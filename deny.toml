# cargo-deny configuration.
#
# Leviath ships a binary that executes model-chosen tool calls on a user's
# machine, so the dependency graph is part of its attack surface. This file is
# what makes that graph reviewable: `cargo deny check` runs in CI and fails on a
# security advisory, an unvetted licence, or an unexpected source registry.
#
# Run locally with:  cargo deny check

[graph]
# Check every target we actually ship (see the release matrix in
# .github/workflows/alpha.yml). Without this, an advisory in a Windows-only or
# Linux-only dependency is invisible from a macOS developer machine.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
# Any advisory fails the build. There is no "warn and carry on" tier here: an
# unfixed advisory in a shipped binary is a decision someone should make
# explicitly, by adding an `ignore` entry below with a reason and a date.
version = 2
yanked = "deny"
ignore = [
    # Format:
    #   { id = "RUSTSEC-0000-0000", reason = "why this is acceptable here" },
    # Every entry needs a reason. An ignore with no justification is a silent
    # acceptance of risk, which is what this file exists to prevent.
    # smartstring is unmaintained: the repository was archived on 2026-05-03.
    #
    # Accepted 2026-08-10, because nothing on our side can remove it. It is a
    # hard, non-optional dependency of rhai, no rhai feature turns it off, and
    # 1.25.1 is the latest release. rhai cannot swap it without a breaking
    # change of its own, because SmartString appears in rhai's public API; the
    # maintainer is weighing `ecow` in rhaiscript/rhai#816.
    #
    # Watch that issue rather than this advisory. It also covers a soundness
    # concern in smartstring whose fix sits in an unmerged PR against the now
    # archived repo, and that is the part that would actually matter to us.
    # Revisit when rhai ships a release without smartstring.
    { id = "RUSTSEC-2026-0249", reason = "unmaintained; transitive via rhai, no upgrade path, tracked in rhaiscript/rhai#816" },
]

[licenses]
version = 2
# Permissive licences only. Leviath is MIT; a copyleft dependency would change
# the obligations of anyone shipping a build of it, which is not a decision to
# make by accident.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "BSL-1.0",
    # Public-domain dedication. Reached via bevy_ecs → bevy_utils → ahash →
    # const-random → tiny-keccak.
    "CC0-1.0",
    # MIT with the attribution requirement removed; OSI approved. Reached via
    # jsonschema → referencing → fluent-uri → borrow-or-share.
    "MIT-0",
]
confidence-threshold = 0.9

[bans]
# `warn`, not `deny`: duplicate versions are a real signal (two copies of a
# crypto crate means two sets of advisories to track) but they are routine in a
# graph this size and blocking on them would make every dependency bump a
# yak-shave. CI surfaces them; a human decides.
#
# The baseline, so a new duplicate stands out against a known set rather than
# being re-investigated every time. Every family below was traced with
# `cargo tree -i <crate>@<version>` on 2026-08-27 and is pinned by an upstream
# crate, not by anything in this workspace:
#   tower-http 0.6 / 0.7        0.6 is inside reqwest; 0.7 is ours (cors)
#   rand, rand_core 0.9 / 0.10  0.9 via opentelemetry_sdk and tungstenite
#   getrandom 0.2 / 0.3 / 0.4   0.2 is proc-macro only (const-random via ahash)
#   hashbrown 0.16 / 0.17       0.16 via bevy_platform; 0.17 everyone else
#   fancy-regex 0.17 / 0.19     0.17 via tiktoken-rs; 0.19 via jsonschema
#   digest, block-buffer, crypto-common, cpufeatures 0.10 / 0.11
#                               0.10 via sha1 under axum and tungstenite
#   base64 0.22 / 0.23          0.22 via axum, hyper-util, reqwest, tiktoken-rs
#   core-foundation 0.9 / 0.10  0.9 via system-configuration under hyper-util
#   syn 2 / 3                   proc-macro only, zero bytes in the binary
# Also decided, not a duplicate: TLS is aws-lc-rs everywhere (reqwest and
# axum-server resolve to the same provider). `ring` would save well under a
# megabyte and change the audit posture; not worth it.
multiple-versions = "warn"
wildcards = "deny"
# Leviath's own crates depend on each other by `path` with no version, which
# reads as a wildcard. That is how a workspace is supposed to work - these are
# not third-party requirements - so path deps are exempt and every *external*
# wildcard still fails.
allow-wildcard-paths = true
# Crates that must never appear, with the reason. Empty for now - this is the
# place to record "we decided against X" so the decision survives.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
