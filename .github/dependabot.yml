version: 2

# Two ecosystems, because both are part of the attack surface:
#
# - `cargo` - the ~370 transitive crates that end up in the shipped binary. Now
#   that Cargo.lock is committed, these updates arrive as reviewable diffs
#   instead of happening invisibly on every CI run.
# - `github-actions` - the actions that build and publish releases. These run
#   with `contents: write` on the release path, so a compromised action is a
#   compromised release.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine churn, so security updates stand out instead of
      # being lost in a queue of patch bumps.
      patch-and-minor:
        update-types:
          - minor
          - patch
    ignore:
      # Both are held back by tui-textarea (latest release 0.7.0, pinned to
      # ratatui 0.29 + crossterm 0.28): bumping either alone puts two
      # incompatible KeyEvent types in the graph, which fails at the
      # `Input: From<KeyEvent>` boundary. Remove these entries when
      # tui-textarea publishes ratatui-0.30 support - that upgrade also
      # clears the RUSTSEC-2024-0436 (`paste`) ignore in deny.toml, which
      # arrives through ratatui 0.29.
      - dependency-name: ratatui
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: crossterm
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    labels:
      - dependencies
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
