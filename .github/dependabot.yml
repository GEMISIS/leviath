version: 2

# Two ecosystems, because both are part of the attack surface:
#
# - `cargo` - the ~370 transitive crates that end up in the shipped binary. Now
#   that Cargo.lock is committed, these updates arrive as reviewable diffs
#   instead of happening invisibly on every CI run.
# - `github-actions` - the actions that build and publish releases. These run
#   with `contents: write` on the release path, so a compromised action is a
#   compromised release.
#
# Both run Thursday at 1pm Pacific, a few hours after the Thursday morning prod
# cut, so a dependency bump lands with a whole weekend to be reviewed and
# integrated before the next Monday beta goes out. `time` is read in the
# `timezone` below rather than UTC, so the hour here is the local one and it
# holds at 1pm across the daylight-saving change. The prod cron cannot do that -
# Actions schedules are UTC only - so the gap between the two is four hours in
# summer and five in winter.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "13:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine churn, so security updates stand out instead of
      # being lost in a queue of patch bumps.
      patch-and-minor:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "13:00"
      timezone: America/Los_Angeles
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
