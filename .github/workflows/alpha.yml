name: Alpha (Nightly)

on:
  # A release is something a maintainer decides, not something a clock
  # decides. Bumping `[workspace.package] version` and merging that is the
  # decision; this trigger is how it reaches the channel without waiting for
  # the next cron. The path filter is only a prefilter - the workspace version
  # lives nowhere but the root manifest, and `check-version` below is what
  # actually rules on whether anything ships.
  push:
    branches: [main]
    paths: ['Cargo.toml']
  schedule:
    # Every day at 2am PST (9am UTC). Kept as a backstop: a bump that landed
    # while Actions was down, or one whose push run was cancelled, still gets
    # picked up the following morning.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if the version was not bumped
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# A bump merged shortly before 09:00 UTC can put the push run and the cron run
# in flight at once, and both would read the same pre-bump version off the
# published alpha and both would publish. Serialising them fixes that without
# a lock: the queued run starts fresh after the first finishes, re-reads the
# now-updated alpha release, and skips itself.
concurrency:
  group: alpha-release
  cancel-in-progress: false

# Default to read-only; the release job elevates itself explicitly.
permissions:
  contents: read

jobs:
  # Nothing below this job runs unless the workspace version at HEAD differs
  # from the version the current alpha release was built at. That is the whole
  # release trigger: a maintainer bumps `[workspace.package] version`, and the
  # commit carrying that bump is the one that ships.
  #
  # The comparison reads the version out of a COMMIT, not out of a stored
  # string, because every one of these workflows already does exactly that
  # (beta and prod read `git show <sha>:Cargo.toml` to title their releases)
  # and the `COMMIT_SHA` asset that names the commit is already published with
  # every channel. Nothing new to write, nothing new to keep in sync.
  #
  # It fails OPEN. A missing release, a missing COMMIT_SHA, a commit that no
  # longer resolves: any of those means "we cannot prove this was already
  # released", and the safe answer to that is to publish, not to go quiet.
  check-version:
    name: Check for a version bump
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `git show <alpha sha>:Cargo.toml` needs that commit present, and it
          # can be many commits behind main by the time this runs.
          fetch-depth: 0
      - name: Compare HEAD's version against the published alpha
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/' || true)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' in Cargo.toml is not a valid semver version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # One assignment, one write at the end: `skip` appearing twice in
          # $GITHUB_OUTPUT would leave which value wins up to the runner.
          skip=false

          if [ "$FORCE" = "true" ]; then
            echo "force=true: publishing $version regardless of the current alpha."
          elif ! gh release view alpha --json tagName >/dev/null 2>&1; then
            echo "No alpha release yet - publishing $version."
          else
            gh release download alpha --pattern COMMIT_SHA --dir /tmp/alpha/ 2>/dev/null || true
            if [ ! -f /tmp/alpha/COMMIT_SHA ]; then
              echo "The current alpha carries no COMMIT_SHA - cannot compare, publishing $version."
            else
              sha=$(cat /tmp/alpha/COMMIT_SHA)
              # A release asset is writable by anyone who can write a release,
              # and this value goes straight into `git show`. Pin its shape
              # first, the same way beta.yml and prod.yml do.
              if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "::error::COMMIT_SHA in the alpha release is not a 40-hex commit id."
                exit 1
              fi
              prev=$(git show "$sha:Cargo.toml" 2>/dev/null | grep '^version' | head -1 | sed 's/.*"\(.*\)"/\1/' || true)
              if [ -z "$prev" ]; then
                echo "No readable version at $sha - publishing $version."
              elif [ "$version" = "$prev" ]; then
                skip=true
                echo "Alpha already shipped $version. Bump [workspace.package] version to"
                echo "release again, or re-run this workflow manually with force=true."
              else
                echo "Version moved $prev -> $version. Publishing."
              fi
            fi
          fi

          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  # The gate is CI itself, not a restatement of it. This job used to spell out
  # its own build + test + clippy, and the two definitions drifted: it linted
  # all three OSes while ci.yml's clippy job linted only ubuntu, so a
  # `#[cfg(windows)]` lint failure that no PR could ever see took the nightly
  # down. Calling the workflow means "green here" and "green on main" are the
  # same statement by construction.
  #
  # Two jobs inside ci.yml self-handle being called from here: `guard-main-rs`
  # is `if: github.event_name == 'pull_request'`, and the badge steps carry a
  # `github.workflow == 'CI'` guard.
  #
  # Only `gate` needs the skip condition spelled out: `build` needs `gate`,
  # `release` needs `build`, and `docs`/`bump-tap` need `release`, so a skipped
  # gate takes the whole chain with it.
  gate:
    name: Gate
    needs: check-version
    if: needs.check-version.outputs.skip != 'true'
    # The ceiling for every job inside ci.yml, so it has to cover the widest
    # scope any of them asks for - even one that will not run from here.
    # Permissions are settled when the run is created, before a single `if:`
    # has been evaluated, so `guard-main-rs` requesting `pull-requests: read`
    # to read its override label off the API failed the WHOLE nightly at
    # startup with "requesting 'pull-requests: read', but is only allowed
    # 'pull-requests: none'" - no jobs, no logs, just a dead run. Grant it
    # here, and note that anything ci.yml adds later has to be granted here
    # too, because the failure lands on this workflow rather than on the PR
    # that introduced it.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build (${{ matrix.target }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: leviath-linux-x64
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: leviath-linux-arm64
            ext: tar.gz
          # Statically linked, for containers older than the runner's glibc
          # (issue #286). The gnu builds above link against whatever the
          # runner ships and so demand GLIBC_2.38+ at run time, which is newer
          # than most task/CI images - `curl a binary into a container` fails
          # on anything below Ubuntu 24.04. These need nothing from the image.
          #
          # arm64 builds on a native ARM runner rather than cross-compiling:
          # `aws-lc-sys` is the crypto backend (see the note on the cross
          # toolchain below) and pointing its cmake build at a musl cross
          # toolchain is a great deal more work than asking for the right
          # runner. Free for public repos.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: leviath-linux-x64-musl
            ext: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            artifact: leviath-linux-arm64-musl
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: leviath-macos-arm64
            ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: leviath-macos-x64
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: leviath-windows-x64
            ext: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # `rust-toolchain.toml` pins the compiler, and rustup resolves that pin
      # per directory - so a cross target handed to a "stable" toolchain action
      # lands on a *different* toolchain installation than the one `cargo build`
      # actually uses, and the cross builds fail with "can't find crate for
      # `core`". Install the pinned toolchain itself (no-arg install reads the
      # pin) and add the target to it.
      - name: Install the pinned toolchain with the build target
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}
      # aarch64-linux-gnu is cross-compiled from the x64 runner, which the gcc
      # cross toolchain is enough for. (`aws-lc-sys` is the crypto backend, not
      # ring - it builds here because its cmake picks the cross compiler up
      # from `CC_aarch64_unknown_linux_gnu` below. The musl arm64 target does
      # not get the same treatment; see the matrix note.)
      - name: Install aarch64 Linux cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      # `musl-gcc`, which is what `aws-lc-sys` compiles its C through for a
      # musl target. Both musl targets build for the runner's own
      # architecture, so this is the native musl toolchain, not a cross one.
      - name: Install the musl toolchain
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      # Linker hardening, appended to the workflow-level `-D warnings`.
      #
      # It has to be spelled here rather than in `.cargo/config.toml`: the
      # `RUSTFLAGS` *environment variable* set at the top of this workflow
      # completely OVERRIDES `build.rustflags` from a config file - it does not
      # merge - so hardening flags added there would apply to local builds and be
      # silently dropped from exactly the release builds that need them.
      #
      # What each does, per platform:
      #   - Linux: full RELRO plus BIND_NOW, so the GOT is mapped read-only after
      #     relocation and cannot be rewritten to redirect a later call.
      #   - Windows: Control Flow Guard, which validates indirect call targets.
      #     Stable, MSVC-only, and free.
      #   - macOS: nothing to add. The Apple linker rejects `-z` options, and the
      #     platform's own protections (hardened runtime once signed, ASLR) are
      #     not rustc flags.
      #   - Linux musl: nothing to add either, and deliberately so. RELRO and
      #     BIND_NOW harden the GOT against being rewritten between dynamic
      #     relocation and use; a fully static non-PIE binary has no dynamic
      #     relocation and no GOT to protect, so the flags would be decoration.
      #     `*-linux-gnu` below therefore stays an exact match, not `*-linux-*`.
      - name: Build release binary
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            *-linux-gnu)   export RUSTFLAGS="$RUSTFLAGS -C link-arg=-Wl,-z,relro,-z,now" ;;
            *-windows-msvc) export RUSTFLAGS="$RUSTFLAGS -C control-flow-guard" ;;
          esac
          echo "RUSTFLAGS=$RUSTFLAGS"
          cargo build --release --bin lev --target "$TARGET"
      - name: Package archive
        shell: bash
        run: |
          mkdir -p staging/
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/lev.exe staging/lev.exe
            cd staging && 7z a -tzip ../${{ matrix.artifact }}.zip lev.exe
          else
            cp target/${{ matrix.target }}/release/lev staging/lev
            chmod +x staging/lev
            cd staging && tar czf ../${{ matrix.artifact }}.tar.gz lev
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}.${{ matrix.ext }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}

  release:
    name: Publish Alpha
    needs: build
    runs-on: ubuntu-latest
    # Handed to bump-tap so the tap declares what this nightly actually ships.
    outputs:
      version: ${{ steps.info.outputs.version }}
      date: ${{ steps.info.outputs.date }}
    permissions:
      contents: write
      # Required by `actions/attest-build-provenance`, which mints a signed,
      # publicly verifiable statement of *what built these binaries, from which
      # commit, with which workflow*. Without it a release asset is a file
      # somebody uploaded; with it, `gh attestation verify` proves provenance.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get commit info
        id: info
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "sha_full=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          # For the release title. Same line-anchored extraction prod.yml uses.
          echo "version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')" >> $GITHUB_OUTPUT

      # Only the platform archives the `build` matrix uploaded. Unfiltered,
      # this pulls every artifact in the run - and since the gate became a call
      # to ci.yml, that includes the 33 `coverage-html-*` reports the coverage
      # matrix uploads. `Prepare release files` below expects each directory to
      # hold one file named after it, so a coverage directory made it fail.
      - name: Download the platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/
          pattern: leviath-*

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release/
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            cp "$dir/$name" "release/$name"
          done
          # A pattern that matches nothing leaves an empty release/, and a
          # channel release carrying no binaries is worse than no release at
          # all - the install script and both taps would resolve it and find
          # nothing to download. Count what arrived against the build matrix.
          found=$(find release -type f | wc -l)
          if [ "$found" -ne 7 ]; then
            echo "::error::expected 7 platform archives, found $found:"
            ls -la release/
            exit 1
          fi
          # Generate checksums
          cd release && sha256sum * > SHA256SUMS
          # Write the commit SHA for downstream promotion
          echo "${{ steps.info.outputs.sha_full }}" > COMMIT_SHA

      # 'alpha' is a rolling channel release: delete the previous release
      # AND its tag together before republishing. Deleting only the tag
      # (the old approach) orphans the attached release as a draft, and
      # the next publish then fails with tag_name already_exists.
      - name: Reset alpha channel release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release delete alpha --yes --cleanup-tag --repo "$REPO" || true

      # Sign a provenance statement for every shipped binary before publishing.
      # Checksums alone only detect transport corruption: anyone who can write a
      # release can rewrite both the binary and its SHA256SUMS. An attestation is
      # signed by GitHub's OIDC identity for this workflow, so it cannot be
      # forged by someone who merely holds a repo token.
      #
      # Users verify with:
      #   gh attestation verify <file> --repo GEMISIS/leviath
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "release/*"

      - name: Publish alpha release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: alpha
          target_commitish: ${{ steps.info.outputs.sha_full }}
          name: "Leviath v${{ steps.info.outputs.version }}-Alpha"
          body: |
            **Nightly alpha build** from `main` at ${{ steps.info.outputs.sha_full }}

            Built: ${{ steps.info.outputs.date }}
            Commit: ${{ steps.info.outputs.sha_short }}

            ⚠️ This is an alpha build. Use at your own risk.

            ### Install

            **Homebrew (macOS):**
            ```bash
            brew tap gemisis/leviath https://github.com/GEMISIS/leviath-dist.git
            brew install leviath
            ```

            **Linux:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/GEMISIS/leviath-dist/main/install.sh | bash
            ```

            **Manual:**
            ```bash
            # Download the archive for your platform, then:
            tar xzf leviath-*.tar.gz
            sudo mv lev /usr/local/bin/
            ```
          prerelease: true
          files: release/*

      # What the README badge reports for this channel. Published from here
      # rather than read off the release by shields.io: shields can only ask for
      # "newest release" or "newest prerelease", and alpha and beta are both
      # prereleases on rolling tags, so it cannot tell them apart. This job
      # already knows exactly what it just published.
      - name: Update the alpha channel badge
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: leviath-channel-alpha.json
          label: alpha
          message: ${{ steps.info.outputs.version }}
          color: orange

  docs:
    name: Publish docs (alpha)
    needs: release
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/publish-docs.yml
    with:
      channel: alpha
      # The same commit the binaries in this run were built from.
      ref: ${{ github.sha }}
    secrets: inherit

  # See prod.yml for why the tap has to be told what shipped.
  #
  # This used to append the build date - `0.1.1-alpha.20260802` - because alpha
  # rebuilt the same source every night, so a constant `0.1.1-alpha` would have
  # left every alpha user pinned to their first install until someone bumped
  # Cargo.toml. `check-version` ended that: alpha only republishes when the
  # workspace version moves, so plain `X.Y.Z-alpha` is already monotonic and
  # both Homebrew and Scoop order `0.1.2-alpha` before `0.1.3-alpha`.
  #
  # The one thing lost with the date: a `force=true` republish of an unchanged
  # version now writes an identical string and offers no upgrade. That is the
  # right answer for the case force exists to serve - recovering from an
  # infrastructure failure, where the source is the same either way.
  bump-tap:
    name: Bump tap manifests (alpha)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to leviath-dist
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          jq -nc --arg version "$VERSION-alpha" \
            '{event_type:"release-published",
              client_payload:{channel:"alpha", version:$version}}' \
            | gh api repos/GEMISIS/leviath-dist/dispatches --input -
          echo "Asked leviath-dist to bump the alpha manifests to $VERSION-alpha."
