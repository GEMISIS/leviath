name: Alpha (Nightly)

on:
  schedule:
    # Every day at 2am PST (9am UTC)
    - cron: '0 9 * * *'
  workflow_dispatch: # Manual trigger

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Re-run all CI gates before building alpha
  gate:
    name: Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build (${{ matrix.target }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: leviath-linux-x64
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: leviath-macos-arm64
            ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: leviath-macos-x64
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: leviath-windows-x64
            ext: zip
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --bin lev --target ${{ matrix.target }}
      - name: Package archive
        shell: bash
        run: |
          mkdir -p staging/
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/lev.exe staging/lev.exe
            cd staging && 7z a -tzip ../${{ matrix.artifact }}.zip lev.exe
          else
            cp target/${{ matrix.target }}/release/lev staging/lev
            chmod +x staging/lev
            cd staging && tar czf ../${{ matrix.artifact }}.tar.gz lev
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}.${{ matrix.ext }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}

  release:
    name: Publish Alpha
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Get commit info
        id: info
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "sha_full=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release files
        run: |
          mkdir -p release/
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            cp "$dir/$name" "release/$name"
          done
          # Generate checksums
          cd release && sha256sum * > SHA256SUMS
          # Write the commit SHA for downstream promotion
          echo "${{ steps.info.outputs.sha_full }}" > COMMIT_SHA

      - name: Create/update alpha tag
        run: |
          git tag -f alpha
          git push -f origin alpha

      - name: Publish alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alpha
          name: "Alpha · ${{ steps.info.outputs.date }} · ${{ steps.info.outputs.sha_short }}"
          body: |
            **Nightly alpha build** from `main` at ${{ steps.info.outputs.sha_full }}

            Built: ${{ steps.info.outputs.date }}
            Commit: ${{ steps.info.outputs.sha_short }}

            ⚠️ This is an alpha build. Use at your own risk.

            ### Install

            **Homebrew (macOS):**
            ```bash
            brew tap sun-forge-ai/leviath https://github.com/Sun-Forge-AI/leviath-dist.git
            brew install leviath
            ```

            **Linux:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/Sun-Forge-AI/leviath-dist/main/install.sh | bash
            ```

            **Manual:**
            ```bash
            # Download the archive for your platform, then:
            tar xzf leviath-*.tar.gz
            sudo mv lev /usr/local/bin/
            ```
          prerelease: true
          files: release/*
