name: Alpha (Nightly)

on:
  schedule:
    # Every day at 2am PST (9am UTC)
    - cron: '0 9 * * *'
  workflow_dispatch: # Manual trigger

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Default to read-only; the release job elevates itself explicitly.
permissions:
  contents: read

jobs:
  # Re-run all CI gates before building alpha
  gate:
    name: Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build (${{ matrix.target }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: leviath-linux-x64
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: leviath-linux-arm64
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: leviath-macos-arm64
            ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: leviath-macos-x64
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: leviath-windows-x64
            ext: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # `rust-toolchain.toml` pins the compiler, and rustup resolves that pin
      # per directory - so a cross target handed to a "stable" toolchain action
      # lands on a *different* toolchain installation than the one `cargo build`
      # actually uses, and the cross builds fail with "can't find crate for
      # `core`". Install the pinned toolchain itself (no-arg install reads the
      # pin) and add the target to it.
      - name: Install the pinned toolchain with the build target
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}
      # aarch64-linux is cross-compiled from the x64 runner (hosted ARM
      # runners aren't available for private repos on this plan). rustls
      # keeps this simple: the only C to cross-compile is ring's, which
      # just needs the gcc cross toolchain.
      - name: Install aarch64 Linux cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      # Linker hardening, appended to the workflow-level `-D warnings`.
      #
      # It has to be spelled here rather than in `.cargo/config.toml`: the
      # `RUSTFLAGS` *environment variable* set at the top of this workflow
      # completely OVERRIDES `build.rustflags` from a config file - it does not
      # merge - so hardening flags added there would apply to local builds and be
      # silently dropped from exactly the release builds that need them.
      #
      # What each does, per platform:
      #   - Linux: full RELRO plus BIND_NOW, so the GOT is mapped read-only after
      #     relocation and cannot be rewritten to redirect a later call.
      #   - Windows: Control Flow Guard, which validates indirect call targets.
      #     Stable, MSVC-only, and free.
      #   - macOS: nothing to add. The Apple linker rejects `-z` options, and the
      #     platform's own protections (hardened runtime once signed, ASLR) are
      #     not rustc flags.
      - name: Build release binary
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            *-linux-gnu)   export RUSTFLAGS="$RUSTFLAGS -C link-arg=-Wl,-z,relro,-z,now" ;;
            *-windows-msvc) export RUSTFLAGS="$RUSTFLAGS -C control-flow-guard" ;;
          esac
          echo "RUSTFLAGS=$RUSTFLAGS"
          cargo build --release --bin lev --target "$TARGET"
      - name: Package archive
        shell: bash
        run: |
          mkdir -p staging/
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/lev.exe staging/lev.exe
            cd staging && 7z a -tzip ../${{ matrix.artifact }}.zip lev.exe
          else
            cp target/${{ matrix.target }}/release/lev staging/lev
            chmod +x staging/lev
            cd staging && tar czf ../${{ matrix.artifact }}.tar.gz lev
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}.${{ matrix.ext }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}

  release:
    name: Publish Alpha
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required by `actions/attest-build-provenance`, which mints a signed,
      # publicly verifiable statement of *what built these binaries, from which
      # commit, with which workflow*. Without it a release asset is a file
      # somebody uploaded; with it, `gh attestation verify` proves provenance.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get commit info
        id: info
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "sha_full=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          # For the release title. Same line-anchored extraction prod.yml uses.
          echo "version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/

      - name: Prepare release files
        run: |
          mkdir -p release/
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            cp "$dir/$name" "release/$name"
          done
          # Generate checksums
          cd release && sha256sum * > SHA256SUMS
          # Write the commit SHA for downstream promotion
          echo "${{ steps.info.outputs.sha_full }}" > COMMIT_SHA

      # 'alpha' is a rolling channel release: delete the previous release
      # AND its tag together before republishing. Deleting only the tag
      # (the old approach) orphans the attached release as a draft, and
      # the next publish then fails with tag_name already_exists.
      - name: Reset alpha channel release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release delete alpha --yes --cleanup-tag --repo "$REPO" || true

      # Sign a provenance statement for every shipped binary before publishing.
      # Checksums alone only detect transport corruption: anyone who can write a
      # release can rewrite both the binary and its SHA256SUMS. An attestation is
      # signed by GitHub's OIDC identity for this workflow, so it cannot be
      # forged by someone who merely holds a repo token.
      #
      # Users verify with:
      #   gh attestation verify <file> --repo GEMISIS/leviath
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "release/*"

      - name: Publish alpha release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: alpha
          target_commitish: ${{ steps.info.outputs.sha_full }}
          name: "Leviath v${{ steps.info.outputs.version }}-Alpha"
          body: |
            **Nightly alpha build** from `main` at ${{ steps.info.outputs.sha_full }}

            Built: ${{ steps.info.outputs.date }}
            Commit: ${{ steps.info.outputs.sha_short }}

            ⚠️ This is an alpha build. Use at your own risk.

            ### Install

            **Homebrew (macOS):**
            ```bash
            brew tap gemisis/leviath https://github.com/GEMISIS/leviath-dist.git
            brew install leviath
            ```

            **Linux:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/GEMISIS/leviath-dist/main/install.sh | bash
            ```

            **Manual:**
            ```bash
            # Download the archive for your platform, then:
            tar xzf leviath-*.tar.gz
            sudo mv lev /usr/local/bin/
            ```
          prerelease: true
          files: release/*

  docs:
    name: Publish docs (alpha)
    needs: release
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/publish-docs.yml
    with:
      channel: alpha
      # The same commit the binaries in this run were built from.
      ref: ${{ github.sha }}
    secrets: inherit
