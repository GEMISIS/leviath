name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` are included so the `guard-main-rs` job re-runs when
    # a maintainer applies/removes the `allow-main-rs-change` override label.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The merge queue runs required checks against a temporary `merge_group` ref.
  # Without this trigger those checks never run, so queued PRs block forever.
  merge_group:
  # The release workflows call this file instead of restating a gate of their
  # own. alpha.yml used to hand-roll build + test + clippy, which drifted: its
  # clippy ran on all three OSes while the `clippy` job below ran only on
  # ubuntu, so a `#[cfg(windows)]` lint failure took down two nightly alphas
  # while every PR stayed green. One definition, called from both places, is
  # the only way that stays fixed.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# CI never writes to the repo; badge publishing uses the scoped GIST_TOKEN
# secret, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test
      # GitHub's native per-job `badge.svg?job=...` filter was observed to
      # render a "passing" badge even for a job name that doesn't exist in
      # this workflow at all -- it silently falls back to some other status
      # rather than erroring, so it can't be trusted to reflect this specific
      # job's real per-OS result. Publish it ourselves instead, via the same
      # self-published-gist mechanism already proven for the coverage badge
      # below: `job.status` reflects the real accumulated pass/fail state of
      # this job's steps so far, checked with `if: always()` so it runs
      # (and reports failure) even when the Test step above failed.
      #
      # `github.workflow == 'CI'` is what keeps a release run out of the
      # badges. A called workflow inherits the CALLER's `github` context, so
      # when alpha.yml runs this file off a push to main both `event_name`
      # and `ref` still match and the badges would be republished from a
      # release run. `github.workflow` resolves to the caller's name
      # ("Alpha (Nightly)"), so it is the one thing that tells them apart.
      # Same guard on every badge step below.
      - name: Publish test status badge
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.workflow == 'CI'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: leviath-test-${{ matrix.os }}.json
          label: ${{ matrix.os }}
          message: ${{ job.status == 'success' && 'passing' || 'failing' }}
          color: ${{ job.status == 'success' && 'brightgreen' || 'red' }}

  # One combined badge for the README (the per-OS gists above stay for
  # anyone who wants the breakdown). `needs.test.result` is 'success' only
  # when every matrix leg passed, so this is the honest aggregate.
  test-badge:
    name: Publish combined test badge
    needs: [test]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.workflow == 'CI'
    runs-on: ubuntu-latest
    steps:
      - name: Publish combined test status badge
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: leviath-test-all.json
          label: tests
          message: ${{ needs.test.result == 'success' && 'passing' || 'failing' }}
          color: ${{ needs.test.result == 'success' && 'brightgreen' || 'red' }}

  # Every OS, because a lint can only be reported for code the compiler
  # actually builds. `#[cfg(windows)]` bodies, the `#[cfg(target_os =
  # "macos")]` launchd plumbing, and the `#[cfg(not(any(macos, linux)))]`
  # arms are each invisible to at least one of the three legs; running only
  # ubuntu meant nothing outside the Linux configuration was ever linted.
  #
  # `--all-features` for the same reason one level up: `debug-http` code is
  # off by default, so `--all-targets` alone never compiles it. The coverage
  # jobs already build with `--all-features` (xtask/src/coverage.rs), and so
  # does the pre-commit hook, so this only aligns CI with what was already
  # being tested locally and measured.
  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Supply chain. Leviath ships a binary that executes model-chosen tool calls on
  # a user's machine, so its ~370 transitive crates are part of the attack
  # surface. This job is what makes that graph reviewable:
  #
  #   - `cargo deny check advisories` fails on any RUSTSEC advisory or yanked
  #     crate. Accepting one requires an explicit `ignore` entry in deny.toml
  #     with a written reason.
  #   - `licenses` keeps the graph permissively licensed (Leviath is MIT).
  #   - `bans` catches wildcard requirements; duplicate versions only warn.
  #   - `sources` refuses anything not from crates.io.
  #
  # None of this could run before: `cargo audit`/`cargo deny` need a lockfile,
  # and Cargo.lock was gitignored, so every CI run re-resolved the whole graph
  # and there was nothing pinned to audit.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-deny
      - name: Check advisories, licenses, bans and sources
        run: cargo deny --all-features check

      # The lockfile is the point of the job above, so prove it is actually
      # current. `--locked` fails if Cargo.toml and Cargo.lock disagree, which
      # catches a dependency edit committed without the lockfile update - the
      # exact case that would silently reintroduce floating resolution.
      - name: Verify Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      # The same manifest, one level up: `[workspace.package] version` and the
      # eleven `[workspace.dependencies]` pins that repeat it have to agree.
      # A bump that moved only some of them is quiet within a `0.1.x` line -
      # a stale `version = "0.1.2"` pin is a `^0.1.2` requirement that `0.1.3`
      # satisfies, so it builds and publishes, just naming the wrong version -
      # and only turns loud on a bump crossing the caret boundary, in the prod
      # job, a week after the alpha shipped.
      - name: Verify the version declarations agree
        run: cargo xtask version --check

  # Rejects broken or private intra-doc links and stray HTML tags in doc
  # comments (`-D warnings` promotes every rustdoc lint to an error). Cheap and
  # OS-independent, so it runs once on ubuntu.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: Check docs/content links and frontmatter
        run: cargo xtask docs

  # Coverage runs on all three OSes and enforces a hard 100% on regions, lines,
  # and functions. Each (os × package) runner GATES one package with llvm-cov's
  # own thresholds: `cargo xtask coverage --package <pkg>` runs `cargo llvm-cov
  # --package <pkg> --fail-under-{lines,functions,regions} 100`, failing the job
  # if that package is below 100% (see xtask/src/coverage.rs). No custom
  # parsing/merging/aggregation - llvm-cov does the counting and the gating.
  #
  # Per-PACKAGE (not `--workspace`) is deliberate: `-C instrument-coverage`
  # records every function in every binary that links it - including binaries
  # that never call it - so the whole-workspace merge lets a never-run record
  # shadow the covered one and reads genuinely-tested code below 100%. One
  # package at a time keeps llvm-cov's counts accurate (see coverage.rs + the
  # upstream LLVM bug it links). Branch coverage is not collected - `--branch`
  # reliably SIGSEGVs on that same bug. `cargo-llvm-cov` is installed from a
  # prebuilt binary via taiki-e/install-action.
  coverage:
    name: Coverage (${{ matrix.os }} / ${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One package's failure must not cancel the others' runs.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The workspace members `parse_workspace_packages` returns. Not
        # listed: `xtask` (the coverage tool itself), `leviath-testkit`
        # (dev-dependency-only scaffolding exercised inside these suites), and
        # `leviath` (the re-export-only crates.io facade - zero executable
        # regions, kept that way by the guard-facade job below).
        package:
          - leviath-core
          - leviath-agent-client
          - leviath-runtime
          - leviath-providers
          - leviath-mcp
          - leviath-scripting
          - leviath-package
          - leviath-tools
          - leviath-cli
          - leviath-sys
          - leviath-telemetry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: llvm-tools
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-llvm-cov
      # Gates this one package at a hard 100% (regions/lines/functions) via
      # llvm-cov's --fail-under-* thresholds and writes its browsable HTML to
      # coverage/html/<pkg>. Fails the job if the package is below 100%.
      - name: Gate ${{ matrix.package }} at 100%
        run: cargo xtask coverage --package ${{ matrix.package }}
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-html-${{ matrix.os }}-${{ matrix.package }}
          path: coverage/html/
          retention-days: 14

  # The per-package `coverage` jobs above ARE the gate now (each fails below
  # 100%). This job is the aggregate signal: `needs: [coverage]` means it only
  # runs once every package on every OS gated green, so its success == the whole
  # workspace is 100%. It keeps the stable `Coverage gate (<os>)` check name and
  # publishes the coverage badges (from ubuntu on push to main). Because the gate
  # is hard-100%, a green run means 100% by construction - the badges are static.
  coverage-gate:
    name: Coverage gate (${{ matrix.os }})
    needs: [coverage]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Confirm every package gated 100%
        run: echo "All packages gated at a hard 100% in the per-package coverage jobs."
      - name: Update lines coverage badge
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.workflow == 'CI'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: leviath-coverage-lines.json
          label: coverage
          message: 100%
          color: brightgreen
      - name: Update regions coverage badge
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.workflow == 'CI'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: leviath-coverage-regions.json
          label: regions
          message: 100%
          color: brightgreen
      - name: Update functions coverage badge
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main' && github.event_name == 'push' && github.workflow == 'CI'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: leviath-coverage-functions.json
          label: functions
          message: 100%
          color: brightgreen

  # The zero-exclusions policy scan runs once (it's OS-independent). It uses
  # ast-grep, which matches Rust/YAML *structurally* (via tree-sitter) rather
  # than by raw text - so a `#[cfg(not(test))]` attribute is caught but a
  # backtick mention of it inside a doc comment is not. Rules live in
  # `.sgrules/` (see `sgconfig.yml`). Explicit scan paths are required because
  # `.github/` is a hidden directory that a bare `ast-grep scan` would skip.
  check-exclusions:
    name: Check coverage suppression markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install ast-grep
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: ast-grep
      - name: Scan for coverage suppression markers
        run: ast-grep scan crates xtask .github/workflows
      # Guard against a vacuous pass: `ast-grep scan` exits 0 on a mistyped or
      # empty path, so a green scan alone doesn't prove the lint actually ran.
      # Plant a real violation and require ast-grep to catch it (non-zero exit);
      # if this scan *succeeds*, the rules/paths are broken and the check-
      # exclusions job must fail rather than silently pass.
      - name: Verify the suppression lint actually fires
        run: |
          probe=crates/leviath-core/src/__astgrep_ci_probe.rs
          printf '#[cfg(not(test))]\nfn __probe() {}\n' > "$probe"
          if ast-grep scan crates xtask .github/workflows; then
            rm -f "$probe"
            echo "::error::ast-grep did NOT catch a planted #[cfg(not(test))] - the suppression lint is misconfigured (bad rules or scan paths)."
            exit 1
          fi
          rm -f "$probe"
          echo "Suppression lint confirmed: the planted probe was caught."

  # `crates/leviath-cli/src/main.rs` is the ONE file excluded from coverage
  # measurement - the thin, un-unit-tested composition root where real terminal
  # / stdin / port / subprocess / `/dev/tty` I/O is wired into the tested lib
  # cores. Changing it needs deliberate maintainer sign-off: this job fails any
  # PR that touches main.rs unless the maintainer applies the
  # `allow-main-rs-change` label.
  guard-main-rs:
    name: Guard bin entrypoint (main.rs)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require maintainer override to change main.rs
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Three dots, so this asks "what did the PR change" rather than "how
          # do these two trees differ". With two dots the diff also contains
          # everything main gained since the branch point, so any PR would fail
          # this the moment someone else's main.rs change landed on main first -
          # and the fix looked like applying the override label to a PR that
          # never touched the file.
          if git diff --name-only "$BASE...$HEAD" | grep -qx 'crates/leviath-cli/src/main.rs'; then
            case ",$LABELS," in
              *,allow-main-rs-change,*)
                echo "main.rs change approved via 'allow-main-rs-change' label." ;;
              *)
                echo "::error file=crates/leviath-cli/src/main.rs::main.rs is the coverage-excluded bin entrypoint; changing it needs maintainer approval. Apply the 'allow-main-rs-change' label to override."
                exit 1 ;;
            esac
          else
            echo "main.rs unchanged."
          fi

  # Merging a version bump to main publishes an alpha within seconds, and a week
  # later that same commit is a permanent `vX.Y.Z` tag and an immutable set of
  # crates.io releases. That is a release decision, not a code change, so it gets
  # the same deliberate sign-off main.rs does - via its own label, so approving a
  # release never doubles as approving an entrypoint change.
  #
  # It compares the declared version rather than whether Cargo.toml was touched:
  # dependency edits land in that file constantly and none of them ship anything.
  guard-version-bump:
    name: Guard release version bump
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require maintainer override to bump the release version
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The merge base, not the base branch tip: comparing against the tip
          # would report a bump for every PR opened after someone else's release
          # landed on main.
          base=$(git merge-base "$BASE" "$HEAD")
          read_version() {
            git show "$1:Cargo.toml" | grep '^version' | head -1 | sed 's/.*"\(.*\)"/\1/' || true
          }
          before=$(read_version "$base")
          after=$(read_version "$HEAD")

          if [ "$before" = "$after" ]; then
            echo "Workspace version unchanged at $after."
            exit 0
          fi

          case ",$LABELS," in
            *,allow-version-bump,*)
              echo "Release bump $before -> $after approved via 'allow-version-bump' label." ;;
            *)
              echo "::error file=Cargo.toml::This PR moves the workspace version $before -> $after, which cuts an alpha release the moment it merges and a permanent vX.Y.Z tag plus crates.io publishes on the following prod run. Apply the 'allow-version-bump' label to confirm that is intended."
              exit 1 ;;
          esac

  # `crates/leviath` is the re-export-only crates.io facade. It is exempt from
  # the 100% coverage gate because llvm-cov has no executable regions to count
  # there - which means any real code added to it would ship untested. This
  # job closes that hole: it fails unless the crate is exactly three files
  # (Cargo.toml, README.md, src/lib.rs) and every source line is a comment, a
  # doc comment, a `pub use`, or the `pub mod prelude` wrapper. To add
  # behavior, put it in a gated crate and re-export it here.
  guard-facade:
    name: Guard re-export-only facade (crates/leviath)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require crates/leviath to stay re-export-only
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys

          root = pathlib.Path("crates/leviath")
          required_files = {"Cargo.toml", "README.md", "src/lib.rs"}
          # Runnable examples are allowed (compiled by CI, exempt from the
          # coverage gate like every examples/ dir); lib.rs stays locked to
          # re-exports by the line check below.
          example = re.compile(r"examples/\w[\w-]*\.rs")
          actual_files = {
              str(p.relative_to(root)) for p in root.rglob("*") if p.is_file()
          }
          unexpected = sorted(
              f
              for f in actual_files
              if f not in required_files and not example.fullmatch(f)
          )
          missing = sorted(required_files - actual_files)
          if unexpected or missing:
              print(
                  "::error::crates/leviath must contain exactly "
                  f"{sorted(required_files)} plus optional examples/*.rs; "
                  f"unexpected: {unexpected}, missing: {missing}. "
                  "The facade is coverage-exempt, so no other files (build.rs, "
                  "tests, extra modules) may live in it."
              )
              sys.exit(1)

          item = r"\w+(::\w+)*"
          allowed_line = re.compile(
              r"^$"                                          # blank
              r"|^\s*//"                                     # comment / doc comment
              rf"|^\s*pub use {item} as \w+;$"               # renamed re-export
              rf"|^\s*pub use {item}::\{{[\w\s,:]*\}};$"     # single-line brace re-export
              rf"|^\s*pub use {item}::\{{$"                  # multi-line brace re-export opener
              rf"|^\s+{item}(,\s*{item})*,?$"                # items inside a brace re-export
              r"|^\s*\};$"                                   # close of a brace re-export
              r"|^pub mod prelude \{$"                       # the one allowed module
              r"|^\}$"                                       # close of the prelude
          )
          bad = [
              (n, line)
              for n, line in enumerate(
                  (root / "src/lib.rs").read_text().splitlines(), start=1
              )
              if not allowed_line.match(line)
          ]
          for n, line in bad:
              print(
                  f"::error file=crates/leviath/src/lib.rs,line={n}::"
                  f"not a re-export or comment: {line!r}. The facade is exempt "
                  "from the coverage gate, so executable code cannot land here; "
                  "put it in a gated crate and re-export it."
              )
          sys.exit(1 if bad else 0)
          EOF
