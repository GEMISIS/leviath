name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  coverage:
    name: Coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools,rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Check coverage suppression markers
        run: cargo xtask check-exclusions
      # Branch coverage is not collected -- `cargo llvm-cov --branch`
      # reliably crashes with SIGSEGV on an open, unresolved upstream LLVM
      # bug (see the doc comment at the top of xtask/src/coverage.rs).
      # 100%-coverage enforcement is also temporarily disabled in
      # xtask/src/coverage.rs (run_report no longer fails the build below
      # 100%) while coverage catches back up across all three remaining
      # metrics on every platform. This step still computes and reports all
      # three (regions/lines/functions) so that re-enabling enforcement
      # later, and re-publishing the other two as badges, is a config-only
      # change -- only the lines badge is published for now (see the step
      # below) since three separate coverage numbers read as confusing to
      # newcomers; regions/functions stay computed but unpublished.
      # Re-enable enforcement by restoring the `anyhow::bail!` noted in that
      # file's comments once coverage is back to 100% everywhere.
      - name: Compute coverage (regions / lines / functions)
        id: cov
        run: cargo xtask coverage
      # Publish the single line-coverage badge — only from ubuntu on push to
      # main (all three OSes compute coverage; only one need publish it).
      - name: Update coverage badge
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: leviath-coverage-lines.json
          label: coverage
          message: ${{ steps.cov.outputs.lines }}%
          valColorRange: ${{ steps.cov.outputs.lines }}
          minColorRange: 50
          maxColorRange: 100
