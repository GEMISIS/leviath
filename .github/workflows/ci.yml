name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# CI never writes to the repo; badge publishing uses the scoped GIST_TOKEN
# secret, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test
      # GitHub's native per-job `badge.svg?job=...` filter was observed to
      # render a "passing" badge even for a job name that doesn't exist in
      # this workflow at all -- it silently falls back to some other status
      # rather than erroring, so it can't be trusted to reflect this specific
      # job's real per-OS result. Publish it ourselves instead, via the same
      # self-published-gist mechanism already proven for the coverage badge
      # below: `job.status` reflects the real accumulated pass/fail state of
      # this job's steps so far, checked with `if: always()` so it runs
      # (and reports failure) even when the Test step above failed.
      - name: Publish test status badge
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: leviath-test-${{ matrix.os }}.json
          label: ${{ matrix.os }}
          message: ${{ job.status == 'success' && 'passing' || 'failing' }}
          color: ${{ job.status == 'success' && 'brightgreen' || 'red' }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Coverage is measured on Linux only. Source-based (`-C instrument-coverage`)
  # coverage attributes counters per-monomorphization, and that attribution is
  # codegen/target-dependent — the MSVC (Windows) target in particular reports
  # far more "missed" regions/lines for the *identical, passing* test suite
  # (derive-macro and generic instantiations that llvm-cov credits on
  # Linux/macOS but not on Windows). Coverage answers "is the code tested?" —
  # a platform-independent question — so we measure it once on a canonical OS.
  # The full test suite still runs on all three OSes via the `test` job above
  # (with per-OS status badges), so nothing about cross-platform testing is lost.
  coverage:
    name: Coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: llvm-tools,rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Check coverage suppression markers
        run: cargo xtask check-exclusions
      # Branch coverage is not collected -- `cargo llvm-cov --branch`
      # reliably crashes with SIGSEGV on an open, unresolved upstream LLVM
      # bug (see the doc comment at the top of xtask/src/coverage.rs).
      # Coverage enforcement IS active: this step fails the build if ANY file
      # is below 100% on regions, lines, or functions. Region coverage is
      # measured merged-by-source-position (see xtask/src/coverage.rs) so
      # per-monomorphization jitter can't produce spurious gaps -- the 100%
      # gate is stable across OSes. This step computes and reports all three
      # metrics (regions/lines/functions). It also writes a browsable HTML
      # report to coverage/html/ (see the doc comment on generate_html_report
      # in xtask/src/coverage.rs) -- uploaded as a build artifact below so it's
      # viewable without needing to run coverage locally.
      - name: Compute coverage (regions / lines / functions)
        id: cov
        run: cargo xtask coverage
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-${{ matrix.os }}
          path: coverage/html/
          retention-days: 14
      # Publish all three coverage-percentage gists — only from ubuntu on
      # push to main (all three OSes compute coverage; only one need
      # publish). Only the lines gist is actually rendered as a README badge
      # today (three separate numbers read as confusing to newcomers there),
      # but regions/functions are published too so they're a click away in
      # the gist for anyone who wants the full picture.
      - name: Update lines coverage badge
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: leviath-coverage-lines.json
          label: coverage
          message: ${{ steps.cov.outputs.lines }}%
          valColorRange: ${{ steps.cov.outputs.lines }}
          minColorRange: 50
          maxColorRange: 100
      - name: Update regions coverage badge
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: leviath-coverage-regions.json
          label: regions
          message: ${{ steps.cov.outputs.regions }}%
          valColorRange: ${{ steps.cov.outputs.regions }}
          minColorRange: 50
          maxColorRange: 100
      - name: Update functions coverage badge
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: leviath-coverage-functions.json
          label: functions
          message: ${{ steps.cov.outputs.functions }}%
          valColorRange: ${{ steps.cov.outputs.functions }}
          minColorRange: 50
          maxColorRange: 100
