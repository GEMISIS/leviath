name: Publish docs

# Renders docs/content to themed, crawlable HTML with leviath.dev's docs-ssg and
# publishes it to the site's S3 docs/<channel>/ prefix. Called by the release
# workflows (alpha/beta/prod) so a new build refreshes docs with no site rebuild.
on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      # The leviath commit whose docs/content gets rendered. The release
      # workflows pass the SHA their binaries were built from, so a channel's
      # docs always describe that channel's binary rather than whatever main
      # happens to be when the promotion runs. Empty means the triggering SHA.
      ref:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      channel:
        description: alpha | beta | stable
        required: true
        default: alpha
        type: string
      ref:
        description: leviath commit to render (empty = current main)
        required: false
        default: ""
        type: string

permissions:
  id-token: write
  contents: read

# Two publishes of the same channel must not interleave their S3 syncs: the
# sync uses `--delete`, so the loser would remove the winner's pages.
concurrency:
  group: publish-docs-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Leviath (docs content)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # leviath.dev is a private repo, so the default GITHUB_TOKEN (scoped to
      # this repo) cannot read it — a fine-grained PAT with Contents: read on
      # leviath.dev only is required.
      - name: Checkout leviath.dev (docs-ssg)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GEMISIS/leviath.dev
          token: ${{ secrets.DOCS_SSG_TOKEN }}
          path: site

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the docs renderer
        working-directory: site
        run: |
          npm ci
          npm run build --workspace @leviath-dev/docs-ssg

      # DOCS_RENDERER_REV goes into a <meta> on every page. This bundle is built from
      # leviath.dev's default branch at whatever it is right now, and only when a
      # channel publishes, so a renderer fix over there can sit unpublished for days
      # with nothing on the page to say which version rendered it. This makes that
      # answerable with view-source instead of a guess.
      - name: Record which renderer is being used
        id: renderer
        working-directory: site
        run: echo "rev=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Render docs
        env:
          DOCS_RENDERER_REV: ${{ steps.renderer.outputs.rev }}
        run: node site/packages/docs-ssg/dist/cli.mjs docs/content docs-out "${{ inputs.channel }}"

      # Full-text search. Pagefind indexes the rendered HTML and shards the index, so a
      # reader fetches only the fragments their query needs rather than one blob of it up
      # front. It runs after the render and before the sync, and the step also deletes
      # Pagefind's own search widget, which this site does not use: ~400 KB a channel
      # that would otherwise be published and never requested.
      #
      # Docs published before this step existed simply have no index, and the site falls
      # back to the title filter it had, so a channel is never broken by being behind.
      - name: Build the docs search index
        run: |
          node site/node_modules/.bin/tsx site/tools/build-docs-index.ts docs-out
          # The site falls back to a title-only filter when the index is absent,
          # and says nothing about it, so a channel can publish without search
          # and look fine. Fail here instead, the way the schemas below do.
          test -s docs-out/pagefind/pagefind.js || {
            echo "no search index at docs-out/pagefind/pagefind.js"; exit 1;
          }

      # The machine-readable half: JSON Schemas for agent.leviath and
      # config.toml, the OpenAPI spec for `lev serve`, and the commented example
      # config that Configuration links beside the schema. llms.txt links these
      # by name, and the sync below uses --delete, so anything not copied in
      # here becomes a 404 that the index still advertises. The example is not
      # a .json, which is exactly how it went missing: the glob did not reach it
      # and the check below did not name it.
      - name: Add the machine-readable schemas
        run: |
          cp docs/schema/*.json docs/schema/config.example.toml docs-out/
          for f in blueprint.schema.json config.schema.json openapi.json config.example.toml; do
            test -s "docs-out/$f" || { echo "missing docs-out/$f"; exit 1; }
          done

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.DOCS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish to S3
        run: aws s3 sync docs-out "s3://${{ vars.SITE_BUCKET }}/docs/${{ inputs.channel }}" --delete

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}"
          --paths "/docs/${{ inputs.channel }}/*"
