name: Prod (Weekly Thursday)

on:
  schedule:
    # Every Thursday at 9am PST (4pm UTC)
    - cron: '0 16 * * 4'
    # Backstop, four hours later. GitHub does not guarantee a scheduled event
    # is ever delivered, and on 2026-08-27 it dropped the 16:00 dispatch
    # outright (the nightly alpha ran ten hours late the same day). A weekly
    # cron with no second chance turns one dropped event into a week with no
    # stable release. `check-beta` already refuses to ship a version stable
    # carries, so a redundant run is a fifteen-second no-op.
    - cron: '0 20 * * 4'
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even if the version was not bumped
        type: boolean
        default: false

# Two scheduled slots plus manual dispatch means two runs can be alive at
# once. They must not overlap: `check-beta` reads what stable currently
# carries, so a second run that clears that gate before the first publishes
# would deploy the same version again, and `Determine version tag` would
# disambiguate it into a junk `vX.Y.Z+<date>` release. Queued rather than
# cancelled, because the in-flight run may be midway through a crates.io
# publish; the queued one re-reads stable afterwards and skips.
concurrency:
  group: prod-release
  cancel-in-progress: false

# Default to read-only; only the deploy job needs to write releases.
permissions:
  contents: read

jobs:
  check-beta:
    name: Check Beta Exists
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.beta.outputs.sha }}
      sha_short: ${{ steps.beta.outputs.sha_short }}
      skip: ${{ steps.beta.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Get beta release info
        id: beta
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          # Get the beta release
          beta_info=$(gh release view beta --json tagName 2>/dev/null || echo "")
          if [ -z "$beta_info" ]; then
            echo "No beta release found. Skipping prod deployment."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get commit SHA
          gh release download beta --pattern "COMMIT_SHA" --dir /tmp/beta/ 2>/dev/null || true
          if [ -f /tmp/beta/COMMIT_SHA ]; then
            sha=$(cat /tmp/beta/COMMIT_SHA)
            # This value comes out of a *release asset*, which is attacker-
            # controlled input for anyone who can write a release. It flows into
            # a `git show` command and into the published release's
            # `target_commitish`, so pin its shape before it goes anywhere.
            if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "ERROR: COMMIT_SHA in the beta release is not a 40-hex commit id."
              exit 1
            fi
            echo "sha=$sha" >> $GITHUB_OUTPUT
            echo "sha_short=${sha:0:7}" >> $GITHUB_OUTPUT
          else
            echo "No COMMIT_SHA in beta release. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$FORCE" = "true" ]; then
            echo "force=true: deploying $sha regardless of what stable carries."
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if this SHA was already released as prod
          current_prod_sha=""
          gh release download latest --pattern "COMMIT_SHA" --dir /tmp/prod/ 2>/dev/null || true
          if [ -f /tmp/prod/COMMIT_SHA ]; then
            current_prod_sha=$(cat /tmp/prod/COMMIT_SHA)
          fi

          if [ "$sha" = "$current_prod_sha" ]; then
            echo "Beta SHA matches current prod. Nothing new to deploy."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # A different commit is not by itself a release. What makes a build
          # worth cutting a permanent `vX.Y.Z` tag for is a deliberate version
          # bump, and both channels record theirs the same way: in the
          # Cargo.toml of the commit their COMMIT_SHA names. Without this,
          # every Thursday shipped whatever beta happened to hold and fell back
          # to a `+date` tag suffix to avoid colliding with a version that had
          # already been released.
          if [ -n "$current_prod_sha" ]; then
            if ! printf '%s' "$current_prod_sha" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "ERROR: COMMIT_SHA in the stable release is not a 40-hex commit id."
              exit 1
            fi
            beta_version=$(git show "$sha:Cargo.toml" 2>/dev/null | grep '^version' | head -1 | sed 's/.*"\(.*\)"/\1/' || true)
            prod_version=$(git show "$current_prod_sha:Cargo.toml" 2>/dev/null | grep '^version' | head -1 | sed 's/.*"\(.*\)"/\1/' || true)
            if [ -n "$prod_version" ] && [ "$beta_version" = "$prod_version" ]; then
              echo "Stable already shipped $prod_version. Nothing new to deploy."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Version moves $prod_version -> $beta_version. Deploying."
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Get version from Cargo.toml
        id: version
        if: steps.beta.outputs.skip != 'true'
        env:
          # Through `env` rather than interpolated into the script: `${{ }}` is
          # expanded before bash parses the line, so a crafted value would run
          # as a command rather than be read as one.
          BETA_SHA: ${{ steps.beta.outputs.sha }}
        run: |
          # Read the version from the promoted commit, not the tip of main --
          # main may have moved past the beta build since it was cut.
          version=$(git show "$BETA_SHA:Cargo.toml" | grep '^version' | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$version" >> $GITHUB_OUTPUT

  approve:
    name: Awaiting Approval
    needs: check-beta
    if: needs.check-beta.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Approval received
        run: echo "Prod deployment approved for ${{ needs.check-beta.outputs.sha_short }}"

  deploy:
    name: Deploy to Prod
    needs: [check-beta, approve]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download beta binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release/
          gh release download beta --dir release/
          ls -la release/

          # Verify the checksums before republishing these binaries as a
          # permanent versioned release. `SHA256SUMS` was generated at alpha and
          # then carried through beta and prod without ever being checked, so a
          # tampered asset propagated all the way to `latest` with its stale
          # checksum shipped next to it.
          if [ -f release/SHA256SUMS ]; then
            (cd release && grep -v '^SHA256SUMS$' SHA256SUMS | sha256sum -c -)
          else
            echo "ERROR: no SHA256SUMS in the beta release - refusing to promote unverified binaries."
            exit 1
          fi

      - name: Determine version tag
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_VERSION: ${{ needs.check-beta.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # `BETA_VERSION` derives from the `Cargo.toml` of a commit named by a
          # release asset, so it is validated here rather than trusted.
          if ! printf '%s' "$BETA_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: '$BETA_VERSION' is not a valid semver version."
            exit 1
          fi
          VERSION="v$BETA_VERSION"
          # `check-beta` now skips an un-bumped promotion outright, so in normal
          # operation the tag cannot already exist. This is the fallback for the
          # one case that still reaches here - a `force=true` re-deploy of a
          # version already released - and it disambiguates with the date rather
          # than moving an immutable tag.
          if gh api "repos/$REPO/git/refs/tags/$VERSION" >/dev/null 2>&1; then
            VERSION="${VERSION}+$(date -u +%Y%m%d)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Publish prod release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          # See beta.yml: tagging the promoted (older) commit needs a token
          # that may create refs with workflow-file drift; GITHUB_TOKEN cannot.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          # Append GitHub's auto-generated notes (merged PRs since the last
          # versioned release) below the static install instructions.
          generate_release_notes: true
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ needs.check-beta.outputs.sha }}
          name: "Leviath ${{ env.VERSION }}"
          body: |
            **Stable release** - ${{ env.VERSION }}

            Source commit: ${{ needs.check-beta.outputs.sha }}

            ### Install

            **Homebrew (macOS):**
            ```bash
            brew tap gemisis/leviath https://github.com/GEMISIS/leviath-dist.git
            brew install leviath
            ```

            **Linux:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/GEMISIS/leviath-dist/main/install.sh | bash
            ```

            **Windows (Scoop):**
            ```powershell
            scoop bucket add leviath https://github.com/GEMISIS/leviath-dist.git
            scoop install leviath
            ```

            **Manual:**
            ```bash
            # Download the archive for your platform, then:
            tar xzf leviath-*.tar.gz    # or unzip for Windows
            sudo mv lev /usr/local/bin/
            ```

            **From source:**
            ```bash
            cargo install --git https://github.com/GEMISIS/leviath.git --tag ${{ env.VERSION }} --bin lev
            ```
          prerelease: false
          make_latest: true
          files: release/*

      # The install script's stable channel resolves releases/tags/latest,
      # so 'latest' must be a rolling channel release with the same assets
      # (like 'alpha' and 'beta'), not just a git tag. Delete release+tag
      # together before republishing to avoid orphaned-draft collisions.
      - name: Update latest channel release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --yes --cleanup-tag --repo ${{ github.repository }} || true

      - name: Publish latest channel release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          # Same as the prod release above.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: latest
          target_commitish: ${{ needs.check-beta.outputs.sha }}
          name: "Leviath ${{ env.VERSION }} (stable channel)"
          body: |
            Rolling **stable channel** release, currently ${{ env.VERSION }}.

            Source commit: ${{ needs.check-beta.outputs.sha }}

            This tag always points at the newest stable release; see the
            ${{ env.VERSION }} release for details and install instructions.
          prerelease: false
          make_latest: false
          files: release/*

      # See alpha.yml: the channel badges are published from the job that knows
      # what it shipped, because shields.io cannot distinguish two prereleases
      # on rolling tags.
      - name: Update the stable channel badge
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: leviath-channel-stable.json
          label: stable
          message: ${{ needs.check-beta.outputs.version }}
          color: brightgreen



  # crates.io tracks the stable channel: same commit as the binaries, so
  # `cargo install leviath-cli` means "the current stable line". Alpha and
  # beta are deliberately NOT published - registry versions are immutable and
  # nightly prereleases would be permanent clutter that `cargo install`
  # ignores by default anyway; developers who want the bleeding edge use
  # `cargo install --git`. Publishing per crate (not --workspace) because
  # cargo hard-errors on partially-published workspaces, and the per-crate
  # already-on-crates.io check makes the whole job idempotent: a same-version
  # re-promotion (the +date tag case) skips every crate cleanly.
  publish-crates:
    name: Publish crates.io
    needs: [deploy, check-beta]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The promoted beta commit, so the crates match the binaries.
          ref: ${{ needs.check-beta.outputs.sha }}
      - uses: ./.github/actions/rust-setup
        with:
          cache: "false"
      - name: Publish unpublished crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.check-beta.outputs.version }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set; skipping the crates.io publish."
            exit 0
          fi
          # Dependency order: cargo publish verifies each crate against the
          # registry, so dependencies must land before their dependents. A
          # dev-dependency counts too: cargo resolves it when packaging, so
          # agent-client (which tests against tools) has to follow tools.
          # The version check in CI refuses a list that breaks this.
          for c in leviath-alloc leviath-core leviath-net leviath-sys \
                   leviath-mcp leviath-package leviath-scripting \
                   leviath-telemetry leviath-providers leviath-tools \
                   leviath-agent-client leviath-runtime \
                   leviath leviath-cli; do
            if curl -fsS -A "leviath-ci (github.com/GEMISIS/leviath)" \
                 "https://crates.io/api/v1/crates/$c/$VERSION" >/dev/null 2>&1; then
              echo "$c@$VERSION already on crates.io, skipping"
              continue
            fi
            # Retry with a delay: crates.io rate-limits bursts of publishes,
            # and the sparse index takes a moment to serve a just-published
            # dependency to the next crate's verify build.
            tries=0
            until cargo publish -p "$c"; do
              tries=$((tries + 1))
              if [ "$tries" -ge 15 ]; then
                echo "::error::giving up on $c after $tries attempts"
                exit 1
              fi
              echo "publish of $c failed (attempt $tries); retrying in 2m"
              sleep 120
            done
          done

  docs:
    name: Publish docs (stable)
    # check-beta is only here for its `sha` output; deploy is the real gate
    # (it inherits check-beta's skip condition).
    needs: [deploy, check-beta]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/publish-docs.yml
    with:
      channel: stable
      # The promoted beta commit, so stable docs match the stable binaries.
      ref: ${{ needs.check-beta.outputs.sha }}
    secrets: inherit

  # Homebrew and Scoop compare the installed version against the version
  # *declared* in the manifest to decide whether an upgrade exists; neither
  # looks at what is behind the rolling channel tag the manifests point at. So
  # the tap has to be told what just shipped, or `brew upgrade` never fires.
  # Its own job, not a step on `deploy`: a failure here must be loud without
  # retroactively failing a release that did publish.
  bump-tap:
    name: Bump tap manifests (stable)
    needs: [deploy, check-beta]
    if: needs.check-beta.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # GITHUB_TOKEN is scoped to this repo, so reaching the tap needs a PAT.
      # RELEASE_TOKEN already exists for the release steps above and only needs
      # leviath-dist added to its repository access (Contents: read and write).
      - uses: ./.github/actions/dispatch-dist
        with:
          channel: stable
          version: ${{ needs.check-beta.outputs.version }}
          token: ${{ secrets.RELEASE_TOKEN }}
