name: Beta (Weekly Monday)

on:
  schedule:
    # Every Monday at 9am PST (4pm UTC)
    - cron: '0 16 * * 1'
  workflow_dispatch: # Manual trigger

# Read-only by default; only the job that publishes a release elevates, matching
# alpha.yml and prod.yml. A workflow-level `contents: write` grants it to every
# step, including ones that merely read.
permissions:
  contents: read

jobs:
  promote:
    name: Promote Alpha → Beta
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Handed to the docs job so beta docs render the promoted alpha commit,
    # exactly like the binaries.
    outputs:
      sha: ${{ steps.alpha.outputs.sha }}
      skip: ${{ steps.alpha.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Get alpha release info
        id: alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the alpha release
          alpha_info=$(gh release view alpha --json tagName,assets,body 2>/dev/null || echo "")
          if [ -z "$alpha_info" ]; then
            echo "No alpha release found. Skipping beta promotion."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract the commit SHA from the alpha release assets
          gh release download alpha --pattern "COMMIT_SHA" --dir /tmp/alpha/ 2>/dev/null || true
          if [ -f /tmp/alpha/COMMIT_SHA ]; then
            sha=$(cat /tmp/alpha/COMMIT_SHA)
            # From a release asset - attacker-controlled for anyone who can write
            # a release - and it becomes the published release's
            # `target_commitish`. Pin its shape before it is used.
            if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "ERROR: COMMIT_SHA in the alpha release is not a 40-hex commit id."
              exit 1
            fi
            echo "sha=$sha" >> $GITHUB_OUTPUT
            echo "sha_short=${sha:0:7}" >> $GITHUB_OUTPUT
            # Version at the promoted commit, for the release title. Same
            # extraction prod.yml applies to the beta SHA.
            echo "version=$(git show "$sha:Cargo.toml" | grep '^version' | head -1 | sed 's/.*"\(.*\)"/\1/')" >> $GITHUB_OUTPUT
          else
            echo "No COMMIT_SHA in alpha release. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Download alpha binaries
        if: steps.alpha.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release/
          gh release download alpha --dir release/
          ls -la release/

          # Verify the checksums before republishing. They were generated at
          # alpha and carried forward without ever being checked, so a tampered
          # asset propagated to beta and on to prod with its stale checksum
          # shipped alongside it.
          if [ -f release/SHA256SUMS ]; then
            (cd release && grep -v '^SHA256SUMS$' SHA256SUMS | sha256sum -c -)
          else
            echo "ERROR: no SHA256SUMS in the alpha release - refusing to promote unverified binaries."
            exit 1
          fi

      # 'beta' is a rolling channel release: delete the previous release
      # AND its tag together before republishing (deleting only the tag
      # orphans the release as a draft and the next publish collides).
      - name: Reset beta channel release
        if: steps.alpha.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release delete beta --yes --cleanup-tag --repo "$REPO" || true

      - name: Publish beta release
        if: steps.alpha.outputs.skip != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: beta
          target_commitish: ${{ steps.alpha.outputs.sha }}
          name: "Leviath v${{ steps.alpha.outputs.version }}-Beta"
          body: |
            **Weekly beta build** promoted from alpha.

            Source commit: ${{ steps.alpha.outputs.sha }}
            Promoted: ${{ steps.alpha.outputs.date }}

            This build has passed nightly alpha testing. It will be promoted to
            prod on Thursday if approved.

            ### Install

            **Homebrew (macOS):**
            ```bash
            brew tap gemisis/leviath https://github.com/GEMISIS/leviath-dist.git
            brew install leviath
            ```

            **Linux:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/GEMISIS/leviath-dist/main/install.sh | bash
            ```

            **Manual:**
            ```bash
            tar xzf leviath-*.tar.gz
            sudo mv lev /usr/local/bin/
            ```
          prerelease: true
          files: release/*

  docs:
    name: Publish docs (beta)
    needs: promote
    # `promote` exits 0 when there is no alpha to promote; no new binaries
    # means no docs refresh either.
    if: needs.promote.outputs.skip != 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/publish-docs.yml
    with:
      channel: beta
      # The promoted alpha commit, so beta docs match the beta binaries.
      ref: ${{ needs.promote.outputs.sha }}
    secrets: inherit
