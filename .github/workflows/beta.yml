name: Beta (Weekly Monday)

on:
  schedule:
    # Every Monday at 9am PST (4pm UTC)
    - cron: '0 16 * * 1'
    # Backstop, four hours later, mirroring prod.yml. GitHub does not guarantee
    # a scheduled event is ever delivered, and on 2026-08-31 it dropped the
    # 16:00 dispatch outright, as it had for prod the Thursday before. The
    # `Get alpha release info` gate already refuses to ship a version beta
    # carries, so a redundant run is a fifteen-second no-op, and the
    # beta-promote concurrency group queues the two slots if both ever arrive.
    - cron: '0 20 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Promote even if the version was not bumped
        type: boolean
        default: false

# One promotion at a time. A manual `force` run started during the scheduled
# one must queue behind it, not race it to the same tag.
concurrency:
  group: beta-promote
  cancel-in-progress: false

# Read-only by default; only the job that publishes a release elevates, matching
# alpha.yml and prod.yml. A workflow-level `contents: write` grants it to every
# step, including ones that merely read.
permissions:
  contents: read

jobs:
  promote:
    name: Promote Alpha → Beta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # Handed to the docs job so beta docs render the promoted alpha commit,
    # exactly like the binaries.
    outputs:
      sha: ${{ steps.alpha.outputs.sha }}
      skip: ${{ steps.alpha.outputs.skip }}
      # Also handed to bump-tap, so the tap declares what beta actually ships.
      version: ${{ steps.alpha.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Get alpha release info
        id: alpha
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          # Get the alpha release
          alpha_info=$(gh release view alpha --json tagName,assets,body 2>/dev/null || echo "")
          if [ -z "$alpha_info" ]; then
            echo "No alpha release found. Skipping beta promotion."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract the commit SHA from the alpha release assets
          gh release download alpha --pattern "COMMIT_SHA" --dir /tmp/alpha/ 2>/dev/null || true
          if [ -f /tmp/alpha/COMMIT_SHA ]; then
            sha=$(cat /tmp/alpha/COMMIT_SHA)
            # From a release asset - attacker-controlled for anyone who can write
            # a release - and it becomes the published release's
            # `target_commitish`. Pin its shape before it is used.
            if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "ERROR: COMMIT_SHA in the alpha release is not a 40-hex commit id."
              exit 1
            fi
            echo "sha=$sha" >> $GITHUB_OUTPUT
            echo "sha_short=${sha:0:7}" >> $GITHUB_OUTPUT
            # Version at the promoted commit, for the release title. Same
            # extraction prod.yml applies to the beta SHA.
            version=$(git show "$sha:Cargo.toml" | grep '^version' | head -1 | sed 's/.*"\(.*\)"/\1/')
            echo "version=$version" >> $GITHUB_OUTPUT
          else
            echo "No COMMIT_SHA in alpha release. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # A promotion has to have something to promote. Alpha is a rolling
          # tag that gets republished whenever the version moves, so "is this
          # alpha newer than what beta already carries" is the same question as
          # "did the version change" - and the answer lives in the same place
          # for both channels: the Cargo.toml of the commit each one names.
          # Without this, every Monday republished beta from an alpha it had
          # already promoted, churning the tag and the tap for nothing.
          if [ "$FORCE" != "true" ]; then
            gh release download beta --pattern "COMMIT_SHA" --dir /tmp/beta/ 2>/dev/null || true
            if [ -f /tmp/beta/COMMIT_SHA ]; then
              beta_sha=$(cat /tmp/beta/COMMIT_SHA)
              if ! printf '%s' "$beta_sha" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "ERROR: COMMIT_SHA in the beta release is not a 40-hex commit id."
                exit 1
              fi
              beta_version=$(git show "$beta_sha:Cargo.toml" 2>/dev/null | grep '^version' | head -1 | sed 's/.*"\(.*\)"/\1/' || true)
              if [ "$version" = "$beta_version" ]; then
                echo "Beta already carries $version. Nothing to promote."
                echo "skip=true" >> $GITHUB_OUTPUT
                exit 0
              fi
              echo "Version moves $beta_version -> $version. Promoting."
            else
              echo "No comparable beta release - promoting $version."
            fi
          else
            echo "force=true: promoting $version regardless of what beta carries."
          fi

          echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Download alpha binaries
        if: steps.alpha.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release/
          gh release download alpha --dir release/
          ls -la release/

          # Verify the checksums before republishing. They were generated at
          # alpha and carried forward without ever being checked, so a tampered
          # asset propagated to beta and on to prod with its stale checksum
          # shipped alongside it.
          if [ -f release/SHA256SUMS ]; then
            (cd release && grep -v '^SHA256SUMS$' SHA256SUMS | sha256sum -c -)
          else
            echo "ERROR: no SHA256SUMS in the alpha release - refusing to promote unverified binaries."
            exit 1
          fi

      # 'beta' is a rolling channel release: delete the previous release
      # AND its tag together before republishing (deleting only the tag
      # orphans the release as a draft and the next publish collides).
      - name: Reset beta channel release
        if: steps.alpha.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release delete beta --yes --cleanup-tag --repo "$REPO" || true

      - name: Publish beta release
        if: steps.alpha.outputs.skip != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          # Promotion tags an OLDER commit whose .github/workflows can differ
          # from main's current tree, and GITHUB_TOKEN is never allowed to
          # create such a ref (the 403's x-accepted-github-permissions wants
          # contents+workflows, and workflow permissions blocks cannot grant
          # workflows). RELEASE_TOKEN is a fine-grained PAT with Contents +
          # Workflows read/write on this repo; the fallback keeps the
          # no-workflow-drift case working without the secret.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: beta
          target_commitish: ${{ steps.alpha.outputs.sha }}
          name: "Leviath v${{ steps.alpha.outputs.version }}-Beta"
          body: |
            **Weekly beta build** promoted from alpha.

            Source commit: ${{ steps.alpha.outputs.sha }}
            Promoted: ${{ steps.alpha.outputs.date }}

            This build has passed nightly alpha testing. It will be promoted to
            prod on Thursday if approved.

            ### Install

            **Homebrew (macOS):**
            ```bash
            brew tap gemisis/leviath https://github.com/GEMISIS/leviath-dist.git
            brew install leviath
            ```

            **Linux:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/GEMISIS/leviath-dist/main/install.sh | bash
            ```

            **Manual:**
            ```bash
            tar xzf leviath-*.tar.gz
            sudo mv lev /usr/local/bin/
            ```
          prerelease: true
          files: release/*

      # See alpha.yml: the channel badges are published from the job that knows
      # what it shipped, because shields.io cannot distinguish two prereleases
      # on rolling tags.
      - name: Update the beta channel badge
        if: steps.alpha.outputs.skip != 'true'
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: leviath-channel-beta.json
          label: beta
          message: ${{ steps.alpha.outputs.version }}
          color: blue

  docs:
    name: Publish docs (beta)
    needs: promote
    # `promote` exits 0 when there is no alpha to promote; no new binaries
    # means no docs refresh either.
    if: needs.promote.outputs.skip != 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/publish-docs.yml
    with:
      channel: beta
      # The promoted alpha commit, so beta docs match the beta binaries.
      ref: ${{ needs.promote.outputs.sha }}
    secrets: inherit

  # See prod.yml: the tap's declared version is the only upgrade signal, so it
  # has to be told what beta just published.
  bump-tap:
    name: Bump tap manifests (beta)
    needs: promote
    if: needs.promote.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/dispatch-dist
        with:
          channel: beta
          version: ${{ needs.promote.outputs.version }}-beta
          token: ${{ secrets.RELEASE_TOKEN }}
