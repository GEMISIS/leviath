[workspace]
resolver = "2"
members = [
    "crates/leviath-core",
    "crates/leviath-runtime",
    "crates/leviath-providers",
    "crates/leviath-mcp",
    "crates/leviath-scripting",
    "crates/leviath-package",
    "crates/leviath-cli",
    "crates/leviath-tools",
    "crates/leviath-sys",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Gerald McAlister <gemisis@gmail.com>"]
repository = "https://github.com/Sun-Forge-AI/leviath"
description = "A structured agent runtime for LLMs — context memory, multi-stage workflows, and ECS-based orchestration"

[workspace.dependencies]
# Core crates
leviath-core = { path = "crates/leviath-core" }
leviath-runtime = { path = "crates/leviath-runtime" }
leviath-providers = { path = "crates/leviath-providers" }
leviath-mcp = { path = "crates/leviath-mcp" }
leviath-scripting = { path = "crates/leviath-scripting" }
leviath-package = { path = "crates/leviath-package" }
leviath-tools = { path = "crates/leviath-tools" }
leviath-sys = { path = "crates/leviath-sys" }

# External dependencies
bevy_ecs = "0.15"
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
# rustls instead of default native-tls: keeps Linux binaries free of a
# runtime libssl dependency (single static binary) and lets the
# aarch64-linux release target cross-compile without an OpenSSL sysroot.
# native-roots so system/corporate CA stores are still honored.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "charset", "http2", "macos-system-configuration"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
toml = { version = "0.8", features = ["preserve_order"] }
anyhow = "1.0"
chrono = "0.4"
rhai = { version = "1.20", features = ["sync"] }
tiktoken-rs = "0.5"
async-trait = "0.1"
futures = "0.3"
futures-core = "0.3"
tokio-stream = "0.1"
pin-project-lite = "0.2"
flate2 = "1.0"
tar = "0.4"
dirs = "6.0.0"
dotenvy = "0.15"
libc = "0.2"
nix = { version = "0.28", default-features = false, features = ["signal", "process"] }
temp-env = "0.3"
crossterm = "0.28"
ratatui = "0.29"
pulldown-cmark = "0.12"
tui-textarea = { version = "0.7", features = ["crossterm"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
