[workspace]
resolver = "2"
members = [
    "crates/leviath",
    "crates/leviath-core",
    "crates/leviath-net",
    "crates/leviath-agent-client",
    "crates/leviath-runtime",
    "crates/leviath-providers",
    "crates/leviath-mcp",
    "crates/leviath-scripting",
    "crates/leviath-package",
    "crates/leviath-cli",
    "crates/leviath-alloc",
    "crates/leviath-tools",
    "crates/leviath-sys",
    "crates/leviath-telemetry",
    "crates/leviath-testkit",
    "xtask",
]

[workspace.package]
version = "0.3.6"
edition = "2024"
license = "MIT"
authors = ["Gerald McAlister <gemisis@users.noreply.github.com>"]
repository = "https://github.com/GEMISIS/leviath"
homepage = "https://leviath.dev"
description = "A structured agent runtime for LLMs - context memory, multi-stage workflows, and ECS-based orchestration"
# crates.io metadata. `rust-version` is the toolchain releases are built and
# tested with (rust-toolchain.toml pins the same minor); edition 2024 already
# needs >= 1.85, this just states the tested floor honestly.
rust-version = "1.97"
keywords = ["agents", "llm", "ai", "runtime", "context"]
categories = ["development-tools"]

# Lints applied to every workspace member that opts in with `[lints] workspace = true`.
# `unsafe_code = "forbid"` is a hard compile error that cannot be re-enabled by a
# local `#[allow(unsafe_code)]` -- the OS-level unsafe leviath needs lives in audited
# dependencies (nix, temp-env) plus ONE audited in-repo exception: leviath-alloc,
# a single-call crate that deliberately does not opt into these lints (its lib.rs
# carries the audit note). Nothing else writes unsafe.
# Every public item carries a doc comment, and CI's `RUSTFLAGS: -D warnings`
# turns this "warn" into a blocking error, so a PR that adds undocumented public
# API does not merge. There are no exemptions -- `leviath-cli` was the obvious
# candidate for one and deliberately does not take it, because its `pub` surface
# is what the integration tests drive and its wire types are read by clients that
# never see this source. Its crate root says so.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# `&s[a..b]` on a `&str` panics when an index lands inside a multi-byte character.
# That is not hypothetical here: it aborted the daemon twice (issues #109 and #115,
# a byte cut-off through an emoji inside a Rhai host function), and an audit found
# two more live instances plus four hand-rolled copies of the walk-back loop. So it
# is denied workspace-wide, with no exceptions: there are zero suppressions of it
# in the tree and a lint rule that fails the build on a new one.
#
# Reach for `leviath_core::text` instead. `substring` and `split_at_boundary` are
# the general replacements and both are total - no combination of offsets makes
# either panic - and `truncate_at_boundary` / `snippet_around` cover the common
# cuts. Where the text is being scanned rather than cut, `split_once` is usually
# the real answer, and it removes the delimiter-length arithmetic along with the
# index.
#
# The suppressions this paragraph used to sanction all turned out to be worth
# removing. Every one named a construct that guaranteed the index was a boundary,
# and every one of those claims was true - but the proof lived in a comment, and
# the code around it was free to drift. What replaced them is not a better comment
# but a signature that cannot be wrong.
[workspace.lints.clippy]
string_slice = "deny"

# Suppressing a lint is itself a compile error. `allow_attributes` rejects
# `#[allow(...)]` outright and `allow_attributes_without_reason` requires a
# `reason = "..."` on anything that remains, so silencing a lint takes a
# deliberate edit to this table rather than a line in a file nobody re-reads.
#
# This is the compiler enforcing what `.sgrules/no-lint-suppression.yml` already
# enforced by pattern, and it is strictly wider: the rule matches attribute
# syntax, while these follow the lint through forms a grep does not see. The one
# violation in the tree when they were switched on was
# `#[cfg_attr(not(feature = "debug-http"), allow(unused_variables))]`, which no
# search for `#[allow(` finds and which only exists in a non-default feature
# build. Keep both - the ast-grep rule still gives a better message and runs on
# the pre-commit path without a full check.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[workspace.dependencies]
# Core crates. Path + version: the path is used inside the workspace, the
# version is what lands in published manifests -- `cargo publish` hard-errors
# on a path dependency without one. A release bump therefore means updating
# `[workspace.package] version` above AND these version fields together.
# `leviath-testkit` stays path-only ON PURPOSE: cargo strips path-only
# dev-dependencies when publishing, which is what keeps the testkit private
# to the repo while every crate that dev-depends on it still publishes.
leviath = { path = "crates/leviath", version = "0.3.6" }
leviath-core = { path = "crates/leviath-core", version = "0.3.6" }
leviath-net = { path = "crates/leviath-net", version = "0.3.6" }
leviath-agent-client = { path = "crates/leviath-agent-client", version = "0.3.6" }
leviath-runtime = { path = "crates/leviath-runtime", version = "0.3.6" }
leviath-providers = { path = "crates/leviath-providers", version = "0.3.6" }
leviath-mcp = { path = "crates/leviath-mcp", version = "0.3.6" }
leviath-scripting = { path = "crates/leviath-scripting", version = "0.3.6" }
leviath-package = { path = "crates/leviath-package", version = "0.3.6" }
leviath-tools = { path = "crates/leviath-tools", version = "0.3.6" }
leviath-sys = { path = "crates/leviath-sys", version = "0.3.6" }
leviath-telemetry = { path = "crates/leviath-telemetry", version = "0.3.6" }
leviath-testkit = { path = "crates/leviath-testkit" }

# External dependencies
bevy_ecs = { version = "0.19", features = ["multi_threaded"] }
bevy_tasks = "0.19"
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
# rustls instead of default native-tls: keeps Linux binaries free of a
# runtime libssl dependency (single static binary) and lets the
# aarch64-linux release target cross-compile without an OpenSSL sysroot.
# native-roots so system/corporate CA stores are still honored.
# TLS is rustls, never native-tls: one audited implementation on every platform
# rather than whatever the OS ships. 0.13 renamed the features -
# `rustls-tls-native-roots` became `rustls` + `rustls-native-certs`, and
# `macos-system-configuration` became `system-proxy`. `form` and `query`, which
# used to be always-on, are now opt-in.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "rustls-native-certs", "charset", "http2", "system-proxy", "blocking", "form", "query"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# OpenTelemetry export ([observability] config, issue #73). OTLP goes over
# HTTP/protobuf on the existing rustls reqwest stack - never gRPC, which would
# drag in tonic and a second TLS implementation. `reqwest-blocking-client` so
# the SDK's own background export thread does the I/O without needing a tokio
# context; `prost` comes along for message encoding only. The `testing`
# feature (in-memory exporters) is enabled by leviath-telemetry's
# dev-dependency, not here.
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry-appender-tracing = "0.32"
thiserror = "2.0"
toml = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
chrono = "0.4"
rhai = { version = "1.25", features = ["sync", "serde"] }
glob = "0.3"
# Free-space queries for the disk guard (`leviath-sys::disk`). Pure Rust over
# `rustix`; `std` has no equivalent and the workspace forbids `unsafe`.
fs4 = "1.1"
# Compiled once per [read_paths] entry at spawn; already in the lock file
# transitively, named here so the allowlist matcher in `leviath-core` uses the
# same version everywhere.
regex = "1.13"
# Already in the tree via reqwest; named explicitly so `leviath-core` can hold
# the outbound-URL policy (`leviath_core::net`) without depending on reqwest.
# `reqwest::Url` IS this crate's `Url`, so the two interoperate directly.
url = "2.5"
tiktoken-rs = "0.12"
# Compiles tool-parameter JSON Schemas and validates model-supplied arguments
# before dispatch (issue #155). `default-features = false` is deliberate: the
# default resolve-http/resolve-file features would let a server-supplied MCP
# schema pull external `$ref`s over the network or filesystem at validation
# time. Without them an external `$ref` simply fails to compile, and a schema
# that fails to compile skips validation instead of refusing calls.
jsonschema = { version = "0.49", default-features = false }
# Parsers behind the built-in output validators, which check that a submitted
# answer is well-formed in the format it claims. Well-formedness only: schema
# conformance is JSON Schema (above) or an agent's own Rhai validator, so none
# of these needs its format's schema language.
quick-xml = "0.41"
yaml-rust2 = "0.11"
csv = "1.4"
async-trait = "0.1"
futures = "0.3"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
base64 = "0.23"
rand = "0.10"
futures-core = "0.3"
tokio-stream = "0.1"
pin-project-lite = "0.2"
flate2 = "1.0"
tar = "0.4"
dirs = "6.0.0"
dotenvy = "0.15"
libc = "0.2"
# "socket" is for the control socket's peer-credential check (SO_PEERCRED on
# Linux, LOCAL_PEERCRED on macOS/BSD), which is what stops another local user
# from driving the daemon.
nix = { version = "0.31", default-features = false, features = ["signal", "process", "user", "socket"] }
temp-env = "0.3"
crossterm = "0.29"
# unstable-rendered-line-info: `Paragraph::line_count`, which the dashboard
# uses to scroll wrapped text by display rows ("unstable" = API may change
# between ratatui versions; this workspace pins 0.30).
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
# Already in the tree via ratatui; named explicitly so the dashboard's mouse
# selection can measure symbol display widths when reading cells back out of
# the drawn frame (wide CJK/emoji symbols occupy continuation cells).
unicode-width = "0.2"
pulldown-cmark = "0.13"
# The ratatui org's adoption of the dormant rhysd/tui-textarea (unreleased
# since 2024-10 and unable to follow ratatui past 0.29). Same widget lineage,
# maintained alongside the framework itself.
ratatui-textarea = { version = "0.9", features = ["crossterm"] }
axum = { version = "0.8", features = ["ws"] }
# HTTPS for `lev serve` (issue #300). Its `tls-rustls` feature resolves to
# `rustls/aws-lc-rs` - the same provider the outbound reqwest stack already
# uses - so this adds a server-side TLS *listener* without adding a second TLS
# implementation or a second crypto provider, which is what the policy above
# is about.
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower-http = { version = "0.7", features = ["cors"] }

# ── Release profile ──────────────────────────────────────────────────────────
#
# There was no `[profile.release]` at all, so shipped binaries used cargo's
# defaults: no LTO, 16 codegen units, full symbol table, and - the one that
# matters for correctness - arithmetic overflow wrapping silently.
#
# A copy of this section lives in crates/leviath-cli/Cargo.toml so that
# `cargo install leviath-cli` (where that manifest is the root and this one
# does not exist) builds with the same settings. Keep the two in sync.
[profile.release]
# Overflow panics instead of wrapping. This workspace already treats
# index/arithmetic mistakes as a real class of bug rather than a theoretical one
# (see the `clippy::string_slice` deny above, which exists because a byte index
# through a multi-byte character aborted the daemon twice). Token budgets,
# context-window arithmetic and region sizing are all `usize` maths on
# model-influenced numbers; a wrap there produces a wrong answer that looks like
# a valid one. A panic is a worse user experience and a much better failure mode.
overflow-checks = true

# One codegen unit and fat LTO: smaller binary, and the whole program is
# optimized as a unit rather than per-CGU.
lto = "fat"
codegen-units = 1

# Strip symbols. `debug` is already false, so there is no DWARF; this drops the
# symbol table too, which is a smaller download and slightly less of a map for
# anyone poking at the binary. Backtraces from a released build are already not
# meaningful without symbols on hand.
strip = "symbols"

# NOTE: `panic = "abort"` is deliberately NOT set, and should not be added.
#
# The daemon depends on unwinding. Rhai host functions are wrapped in
# `catch_unwind` (`guard_str`/`guard_dyn`, private to
# `crates/leviath-scripting/src/tool.rs`) so that a
# panic inside a native function registered with the script engine becomes an
# ordinary script error instead of taking the whole daemon down - that was issue
# #109, where a byte-boundary panic inside `decode_entities` aborted the process
# for every running agent. `panic = "abort"` would remove that safety net and
# reinstate the bug. The same applies to the pipeline's per-system panic
# attribution and the `catch_unwind` around agent spawn.
