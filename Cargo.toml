[workspace]
resolver = "2"
members = [
    "crates/leviath-core",
    "crates/leviath-runtime",
    "crates/leviath-providers",
    "crates/leviath-mcp",
    "crates/leviath-scripting",
    "crates/leviath-package",
    "crates/leviath-cli",
    "crates/leviath-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Gerald McAlister <gemisis@gmail.com>"]

[workspace.dependencies]
# Core crates
leviath-core = { path = "crates/leviath-core" }
leviath-runtime = { path = "crates/leviath-runtime" }
leviath-providers = { path = "crates/leviath-providers" }
leviath-mcp = { path = "crates/leviath-mcp" }
leviath-scripting = { path = "crates/leviath-scripting" }
leviath-package = { path = "crates/leviath-package" }
leviath-tools = { path = "crates/leviath-tools" }

# External dependencies
bevy_ecs = "0.15"
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
toml = { version = "0.8", features = ["preserve_order"] }
anyhow = "1.0"
chrono = "0.4"
rhai = { version = "1.20", features = ["sync"] }
tiktoken-rs = "0.5"
async-trait = "0.1"
futures = "0.3"
futures-core = "0.3"
tokio-stream = "0.1"
pin-project-lite = "0.2"
flate2 = "1.0"
tar = "0.4"
dirs = "6.0.0"
dotenvy = "0.15"
crossterm = "0.28"
ratatui = "0.29"
pulldown-cmark = "0.12"
