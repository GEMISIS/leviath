"""
Where a run stands. Exactly one of these, and each carries what a caller needs
to act on it: the question for a person, the workers being waited on, the
setup fix, the error, or the verdict.
"""
union RunState = Starting | Running | WaitingOnPerson | WaitingOnSubAgents | NeedsSetup | WaitingUnexplained | Paused | Lost | Completed | CompletedWithProblems | Failed | Cancelled | UnrecognizedState

"""
Filter on a run's state: one field per `RunState` type, and setting it
selects that state (`{ waitingOnPerson: {} }`); `or` picks several. `finished`
selects every state that implements `Finished`. Somebody has to act is
`or: [{ waitingOnPerson: {} }, { waitingOnSubAgents: { questionsBelow: { some: {} } } }]`.
"""
input RunStateFilter {
  "Matches `Starting` only."
  starting: StartingFilter
  "Matches `Running` only."
  running: RunningFilter
  "Matches `WaitingOnPerson` only."
  waitingOnPerson: WaitingOnPersonFilter
  "Matches `WaitingOnSubAgents` only."
  waitingOnSubAgents: WaitingOnSubAgentsFilter
  "Matches `NeedsSetup` only."
  needsSetup: NeedsSetupFilter
  "Matches `WaitingUnexplained` only."
  waitingUnexplained: WaitingUnexplainedFilter
  "Matches `Paused` only."
  paused: PausedFilter
  "Matches `Lost` only."
  lost: LostFilter
  "Matches `Completed` only."
  completed: CompletedFilter
  "Matches `CompletedWithProblems` only."
  completedWithProblems: CompletedWithProblemsFilter
  "Matches `Failed` only."
  failed: FailedFilter
  "Matches `Cancelled` only."
  cancelled: CancelledFilter
  "Matches `UnrecognizedState` only."
  unrecognizedState: UnrecognizedStateFilter
  "Matches every state that implements `Finished`."
  finished: FinishedFilter
  "Every filter in this list has to hold."
  and: [RunStateFilter!]
  "At least one filter in this list has to hold."
  or: [RunStateFilter!]
  "This filter must not hold."
  not: RunStateFilter
}

