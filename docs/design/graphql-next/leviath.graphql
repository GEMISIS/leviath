}

"Filter on `RunDirectory`, field for field."
input RunDirectoryFilter {
  "Filter on `RunDirectory.name`."
  name: StringFilter
  "Filter on `RunDirectory.path`."
  path: StringFilter
  "Every filter in this list has to hold."
  and: [RunDirectoryFilter!]
  "At least one filter in this list has to hold."
  or: [RunDirectoryFilter!]
  "This filter must not hold."
  not: RunDirectoryFilter
  "Match where there is no value at all (`true`), or where there is one (`false`)."
  isNull: Boolean
}

"""
A frame about one run. Every fact a frame carries can also be read by a query
(`Run`, `Run.stages`, `Run.executions`, `Run.spendCrossings`,
`openInteractions`), because an MCP tool-call client cannot hold a stream.
"""
interface RunEvent implements Event {
  "This server process's own frame number (see `Server.instanceId`). Gaps are ordinary; only `EventsDroppedEvent` announces a drop."
  seq: BigInt!
  "When the server sent it."
  at: DateTime!
  "The run's id, kept because the run may since have been deleted."
  runId: ID!
  "The run, read only when selected. Null once deleted."
  run: Run
}

"What `runEvents` yields: the run frames, the daemon-link frame (a scoped subscriber has to learn why its frames stopped), and the two about the stream."
union RunEventFrame = RunSpawnedEvent | RunChangedEvent | RunRenamedEvent | TokensUpdatedEvent | ContextUpdatedEvent | StageTransitionedEvent | ToolCallStartedEvent | ToolCallFinishedEvent | LogLineWrittenEvent | SpendThresholdCrossedEvent | InteractionOpenedEvent | RunFinishedEvent | DaemonLinkChangedEvent | SubscriptionOpenedEvent | EventsDroppedEvent

"""
Which run frames `runEvents` sends: one field per frame type. Omitted, every
run frame; given, only the types set `true`. The daemon-link and stream
frames always come.
"""
input RunEventFrameFilter {
  "`RunSpawnedEvent`."
  runSpawnedEvent: Boolean
  "`RunChangedEvent`."
  runChangedEvent: Boolean
  "`RunRenamedEvent`."
  runRenamedEvent: Boolean
  "`TokensUpdatedEvent`."
  tokensUpdatedEvent: Boolean
  "`ContextUpdatedEvent`."
  contextUpdatedEvent: Boolean
  "`StageTransitionedEvent`."
  stageTransitionedEvent: Boolean
  "`ToolCallStartedEvent`."
  toolCallStartedEvent: Boolean
  "`ToolCallFinishedEvent`."
  toolCallFinishedEvent: Boolean
  "`LogLineWrittenEvent`."
  logLineWrittenEvent: Boolean
  "`SpendThresholdCrossedEvent`."
  spendThresholdCrossedEvent: Boolean
  "`InteractionOpenedEvent`."
  interactionOpenedEvent: Boolean
  "`RunFinishedEvent`."
  runFinishedEvent: Boolean
}

"One export of the run store to a JSONL file."
