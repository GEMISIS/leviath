"""A tool an MCP server advertises, under the name Leviath gives it."""
type McpTool implements Tool & Node & Versioned {
  "`builtinTool:<name>`, `subagentTool:<name>`, `customTool:<name>` or `customTool@<blueprint>:<name>`, `mcpTool:<server>:<name on server>`."
  id: ID!
  """
  `<server>__<tool>`, sanitized for providers. The whole rule, so it can be written before the server has connected.
  """
  name: String!
  "What a call does when no config, blueprint, stage or launch flag says otherwise."
  defaultPermission: ToolPermission!
  """The name the server gives it; calls reach the server under this name."""
  nameOnServer: String!
  "The server that advertises it."
  server: McpServer!
  "The tool as it is offered now: its description and argument schema."
  revision: ToolRevision!
  "Every definition of this tool a run on this machine was offered, newest first. At most 100 a page."
  revisions(
    "Page size, 1 to 100."
    first: Int! = 20
    "Cursor from the previous page."
    after: Cursor
  ): ToolRevisionConnection!
  """
  The edits, newest first: one per write, each with the fields it changed.
  Kept for as long as the revisions they made. At most 100 a page.
  """
  history(
    "Page size, 1 to 100. Over 100 is refused (`BAD_USER_INPUT` / `PAGE_TOO_LARGE`)."
    first: Int! = 20
    "Cursor from the previous page."
    after: Cursor
  ): EditConnection!
}

