"""
One state of a `Versioned` thing, content-addressed: the same content always
has the same `digest`, and a revision never changes once recorded.
"""
interface Revision implements Node {
  "The owner's id, `@`, and the first 12 hex of `digest`."
  id: ID!
  "Which revision of its owner this is, from 1, in the order this machine first saw them."
  number: Int!
  """
  Lowercase hex SHA-256 of the content. For content that holds secrets (an
  MCP server, a model provider, the config) it is an HMAC under this
  machine's link-signing key, so it reveals nothing about them. Send it as
  `expectedRevision` to write over exactly this revision.
  """
  digest: String!
  "When this machine first recorded it."
  createdAt: DateTime!
  """
  Who wrote it: the name the API caller authenticated as, or `"cli"` for the
  lev command line. Null when the file was edited on disk and Leviath only saw
  the result.
  """
  createdBy: String
}

"""
One execution of a blueprint: the work, from the task it was given to what it
handed back. Read `state` first: it is the one honest answer to "what is this
run doing, and does anybody need to act".
"""
type Run implements Node {
  "`<blueprint name folded to ASCII>-<spawn Unix seconds>-<hex suffix>`, the handle every route takes. Read `blueprint.name` rather than parsing it."
  id: ID!
  "The task the run was started with, verbatim."
  task: String!
  "Human title from the titling pass. Null until it lands, or when it failed (`titleError`)."
  title: String
  "Why titling gave up. Null while it is pending and once it succeeded."
  titleError: String
  """
  The exact blueprint revision this run executed: its manifest and the files
  it names, as the run took them at spawn. What the blueprint is now is
  `blueprint.blueprint`.
  """
  blueprint: BlueprintRevision!
  """
  Where `blueprint` came from: the run's own snapshot, or, for a run recorded
  before snapshots, the installed revision standing in for it.
  """
  blueprintSource: BlueprintSource!
  "Where the run stands, as one of the `RunState` types. Branch on `__typename`."
  state: RunState!
  """
  Everything recorded against this run so far that makes its result suspect,
  one typed problem each. Empty is a clean record. A finished run also shows
  the verdict in `state` (`Completed` versus `CompletedWithProblems`).
  """
  problems: [RunProblem!]!
  "Whether the daemon is hosting this run right now. Null when the daemon did not answer, which is never evidence either way. False on a finished run."
  isHosted: Boolean
  "When it was spawned."
  startedAt: DateTime!
  """
  When the run last actually moved: a new turn, a new stage, or a new state.
  The record's write time is not offered: it advances on a 30-second
  heartbeat and says nothing about the run.
  """
  lastMovedAt: DateTime
  "The v1 name of `Run.lastMovedAt`."
  lastProgressAt: DateTime @deprecated(reason: "Use `lastMovedAt`.")
  "Seconds since `startedAt`, wall clock, when this answer was built."
  ageSeconds: BigInt!
  "The v1 name of `Run.ageSeconds`."
  ageSecs: BigInt! @deprecated(reason: "Use `ageSeconds`.")
  "Seconds spent working, parked and paused time excluded."
  workingSeconds: BigInt!
  "The v1 name of `Run.workingSeconds`."
  workingSecs: BigInt! @deprecated(reason: "Use `workingSeconds`.")
  "When the working span in progress began. Null while the run is not working."
  workingSince: DateTime
  "The stage the run is in, or finished in. Null before the first stage is entered."
  currentStage: RunStage
  "One entry per stage the blueprint revision declares, in declared order, reached or not. Bounded by its stage count."
  stages: [RunStage!]!
  "Every provider and model some stage ran an inference on, in first-use order."
  modelsUsed: [ModelUse!]!
  "Tokens for the whole run."
  usage: TokenUsage!
  "Spend for the whole run."
  cost: Cost!
  "Every spend threshold the run's priced spend has crossed, oldest first. Bounded by the configured thresholds. Empty for a run recorded before crossings were kept."
  spendCrossings: [SpendCrossing!]!
  "How many tool calls the run has made. The calls themselves are `executions`."
  toolCallCount: Int!
  """
  The approval policy revision the run was spawned under, unattended
  (`--yolo=<name>`; bare `--yolo` is the built-in `"default"`). Null for an
  attended run: every prompt goes to a person.
  """
  approvalPolicy: ApprovalPolicyRevision
  "Whether `sendMessage` reaches the run where it stands."
  acceptsMessages: Boolean!
  "What the spawn asked for beyond the blueprint, as the run persisted it."
  spawnedWith: SpawnSettings!
  "Caller-supplied labels from spawn, sorted by key. Nothing in the run reads them."
  metadata: [KeyValue!]!
  "The run that started this one. Null for a top-level run."
  parent: Run
  "Every run above this one, root first. Empty for a top-level run. Bounded by the depth limit."
  ancestors: [Run!]!
  "Direct sub-agents and fan-out workers: the run listing with this run preset as parent."
  children(
    "Which to include. Omitted means all."
    filter: RunFilter
    "Sort keys. Omitted means newest first."
    orderBy: [RunOrder!]
    "Page size, 1 to 200."
    first: Int! = 50
    "Cursor from the previous page."
    after: Cursor
  ): RunConnection!
  "Roll-ups over this run and everything below it."
  subtree: RunSubtree!
  "The answer the run submitted. Null until something is submitted."
  answer: Answer
  "Every interaction this run opened, open ones first, then settled ones in the order asked."
  interactions(
    "Which to include. Omitted means all; `{ settlement: { isNull: true } }` is the open ones."
    filter: InteractionFilter
    "Sort keys. Omitted means the order above."
    orderBy: [InteractionOrder!]
    "Page size, 1 to 200."
    first: Int! = 50
    "Cursor from the previous page."
    after: Cursor
  ): InteractionConnection!
  "Every attempt at every tool call, in dispatch order, from the journal."
  executions(
    "Which to include. Omitted means all."
    filter: ToolExecutionFilter
    "Sort keys. Omitted means journal order."
    orderBy: [ToolExecutionOrder!]
    "Page size, 1 to 200."
    first: Int! = 50
    "Cursor from the previous page."
    after: Cursor
  ): ToolExecutionConnection!
  "Every trip to a model provider, answered or failed, in the order made."
  modelAttempts(
    "Which to include. Omitted means all."
    filter: ModelAttemptFilter
    "Sort keys. Omitted means the order made."
    orderBy: [ModelAttemptOrder!]
    "Page size, 1 to 200."
    first: Int! = 50
    "Cursor from the previous page."
    after: Cursor
  ): ModelAttemptConnection!
  "The context window as it stands now. Null before the run writes one, and for a finished run whose window was not kept."
  context: ContextSnapshot
  "The window at each point it was recorded, chronological by default."
  contextSnapshots(
    "Which to include. Omitted means all."
    filter: ContextSnapshotFilter
    "Sort keys. Omitted means chronological."
    orderBy: [ContextSnapshotOrder!]
    "Page size, 1 to 50: each snapshot is a whole window."
    first: Int! = 20
    "Cursor from the previous page."
    after: Cursor
  ): ContextSnapshotConnection!
  "One window this run held, by digest. Null when this run never held it."
  contextSnapshot(
    "The window's digest, from `ContextSnapshot.digest` or a change's `before`/`after`."
    digest: String!
  ): ContextSnapshot
  "Every committed change to the window, in the order it landed."
  contextChanges(
    "Which to include. Omitted means all."
    filter: ContextChangeFilter
    "Sort keys. Omitted means journal order."
    orderBy: [ContextChangeOrder!]
    "Page size, 1 to 200."
    first: Int! = 50
    "Cursor from the previous page."
    after: Cursor
  ): ContextChangeConnection!
  "The stored parts (images, audio, documents: non-text content) this run holds. Metadata only; bytes are behind each part's `url`."
  parts(
    "Which to include. Omitted means all."
    filter: StoredPartFilter
    "Sort keys. Omitted means by content hash."
    orderBy: [StoredPartOrder!]
    "Page size, 1 to 200."
    first: Int! = 50
    "Cursor from the previous page."
    after: Cursor
  ): StoredPartConnection!
  "One stored part by content hash. Null when this run holds none by that hash."
  part(
    "The part's content hash."
    sha256: String!
  ): StoredPart
  "The run's working directory as it is on disk now."
  workingDirectory: RunDirectory!
  "What the run recorded changing, first touch first. Capped at 200 when recorded; `changedFileCount` is the true total."
  changedFiles: [ChangedFile!]!
  "How many successful file-changing tool calls the run made, uncapped."
  changedFileCount: Int!
  "One file by path relative to the working directory. Lazy: asking for its `url` does not touch the disk."
  file(
    "Relative to the working directory."
    path: String!
  ): RunFile
}

"""
Something about a run moved: its state, its stage, or its counters. Fires on
every tool call, so ask for it only when you draw live counters.
"""
type RunChangedEvent implements RunEvent & Event {
  "Where the run stands now."
  state: RunState!
  "The stage it is in. Null before the first."
  stage: RunStage
  "Tool calls across the whole run."
  toolCallCount: Int!
  "Whether a message reaches the run right now."
  acceptsMessages: Boolean!
  "This server process's own frame number (see `Server.instanceId`). Gaps are ordinary; only `EventsDroppedEvent` announces a drop."
  seq: BigInt!
  "When the server sent it."
  at: DateTime!
  "The run's id, kept because the run may since have been deleted."
  runId: ID!
  "The run, read only when selected. Null once deleted."
  run: Run
}

"A page of runs."
type RunConnection {
  "The runs on this page, at most `first` of them."
  results: [Run!]!
  "Pass as `after` for the next page. Null on the last."
  cursor: Cursor
  "How many match across every page."
  total: Int!
  "Why each run on the page matched the search. Empty without a search."
  matches: [RunSearchMatch!]!
}

"A directory in a run's working directory; the working directory itself is one, with the empty path."
type RunDirectory implements RunDirectoryEntry {
  "What it holds, one level down, directories first."
  entries(
    "Which to include. Omitted means all."
    filter: RunDirectoryEntryFilter
    "Sort keys. Omitted means directories first, then by name."
    orderBy: [RunDirectoryEntryOrder!]
    "Page size, 1 to 200."
    first: Int! = 50
    "Cursor from the previous page."
    after: Cursor
  ): RunDirectoryEntryConnection!
  "Its own name."
  name: String!
  "Relative to the run's working directory, ready to pass back to `Run.file`."
  path: String!
}

"One entry of a run's working directory. The type says whether it is a file or a directory."
interface RunDirectoryEntry {
  "Its own name."
  name: String!
  "Relative to the run's working directory, ready to pass back to `Run.file`."
  path: String!
}

"One page of `RunDirectoryEntry`: the items, where to resume, and how many there are altogether."
type RunDirectoryEntryConnection {
  "The items on this page, at most `first` of them."
  results: [RunDirectoryEntry!]!
  "Pass as `after` to read the next page. Null on the last one."
