"""
`extensions.code` on every error. Branch on it, never on the message.

The error contract: a request that asked for one thing did
it or fails whole; a sweep reports each run as data (`SweepItem`) and never
fails once its first act has gone out. `extensions.code` is this;
`extensions.httpStatus` its status; `extensions.reason` an `ErrorReason`,
where the code alone could mean more than one thing; `extensions.nodeType`, on
`NOT_FOUND`, the schema type that was looked for (`Run`), or null for a file
path; `extensions.argument` the input coordinate a refusal is about;
`extensions.current`, on `CONFLICT`, the node as it is now, as JSON keyed by
its schema field names, with `__typename`; `extensions.remedy` what to do
instead; `extensions.matched` and `extensions.max` the counts a cap refused. A retry of something
that already happened succeeds and says so (`alreadyInState`, `replayed`); it
is never a `CONFLICT`.
"""
enum ErrorCode {
  "400. Wrong as written; sending it again unchanged fails the same way. `extensions.reason` names the rule."
  BAD_USER_INPUT
  "403. This server is configured to refuse it. Only the operator can change the answer."
  FORBIDDEN
  "404. Nothing by that key. `extensions.nodeType` names what was looked for."
  NOT_FOUND
  "409. It exists and its state refuses the change. `extensions.current` is the node as it is now."
  CONFLICT
  "413. An attachment is over `ServerLimits.maxUploadBytes`."
  PAYLOAD_TOO_LARGE
  "415. A text read of a file that is not text (`RunFile.content`). Reads only; read `RunFile.url` instead."
  UNSUPPORTED_MEDIA_TYPE
  "416. A read offset past the end of what it names (`RunFile.content`, `RunStage.log`). Reads only."
  RANGE_NOT_SATISFIABLE
  "422. Well formed, and a file on disk will not answer: a config, `yolo.toml`, a manifest or a run record that does not parse."
  UNPROCESSABLE
  "502. Something this server depends on answered badly. Retrying may work."
  UPSTREAM
  "502. The daemon was updated under a running server. Restart the server; retrying will not help."
  DAEMON_INCOMPATIBLE
  """
  503. The daemon could not be reached. If the act had already been sent it
  may have landed; retrying is safe, because a repeat answers
  `alreadyInState: true` or, with the same `idempotencyKey`, `replayed: true`.
  """
  DAEMON_UNAVAILABLE
  "500. Something failed that the caller did nothing to cause."
  INTERNAL
}

"Taken when the stage ends in error (`error`)."
type ErrorEdge implements TransitionEdge {
  "The stage it leads to."
  target: Stage!
  "What happens to the context."
  transform: EdgeTransform!
  "What must be true first."
  gate: TransitionGate
}

"""
`extensions.reason`: the rule that refused a request, where the code alone
could mean more than one thing. Rules only: which kind of thing was missing is
`extensions.nodeType`, and what happened to each run of a sweep is its
`SweepItem` type. Absent where the code says it all. Treat a value you do not
know by its code.
"""
enum ErrorReason {
  "`BAD_USER_INPUT`. The document did not parse or validate."
  INVALID_DOCUMENT
  "`BAD_USER_INPUT`. Over a limit checked before anything runs: depth, complexity, filter depth or size."
  QUERY_TOO_LARGE
  "`BAD_USER_INPUT`. A `first` over its listing's cap, which each `first` states. `extensions.max` is the cap. Never quietly cut."
  PAGE_TOO_LARGE
  "`BAD_USER_INPUT`. An `after` cursor minted under a different filter, order or search."
  CURSOR_MISMATCH
  "`BAD_USER_INPUT`. A value out of its range or shape. `extensions.argument` names the input."
  INVALID_ARGUMENT
  "`BAD_USER_INPUT`. A sweep's filter sets nothing, so it names every run on this machine."
  EMPTY_SWEEP_FILTER
  "`BAD_USER_INPUT`. A sweep's `maxAffected` is outside 1 to 200."
  MAX_AFFECTED_TOO_LARGE
  "`BAD_USER_INPUT`. The answer is not the shape the interaction's type takes (a `choice` for a `ToolApproval`)."
  ANSWER_SHAPE_MISMATCH
  "`FORBIDDEN`. A working directory, or a directory to create, outside `Server.workdirRoot`."
  OUTSIDE_WORKDIR_ROOT
  "`FORBIDDEN`. An unattended run on a server started with `--no-remote-yolo`."
  REMOTE_YOLO_DISABLED
  "`FORBIDDEN`. An attachment path that resolves outside the run's working directory."
  ATTACHMENT_OUTSIDE_WORKDIR
  "`FORBIDDEN`. A callback or endpoint URL the outbound policy will not let this host call."
  OUTBOUND_URL_BLOCKED
  "`CONFLICT`. The run had already finished, in a state other than the one this act puts it in."
  ALREADY_FINISHED
  "`CONFLICT`. The run is live in a state a pause cannot land in yet (`Starting`). Wait (`awaitRun`) and send it again."
  NOT_PAUSABLE
  "`CONFLICT`. The stage the run is in takes no messages. `Run.acceptsMessages` says when it does."
  MESSAGES_NOT_ACCEPTED
  "`CONFLICT`. The run's record says live but the daemon does not hold it (`Lost`). Only `cancelRun` or `deleteRuns` moves it."
  RUN_NOT_LIVE
  "`CONFLICT`. On a delete: the run is still going. Cancel it first."
  RUN_STILL_LIVE
  "`CONFLICT`. A create named something that exists with different content. The same content answers `alreadyInState: true`."
  ALREADY_EXISTS
  "`CONFLICT`. An `expectedRevision` or `digest` pin no longer matches: somebody wrote after you read. Merge into `extensions.current` and resend."
  REVISION_CONFLICT
  "`CONFLICT`. This `idempotencyKey` was already used with a different request. A new intent needs a new key."
  KEY_REUSED
  "`CONFLICT`. The sweep's filter names more runs than its `maxAffected`, so nothing was done. `extensions.matched` is the count."
  SWEEP_TOO_LARGE
  "`CONFLICT`. The interaction was already settled with a different answer. `extensions.current` shows how."
  INTERACTION_SETTLED
  "`CONFLICT`. Nobody answered before the timeout, so the timeout answered: an approval that times out is denied."
  INTERACTION_EXPIRED
  "`CONFLICT`. The interaction was withdrawn before anybody answered: the run was cancelled or its asker went away."
  INTERACTION_WITHDRAWN
  "`CONFLICT`. The `digest` sent is not the digest of the interaction under that id. Re-read and answer the one you meant."
  INTERACTION_MISMATCH
  "`CONFLICT`. An act that runs one at a time is already running (a sign-in, `checkMachine`). Wait, then send it again."
  BUSY
  "`UNPROCESSABLE`. A file this act reads does not parse. `extensions.problem` is its `FileProblem`."
  CONFIG_FILE_INVALID
  "`UNPROCESSABLE`. A run's record will not read. On `deleteRuns`, `force: true` deletes it anyway."
  RECORD_UNREADABLE
  "`UNPROCESSABLE`. An installed manifest does not load, so it cannot be read as a `Blueprint`; `brokenBlueprints` lists it with its problems."
  BLUEPRINT_DOES_NOT_LOAD
}

