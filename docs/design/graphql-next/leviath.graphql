"""
A top-level key of an exported row. Rows are the run store's own records (the
REST run shape), so these are its keys, generated from that record so the two
cannot drift; each value names the `Run` field it corresponds to. The callback
secret is never exported.
"""
enum RunExportField {
  "The run's id (`Run.id`). Key `\"run_id\"`."
  RUN_ID
  "Its blueprint's name (`BlueprintRevision.name` of `Run.blueprint`). Key `\"agent_name\"`."
  AGENT_NAME
  "Where that blueprint was installed (`Blueprint.path`). Key `\"agent_path\"`."
  AGENT_PATH
  "The task (`Run.task`). Key `\"task\"`."
  TASK
  "The `provider/model` the entry stage resolved (the first of `Run.modelsUsed`). Key `\"model\"`."
  MODEL
  "Every provider and model it ran on (`Run.modelsUsed`). Key `\"stage_models\"`."
  STAGE_MODELS
  "Always 0; kept for old readers. Key `\"pid\"`."
  PID
  "Its lifecycle word (`Run.state`). Key `\"status\"`."
  STATUS
  "The stage it is in (`Run.currentStage`). Key `\"current_stage\"`."
  CURRENT_STAGE
  "That stage's position (`RunStage.position`). Key `\"stage_index\"`."
  STAGE_INDEX
  "How many stages its blueprint declares (`Run.stages`). Key `\"num_stages\"`."
  NUM_STAGES
  "The turn it is on (`Running.turn`). Key `\"iteration\"`."
  ITERATION
  "Input tokens (`TokenUsage.inputTokens` of `Run.usage`). Key `\"prompt_tokens\"`."
  PROMPT_TOKENS
  "Output tokens (`TokenUsage.outputTokens`). Key `\"completion_tokens\"`."
  COMPLETION_TOKENS
  "Cache reads (`TokenUsage.cacheReadTokens`). Key `\"cached_tokens\"`."
  CACHED_TOKENS
  "Cache writes (`TokenUsage.cacheWriteTokens`). Key `\"cache_write_tokens\"`."
  CACHE_WRITE_TOKENS
  "Tool calls made (`Run.toolCallCount`). Key `\"tool_calls\"`."
  TOOL_CALLS
  "Its spend, null when unpriced (`Cost.totalUsd` of `Run.cost`). Key `\"cost_usd\"`."
  COST_USD
  "Calls nobody could price (`Cost.unpricedCalls`). Key `\"unpriced_calls\"`."
  UNPRICED_CALLS
  "Whether every call carried the provider's own figure (`Cost.providerReported`). Key `\"cost_is_exact\"`."
  COST_IS_EXACT
  "The priced subtotal (`Cost.pricedUsd`). Key `\"cost_priced_usd\"`."
  COST_PRICED_USD
  "Its working directory (`Run.workingDirectory`). Key `\"workdir\"`."
  WORKDIR
  "When it was spawned (`Run.startedAt`). Key `\"started_at\"`."
  STARTED_AT
  "The record's last write, a 30-second heartbeat. No `Run` field: it says nothing about the run. Key `\"updated_at\"`."
  UPDATED_AT
  "When it last moved (`Run.lastMovedAt`). Key `\"last_progress_at\"`."
  LAST_PROGRESS_AT
  "Its working clock (`Run.workingSeconds`, `Run.workingSince`). Key `\"active\"`."
  ACTIVE
  "Why it failed (`Failed.error`). Key `\"error\"`."
  ERROR
  "Its title (`Run.title`). Key `\"title\"`."
  TITLE
  "Why titling gave up (`Run.titleError`). Key `\"title_error\"`."
  TITLE_ERROR
  "Caller labels (`Run.metadata`). Key `\"metadata\"`."
  METADATA
  "Where it posts events (`SpawnSettings.callbackUrl`). Key `\"callback_url\"`."
  CALLBACK_URL
  "The run that started it (`Run.parent`). Key `\"parent_run_id\"`."
  PARENT_RUN_ID
  "Its direct sub-agents (`Run.children`). Key `\"children\"`."
  CHILDREN
  "Its depth in its tree (`SpawnSettings.depth`). Key `\"depth\"`."
  DEPTH
  "The depth limit on its sub-agents (`SpawnSettings.maxChildDepth`). Key `\"max_child_depth\"`."
  MAX_CHILD_DEPTH
  "Its diagnostics (`Run.problems`, `Run.changedFiles`). Key `\"flags\"`."
  FLAGS
  "Whether it runs unattended (`Run.approvalPolicy` is set). Key `\"yolo\"`."
  YOLO
  "The approval policy it runs under (`Run.approvalPolicy`). Key `\"yolo_profile\"`."
  YOLO_PROFILE
  "Read paths declared and granted (`SpawnSettings.readPathsGranted`). Key `\"read_paths\"`."
  READ_PATHS
  "The answer it submitted (`Run.answer`). Key `\"final_output\"`."
  FINAL_OUTPUT
  "Why it is parked (`Run.state`). Key `\"waiting_on\"`."
  WAITING_ON
  "The output shape the spawn asked for (`SpawnSettings.outputFormat`). Key `\"output_request\"`."
  OUTPUT_REQUEST
  "The spawn's model override (`SpawnSettings.modelOverride`). Key `\"model_override\"`."
  MODEL_OVERRIDE
  "The blueprint revision it executed (`BlueprintRevision.digest` of `Run.blueprint`). Key `\"blueprint_digest\"`."
  BLUEPRINT_DIGEST
}

