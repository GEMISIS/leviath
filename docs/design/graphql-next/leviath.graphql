"Fresh Linux namespaces, through unshare(1). Isolates processes and, optionally, the network. Linux only."
type NamespaceSandbox implements Sandbox {
  "Always true: a namespace shares the host root filesystem. It takes no mounts."
  sharesHostFilesystem: Boolean!
  "Whether commands can reach the network."
  allowsNetwork: Boolean!
  "What happens when namespaces cannot be set up (off Linux)."
  whenUnavailable: SandboxUnavailable!
}

"Parked because something on this machine has to change first. Fix it, then `resumeRun`."
type NeedsSetup {
  "Which fix is needed: one value per remedy."
  blocker: SetupBlocker!
  "What to do, in a sentence."
  remedy: String!
  "The provider the fix concerns, as it is now. Null for `PROVIDERS_UNAVAILABLE`, and where the provider is not configured at all."
  provider: ModelProvider
}

"Filter on `NeedsSetup`, field for field."
input NeedsSetupFilter {
  "Filter on `NeedsSetup.blocker`."
  blocker: SetupBlockerFilter
  "Filter on `NeedsSetup.remedy`."
  remedy: StringFilter
  "Every filter in this list has to hold."
  and: [NeedsSetupFilter!]
  "At least one filter in this list has to hold."
  or: [NeedsSetupFilter!]
  "This filter must not hold."
  not: NeedsSetupFilter
  "Match where there is no value at all (`true`), or where there is one (`false`)."
  isNull: Boolean
}

"Why an interaction settled with no answer."
enum NoAnswerReason {
  "The run's interaction timeout ran out."
  TIMED_OUT
  "The run was cancelled or the asking agent went away."
  WITHDRAWN
  "It never opened: another ask already held its id. A server fault, not a decision."
  DUPLICATE_ID
}

"Exact and set tests on `NoAnswerReason` (TIMED_OUT, WITHDRAWN, DUPLICATE_ID)."
input NoAnswerReasonFilter {
  "Exactly this value."
  eq: NoAnswerReason
  "Anything but this value."
  ne: NoAnswerReason
  "One of these values."
  in: [NoAnswerReason!]
  "None of these values."
  notIn: [NoAnswerReason!]
  "Match where there is no value at all."
  isNull: Boolean
}

"Its blueprint only let it answer, and it finished without answering."
type NoAnswerSubmitted implements RunProblem {
  "The problem in one sentence."
  summary: String!
}

"Filter on `NoAnswerSubmitted`, field for field."
input NoAnswerSubmittedFilter {
  "Filter on `NoAnswerSubmitted.summary`."
  summary: StringFilter
  "Every filter in this list has to hold."
  and: [NoAnswerSubmittedFilter!]
  "At least one filter in this list has to hold."
  or: [NoAnswerSubmittedFilter!]
  "This filter must not hold."
  not: NoAnswerSubmittedFilter
  "Match where there is no value at all (`true`), or where there is one (`false`)."
  isNull: Boolean
}

"""
Anything this schema can hand back from its id alone, through `node` or
`nodes`. Ids are transparent, documented and never base64. Every id but a
run's leads with the kind of thing it names: `blueprint:coder`,
`mcpServer:docs`, `modelProvider:openrouter`, `model:openai/gpt-5.5`,
`approvalPolicy:careful`, `toolExtension:summarise.rhai`, `builtinTool:shell`,
`updateJob:1758999365-1`, `config`. A revision's id is its owner's id, `@`,
and the first 12 hex of its digest (`blueprint:coder@3f9a1c0d8e77`). A run's
id is its bare name (`coder-1758999365-9f3a2b1c4d5e`).
"""
interface Node {
  "Unique across every type that implements `Node`."
  id: ID!
}

"Nobody answered. An unanswered approval or gate is a denial; an unanswered question tells the model no answer came."
type NotAnswered implements ApprovalSettlement & TextSettlement & ChoiceSettlement & ConfirmSettlement & Settlement {
  "When it settled."
  settledAt: DateTime!
  "Why nobody answered."
  why: NoAnswerReason!
}

