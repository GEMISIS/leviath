"""
A Rhai file this machine loads at one extension point. Each extension point
is its own type, because what a file is for decides what it has: a stage
hook knows the stages that call it, a provider extension the providers that
run on it. `__typename` says which.

Machine-wide ones are listed by `extensions`, a blueprint's own by
`Blueprint.extensions`. A `.rhai` file nothing names is not an extension:
see `UnclaimedFile`. The file's text is on `revision`, and every earlier text
on `revisions`.
"""
interface Extension implements Versioned & Node {
  """
  `<typeName>:<relativePath>` for a machine-wide file,
  `<typeName>@<blueprint>:<relativePath>` for a blueprint's own:
  `toolExtension:summarise.rhai`, `stageHook@coder:hooks/enter.rhai`.
  """
  id: ID!
  "The file, absolute."
  path: String!
  """
  The file relative to its home directory, which each type names: a
  blueprint's directory, the config's directory, `~/.leviath/tools/` or
  `~/.leviath/providers/`. For a blueprint's file this is the spelling its
  manifest or mime rules use.
  """
  relativePath: String!
  """
  Why this file does not load at its extension point: the compiler's
  complaint, or that the file named is not there. Null when it compiles.
  """
  compileError: String
  "The file as it is now. Null when there is no file there (`compileError` says so)."
  revision: ExtensionRevision
  "Every text this file has had, newest first. At most 100 a page."
  revisions(
    "Page size, 1 to 100."
    first: Int! = 20
    "Cursor from the previous page."
    after: Cursor
  ): ExtensionRevisionConnection!
  """
  The edits, newest first: one per write, each with the fields it changed.
  Kept for as long as the revisions they made. At most 100 a page.
  """
  history(
    "Page size, 1 to 100. Over 100 is refused (`BAD_USER_INPUT` / `PAGE_TOO_LARGE`)."
    first: Int! = 20
    "Cursor from the previous page."
    after: Cursor
  ): EditConnection!
}

"One page of `Extension`: the items, where to resume, and how many there are altogether."
