schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

"Cancels the run (`abort_options`)."
type AbortAnswer implements AnswerOption {
  "The label, matched ignoring dashes and spacing."
  label: String!
}

"""A whole group of tools, written `@all`: every tool this install has."""
type AllTools {
  "The token as a blueprint writes it: `@all`."
  token: String!
}

"""A whole group of tools, written `@builtin`: every `BuiltinTool` this build ships."""
type AllBuiltinTools {
  "The token as a blueprint writes it: `@builtin`."
  token: String!
}

"""A whole group of tools, written `@mcp`: every `McpTool` of every configured MCP server."""
type AllMcpTools {
  "The token as a blueprint writes it: `@mcp`."
  token: String!
}

"""A whole group of tools, written `@scripts`: every `CustomTool` visible to the run: the blueprint's own, the working directory's and the machine's."""
type AllCustomTools {
  "The token as a blueprint writes it: `@scripts`."
  token: String!
}

"""A whole group of tools, written `@subagent`: every `SubagentTool` the stage may spawn."""
type AllSubagentTools {
  "The token as a blueprint writes it: `@subagent`."
  token: String!
}

"""
Offered when the stage finishes; followed alone, or chosen by the model among several (`"always"`).
"""
type AlwaysEdge implements TransitionEdge {
  "The stage it leads to."
  target: Stage!
  "What happens to the context."
  transform: EdgeTransform!
  "What must be true first."
  gate: TransitionGate
  "Told to the model when it chooses."
  hint: String
}

"The answer a run submitted (`submit_output`; the docs' final output)."
type Answer {
  "The answer's text."
  text: String!
  "The v1 name of `Answer.text`."
  content: String! @deprecated(reason: "Use `text`.")
  "The format label it carried. Null for none."
  format: String
  "Whether the stored text was cut to fit."
  truncated: Boolean!
  "When it was submitted."
  submittedAt: DateTime!
  "The stage that submitted it."
  stage: RunStage
  "The files handed back with it. Bounded by the submission."
  artifacts: [Artifact!]!
}

"""
How a model's answer ended, as the provider reported it: a reason Leviath
recognises, or the provider's own words for one it does not.
"""
union AnswerEnding = EndedFor | EndedForUnrecognizedReason

"Filter on `AnswerEnding`: set the variant to select; its fields add conditions. `or` selects several."
input AnswerEndingFilter {
  "Select answers that ended for a recognised reason."
  endedFor: EndedForFilter
  "Select answers that ended for a reason Leviath does not recognise."
  endedForUnrecognizedReason: EndedForUnrecognizedReasonFilter
  "At least one filter in this list has to hold."
  or: [AnswerEndingFilter!]
  "Match where there is no value at all (`true`), or where there is one (`false`)."
  isNull: Boolean
}

"Which interaction to answer, and the answer."
input AnswerInteractionRequest {
  "The interaction."
  interactionId: ID!
  "Exactly one answer, of the shape its type takes."
  answer: InteractionAnswerWrite!
  "The `digest` of the interaction you reviewed. Worth sending with every approval: a mismatch is `CONFLICT` / `INTERACTION_MISMATCH`."
  digest: String
}

"How answering landed. A different, expired or withdrawn settlement is a `CONFLICT`, never an answer here."
type AnswerInteractionResult {
  "The interaction, settled."
  interaction: Interaction!
  "Whether it had already settled with this same answer, so nothing was sent."
  alreadyInState: Boolean!
  "The run, as it stands now."
  run: Run!
}

"An answer and what it does. `__typename` says what."
interface AnswerOption {
  "The label, matched ignoring dashes and spacing."
  label: String!
}

"Stages that must submit an answer were let through without one after their retries ran out."
type AnswerSkipped implements RunProblem {
  "The problem in one sentence."
  summary: String!
  "How many times it happened."
  count: Int!
}

"Filter on `AnswerSkipped`, field for field."
input AnswerSkippedFilter {
  "Filter on `AnswerSkipped.summary`."
  summary: StringFilter
  "Filter on `AnswerSkipped.count`."
  count: IntFilter
  "Every filter in this list has to hold."
  and: [AnswerSkippedFilter!]
  "At least one filter in this list has to hold."
  or: [AnswerSkippedFilter!]
  "This filter must not hold."
  not: AnswerSkippedFilter
  "Match where there is no value at all (`true`), or where there is one (`false`)."
  isNull: Boolean
}

"An attempt the provider answered."
type AnsweredAttempt implements ModelAttempt {
  "`a<16 hex: mint time in ns>-<8 hex: counter>`. Null in a journal written before attempts had ids."
  id: ID
  "Which trip for this turn's call, from 1, retries included."
  number: Int!
  "The v1 name of `AnsweredAttempt.number`."
  attempt: Int! @deprecated(reason: "Use `number`.")
  "The stage it was made in. Null for a run-level lane with no stage, such as titling."
  stage: RunStage
  "The turn it belongs to. Null for a run-level lane, and in a journal that did not record it."
  turn: Turn
  "The provider as configured when called."
  providerName: String!
  "The model asked for, as configured."
  modelName: String!
  "The provider's settings as this attempt used them. Null in a journal written before provider revisions were kept."
  provider: ModelProviderRevision
  "The model as catalogued now. Null once the catalogue drops it."
  model: Model
  "When it finished."
  at: DateTime!
  "How long it took, in milliseconds, not counting the wait before it."
  durationMs: BigInt!
  "How long the retry loop slept before making it, in milliseconds."
  backoffMs: BigInt!
  "What went out, in the little of it always kept."
  sent: RequestSummary!
  "How the request was assembled. Null where the journal kept no record of it."
  assembly: RequestAssembly
  "The move to another provider that followed this attempt. Null unless the stage gave up on the provider here."
  failover: Failover
  "Tokens the answer was billed for."
  usage: TokenUsage!
  "What the answer cost."
  cost: Cost!
  "The tool calls this answer asked for, in dispatch order."
  requestedExecutions: [ToolExecution!]!
  """
  How the provider said the answer ended. Null in a journal written before
  finish reasons were recorded.
  """
  ending: AnswerEnding
}

"Filter on `AnsweredAttempt`, field for field."
input AnsweredAttemptFilter {
  "Filter on `AnsweredAttempt.id`."
  id: IDFilter
  "Filter on `AnsweredAttempt.number`."
  number: IntFilter
  "Filter on `AnsweredAttempt.providerName`."
  providerName: StringFilter
  "Filter on `AnsweredAttempt.modelName`."
  modelName: StringFilter
  "Filter on `AnsweredAttempt.at`."
  at: DateTimeFilter
  "Filter on `AnsweredAttempt.durationMs`."
  durationMs: BigIntFilter
  "Filter on `AnsweredAttempt.backoffMs`."
  backoffMs: BigIntFilter
  "Filter on `AnsweredAttempt.ending`: set one variant to select it."
  ending: AnswerEndingFilter
  "Every filter in this list has to hold."
  and: [AnsweredAttemptFilter!]
  "At least one filter in this list has to hold."
  or: [AnsweredAttemptFilter!]
  "This filter must not hold."
  not: AnsweredAttemptFilter
  "Match where there is no value at all (`true`), or where there is one (`false`)."
  isNull: Boolean
}

"""
A vendor built into this build, reached with an API key: Anthropic, OpenAI, Google, OpenRouter, Amazon Bedrock, xAI, Meta, Meshy.
"""
type ApiKeyProvider implements ModelProvider & Node & Versioned {
  "`modelProvider:<name>`."
  id: ID!
  "The name before the slash in `provider/model`, and the config key."
  name: String!
  "The name to show."
  displayName: String!
  """The same fact as `hasApiKey`: a stored key is what turns one on."""
  isEnabled: Boolean!
  "The models it serves, from the catalogue this server keeps. `refreshModels` asks again."
  models(
    "Which models. Omitted means all."
    filter: ModelFilter
    "Sort keys. Omitted means name ascending."
    orderBy: [ModelOrder!]
    "Page size, 1 to 200."
    first: Int! = 50
    "Cursor from the previous page."
    after: Cursor
  ): ModelConnection!
  """
  Whether a key is stored or found in the environment. The key never crosses the wire.
  """
  hasApiKey: Boolean!
  """
  `<name>_base_url`: another host in front of the vendor (an enterprise gateway). Null means the vendor's own.
  """
  baseUrl: String
  """
  `<name>_headers`: names of extra headers sent to that host. Values never cross the wire.
  """
  headerNames: [String!]!
  """
  Settings only this vendor has (Bedrock's region). Null for a vendor with none.
  """
  settings: ProviderSettings
  "Its settings as they are now."
  revision: ModelProviderRevision!
  "Every state of its settings, newest first. At most 100 a page."
  revisions(
    "Page size, 1 to 100."
    first: Int! = 20
    "Cursor from the previous page."
    after: Cursor
  ): ModelProviderRevisionConnection!
  """
  The edits, newest first: one per write, each with the fields it changed.
  Kept for as long as the revisions they made. At most 100 a page.
  """
  history(
    "Page size, 1 to 100. Over 100 is refused (`BAD_USER_INPUT` / `PAGE_TOO_LARGE`)."
    first: Int! = 20
    "Cursor from the previous page."
    after: Cursor
  ): EditConnection!
}

"Filter on `ApiKeyProvider`, field for field."
input ApiKeyProviderFilter {
  "Filter on `ApiKeyProvider.id`."
  id: IDFilter
  "Filter on `ApiKeyProvider.name`."
  name: StringFilter
  "Filter on `ApiKeyProvider.displayName`."
  displayName: StringFilter
  "Filter on `ApiKeyProvider.isEnabled`."
  isEnabled: BooleanFilter
  "Filter on `ApiKeyProvider.hasApiKey`."
  hasApiKey: BooleanFilter
  "Filter on `ApiKeyProvider.baseUrl`."
  baseUrl: StringFilter
  "Filter on `ApiKeyProvider.headerNames`."
  headerNames: StringListFilter
  "Every filter in this list has to hold."
  and: [ApiKeyProviderFilter!]
  "At least one filter in this list has to hold."
  or: [ApiKeyProviderFilter!]
  "This filter must not hold."
  not: ApiKeyProviderFilter
  "Match where there is no value at all (`true`), or where there is one (`false`)."
  isNull: Boolean
}

"A built-in API-key vendor's settings. Omitted fields keep their value."
input ApiKeyProviderWrite {
  "The provider's name."
  name: String!
  "Store or remove the key."
  apiKey: StringSetting
  "Another host in front of the vendor (`<name>_base_url`)."
  baseUrl: StringSetting
  "Extra headers sent to that host, replacing the stored set."
  headers: [KeyValueWrite!]
  "Bedrock's own settings. Refused for any other vendor."
  bedrock: BedrockSettingsWrite
}

"What an approval policy would do with one call."
type ApprovalDecision {
  "The name asked about."
  toolName: String!
  "The tool the name reaches here, when there is one."
  tool: Tool
  "What the config and blueprint layers resolve it to, before the policy."
  configured: ToolPermission!
  "What the policy makes of it."
  decided: ToolPermission!
  "The v1 name of `ApprovalDecision.decided`."
  policy: ToolPermission! @deprecated(reason: "Use `decided`.")
  "Why, in words, when the decision has a reason to give."
  reason: String
}

"""
A named set of approval rules for unattended runs: which tool calls run
without asking, which still ask a person, which are refused. Product name: a
yolo profile, a table in `yolo.toml` chosen with `--yolo=<name>`. `"default"`
is the built-in one bare `--yolo` uses.

It may loosen an `ASK` and tighten anything, and never lifts a `DENY` that the
config or the blueprint set. The rules are on `revision`, because a run
records the revision it ran under (`Run.approvalPolicy`).
"""
type ApprovalPolicy implements Versioned & Node {
  "`approvalPolicy:<name>`."
  id: ID!
  "As `--yolo=<name>` spells it."
  name: String!
  """
  Whether this is `"default"`, the built-in blanket waiver, which no file holds and nobody edits.
  """
  isBuiltIn: Boolean!
  "The rules as they are now."
  revision: ApprovalPolicyRevision!
  "Every state of this policy's rules, newest first. At most 100 a page."
  revisions(
    "Page size, 1 to 100."
    first: Int! = 20
    "Cursor from the previous page."
    after: Cursor
  ): ApprovalPolicyRevisionConnection!
  """
  What this policy decides now about one call: the code path `lev yolo test`
  runs. Nothing runs and nothing is written.
  """
  decide(
    "The name the model would call."
    toolName: String!
    "The call's arguments; the shell reads its line from `command`."
    arguments: JSON
    "The blueprint the run would be of: its own custom tools and `[agent_tool_permissions]` apply. Left out, only the machine's tools are known and any other name reads as an MCP tool."
    blueprintName: String
  ): ApprovalDecision!
  """
  The edits, newest first: one per write, each with the fields it changed.
  Kept for as long as the revisions they made. At most 100 a page.
  """
  history(
    "Page size, 1 to 100. Over 100 is refused (`BAD_USER_INPUT` / `PAGE_TOO_LARGE`)."
    first: Int! = 20
    "Cursor from the previous page."
    after: Cursor
  ): EditConnection!
}

"One page of `ApprovalPolicy`: the items, where to resume, and how many there are altogether."
type ApprovalPolicyConnection {
  "The items on this page, at most `first` of them."
  results: [ApprovalPolicy!]!
  "Pass as `after` to read the next page. Null on the last one."
  cursor: Cursor
  "How many items match, across every page."
  total: Int!
}

"Filter on `ApprovalPolicy`, field for field."
input ApprovalPolicyFilter {
  "Filter on `ApprovalPolicy.id`."
  id: IDFilter
  "Filter on `ApprovalPolicy.name`."
  name: StringFilter
  "Filter on `ApprovalPolicy.isBuiltIn`."
  isBuiltIn: BooleanFilter
  "Every filter in this list has to hold."
  and: [ApprovalPolicyFilter!]
  "At least one filter in this list has to hold."
  or: [ApprovalPolicyFilter!]
  "This filter must not hold."
  not: ApprovalPolicyFilter
  "Match where there is no value at all (`true`), or where there is one (`false`)."
  isNull: Boolean
}

"""One sort key for an approval policy listing."""
input ApprovalPolicyOrder {
  "Which field."
  field: ApprovalPolicyOrderField!
  "Which way. A to Z unless you say otherwise."
  direction: OrderDirection! = ASC
}

"""What an approval policy listing sorts by."""
enum ApprovalPolicyOrderField {
  "`ApprovalPolicy.id`."
  ID
  "`ApprovalPolicy.name`."
  NAME
}

"Which approval policy, by name."
input ApprovalPolicyRef {
  "As `--yolo=<name>` spells it; `\"default\"` is bare `--yolo`."
  name: String!
}

"One state of one approval policy's rules."
type ApprovalPolicyRevision implements Revision & Node {
  "The policy's id, `@`, and the first 12 hex of `digest`."
  id: ID!
  "The policy's name."
  name: String!
  "What a call no rule names does, where the config would ask. Never `DENY`: a policy waives prompts, it does not add refusals."
  unlistedTools: ApprovalWaiver!
  "The run's own questions (`ask_user_*`, `present_for_review`, `edit_document`)."
  questions: HumanInTheLoop!
  "Blueprint checkpoints (interaction points)."
  checkpoints: HumanInTheLoop!
  "Taint-gate prompts, where taint tracking is on."
  taintGate: HumanInTheLoop!
  "Its tool rules, in file order."
  toolRules: [ToolPermissionRule!]!
  "Its shell rules, in file order."
  shellRules: [ShellRule!]!
  "The policy as it is now. Null once it is deleted."
  policy: ApprovalPolicy
  "Which revision of its owner this is, from 1, in the order this machine first saw them."
  number: Int!
  """
  Lowercase hex SHA-256 of the content. For content that holds secrets (an
  MCP server, a model provider, the config) it is an HMAC under this
  machine's link-signing key, so it reveals nothing about them. Send it as
  `expectedRevision` to write over exactly this revision.
  """
  digest: String!
  "When this machine first recorded it."
  createdAt: DateTime!
  """
  Who wrote it: the name the API caller authenticated as, or `"cli"` for the
  lev command line. Null when the file was edited on disk and Leviath only saw
  the result.
  """
  createdBy: String
}

"One page of `ApprovalPolicyRevision`: the items, where to resume, and how many there are altogether."
type ApprovalPolicyRevisionConnection {
  "The items on this page, at most `first` of them."
  results: [ApprovalPolicyRevision!]!
  "Pass as `after` to read the next page. Null on the last one."
  cursor: Cursor
  "How many items match, across every page."
  total: Int!
}

"Filter on `ApprovalPolicyRevision`, field for field."
input ApprovalPolicyRevisionFilter {
  "Filter on `ApprovalPolicyRevision.id`."
  id: IDFilter
  "Filter on `ApprovalPolicyRevision.name`."
  name: StringFilter
  "Filter on `ApprovalPolicyRevision.unlistedTools`."
  unlistedTools: ApprovalWaiverFilter
  "Filter on `ApprovalPolicyRevision.questions`."
  questions: HumanInTheLoopFilter
  "Filter on `ApprovalPolicyRevision.checkpoints`."
  checkpoints: HumanInTheLoopFilter
  "Filter on `ApprovalPolicyRevision.taintGate`."
  taintGate: HumanInTheLoopFilter
  "Filter on `ApprovalPolicyRevision.number`."
  number: IntFilter
  "Filter on `ApprovalPolicyRevision.digest`."
  digest: StringFilter
  "Filter on `ApprovalPolicyRevision.createdAt`."
  createdAt: DateTimeFilter
  "Filter on `ApprovalPolicyRevision.createdBy`."
  createdBy: StringFilter
  "Every filter in this list has to hold."
  and: [ApprovalPolicyRevisionFilter!]
  "At least one filter in this list has to hold."
  or: [ApprovalPolicyRevisionFilter!]
  "This filter must not hold."
  not: ApprovalPolicyRevisionFilter
  "Match where there is no value at all (`true`), or where there is one (`false`)."
  isNull: Boolean
}

"One approval policy, whole, as a write sends it."
input ApprovalPolicyWrite {
  "`\"default\"` is reserved."
  name: String!
  "What a call no rule names does."
  unlistedTools: ApprovalWaiver!
  "The run's own questions. Left out: `AUTO`."
  questions: HumanInTheLoop
  "Blueprint checkpoints. Left out: `AUTO`."
  checkpoints: HumanInTheLoop
  "Taint-gate prompts. Left out: `AUTO`."
  taintGate: HumanInTheLoop
  "Tool rules, in order."
  toolRules: [ToolPermissionRuleWrite!]
  "Shell rules, in order."
  shellRules: [ShellRuleWrite!]
}

"How far an approval reaches."
enum ApprovalScope {
  "This call only."
  ONCE
  "Every later call it covers until the run leaves the stage."
  STAGE
  "Every later call it covers for the rest of the run."
  RUN
}

"Exact and set tests on `ApprovalScope` (ONCE, STAGE, RUN)."
input ApprovalScopeFilter {
  "Exactly this value."
  eq: ApprovalScope
  "Anything but this value."
  ne: ApprovalScope
  "One of these values."
  in: [ApprovalScope!]
  "None of these values."
  notIn: [ApprovalScope!]
  "Match where there is no value at all."
  isNull: Boolean
}

"How an approval ended."
interface ApprovalSettlement implements Settlement {
  "When it settled."
  settledAt: DateTime!
}

"Filter on `ApprovalSettlement`, field for field. Set an implementer's field to match that type only."
input ApprovalSettlementFilter {
  "Filter on `ApprovalSettlement.settledAt`."
  settledAt: DateTimeFilter
  "Matches `Approved` values only, and those against this filter."
  approved: ApprovedFilter
  "Matches `Denied` values only, and those against this filter."
  denied: DeniedFilter
  "Matches `NotAnswered` values only, and those against this filter."
  notAnswered: NotAnsweredFilter
  "Every filter in this list has to hold."
  and: [ApprovalSettlementFilter!]
  "At least one filter in this list has to hold."
  or: [ApprovalSettlementFilter!]
  "This filter must not hold."
  not: ApprovalSettlementFilter
  "Match where there is no value at all (`true`), or where there is one (`false`)."
  isNull: Boolean
}

"""What an approval policy does with a tool no rule names."""
enum ApprovalWaiver {
  """Runs without asking."""
  ALLOW
  """Asks, as it would with no policy."""
  ASK
}

"Exact and set tests on `ApprovalWaiver` (ALLOW, ASK)."
input ApprovalWaiverFilter {
  "Exactly this value."
  eq: ApprovalWaiver
  "Anything but this value."
  ne: ApprovalWaiver
  "One of these values."
  in: [ApprovalWaiver!]
  "None of these values."
  notIn: [ApprovalWaiver!]
  "Match where there is no value at all."
  isNull: Boolean
}

"Approves, and the stage goes on to its edges."
type ApproveAnswer implements AnswerOption {
  "The label, matched ignoring dashes and spacing."
  label: String!
}

"Approve."
input ApproveWrite {
  "How far it reaches. Ignored for a `ConfirmQuestion`."
  scope: ApprovalScope! = ONCE
}

"A person approved the call."
type Approved implements ApprovalSettlement & Settlement {
  "When it settled."
  settledAt: DateTime!
  "How far the approval reaches."
  scope: ApprovalScope!
}

"Filter on `Approved`, field for field."
input ApprovedFilter {
  "Filter on `Approved.settledAt`."
  settledAt: DateTimeFilter
  "Filter on `Approved.scope`."
  scope: ApprovalScopeFilter
  "Every filter in this list has to hold."
  and: [ApprovedFilter!]
  "At least one filter in this list has to hold."
  or: [ApprovedFilter!]
  "This filter must not hold."
  not: ApprovedFilter
  "Match where there is no value at all (`true`), or where there is one (`false`)."
  isNull: Boolean
}

"One file a run handed back with its answer, typed and hashed when submitted."
type Artifact {
  "What the submission called it."
  name: String!
  "Its mime type."
  mimeType: String!
  "Size in bytes, when recorded."
  size: BigInt
  "Content hash, when computed."
  sha256: String
  "Where the run wrote it, relative to the working directory."
  path: String!
  "The file at that path now. It may have changed since; compare `sha256`."
  file: RunFile
  "The stored copy of the bytes, when they fit the part store."
  part: StoredPart
  "A short-lived signed link to the submitted bytes."
  url(
    "Offer it as a download."
    download: Boolean! = false
  ): String!
}

"One file named in `submit_output`, by bare path or as an object."
type ArtifactArgument {
  "The path."
  path: String!
  "The name given. Null when left to the file name, or given as a bare path."
  name: String
  """
  The mime type given (the object's `"type"` key). Null when left to the registry.
  """
  mimeType: String
}

"A file the answer is expected to carry. What the blueprint asks for, not what a run produced."
type ArtifactSlot {
  "The name it is handed back under."
  name: String!
  "The mime type or pattern it must be."
  mimeType: String!
  "Whether a submission without it is refused."
  required: Boolean!
  "What it should contain, shown to the model."
  description: String
}

"One file to attach, by path inside the working directory."
input AttachmentWrite {
  "The file."
  path: String!
  "The region to put it in. Absent means where the text lands."
  region: RegionRef
  "The part's name. Absent means the file's."
  name: String
  "The mime type, when name and bytes do not say."
  mimeType: String
  "How it reaches the model. Absent means the run decides."
  delivery: Delivery
  "Text stored beside it."
  caption: String
}

"The tool loop: infer, call tools, repeat until an edge is taken (`mode = \"autonomous\"`, the default)."
type AutonomousStage implements Stage & Node {
  "`<blueprint id>#<stage name>`."
  id: ID!
  "Unique within the blueprint."
  name: String!
  "What the stage is for."
  description: String
  "Which model it runs on."
  model: StageModel!
  "What the model may call here."
  tools: StageTools!
  "Which regions this stage declares, hides and empties."
  context: StageContext!
  "Where the run goes next."
  transitions: [TransitionEdge!]!
  "Extra prompt text for choosing among edges."
  transitionPrompt: String
  "A region naming the next stage."
  routingRegion: Region
  "How many times the run may re-enter this stage."
  maxRevisits: Int
  "Whether the model may end the run here."
  mayEndRun: Boolean!
  "The v1 name of `AutonomousStage.mayEndRun`."
  allowComplete: Boolean! @deprecated(reason: "Use `mayEndRun`.")
  "Whether a fan-out may run this stage as its worker."
  mayRunAsWorker: Boolean!
  "The v1 name of `AutonomousStage.mayRunAsWorker`."
  allowAsWorker: Boolean! @deprecated(reason: "Use `mayRunAsWorker`.")
  "Whether the stage holds until its child runs finish."
  waitsForChildren: Boolean!
  "The v1 name of `AutonomousStage.waitsForChildren`."
  requiresChildren: Boolean! @deprecated(reason: "Use `waitsForChildren`.")
  "Whether `sendMessage` reaches a run parked here."
  acceptsMessages: Boolean!
  "What the stage takes as typed parts."
  input: StageInput!
  "Whether the stage must call `submit_output` before it leaves."
  outputRequired: Boolean!
  "The shape its answer must take."
  output: OutputShape
  "Where produced parts are written."
  partRoutes: [PartRoute!]!
  "What this stage sets over the blueprint's settings."
  overrides: SettingOverrides!
  "The stage hooks it runs."
  hooks: StageHooks!
  "What its settings resolve to now."
  effective: EffectiveStageSettings!
  "Inference turns allowed per visit. Null: no limit."
  maxIterations: Int
}

"How a sliding window makes room in batches."
union BatchEviction = DropInBatches | SummarizeInBatches

"""Amazon Bedrock's own settings."""
type BedrockSettings {
  """`bedrock_region`. Null leaves the AWS environment's."""
  region: String
