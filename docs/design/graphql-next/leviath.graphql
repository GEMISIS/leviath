  "`Model.id`."
  ID
  "`Model.name`."
  NAME
  "`Model.qualifiedName`."
  QUALIFIED_NAME
}

"""
What is asked of a model. The same concept on a stage (what it asks for) and on
`RequestAssembly.parameters` (what one request carried).
"""
type ModelParameters {
  "Sampling temperature. Null: the provider's default."
  temperature: Float
  "The largest reply accepted. Null: the model's own limit."
  replyLimit: ReplyTokenLimit
  "The v1 name of `ModelParameters.replyLimit`."
  maxOutputTokens: ReplyTokenLimit @deprecated(reason: "Use `replyLimit`.")
  "Every other parameter, as written, for the provider to read."
  providerParameters: JSON!
  "The v1 name of `ModelParameters.providerParameters`."
  providerParams: JSON! @deprecated(reason: "Use `providerParameters`.")
}

"""What one model costs per million tokens."""
type ModelPricing {
  "Dollars per million input tokens."
  inputPerMtok: Decimal!
  "Dollars per million input tokens served from the cache."
  cachedInputPerMtok: Decimal!
  "Dollars per million tokens written to the cache."
  cacheWritePerMtok: Decimal!
  "Dollars per million output tokens."
  outputPerMtok: Decimal!
}

"Filter on `ModelPricing`, field for field."
input ModelPricingFilter {
  "Filter on `ModelPricing.inputPerMtok`."
  inputPerMtok: DecimalFilter
  "Filter on `ModelPricing.cachedInputPerMtok`."
  cachedInputPerMtok: DecimalFilter
  "Filter on `ModelPricing.cacheWritePerMtok`."
  cacheWritePerMtok: DecimalFilter
  "Filter on `ModelPricing.outputPerMtok`."
  outputPerMtok: DecimalFilter
  "Every filter in this list has to hold."
  and: [ModelPricingFilter!]
  "At least one filter in this list has to hold."
  or: [ModelPricingFilter!]
  "This filter must not hold."
  not: ModelPricingFilter
  "Match where there is no value at all (`true`), or where there is one (`false`)."
  isNull: Boolean
}

"""
A model backend: what a blueprint names before the slash in `provider/model`.
How the machine reaches it and proves who it is decides what it has, so each
way is its own type. Every provider this build can route to is listed,
configured or not, and custom ones from `[model_providers]` with them (the
docs call an OpenAI-compatible one a gateway).
"""
interface ModelProvider implements Versioned & Node {
  "`modelProvider:<name>`."
  id: ID!
  "The name before the slash in `provider/model`, and the config key."
  name: String!
  "The name to show."
  displayName: String!
  """
  Whether this install has it turned on: a stored key, a switch, or a config
  entry. On is not working: a subscription can be on and signed out.
  """
  isEnabled: Boolean!
  "The models it serves, from the catalogue this server keeps. `refreshModels` asks again."
  models(
    "Which models. Omitted means all."
    filter: ModelFilter
    "Sort keys. Omitted means name ascending."
    orderBy: [ModelOrder!]
    "Page size, 1 to 200."
    first: Int! = 50
    "Cursor from the previous page."
    after: Cursor
  ): ModelConnection!
  "Its settings as they are now."
  revision: ModelProviderRevision!
  "Every state of its settings, newest first. At most 100 a page."
  revisions(
    "Page size, 1 to 100."
    first: Int! = 20
    "Cursor from the previous page."
    after: Cursor
  ): ModelProviderRevisionConnection!
  """
  The edits, newest first: one per write, each with the fields it changed.
  Kept for as long as the revisions they made. At most 100 a page.
  """
  history(
    "Page size, 1 to 100. Over 100 is refused (`BAD_USER_INPUT` / `PAGE_TOO_LARGE`)."
    first: Int! = 20
    "Cursor from the previous page."
    after: Cursor
  ): EditConnection!
}

"One page of `ModelProvider`: the items, where to resume, and how many there are altogether."
type ModelProviderConnection {
  "The items on this page, at most `first` of them."
  results: [ModelProvider!]!
  "Pass as `after` to read the next page. Null on the last one."
  cursor: Cursor
  "How many items match, across every page."
  total: Int!
}

"Filter on `ModelProvider`, field for field. Set an implementer's field to match that type only."
input ModelProviderFilter {
  "Filter on `ModelProvider.id`."
  id: IDFilter
  "Filter on `ModelProvider.name`."
  name: StringFilter
  "Filter on `ModelProvider.displayName`."
  displayName: StringFilter
  "Filter on `ModelProvider.isEnabled`."
  isEnabled: BooleanFilter
  "Matches `ApiKeyProvider` values only, and those against this filter."
  apiKeyProvider: ApiKeyProviderFilter
  "Matches `CommandLineProvider` values only, and those against this filter."
  commandLineProvider: CommandLineProviderFilter
  "Matches `LocalProvider` values only, and those against this filter."
  localProvider: LocalProviderFilter
  "Matches `NamedOpenAiProvider` values only, and those against this filter."
  namedOpenAiProvider: NamedOpenAiProviderFilter
  "Matches `OpenAiCompatibleProvider` values only, and those against this filter."
  openAiCompatibleProvider: OpenAiCompatibleProviderFilter
  "Matches `ScriptProvider` values only, and those against this filter."
  scriptProvider: ScriptProviderFilter
  "Matches `SubscriptionProvider` values only, and those against this filter."
  subscriptionProvider: SubscriptionProviderFilter
  "Every filter in this list has to hold."
  and: [ModelProviderFilter!]
  "At least one filter in this list has to hold."
  or: [ModelProviderFilter!]
  "This filter must not hold."
  not: ModelProviderFilter
  "Match where there is no value at all (`true`), or where there is one (`false`)."
  isNull: Boolean
}

"""One sort key for a provider listing."""
input ModelProviderOrder {
  "Which field."
  field: ModelProviderOrderField!
  "Which way. A to Z unless you say otherwise."
  direction: OrderDirection! = ASC
}

"""What a provider listing sorts by."""
enum ModelProviderOrderField {
  "`ModelProvider.id`."
  ID
  "`ModelProvider.name`."
  NAME
  "`ModelProvider.displayName`."
  DISPLAY_NAME
}

"One state of one provider's settings."
type ModelProviderRevision implements Revision & Node {
  "The provider's id, `@`, and the first 12 hex of `digest`."
  id: ID!
  "The settings as the config held them, keyed as it spells them; a secret reads `\"<set>\"` or null, never its value."
  settings: JSON!
  "The provider as it is now. Null once a custom one is removed."
  provider: ModelProvider
  "Which revision of its owner this is, from 1, in the order this machine first saw them."
  number: Int!
  """
  Lowercase hex SHA-256 of the content. For content that holds secrets (an
  MCP server, a model provider, the config) it is an HMAC under this
  machine's link-signing key, so it reveals nothing about them. Send it as
  `expectedRevision` to write over exactly this revision.
  """
  digest: String!
  "When this machine first recorded it."
  createdAt: DateTime!
  """
  Who wrote it: the name the API caller authenticated as, or `"cli"` for the
  lev command line. Null when the file was edited on disk and Leviath only saw
  the result.
  """
  createdBy: String
}

"One page of `ModelProviderRevision`: the items, where to resume, and how many there are altogether."
type ModelProviderRevisionConnection {
  "The items on this page, at most `first` of them."
  results: [ModelProviderRevision!]!
  "Pass as `after` to read the next page. Null on the last one."
  cursor: Cursor
  "How many items match, across every page."
  total: Int!
}

"""
One provider's settings, as `updateConfig` sends them. Exactly one field,
named for the way the provider is reached, so a write can only carry settings
that kind of provider has. A vendor-only setting sent for another vendor (a
region for OpenAI) is still refused.
"""
input ModelProviderWrite @oneOf {
  "A built-in vendor reached with an API key."
  apiKey: ApiKeyProviderWrite
  "The local model server."
  local: LocalProviderWrite
  "A subscription provider. Signing in is `signInProvider`."
  subscription: SubscriptionProviderWrite
  "The command-line provider."
  commandLine: CommandLineProviderWrite
  "An OpenAI-compatible server under `[model_providers]`."
  openAiCompatible: OpenAiCompatibleProviderWrite
  "OpenAI at another host under `[model_providers]`."
  namedOpenAi: NamedOpenAiProviderWrite
  "A provider that runs on a provider extension."
  script: ScriptProviderWrite
}

"A model to run on, and optionally the provider that serves it."
input ModelRef {
  "The provider, as `provider/model` spells it. Omitted: the model name resolves through `Config.routing`."
  providerName: String
  "The model, as that provider spells it."
  modelName: String!
}

"How a model name is resolved, and what overrides a stage's own choice."
type ModelRouting {
  "The provider a bare model name resolves on when `providerOrder` says nothing."
  defaultProvider: ProviderChoice!
  "The providers allowed to serve a bare model name, best first. Empty: `defaultProvider` alone."
  providerOrder: [ProviderChoice!]!
  "The model every stage that permits it starts on, ahead of its own list. Null when none is pinned."
  overrideModel: ModelChoice
  "The model tried after every model a stage names. Null when none is set."
  fallbackModel: ModelChoice
}

"Routing settings. Each omitted field is left alone."
input ModelRoutingWrite {
  "The provider a bare model name resolves on."
  defaultProvider: String
  "Providers allowed to serve a bare model name, best first, replaced whole. Empty: `defaultProvider` alone."
  providerOrder: [String!]
  "Pin or unpin the override model."
  overrideModel: StringSetting
  "Set or clear the fallback model."
  fallbackModel: StringSetting
}

"One model turn: what it said, and the calls it asked for."
type ModelTurnEntry implements ContextEntry {
  "Its token cost when added."
  tokens: Int!
  "How sensitive it is."
  taint: TaintLevel!
  "Its parts rendered as text."
  text: String!
  "Its parts, in order."
  parts: [Part!]!
  "The calls it asked for. Empty when it only spoke."
  requestedCalls: [ToolCall!]!
}

"One provider and model some stage ran an inference on."
type ModelUse {
  "The provider as the run's configuration named it."
  providerName: String!
  "The model as that provider spells it."
  modelName: String!
  "The provider's settings as this run first used them. Null for a run recorded before provider revisions were kept."
  provider: ModelProviderRevision
  "The model as catalogued now. Null once the catalogue drops it."
  model: Model
}

"""
A successful file-modifying call in the stage (`write_file`, `edit_file`, or a
tool listed here). Only enforced where the stage can call one.
"""
type ModificationRequirement {
  "Tools that count as modifying beyond `write_file` and `edit_file`."
  countedTools: [ToolByName!]!
  "A region whose holding anything also satisfies it (it survives a daemon restart). Null: none."
  orFilledRegion: Region
}

"One of a list of options."
type MultipleChoicePoint implements InteractionPoint {
  "Unique within the stage."
  name: String!
  "What the person is asked."
  prompt: String!
  "What happens when nobody is watching."
  whenUnattended: UnattendedPolicy!
  "The v1 name of `MultipleChoicePoint.whenUnattended`."
  unattended: UnattendedPolicy! @deprecated(reason: "Use `whenUnattended`.")
  "A region the current document replaces."
  documentRegion: Region
  "The options, in order, each with what picking it does."
  options: [AnswerOption!]!
}

"""
Writes and acts. Every write takes one `request` and answers one result.
Creates that mint an id take an `idempotencyKey`; updates of shared state take
an `expectedRevision` (or a `digest` pin); sweeps take `maxAffected` and offer
`dryRun`. A retry of something that already happened succeeds and says so
(`alreadyInState`, `replayed`). The `check...` fields contact the real thing
(a provider, an endpoint, an MCP server's process, a billed inference), which
is why they are here and not on `Query`; each answers its verdict as data.
"""
type Mutation {
  "Start a run. Send an `idempotencyKey`."
  spawnRun(
    "The run to start."
    request: SpawnRunRequest!
  ): SpawnRunResult!
  "Send a message to a live run. Send an `idempotencyKey`."
  sendMessage(
    "The message."
    request: SendMessageRequest!
  ): SendMessageResult!
  "Answer an open interaction. The first answer wins; a different, expired or withdrawn settlement is `CONFLICT`, with `extensions.current` showing how it settled."
  answerInteraction(
    "The interaction and the answer."
    request: AnswerInteractionRequest!
  ): AnswerInteractionResult!
  "Park a run. A run already paused answers `alreadyInState: true`."
  pauseRun(
    "Which run."
    request: PauseRunRequest!
  ): PauseRunResult!
  "Resume a paused run, or one that `NeedsSetup` once it is fixed. A run not paused answers `alreadyInState: true`."
  resumeRun(
    "Which run."
    request: ResumeRunRequest!
  ): ResumeRunResult!
  "Cancel a run and its sub-agents. A run already cancelled answers `alreadyInState: true`."
  cancelRun(
    "Which run."
    request: CancelRunRequest!
  ): CancelRunResult!
  "Pause every run a filter names, up to `maxAffected`. Answers each run as a `SweepItem`."
  pauseRuns(
    "The filter, the cap, and whether only to look."
    request: PauseRunsRequest!
  ): PauseRunsResult!
  "Resume every run a filter names, up to `maxAffected`. Answers each run as a `SweepItem`."
  resumeRuns(
    "The filter, the cap, and whether only to look."
    request: ResumeRunsRequest!
  ): ResumeRunsResult!
  "Cancel every run a filter names, up to `maxAffected`. Answers each run as a `SweepItem`."
  cancelRuns(
    "The filter, the cap, and whether only to look."
    request: CancelRunsRequest!
  ): CancelRunsResult!
  """
  Delete the run records a filter names, up to `maxAffected`. A live run is
  refused. For more than 200, sweep a slice at a time: filter on
  `startedAt`, `dryRun: true` to see the count, then send that count.
  """
  deleteRuns(
    "The filter, the cap, and whether only to look."
    request: DeleteRunsRequest!
  ): DeleteRunsResult!
  "Install a blueprint under the name its manifest gives. A manifest that does not load is `UNPROCESSABLE`; the same manifest again answers `alreadyInState: true`."
  createBlueprint(
    "The manifest."
    request: CreateBlueprintRequest!
  ): CreateBlueprintResult!
  "Replace an installed blueprint's manifest; a new revision. The name cannot change here. Runs already spawned keep their own revision."
  updateBlueprint(
    "Which blueprint, the pin, and the manifest."
    request: UpdateBlueprintRequest!
  ): UpdateBlueprintResult!
  "Uninstall a blueprint. Runs that used it keep their revision, so `Run.blueprint` still answers."
  deleteBlueprint(
    "Which blueprint."
    request: DeleteBlueprintRequest!
  ): DeleteBlueprintResult!
  "Write an extension file."
  upsertExtension(
    "Which file, and its text."
    request: UpsertExtensionRequest!
  ): UpsertExtensionResult!
  "Remove an extension file."
  deleteExtension(
    "Which file."
    request: DeleteExtensionRequest!
  ): DeleteExtensionResult!
  "Add an MCP server to the config. The same entry again answers `alreadyInState: true`."
  createMcpServer(
    "The server."
    request: CreateMcpServerRequest!
  ): CreateMcpServerResult!
  "Replace an MCP server's entry, whole."
  updateMcpServer(
    "The server, whole."
    request: UpdateMcpServerRequest!
  ): UpdateMcpServerResult!
  "Remove an MCP server and its stored credential."
  deleteMcpServer(
    "Which server."
    request: DeleteMcpServerRequest!
  ): DeleteMcpServerResult!
  "Start a configured MCP server and list what it advertises. A server that will not start or answer is `passed: false`."
  checkMcpServer(
    "Which server."
    request: CheckMcpServerRequest!
  ): CheckMcpServerResult!
  "Sign in to an HTTP MCP server through a browser on the serving host."
  signInMcpServer(
    "Which server."
    request: SignInMcpServerRequest!
  ): SignInMcpServerResult!
  "Start signing in to a subscription provider. Answers as soon as there is a URL for the person to open, on the serving host."
  signInProvider(
    "Which provider."
    request: SignInProviderRequest!
  ): SignInProviderResult!
  "Forget a subscription provider's stored sign-in."
  signOutProvider(
    "Which provider."
    request: SignOutProviderRequest!
  ): SignOutProviderResult!
  "Ask a subscription provider's account whether the stored sign-in works, and what it may use. Costs a request."
  checkProviderSignIn(
    "Which provider."
    request: CheckProviderSignInRequest!
  ): CheckProviderSignInResult!
  "Ask providers for their model lists again, and update the catalogue."
  refreshModels(
    "Which provider, or every enabled one."
    request: RefreshModelsRequest!
  ): RefreshModelsResult!
  "Ask an OpenAI-compatible endpoint what models it serves, before writing a provider for it."
  checkEndpoint(
    "Where to look."
    request: CheckEndpointRequest!
  ): CheckEndpointResult!
  "Write an approval policy, whole."
  upsertApprovalPolicy(
    "The policy."
    request: UpsertApprovalPolicyRequest!
  ): UpsertApprovalPolicyResult!
  "Remove an approval policy."
  deleteApprovalPolicy(
    "Which policy."
    request: DeleteApprovalPolicyRequest!
  ): DeleteApprovalPolicyResult!
  "Write an operator mime type rule."
  upsertMimeTypeRule(
    "The rule."
    request: UpsertMimeTypeRuleRequest!
  ): UpsertMimeTypeRuleResult!
  "Remove an operator mime type rule."
  deleteMimeTypeRule(
    "Which rule."
    request: DeleteMimeTypeRuleRequest!
  ): DeleteMimeTypeRuleResult!
  "Change the config file in one write. Every refusal happens before anything is written."
  updateConfig(
    "What to change."
    request: UpdateConfigRequest!
  ): UpdateConfigResult!
  "Run every diagnostic, the billed ones included: one inference, and one throwaway run through the daemon. One at a time (`CONFLICT` / `BUSY`)."
  checkMachine(
    "Which model to probe; `{}` for the default."
    request: CheckMachineRequest!
  ): CheckMachineResult!
  "Make one directory, for a picker's New Folder."
  createDirectory(
    "Where, and what to call it."
    request: CreateDirectoryRequest!
  ): CreateDirectoryResult!
  "Start a self-update and hand back the job. While one is running, answers that one with `alreadyRunning: true`."
  startUpdate(
    "Which steps."
    request: StartUpdateRequest!
  ): StartUpdateResult!
  "Export the run store to a file and hand back the job."
  startRunExport(
    "Which runs and fields."
    request: StartRunExportRequest!
  ): StartRunExportResult!
}

"""
A `[model_providers]` entry with `kind = "openai"`: OpenAI's own API at another host, under a name of its own (an Azure resource, say).
"""
type NamedOpenAiProvider implements ModelProvider & Node & Versioned {
  "`modelProvider:<name>`."
  id: ID!
  "The name before the slash in `provider/model`, and the config key."
  name: String!
  "The name to show."
  displayName: String!
  """
  Whether this install has it turned on: a stored key, a switch, or a config
  entry. On is not working: a subscription can be on and signed out.
  """
  isEnabled: Boolean!
  "The models it serves, from the catalogue this server keeps. `refreshModels` asks again."
  models(
    "Which models. Omitted means all."
    filter: ModelFilter
    "Sort keys. Omitted means name ascending."
    orderBy: [ModelOrder!]
    "Page size, 1 to 200."
    first: Int! = 50
    "Cursor from the previous page."
    after: Cursor
  ): ModelConnection!
  "Where it is."
  baseUrl: String!
  "Whether a key is stored. The key never crosses the wire."
  hasApiKey: Boolean!
  """
  `auth_header`: the header the key goes in. Null sends it as a bearer token.
  """
  keyHeaderName: String
  "Names of the extra headers it sends. Values never cross the wire."
  headerNames: [String!]!
  """
  `serves =` / `models`: deployment names a bare model name may route here by.
  """
  servedModelNames: [String!]!
  "Its settings as they are now."
  revision: ModelProviderRevision!
  "Every state of its settings, newest first. At most 100 a page."
  revisions(
    "Page size, 1 to 100."
    first: Int! = 20
    "Cursor from the previous page."
    after: Cursor
  ): ModelProviderRevisionConnection!
  """
  The edits, newest first: one per write, each with the fields it changed.
  Kept for as long as the revisions they made. At most 100 a page.
  """
  history(
    "Page size, 1 to 100. Over 100 is refused (`BAD_USER_INPUT` / `PAGE_TOO_LARGE`)."
    first: Int! = 20
    "Cursor from the previous page."
    after: Cursor
  ): EditConnection!
}

"Filter on `NamedOpenAiProvider`, field for field."
input NamedOpenAiProviderFilter {
  "Filter on `NamedOpenAiProvider.id`."
  id: IDFilter
  "Filter on `NamedOpenAiProvider.name`."
  name: StringFilter
  "Filter on `NamedOpenAiProvider.displayName`."
  displayName: StringFilter
  "Filter on `NamedOpenAiProvider.isEnabled`."
  isEnabled: BooleanFilter
  "Filter on `NamedOpenAiProvider.baseUrl`."
  baseUrl: StringFilter
  "Filter on `NamedOpenAiProvider.hasApiKey`."
  hasApiKey: BooleanFilter
  "Filter on `NamedOpenAiProvider.keyHeaderName`."
  keyHeaderName: StringFilter
  "Filter on `NamedOpenAiProvider.headerNames`."
  headerNames: StringListFilter
  "Filter on `NamedOpenAiProvider.servedModelNames`."
  servedModelNames: StringListFilter
  "Every filter in this list has to hold."
  and: [NamedOpenAiProviderFilter!]
  "At least one filter in this list has to hold."
  or: [NamedOpenAiProviderFilter!]
  "This filter must not hold."
  not: NamedOpenAiProviderFilter
  "Match where there is no value at all (`true`), or where there is one (`false`)."
  isNull: Boolean
}

"OpenAI at another host, merged field by field."
input NamedOpenAiProviderWrite {
  "The entry's name. Created when nothing has it."
  name: String!
  "Where it is. Required when creating."
  baseUrl: String
  "Store or remove its key."
  apiKey: StringSetting
  "The header the key goes in. Omitted sends it as a bearer token."
  keyHeaderName: String
  "Extra headers, replacing the stored set."
  headers: [KeyValueWrite!]
