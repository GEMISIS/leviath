A share of the model's context window (`budget = \"30%\"`), with optional
guard rails. What it resolves to depends on the model, so a run reports it.
"""
type WindowShareBudget {
  "Percent, 0 to 100."
  percent: Float!
  "A floor (`min_tokens`). Null: none."
  minTokens: Int
  "A cap (`max_tokens`). Null: none."
  maxTokens: Int
}

"A separate installed blueprint (`worker_agent`). Named, because it must be installed when the fan-out runs, not now."
type WorkerBlueprint {
  "The blueprint's name."
  blueprintName: String!
}

"What one fan-out worker failing does."
enum WorkerFailurePolicy {
  "The rest carry on; the failure is in the report."
  CONTINUE
  "The stage leaves by its `ErrorEdge`."
  FAIL_ALL
}

"A description matched against the installed blueprints when the fan-out runs (`worker_query`)."
type WorkerSearch {
  "The description."
  query: String!
}

"A stage of this blueprint (`worker_stage`). It allows it with `mayRunAsWorker`."
type WorkerStage {
  "The stage."
  stage: Stage!
}

"The working directory disappeared mid-run."
type WorkingDirectoryLost implements RunProblem {
  "The problem in one sentence."
  summary: String!
}

"Filter on `WorkingDirectoryLost`, field for field."
input WorkingDirectoryLostFilter {
  "Filter on `WorkingDirectoryLost.summary`."
  summary: StringFilter
  "Every filter in this list has to hold."
  and: [WorkingDirectoryLostFilter!]
  "At least one filter in this list has to hold."
  or: [WorkingDirectoryLostFilter!]
  "This filter must not hold."
  not: WorkingDirectoryLostFilter
  "Match where there is no value at all (`true`), or where there is one (`false`)."
  isNull: Boolean
}

"`write_file`."
type WriteFileArguments {
  "The file."
  path: String!
  "What was written."
  content: String!
  "Whether it appended rather than replaced. Null when the model left it out (replace)."
  append: Boolean
}

"Directs the executor to include this field or fragment only when the `if` argument is true."
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT

"Exactly one field of an input with this directive must be set, and it must not be null."
directive @oneOf on INPUT_OBJECT

"Directs the executor to skip this field or fragment when the `if` argument is true."
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
