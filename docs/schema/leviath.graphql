A per-tool ceiling on one result, in place of the stage's own.

One number for a whole stage cannot fit a stage that both greps, where the
answer is small and wanted whole, and reads files, where it can be enormous.
"""
type ToolTokenCeiling {
	"""
	The tool, by the name the manifest used. A name rather than a `Tool`: a
	ceiling may name an MCP server's tool or one this machine does not have.
	"""
	tool: String!
	"""
	The most tokens one of its results may take.
	"""
	maxResultTokens: Int!
}

"""
The prompt guidance a blueprint or a stage declares.
"""
type ToolUseGuidance {
	"""
	Whether the batch-independent-tool-calls paragraph is included.
	"""
	batchIndependentCalls: HintSetting!
	"""
	Whether the platform shell paragraph is included. Even when included,
	it is only emitted where the host has shell guidance worth giving and
	the stage offers the `shell` tool.
	"""
	shellForMultiStepWork: HintSetting!
}

"""
What a transform does in detail: which regions it carries, compacts and
clears, and what it asks the summarizer for.

Set for `COMPACT`, which carries the prompt and nothing else, and for
`CUSTOM`, which carries the per-region lists. Null for `DIRECT` and `CLEAR`,
which have nothing to say.
"""
type TransformConfig {
	"""
	Regions carried over verbatim.
	
	One entry per name the edge wrote that a layout in this blueprint
	declares. A name with no declaration is in `carryNames` and not here:
	either a later edit removed the region, or the edge names one of the four
	the runtime carries whatever a manifest says - `conversation`,
	`tool_results`, `final_output` and `stage_instructions` - which exist at
	run time with nothing declared to read.
	"""
	carry: [Region!]!
	"""
	Every name the edge wrote in `carry`, verbatim and in order, declared or
	not.
	"""
	carryNames: [String!]!
	"""
	Regions handed to the summarizer. Declared names only; `compactNames`
	carries the whole list.
	"""
	compact: [Region!]!
	"""
	Every name the edge wrote in `compact`, verbatim and in order.
	"""
	compactNames: [String!]!
	"""
	Regions emptied. Declared names only; `clearNames` carries the whole
	list.
	"""
	clear: [Region!]!
	"""
	Every name the edge wrote in `clear`, verbatim and in order.
	"""
	clearNames: [String!]!
	"""
	A prompt for the summarizer on this edge, in place of the default.
	"""
	compactPrompt: String
}

"""
When an edge may be taken.
"""
enum TransitionCondition {
	"""
	Taken as soon as the stage finishes.
	"""
	ALWAYS
	"""
	The model chooses this edge over the stage's others.
	"""
	LLM_CHOICE
	"""
	Taken when the stage ends in an error.
	"""
	ERROR
	"""
	Taken when the stage runs out of iterations.
	"""
	MAX_ITERATIONS
	"""
	Taken when the stage is detected stuck. The thresholds that arm it are
	on `stuck`.
	"""
	STUCK
	"""
	Taken when no other edge can fire.
	"""
	DEAD_END
}

"""
One outgoing edge of a stage.

A stage with no edges is terminal.
"""
type TransitionEdge {
	"""
	The stage this edge leads to.
	
	Null only where the blueprint names a stage it does not declare, which
	`lev validate` refuses and the daemon will not spawn: an installed
	manifest can still be in that state, and `targetName` is the name it
	wrote.
	"""
	target: Stage
	"""
	The stage name this edge was keyed by, verbatim.
	"""
	targetName: String!
	"""
	Told to the model when it is choosing where to go next.
	"""
	hint: String
	"""
	When this edge may be taken.
	"""
	condition: TransitionCondition!
	"""
	What happens to the context on the way through.
	"""
	transform: TransitionTransform!
	"""
	The transform in detail: a `COMPACT` edge's prompt, or a `CUSTOM` edge's
	per-region lists. Null for `DIRECT` and `CLEAR`.
	"""
	transformConfig: TransformConfig
	"""
	What must be true before this edge is taken. Null when the edge asks for
	nothing beyond its condition.
	"""
	gate: TransitionGate
	"""
	What arms this edge, for a `STUCK` condition. Null for every other
	condition, and never null for that one.
	"""
	stuck: StuckThresholds
}

"""
What a stage must have done before an edge may be taken.

A gate that is not satisfied re-runs the stage with `message` instead of
transitioning, up to `maxAttempts` times, and then lets the run through: an
unmet gate slows a run down, it never strands one.
"""
type TransitionGate {
	"""
	The stage must have modified something.
	"""
	requireModifications: Boolean!
	"""
	A second way to satisfy `requireModifications`: this region holding
	anything also passes. It is an alternative rather than a requirement,
	because per-stage tool counters do not survive a daemon restart and a
	region does.
	
	Null when the gate names no region, and also when it names one no layout
	in this blueprint declares. `regionName` tells those apart: it is null
	only in the first case.
	"""
	region: Region
	"""
	The region name the gate wrote for its `requireModifications`
	alternative, verbatim. Null when it names none.
	"""
	regionName: String
	"""
	Tools counted as modifying, beyond `write_file` and `edit_file`. For an
	blueprint whose writes go through MCP or a script.
	
	Names rather than `Tool`s, because an MCP server's tool is exactly what
	this list is for and an inventory does not describe one.
	"""
	tools: [String!]!
	"""
	Regions that must all hold something. Conjunctive, unlike `region`.
	
	Declared names only. `requireRegionNames` carries every name the gate
	wrote, which is where a name with no declaration in this blueprint stays
	readable.
	"""
	requireRegions: [Region!]!
	"""
	Every name the gate wrote in `requireRegions`, verbatim and in order,
	declared or not.
	"""
	requireRegionNames: [String!]!
	"""
	A region that must have changed during this stage, not merely be
	present. What a revise loop needs: re-emitting the same content
	satisfies a presence check.
	
	Null when the gate asks for none, and also when it names one no layout
	declares. `requireRegionUpdatedName` tells those apart.
	"""
	requireRegionUpdated: Region
	"""
	The name the gate wrote for `requireRegionUpdated`, verbatim. Null when
	it asks for none.
	"""
	requireRegionUpdatedName: String
	"""
	A checklist region that must have no open items left.
	
	Null when the gate asks for none, and also when it names one no layout
	declares. `requireNoOpenItemsName` tells those apart.
	"""
	requireNoOpenItems: Region
	"""
	The name the gate wrote for `requireNoOpenItems`, verbatim. Null when it
	asks for none.
	"""
	requireNoOpenItemsName: String
	"""
	A region that must hold at least so many entries.
	"""
	requireRegionEntries: RegionEntryRequirement
	"""
	Sent back to the stage while the gate holds it. A default explaining the
	framework's change tracking is generated when this is absent.
	"""
	message: String
	"""
	How many times the stage is re-asked before the gate gives up and lets
	the transition through with a warning.
	"""
	maxAttempts: Int
}

"""
What happens to the context on the way through an edge.
"""
enum TransitionTransform {
	"""
	Everything carries over untouched.
	"""
	DIRECT
	"""
	The context is cleared.
	"""
	CLEAR
	"""
	The context is compacted: the summarizer replaces it with a summary of
	itself. `transformConfig.compactPrompt` carries the instruction when the
	edge names one.
	"""
	COMPACT
	"""
	Per-region, as `transformConfig` spells out.
	"""
	CUSTOM
}

"""
What a checkpoint does when nobody is watching.
"""
enum UnattendedPolicy {
	"""
	Taken as approved, and the run carries on.
	"""
	AUTO_APPROVE
	"""
	The run holds for a person even under a yolo profile. For the checkpoint
	whose whole purpose is a human decision.
	"""
	ASK
}

"""
Why a call came back untyped.

The two are different situations and a client should treat them differently.
An MCP or script tool has no type here and never will, which is ordinary. A
built-in whose arguments did not fit its own schema is a call that the model
got wrong or that a later build changed, and it is worth looking at.
"""
enum UntypedCallReason {
	"""
	This build has no type for this tool: an MCP tool, or a script one.
	"""
	NO_TYPE_FOR_THIS_TOOL
	"""
	The tool is known, and the recorded arguments did not fit its shape.
	"""
	ARGUMENTS_DID_NOT_MATCH
}

"""
One call whose arguments stay as they were recorded.
"""
type UntypedToolCall implements ToolCall {
	"""
	Tool name, exactly as the model called it.
	"""
	toolName: String!
	"""
	What the tool does, where this build knows the tool.
	"""
	toolDescription: String
	"""
	The arguments as the model sent them, untouched.
	"""
	rawArguments: JSON!
	"""
	Why this call is not one of the typed ones.
	"""
	reason: UntypedCallReason!
}

"""
One bundled blueprint, and what an update would do to it.
"""
type UpdateBlueprintEntry {
	"""
	The blueprint's name.
	"""
	name: String!
	"""
	The version this build ships.
	"""
	version: String!
	"""
	What would happen to the installed copy, in words.
	"""
	change: String!
	"""
	Whether that is a change at all, rather than "already current".
	"""
	hasChanges: Boolean!
	"""
	Whether an update would install it without being asked. A copy somebody
	edited is not, because overwriting it would throw that work away.
	"""
	preselected: Boolean!
}

"""
A self-update finished.
"""
type UpdateFinished {
	"""
	The update job.
	"""
	jobId: String!
	"""
	Its terminal status.
	"""
	status: String!
	"""
	Whether both this server and the daemon keep running the old build
	until they are restarted.
	"""
	restartRequired: Boolean!
}

"""
What an update would do, and whether there is anything newer to get.
"""
type UpdateInfo {
	"""
	The version running now.
	"""
	version: String!
	"""
	How this copy was installed.
	"""
	installMethod: InstallMethod!
	"""
	The release channel this install tracks, where that is knowable. Null for
	an install method that does not carry one.
	"""
	channel: String
	"""
	The newest version there is. Null means nothing to show, which covers
	three cases that are one answer to a client: not checked yet, checking
	switched off, and the check failed.
	"""
	latest: String
	"""
	Whether that is newer than this. Null for the same three cases.
	"""
	updateAvailable: Boolean
	"""
	When the check last answered. Null for the same three cases.
	"""
	checkedAt: Timestamp
	"""
	How the binary would be upgraded.
	"""
	binary: BinaryUpgrade!
	"""
	The bundled blueprints, and what would happen to each.
	"""
	blueprints: [UpdateBlueprintEntry!]!
	"""
	The config migrations that apply.
	"""
	migrations: [UpdateMigration!]!
	"""
	Why the config could not be read, when it could not. The plan is still
	honest about the binary and the blueprints; it is the migrations it
	cannot judge.
	"""
	configError: String
}

"""
One update run.
"""
type UpdateJob implements Node {
	"""
	The job's id, which `updateJob` and `node` both take. Unique to this
	server: the jobs live in memory, so nothing answers to it after a
	restart.
	"""
	id: ID!
	"""
	Where the run as a whole got to.
	"""
	status: UpdateJobStatus!
	"""
	Each step, in the order they run. A step that was not asked for is
	`SKIPPED` rather than absent, so a client renders the same rows
	whatever the request was.
	"""
	steps: [UpdateJobStep!]!
}

"""
Where an update run as a whole got to.
"""
enum UpdateJobStatus {
	"""
	Still going.
	"""
	RUNNING
	"""
	Every step finished and none failed.
	"""
	COMPLETE
	"""
	At least one step failed.
	"""
	FAILED
}

"""
One step of an update run.
"""
type UpdateJobStep {
	"""
	Which step this is.
	"""
	step: UpdateStep!
	"""
	Where it got to.
	"""
	status: UpdateStepStatus!
	"""
	What happened, in words.
	"""
	detail: String!
}

"""
One config migration that applies to the config as it stands.
"""
type UpdateMigration {
	"""
	The migration's name.
	"""
	name: String!
	"""
	What it changes.
	"""
	description: String!
}

"""
A self-update step moved.
"""
type UpdateProgress {
	"""
	The update job.
	"""
	jobId: String!
	"""
	Which part of the install the step touches.
	"""
	step: String!
	"""
	The step's status.
	"""
	status: String!
	"""
	One line about what just happened, ready to print.
	"""
	detail: String!
}

"""
The steps an update runs, in order.
"""
enum UpdateStep {
	"""
	Leviath itself. First, because what the other steps do is decided by
	what the new binary ships.
	"""
	BINARY
	"""
	The bundled blueprints in the agents directory.
	"""
	BLUEPRINTS
	"""
	Keys in the reader's own blueprints that changed name.
	"""
	KEYS
	"""
	The config file.
	"""
	MIGRATIONS
}

"""
Where one step of an update got to.
"""
enum UpdateStepStatus {
	"""
	Not reached yet.
	"""
	PENDING
	"""
	Happening now.
	"""
	RUNNING
	"""
	Did what it set out to.
	"""
	DONE
	"""
	The request did not ask for it, or it had nothing to do.
	"""
	SKIPPED
	"""
	The reader's to carry out, with the reason in `detail`. Neither success
	nor failure: nothing was done and nothing went wrong.
	"""
	ADVISED
	"""
	Tried, and did not manage it.
	"""
	FAILED
}

"""
There is nothing to run, and this is why.
"""
type UpgradeByAdvice {
	"""
	What to tell the person instead.
	"""
	message: String!
}

"""
Commands that would upgrade the binary.

A list rather than one command because a package manager will not see a
release published minutes ago until its own index is refreshed, so the
refresh and the upgrade only make sense together.
"""
type UpgradeByCommand {
	"""
	Each command's own words, in order. They stop at the first failure.
	"""
	commands: [String!]!
	"""
	The same sequence as one line, joined with `&&`: what to paste into a
	shell to do it by hand.
	"""
	shell: String!
}

"""
What a validation found.

`valid` is the verdict; the lists say why. A manifest can be valid and still
carry warnings, which is the common case for a blueprint that works but names
something the engine has retired.
"""
type ValidationReport {
	"""
	Whether the manifest would install and run.
	"""
	valid: Boolean!
	"""
	What makes it invalid. Empty when it is.
	"""
	errors: [String!]!
	"""
	What is worth knowing about it anyway.
	"""
	warnings: [String!]!
}

"""
What happens when the validator refuses a submitted output.
"""
enum ValidatorErrorPolicy {
	"""
	The output is refused and the stage is asked again with the reason.
	"""
	REJECT
	"""
	The output is taken anyway, and the refusal is a warning.
	"""
	ACCEPT
}

"""
Arguments for the `wait_for_agent` tool.
"""
type WaitForAgentArgs {
	"""
	The agent waited for, by its live id.
	"""
	agentId: String!
}

"""
One `wait_for_agent` call.
"""
type WaitForAgentCall implements ToolCall {
	"""
	Tool name, exactly as the model called it.
	"""
	toolName: String!
	"""
	What the tool does, as this build describes it.
	"""
	toolDescription: String
	"""
	The arguments as the model sent them, untouched. The typed
	form beside this is a reading of it, not a replacement.
	"""
	rawArguments: JSON!
	"""
	The call's arguments.
	"""
	args: WaitForAgentArgs!
}

"""
Why a run is parked, and what would unblock it.

Present only while the run is in `WAITING_INPUT`. A run waiting on a person
carries the prompt in `interaction`; a run parked on its own sub-agents
carries the reason here and needs nobody.
"""
type WaitReason {
	"""
	The machine-readable cause.
	"""
	reason: WaitReasonKind!
	"""
	What is blocked. Present when `reason` is `NEEDS_SETUP`.
	"""
	blocker: SetupBlocker
	"""
	What to do about it, in a sentence. Present with `blocker`.
	"""
	remedy: String
	"""
	How many are still outstanding. Present for `FAN_OUT_WORKERS` and
	`CHILDREN`.
	"""
	outstanding: Int
	"""
	Whether this needs a person, as against resolving on its own.
	
	The difference a client cares about: a run waiting on workers is
	healthy, and a run waiting on an answer is a row somebody has to act
	on.
	"""
	needsAPerson: Boolean!
}

"""
Why a run is parked.
"""
enum WaitReasonKind {
	"""
	Waiting on a tool-permission decision.
	"""
	TOOL_APPROVAL
	"""
	Waiting on an answer to a question the run asked.
	"""
	USER_PROMPT
	"""
	Waiting at a taint gate.
	"""
	TAINT_GATE
	"""
	Waiting at a blueprint interaction point.
	"""
	INTERACTION_POINT
	"""
	Fan-out workers are still running. Healthy; it resolves on its own.
	"""
	FAN_OUT_WORKERS
	"""
	Child runs are still running. Healthy; it resolves on its own.
	"""
	CHILDREN
	"""
	Something on the machine has to change before this run can go on.
	"""
	NEEDS_SETUP
}

"""
Arguments for the `which_command` tool.
"""
type WhichCommandArgs {
	"""
	The program name to look up, such as `git` or `python3`.
	"""
	command: String!
}

"""
One `which_command` call.
"""
type WhichCommandCall implements ToolCall {
	"""
	Tool name, exactly as the model called it.
	"""
	toolName: String!
	"""
	What the tool does, as this build describes it.
	"""
	toolDescription: String
	"""
	The arguments as the model sent them, untouched. The typed
	form beside this is a reading of it, not a replacement.
	"""
	rawArguments: JSON!
	"""
	The call's arguments.
	"""
	args: WhichCommandArgs!
}

"""
What happens to a fan-out when one worker fails.
"""
enum WorkerFailurePolicy {
	"""
	The others finish, and the merge stage sees what came back.
	"""
	CONTINUE
	"""
	The whole fan-out fails with the worker.
	"""
	FAIL_ALL
}

"""
Elapsed working time: banked spans plus the one in progress.
"""
type WorkingClock {
	"""
	Seconds banked by spans that have ended.
	"""
	bankedSecs: Int!
	"""
	When the span in progress began; null while the clock is stopped.
	"""
	since: Timestamp
}

"""
Arguments for the `write_file` tool.
"""
type WriteFileArgs {
	"""
	Path to the file, relative to the working directory.
	"""
	path: String!
	"""
	The content to write: the whole file, or with `append` the part to add.
	"""
	content: String!
	"""
	Add to the end of the file instead of replacing it. Left out means no.
	"""
	append: Boolean
}

"""
One `write_file` call.
"""
type WriteFileCall implements ToolCall {
	"""
	Tool name, exactly as the model called it.
	"""
	toolName: String!
	"""
	What the tool does, as this build describes it.
	"""
	toolDescription: String
	"""
	The arguments as the model sent them, untouched. The typed
	form beside this is a reading of it, not a replacement.
	"""
	rawArguments: JSON!
	"""
	The call's arguments.
	"""
	args: WriteFileArgs!
}

"""
What a yolo profile would do with one call.
"""
type YoloDecision {
	"""
	The profile that decided.
	"""
	profile: String!
	"""
	The tool the call was for.
	"""
	tool: String!
	"""
	What the config layers resolve the tool to, before the profile.
	"""
	configured: String!
	"""
	What the profile makes of it: `allow`, `ask` or `deny`.
	"""
	policy: String!
	"""
	Why, in words, when the decision has a reason to give.
	"""
	reason: String
}

"""
Whether one human-in-the-loop mechanism still reaches a person.
"""
enum YoloHuman {
	"""
	Reaches a person and waits.
	"""
	ASK
	"""
	Answers itself and carries on.
	"""
	AUTO
}

"""
One named yolo profile, summarised.

The counts rather than the rules: a settings list shows how much a profile
waives, and `lev yolo show` prints the rules themselves.
"""
type YoloProfile implements Node {
	"""
	`yoloProfile:<name>`. One file holds the profiles, one profile per
	name, so the name is the whole key.
	"""
	id: ID!
	"""
	The profile's name, as `--yolo=<name>` spells it.
	"""
	name: String!
	"""
	What tools with no explicit rule do.
	"""
	default: YoloWaiver!
	"""
	What happens to the run's own questions.
	"""
	questions: YoloHuman!
	"""
	What happens at blueprint checkpoints.
	"""
	checkpoints: YoloHuman!
	"""
	What happens at the taint gate.
	"""
	gate: YoloHuman!
	"""
	How many tool rules it carries: allow, ask, deny.
	"""
	toolRules: [Int!]!
	"""
	How many shell rules it carries: allow, ask, deny.
	"""
	shellRules: [Int!]!
}

"""
The yolo profiles, and where they are read from.
"""
type YoloProfiles {
	"""
	The file the profiles are read from.
	"""
	path: String!
	"""
	Whether that file exists. False with no error means `--yolo=<name>` has
	nothing to name yet.
	"""
	exists: Boolean!
	"""
	Why the file does not load, when it does not. The profiles are then
	empty, and a spawn naming one is refused with this same message.
	"""
	error: String
	"""
	The profiles themselves.
	"""
	profiles: [YoloProfile!]!
}

"""
One call to decide about, as a yolo test sends it.
"""
input YoloTestInput {
	"""
	The profile to test.
	"""
	profile: String!
	"""
	The tool the model would call.
	"""
	tool: String!
	"""
	The command line, for the shell.
	"""
	command: String
	"""
	The call's arguments, for a tool that is not the shell.
	"""
	arguments: JSON
	"""
	The working directory the run would have. The server's own, when left out.
	"""
	workdir: String
	"""
	What the config resolves the tool to. Read from the config in force when
	left out.
	"""
	configured: String
	"""
	The tool's kind: `builtin`, `subagent`, `script` or `mcp`. Guessed from the
	name when left out.
	"""
	kind: String
	"""
	Decide as if the tool had been named in `--allow`.
	"""
	allowed: Boolean
}

"""
What a profile does with a tool no rule names.

Two values, not three: a profile waives prompts, it never adds a refusal.
A tool a profile does not reach is decided by the config's own permissions,
which can still deny it.
"""
enum YoloWaiver {
	"""
	Runs without asking.
	"""
	ALLOW
	"""
	Stops and asks, as it would with no profile.
	"""
	ASK
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Indicates that an Input Object is a OneOf Input Object (and thus requires exactly one of its field be provided)
"""
directive @oneOf on INPUT_OBJECT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Query
	mutation: Mutation
	subscription: Subscription
}

