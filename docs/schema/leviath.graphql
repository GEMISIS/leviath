"""
One tool a run on this machine can be given.

An interface rather than one type with nullable extras: a script tool always
has a file and a built-in never does, and a schema that says so lets a client
read the file without checking whether it is there.
"""
interface Tool {
	"""
	The name the model calls it by.
	"""
	name: String!
	"""
	What it does, in the words the model is given.
	"""
	description: String!
	"""
	The JSON Schema of its arguments, as the model is given it.
	"""
	arguments: JSON!
	"""
	What kind of thing offers it, for a client that would rather branch on a value than on a type.
	"""
	origin: ToolOrigin!
}

"""
What one tool may be handed at this stage.

A stored part outside a tool's list is out of that tool's reach here. A tool
absent from the table has no limit beyond what it takes itself, and inline
text is never hidden by one.
"""
