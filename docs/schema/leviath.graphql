"""
How one trip to a provider ended, and how the failure was judged when there
was one.

`failureKind`, `transient`, `capacity` and `retry` are null unless `kind` is
`FAILED`: an attempt that worked has no failure to classify. What the answer
cost is on the run's `usage` and `cost`, not here.
"""
type AttemptOutcome {
	"""
	Whether the provider answered.
	"""
	kind: AttemptOutcomeKind!
	"""
	A stable label for what went wrong. Null for an attempt that worked, and
	for a failure the provider gave no classification for at all.
	"""
	failureKind: String
	"""
	Whether a retry could plausibly have cleared it. Recorded as judged at
	the time rather than inferred now: what counts as transient is a policy
	that moves between releases.
	"""
	transient: Boolean
	"""
	Whether the provider said it was at capacity, which is what buys the slow
	backoff schedule rather than the blip-sized one.
	"""
	capacity: Boolean
	"""
	What the loop did next.
	"""
	retry: RetryDecision
}

"""
How one trip to a provider ended.
"""
enum AttemptOutcomeKind {
	"""
	The provider answered.
	"""
	SUCCEEDED
	"""
	It produced no answer.
	"""
	FAILED
}

"""
A 64-bit integer, serialized as a JSON number. GraphQL's `Int` is 32-bit:
it cannot hold a 2 GiB file size or a large aggregate token count. Every
magnitude this API produces is well under 2^53, so it round-trips through
a browser without loss.
"""
scalar BigInt

"""
How the binary would be upgraded.
"""
union BinaryUpgrade = UpgradeByCommand | UpgradeByAdvice

"""
One stored part a run holds.

The bytes are not here. They are behind `url`, which is a short-lived signed
link the byte route verifies: bytes never ride a query answer, and a page can
put that link straight in an `<img src>`.
"""
type BlobEntry {
	"""
	The store's key: the bytes' SHA-256.
	"""
	sha256: String!
	"""
	The type the bytes were stored as.
	"""
	mimeType: String!
	"""
	The name the part carries, when its context gave it one.
	"""
	name: String
	"""
	Size in bytes.
	"""
	size: BigInt!
	"""
	Pixel width, for an image or a video.
	"""
	width: Int
	"""
	Pixel height, for an image or a video.
	"""
	height: Int
	"""
	Duration in milliseconds, for audio or video.
	"""
	durationMs: Int
	"""
	What the part is budgeted at in context.
	"""
	tokens: Int!
	"""
	Every region holding an entry that names this part.
	"""
	regions: [String!]!
	"""
	Whether the bytes are still on disk. A context can name a part whose
	file was too large to keep, or that a pruned run directory lost.
	"""
	stored: Boolean!
	"""
	A short-lived signed link to the bytes. Null when they are not on disk.
	"""
	url: String
}

"""
A blueprint: the manifest that says what an agent is, whole.

Its stages, regions, tools and models are the declaration and nothing more.
Nothing here belongs to any one execution: that is a `Run`, which carries
its own frozen copy of the blueprint it started from.

So read from a run, this is the manifest that run executed; read from the
blueprint listing, it is the definition installed now. The `source` field
says which, and the digest in the id says whether they are the same bytes.
"""
type Blueprint implements Node {
	"""
	This revision's id: `<name>@<digest prefix>`.
	
	The digest is part of the identity on purpose. A run's frozen copy and
	the installed blueprint share a name and may differ in every other way,
	and a client that caches by type and id would otherwise merge the two.
	
	`node` answers with the installed revision. A revision only a run
	carries is read through that run, so its id answers with nothing there.
	"""
	id: ID!
	"""
	Unique within the installed set.
	"""
	name: String!
	"""
	Content digest of this manifest, lowercase hex SHA-256.
	"""
	digest: String!
	"""
	Which file this was read from.
	"""
	source: BlueprintSource!
	"""
	From `[agent] version`.
	"""
	version: String!
	"""
	From `[agent] description`.
	"""
	description: String!
	"""
	The stage a run starts in. Defaults to the first stage declared.
	
	Null for a blueprint that declares no stages, and for one whose
	`entry_stage` names a stage it does not declare, which `lev validate`
	refuses and the daemon will not spawn. `entryStageName` is the name it
	wrote.
	"""
	entryStage: Stage
	"""
	The name the manifest gave as its entry stage, verbatim. Null where it
	names none, which starts the run in the first stage declared.
	"""
	entryStageName: String
	"""
	How deep sub-agent spawning may nest.
	"""
	maxChildDepth: Int
	"""
	When this blueprint's runs look for tools again.
	"""
	toolRescan: ToolRescan!
	"""
	The prompt guidance this blueprint declares, before the cascade.
	"""
	toolGuidance: ToolUseGuidance!
	"""
	One entry per stage, in declaration order.
	"""
	stages: [Stage!]!
	"""
	One entry per context region the blueprint declares run-wide.
	
	A stage may declare a layout of its own on top of this, and those regions
	are on `Stage.context.regions` rather than here.
	"""
	regions: [Region!]!
	"""
	Paths this blueprint declares it needs beyond its workdir. Declaring is not
	granting: an entry takes effect only where the host grants it.
	"""
	readPaths: [String!]!
	"""
	What must be on the machine before a run of this will start. A required
	one missing fails the spawn with its remedy; the rest are warnings.
	"""
	dependencies: [BlueprintDependency!]!
	"""
	The mime rows this blueprint ships, so one that works in a file type the
	machine has never heard of carries the row that describes it.
	"""
	mimeTypes: [BlueprintMimeRow!]!
	"""
	What this blueprint asks of the taint layer. Null inherits the machine's
	setting.
	"""
	security: BlueprintSecurity
	"""
	Where this blueprint's tools run, unless a stage says otherwise. Null leaves
	the machine's own setting.
	"""
	sandbox: SandboxConfig
	"""
	What happens when a model answers with text before calling any tool,
	unless a stage says otherwise. Null leaves the machine's own setting.
	"""
	nudge: NudgeConfig
	"""
	The model that summarizes a region when it fills. Null leaves the
	machine's own summarizer.
	"""
	compaction: CompactionConfig
	"""
	Keeping the files this blueprint's runs read and write in one region, so a tool
	result can point at the region rather than repeating the file.
	"""
	fileTracking: FileTrackingConfig
	"""
	When a run of this is stopped for going round in circles. Null leaves the
	machine's own thresholds.
	"""
	repetitionDetection: RepetitionDetection
	"""
	What this blueprint would like to run without being asked. A request rather
	than a grant: the machine's own policy decides, and this is what an
	operator reads when deciding whether to write it in.
	"""
	safeCommands: SafeCommands
	"""
	The shape this blueprint's answer takes, unless a stage narrows it.
	"""
	output: OutputSpec
	"""
	How this blueprint's context maps onto another's, for a handoff to a
	different blueprint.
	"""
	transforms: [ContextTransform!]!
}

"""
A paged listing of the installed blueprints.
"""
type BlueprintConnection {
	"""
	The blueprints on this page.
	"""
	edges: [BlueprintEdge!]!
	"""
	Keyset page state.
	"""
	pageInfo: PageInfo!
	"""
	How many blueprints are installed.
	"""
	total: Int!
	"""
	Names from an `exact` fetch that are not installed. Never fails the
	request.
	"""
	missing: [String!]!
}

"""
One thing a blueprint needs.
"""
type BlueprintDependency {
	"""
	A short name, unique within the blueprint.
	"""
	name: String!
	"""
	What kind of thing it is. Which of the fields below is set follows from
	this.
	"""
	kind: DependencyKind!
	"""
	Whether the spawn fails when it is missing. False makes a miss a warning
	the run goes past.
	"""
	required: Boolean!
	"""
	A sentence telling the person how to satisfy it, shown wherever the miss
	is reported.
	"""
	remedy: String
	"""
	One line on why the blueprint needs it.
	"""
	description: String
	"""
	How it can be installed, when the blueprint says.
	"""
	install: DependencyInstall
	"""
	The server that must be configured, for an MCP dependency.
	"""
	server: String
	"""
	The variables that server needs set, for an MCP dependency.
	"""
	env: [String!]!
	"""
	The variable that must be set, for an environment dependency.
	"""
	var: String
	"""
	The program that must resolve on the path, for a binary dependency.
	"""
	command: String
	"""
	The script that decides, for a script dependency.
	"""
	check: String
}

"""
One installed blueprint with its page cursor.
"""
type BlueprintEdge {
	"""
	The blueprint.
	"""
	node: Blueprint!
	"""
	Cursor for this edge.
	"""
	cursor: Cursor!
}

"""
Which installed blueprints a listing is about.

Every field set has to hold, so a filter object is an `and` of its own
fields. `and`, `or` and `not` take filters of this same type.
"""
input BlueprintFilter {
	"""
	Every one of these has to match.
	"""
	and: [BlueprintFilter!]
	"""
	At least one of these has to match. An empty list matches no blueprint,
	which is what an alternation with no alternatives selects.
	"""
	or: [BlueprintFilter!]
	"""
	This must not match.
	"""
	not: BlueprintFilter
	"""
	Case-insensitive prefix match on the blueprint name, for a search box.
	The same thing as `name: { startsWith: }`, spelled shorter.
	"""
	query: String
	"""
	The blueprint's name, which is also its key: one name is one installed
	blueprint.
	"""
	name: StringFilter
	"""
	Exactly these names.
	
	Passed on the filter a request makes rather than inside a combinator,
	this also says which blueprints to read, and a name nothing is
	installed under lands in `missing` instead of failing the request.
	"""
	names: [String!]
	"""
	The version the manifest declares.
	"""
	version: StringFilter
	"""
	The description the manifest declares.
	"""
	description: StringFilter
}

"""
Which installed blueprint an operation is about.

The `name` it is installed under, and optionally the `digest` of the
revision the caller means. Nothing else: a reference says which blueprint,
and an operation that also needs a manifest's text takes that text as an
argument of its own.
"""
input BlueprintInput {
	"""
	The installed blueprint's name.
	"""
	name: String!
	"""
	The revision the caller believes is installed, as the lowercase hex
	SHA-256 on `Blueprint.digest`.
	
	Optional, and worth sending: a digest that does not match the installed
	manifest fails the request rather than acting on a revision the caller
	has not seen.
	"""
	digest: String
}

"""
One row of the mime registry, as a blueprint writes it.

Every field but the key is optional, because a row says only what it
changes: a row that names a family and nothing else leaves the rest to
whatever broader row already covers the type.
"""
type BlueprintMimeRow {
	"""
	The type or pattern this row covers: `image/png`, or `image/*`.
	"""
	mimeType: String!
	"""
	What providers key their encoders on.
	"""
	family: String
	"""
	Whether the bytes are text, and so may travel inline and reach any model
	as text.
	"""
	isText: Boolean
	"""
	How the part's tokens are estimated.
	"""
	tokens: MimeTokenRates
	"""
	Extensions that imply this type, without the dot.
	"""
	extensions: [String!]!
	"""
	A hex prefix that identifies the bytes.
	"""
	magic: String
	"""
	What a consumer that cannot take this type sees in the part's place.
	"""
	standIn: String
	"""
	A script the bytes must pass before they are stored as this type. An
	empty string lifts a check a broader row put on the type.
	"""
	check: String
}

"""
What this level asks of the taint layer.
"""
type BlueprintSecurity {
	"""
	Whether content that came from outside is followed through the run, so a
	tool call carrying it can be held.
	"""
	taintTracking: TaintTracking!
}

"""
Where a blueprint was read from.
"""
enum BlueprintSource {
	"""
	The run's own copy, written at spawn: what the run executed, whatever
	the installed file says now.
	"""
	SNAPSHOT
	"""
	The installed file. For a run, this means it kept no snapshot, so the
	file may have changed since it ran.
	"""
	INSTALLED
}

"""
Comparisons on one boolean field.

Two fields rather than one because `ne` reads as itself beside every other
filter in the schema. `eq: false` and `ne: true` select the same runs.
"""
input BooleanFilter {
	"""
	Exactly this.
	"""
	eq: Boolean
	"""
	Anything but this.
	"""
	ne: Boolean
}

"""
A tool compiled into this build of Leviath.
"""
type BuiltinTool implements Tool {
	"""
	The name the model calls it by.
	"""
	name: String!
	"""
	What it does, in the words the model is given.
	"""
	description: String!
	"""
	The JSON Schema of its arguments.
	"""
	arguments: JSON!
	"""
	Always `BUILTIN`.
	"""
	origin: ToolOrigin!
}

"""
An export job, as a client polls it.
"""
type BulkExport implements Node {
	"""
	The job's id, which `bulkExport` and `node` both take. Unique to this
	server: the jobs live in memory, so nothing answers to it after a
	restart.
	"""
	id: ID!
	"""
	Where it has got to: `queued`, `running`, `complete` or `failed`.
	"""
	status: String!
	"""
	How many runs have been written.
	"""
	written: Int!
	"""
	Why it failed, when it did.
	"""
	error: String
	"""
	A short-lived signed link to the JSONL. Null until the export is
	complete, because there is nothing to fetch before then.
	"""
	downloadUrl: String
}

"""
Whether an attempt's exact request is in the journal, and where it went if
not.

Each value describes the state of the record rather than the intent behind
it: a body that is here can be read, a body that was never taken cannot be
recovered, and a body that was taken and then removed is a different fact
from one that never existed.
"""
enum CaptureStatus {
	"""
	The request is on this record, as the provider adapter received it.
	"""
	RETAINED
	"""
	Capture was off for this run, so no body was ever taken. Everything else
	on `modelInput` still describes the attempt.
	"""
	NOT_CAPTURED
	"""
	A body was captured and then deliberately scrubbed.
	"""
	REDACTED
	"""
	A body was captured and then aged out.
	"""
	EXPIRED
}

"""
Arguments for the `check_agent` tool.
"""
type CheckAgentArgs {
	"""
	The agent asked about, by its live id.
	"""
	agentId: String!
}

"""
One `check_agent` call.
"""
type CheckAgentCall implements ToolCall {
	"""
	Tool name, exactly as the model called it.
	"""
	toolName: String!
	"""
	What the tool does, as this build describes it.
	"""
	toolDescription: String
	"""
	The arguments as the model sent them, untouched. The typed
	form beside this is a reading of it, not a replacement.
	"""
	rawArguments: JSON!
	"""
	The call's arguments.
	"""
	args: CheckAgentArgs!
}

"""
One page of a run's direct children.
