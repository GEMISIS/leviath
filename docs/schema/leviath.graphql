	"""
	Its name, unique within that kind and the directory it came from.
	"""
	name: String!
	"""
	Where it was found: the directory kind this script was read from.
	"""
	foundAt: String!
	"""
	The blueprint whose directory it came from, for a blueprint-scoped
	script.
	"""
	blueprint: String
