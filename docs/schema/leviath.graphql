"""
The whole write side: the acts on runs and blueprints, plus the ones
`--allow-admin` opens.

Merged rather than nested, so an admin mutation reads the same as every
other mutation to a client that is allowed to use it, and does not exist to
a client that is not.

Every field takes one argument named `request` and answers with a result
carrying what it changed. Nothing inside a result is a failure: a refusal is
a GraphQL error, and its `extensions.code` is the thing to branch on, from
this vocabulary.

| `code` | `httpStatus` | Means |
|---|---|---|
| `BAD_USER_INPUT` | 400 | The request is wrong as written: a negative `maxDepth`, an empty filter on a destructive sweep, an unknown export field. Sending it again unchanged fails the same way. |
| `FORBIDDEN` | 403 | This server is configured to refuse it: a workdir outside `--workdir-root`, an unattended run on a `--no-remote-yolo` server, an attachment path outside the working directory. |
| `NOT_FOUND` | 404 | Nothing by that name, or nothing in the state the act needs: an unknown run id, a blueprint that is not installed. |
| `CONFLICT` | 409 | It exists and its state refuses the change: a finished run cannot be paused, a stale digest pin cannot write. |
| `PAYLOAD_TOO_LARGE` | 413 | An attachment is over this server's `max_upload_bytes`. |
| `UNPROCESSABLE` | 422 | The request is well formed and something on disk will not answer, such as a `yolo.toml` that does not parse. |
| `UPSTREAM` | 502 | Something this server depends on answered badly. Retrying may well work. |
| `DAEMON_INCOMPATIBLE` | 502 | The daemon was updated under a running `lev serve`. Restart the server. |
| `DAEMON_UNAVAILABLE` | 503 | The daemon could not be reached. |
| `INTERNAL` | 500 | Something failed that the caller did nothing wrong to cause. |
"""
type Mutation {
	"""
	Park a run.
	
	Read `run.status` on the way back: `PAUSED` means the pause landed.
	A finished run is a `CONFLICT`, never a silent no-op.
	"""
	pauseRun(
		"The run to pause."
		request: PauseRunRequest!
	): PauseRunResult!
	"""
	Park every run a filter names.
	
	A run that had already finished is reported under `skipped` rather than
	failing the sweep. An empty filter names every run on this machine and
	is refused.
	"""
	pauseRuns(
		"The runs to pause."
		request: PauseRunsRequest!
	): PauseRunsResult!
	"""
	Resume a paused run.
	
	Read `run.status`: `RUNNING` means it is moving again.
	"""
	resumeRun(
		"The run to resume."
		request: ResumeRunRequest!
	): ResumeRunResult!
	"""
	Resume every paused run a filter names.
	
	A run that is not parked is reported under `skipped`. An empty filter
	names every run on this machine and is refused.
	"""
	resumeRuns(
		"The runs to resume."
		request: ResumeRunsRequest!
	): ResumeRunsResult!
	"""
	Cancel a run, and its sub-agents with it.
	
	Read `run.status`: `CANCELLED` means the cancel landed. A run that had
	already finished is a `CONFLICT`, which tells a client the difference
	between "you stopped it" and "it was over before you asked".
	"""
	cancelRun(
		"The run to cancel."
		request: CancelRunRequest!
	): CancelRunResult!
	"""
	Cancel every run a filter names, and their sub-agents with them.
	
	A run that was already over is reported under `skipped`. An empty filter
	names every run on this machine and is refused.
	"""
	cancelRuns(
		"The runs to cancel."
		request: CancelRunsRequest!
	): CancelRunsResult!
	"""
	Start a run.
	
	Answers with the run itself, so a client renders the new row without a
	second request. `warnings` names checks the blueprint declared that this
	request's own output shape retires.
	
	The refusals are the server's, not the daemon's: a workdir outside
	`--workdir-root`, an unattended run on a `--no-remote-yolo` server, an
	attachment outside the working directory, or a callback URL the outbound
	policy will not allow.
	"""
	spawnRun(
		"Everything about the new run."
		request: SpawnRunRequest!
	): SpawnRunResult!
	"""
	Send a message to a run that is going.
	
	Whether it lands is the daemon's call: a stage that declared
	`accepts_messages = false`, or a finished run, does not take one, and the
	refusal says that rather than claiming the run does not exist.
	"""
	sendMessage(
		"The run, the words, and anything to send with them."
		request: SendMessageRequest!
	): SendMessageResult!
	"""
	Delete run records.
	
	Deleting a run takes its sub-agents with it: their records only mean
	anything under the run that started them. A live run is skipped rather
	than removed, and deleting a record is not editing a run, so a finished
	one is fair game. An empty filter names every run on this machine and is
	refused.
	"""
	deleteRuns(
		"The runs to delete."
		request: DeleteRunsRequest!
	): DeleteRunsResult!
	"""
	Install a blueprint.
	
	A name that is already installed is a `CONFLICT`: replacing somebody's
	blueprint is what `updateBlueprint` is for, and doing it silently here
	is how a blueprint disappears without anybody asking for it.
	"""
	createBlueprint(
		"The name to install it under, and the manifest text."
		request: CreateBlueprintRequest!
	): CreateBlueprintResult!
	"""
	Replace an installed blueprint.
	
	The name is the key and does not change. A `digest` on the reference
	pins the revision being replaced, so two clients editing one blueprint
	cannot silently overwrite each other. Runs already spawned keep their own
	snapshot of what they executed, so this never rewrites history.
	"""
	updateBlueprint(
		"Which blueprint to replace, and what with."
		request: UpdateBlueprintRequest!
	): UpdateBlueprintResult!
	"""
	Uninstall a blueprint.
	
	Runs that used it keep their own copy of the manifest, so their history
	is unaffected: `run.blueprint` still answers. A name nothing is installed
	under is `NOT_FOUND`.
	"""
	deleteBlueprint(
		"The installed blueprint to remove."
		request: DeleteBlueprintRequest!
	): DeleteBlueprintResult!
	"""
	Answer a pending ask.
	
	The first answer wins. A second answer to the same request is not an
	error on the client's part: two people clicking one prompt is ordinary,
	and it reads as `ALREADY_SETTLED` rather than as a failure.
	"""
	answerInteraction(
		"The ask, and exactly one answer of the kind it takes."
		request: AnswerInteractionRequest!
	): AnswerInteractionResult!
	"""
	Export the run store to a file, and hand back the job.
	
	Paging ten thousand runs through a connection is two hundred requests,
	and a client that wants everything wants it once. This returns
	immediately; poll `runExport(id:)` and fetch `downloadUrl` when it is
	complete.
	
	The filter is the run listing's own, so a client builds the predicate
	once and uses it for both. `fields` narrows each row, and an unknown name
	is refused rather than dropped: a column quietly missing from an export
	is discovered downstream, by somebody else.
	"""
	startRunExport(
		"Which runs to export, and which fields to keep."
		request: StartRunExportRequest!
	): StartRunExportResult!
	"""
	Re-read what the providers serve, and answer with the catalogue.
	
	The one write that changes nothing a run can see: `models` is a query and
	stays side-effect free, so going and asking is a mutation.
	"""
	refreshModels(
		"Which provider to go and ask."
		request: RefreshModelsRequest!
	): RefreshModelsResult!
	"""
	Add an MCP server to the config.
	
	Remote code execution by construction: the command written here is what
	Leviath spawns, for this run and every future one. That is why the whole
	group is behind a flag rather than behind the API token alone.
	"""
	createMcpServer(
		"The server to write."
		request: CreateMcpServerRequest!
	): CreateMcpServerResult!
	"""
	Replace an MCP server's configuration, whole.
	
	Whole rather than field by field: the entry is what gets spawned, and an
	edit that left half of a previous transport behind would describe a
	server nobody wrote.
	"""
	updateMcpServer(
		"The server, named by the name it is already under."
		request: UpdateMcpServerRequest!
	): UpdateMcpServerResult!
	"Remove an MCP server from the config, and its stored credential with it."
	deleteMcpServer(
		"The server to remove."
		request: DeleteMcpServerRequest!
	): DeleteMcpServerResult!
	"""
	Add or update one row of the mime registry.
	
	Every field but the key is optional, because a row says only what it
	changes: what a field leaves out stays as whatever broader row already
	covers the type.
	"""
	upsertMimeRow(
		"The row to write."
		request: UpsertMimeRowRequest!
	): UpsertMimeRowResult!
	"""
	Remove a row from the mime registry.
	
	A key nothing has a row for is a miss: the caller named a row, and
	there was none to take out.
	"""
	deleteMimeRow(
		"The row to remove."
		request: DeleteMimeRowRequest!
	): DeleteMimeRowResult!
	"""
	Change the machine's config.
	
	A partial edit in four parts: `set` names the settings to change,
	`clear` the ones to take back to nothing, `providers` the per-provider
	settings, and the two gateway lists what to add and what to remove.
	What none of them mentions is left alone. Every refusal happens before
	anything is written, so a request that is going to fail leaves the file
	as it was.
	"""
	updateConfig(
		"What to change."
		request: UpdateConfigRequest!
	): UpdateConfigResult!
	"""
	Write a Rhai script.
	
	Remote code execution by construction, like adding an MCP server: what is
	written here is what a run then executes. The answer says whether it
	compiles, so an editor does not have to save and wait for a run to fail.
	"""
	upsertScript(
		"The script to write, and what to put in it."
		request: UpsertScriptRequest!
	): UpsertScriptResult!
	"Remove a script."
	deleteScript(
		"The script to remove."
		request: DeleteScriptRequest!
	): DeleteScriptResult!
	"""
	Run the diagnostics that reach the network.
	
	The plain `doctor` field answers from the config alone. This one asks a
	provider whether a key works and the daemon whether it is there, which
	costs a few seconds and is why it is a mutation rather than a field: it is
	an act with a cost, and one runs at a time.
	
	The one mutation with no request, because there is nothing to say: the
	checks are the checks.
	"""
	checkMachine: CheckMachineResult!
	"""
	Make one directory, so a picker can offer "New Folder" rather than one
	that refuses.
	
	The three refusals are told apart on purpose: a path outside
	`--workdir-root`, a parent that is not there, and a name already taken are
	three different things to show somebody.
	"""
	createDirectory(
		"Where to make it, and what to call it."
		request: CreateDirectoryRequest!
	): CreateDirectoryResult!
	"""
	Start a self-update, and hand back the job.
	
	Answers before the work is done, because the work is a download and an
	install: a request held open for a package manager is a console showing a
	spinner it made up. Poll `updateJob(id:)`, or watch the live frames. One
	update at a time: two package-manager upgrades of the same binary racing
	each other is not a state worth debugging.
	"""
	startUpdate(
		"Which steps to run. Omitted means all of them."
		request: StartUpdateRequest!
	): StartUpdateResult!
	"""
	Sign in to a subscription provider.
	
	Answers as soon as there is a URL to go to, because what happens after
	that is the person's business: they open it, approve, and the flow lands
	the grant. Read `providers` to see whether it did.
	
	The browser has to be on the serving host. The flow listens on a loopback
	port there, so a browser anywhere else cannot complete it, and one sign-in
	runs at a time because a second could not bind that port.
	"""
	signInProvider(
		"The provider to sign in to."
		request: SignInProviderRequest!
	): SignInProviderResult!
	"""
	Forget a provider's stored sign-in.
	
	The config is untouched: signing out is not turning the provider off, and
	doing both would surprise anybody who meant to sign in again.
	"""
	signOutProvider(
		"The provider to forget."
		request: SignOutProviderRequest!
	): SignOutProviderResult!
	"""
	Ask a provider whether the stored sign-in works.
	
	It asks the account rather than reading a table, so a green answer means
	the subscription really did agree, and the models are what that account may
	use. That costs a request, which is why this is a mutation.
	"""
	checkProvider(
		"The provider to ask."
		request: CheckProviderRequest!
	): CheckProviderResult!
	"""
	Connect to an MCP server and list what it advertises.
	
	The only honest answer to "does this server work": a config that parses
	proves nothing about a program that will not start.
	"""
	checkMcpServer(
		"The server to connect to."
		request: CheckMcpServerRequest!
	): CheckMcpServerResult!
	"""
	Sign in to an MCP server that wants OAuth.
	
	`NOT_REQUIRED` is a success, not a failure: the question was whether a
	sign-in was needed, and the answer is no. Opens a browser on the serving
	host, like the provider sign-in.
	"""
	signInMcpServer(
		"The server to sign in to."
		request: SignInMcpServerRequest!
	): SignInMcpServerResult!
	"""
	Ask an OpenAI-compatible endpoint what models it serves.
	
	Makes this host open a connection to an address the caller names, which is
	the same act as checking an MCP server, and it exists to precede writing a
	gateway for it: a person picks a default from what the endpoint really
	serves rather than typing a model id and hoping.
	"""
	checkEndpoint(
		"Where to look, and what to send."
		request: CheckEndpointRequest!
	): CheckEndpointResult!
	"""
	Write one yolo profile.
	
	The whole profile, because a profile is a grant of permissions: an edit
	that left half of a previous list behind would describe a set of rules
	nobody wrote. Only that one table of `yolo.toml` is touched, so comments
	and formatting around it survive; the comments inside the table being
	written do not.
	
	The whole file is checked before anything is written, so a save that
	would leave the set unloadable is refused rather than discovered at the
	next spawn.
	"""
	upsertYoloProfile(
		"The profile to write."
		request: UpsertYoloProfileRequest!
