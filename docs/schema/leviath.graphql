enum RegionKind {
	"Stays in the prompt verbatim."
	PINNED
	"The default. Cleared or dropped as the window fills."
	TEMPORARY
	"Emptied by an edge transform or an explicit clear."
	CLEARABLE
	"Keeps the newest entries."
	SLIDING_WINDOW
	"Summarized by the compaction model as it fills."
	COMPACTING
	"Keeps compacted summaries of its own past."
	COMPACT_HISTORY
	"Key-value entries with admission control."
	HASHMAP
	"Open and done items a gate can require empty."
	CHECKLIST
	"Behaviour defined by a Rhai script under `context_hooks/`."
	CUSTOM
}

"Exact and set tests on `RegionKind` (PINNED, TEMPORARY, CLEARABLE, SLIDING_WINDOW, COMPACTING, COMPACT_HISTORY, HASHMAP, CHECKLIST, CUSTOM)."
input RegionKindFilter {
	"Exactly this value."
	eq: RegionKind
	"Anything but this value."
	ne: RegionKind
	"One of these values."
	in: [RegionKind!]
	"None of these values."
	notIn: [RegionKind!]
	"Match where there is no value at all."
	isNull: Boolean
}

"Quantified tests over a list of `RegionOutput`."
input RegionListInput {
	"At least one item matches."
	some: RegionInput
	"Every item matches."
	every: RegionInput
	"No item matches."
	none: RegionInput
	"Match where there is no list at all."
	isNull: Boolean
}

