"""
The whole write side: the acts on runs and blueprints, plus the ones
`--allow-admin` opens.

Merged rather than nested, so `mutation { addMcpServer(...) }` reads the
same as every other mutation to a client that is allowed to use it, and does
not exist to a client that is not.
"""
type Mutation {
	"""
	Park a run.
	
	Read `run.status` on the way back: `PAUSED` means the pause landed.
	A finished run is a `CONFLICT`, never a silent no-op.
	"""
	pauseRun(
		"""
		The run to pause.
		"""
		runId: String!
	): RunPayload!
	"""
	Resume a paused run.
	
	Read `run.status`: `RUNNING` means it is moving again.
	"""
	resumeRun(
		"""
		The run to resume.
		"""
		runId: String!
	): RunPayload!
	"""
	Start a run.
	
	Answers with the run itself, so a client renders the new row without a
	second request. `warnings` names checks the blueprint declared that this
	request's own output shape retires.
	
	The refusals are the server's, not the daemon's: a workdir outside
	`--workdir-root`, an unattended run on a `--no-remote-yolo` server, or a
	callback URL the outbound policy will not allow, each answer `FORBIDDEN`.
	"""
	spawnRun(
		"""
		Everything about the new run.
		"""
		input: SpawnRunInput!
	): RunPayload!
	"""
	Send a message to a run that is going.
	
	Whether it lands is the daemon's call: a stage that declared
	`accepts_messages = false`, or a finished run, does not take one, and the
	refusal says that rather than claiming the run does not exist.
	"""
	sendMessage(
		"""
		The run to message.
		"""
		runId: String!,
		"""
		What to say to it.
		"""
		message: String!,
		"""
		Deliver into this context region instead of the default one.
		"""
		targetRegion: RegionInput
	): RunPayload!
	"""
	Install a blueprint.
	
	A name that is already installed is a `CONFLICT`: replacing somebody's
	blueprint is what `updateBlueprint` is for, and doing it silently here
	is how a blueprint disappears without anybody asking for it.
	"""
	createBlueprint(
		"""
		The name to install it under.
		"""
		name: String!,
		"""
		The manifest text.
		"""
		manifest: String!
	): Blueprint!
	"""
	Replace an installed blueprint.
	
	The name is the key and does not change. Runs already spawned keep their
	own snapshot of what they executed, so this never rewrites history.
	"""
	updateBlueprint(
		"""
		Which installed blueprint to replace.
		"""
		name: String!,
		"""
		The replacement manifest text.
		"""
		manifest: String!
	): Blueprint!
	"""
	Uninstall a blueprint.
	
	Runs that used it keep their own copy of the manifest, so their history
	is unaffected: `run.blueprint` still answers.
	"""
	deleteBlueprint(
		"""
		The installed blueprint to remove.
		"""
		name: String!
	): Boolean!
	"""
	Export the run store to a file, and hand back the job.
	
	Paging ten thousand runs through a connection is two hundred requests,
	and a client that wants everything wants it once. This returns
	immediately; poll `bulkExport(id:)` and fetch `downloadUrl` when it is
	complete.
	
	The filter is the run listing's own, so a client builds the predicate
	once and uses it for both. `fields` narrows each row, and an unknown name
	is refused rather than dropped: a column quietly missing from an export
	is discovered downstream, by somebody else.
	"""
	bulkExportRuns(
		"""
		Which runs to export. Omitted means all of them.
		"""
		filter: RunFilter,
		"""
		Which top-level run fields to keep in each row.
		"""
		fields: [String!]
	): BulkExport!
	"""
	Delete run records.
	
	Takes exactly one of `ids` or `before`. Neither is a client that failed
	to build its query, and both at once is two predicates for one act, so
	each is refused rather than resolved one way.
	
	Deleting a run takes its sub-agents with it: their records only mean
	anything under the run that started them. A live run is skipped rather
	than removed, and deleting a record is not editing a run, so a finished
	one is fair game.
	"""
	deleteRuns(
		"""
		Exactly these runs.
		"""
		ids: [String!],
		"""
		Every finished run last touched before this second.
		"""
		before: Timestamp,
		"""
		Delete a run whose record cannot be read, which cannot be shown to be finished.
		"""
		force: Boolean! = false
	): DeletePayload!
	"""
	Answer a pending ask.
	
	The first answer wins. A second answer to the same request is not an
	error on the client's part: two people clicking one prompt is ordinary,
	and it reads as `accepted: false` rather than as a failure.
	"""
	answerInteraction(
		"""
		Exactly one answer, of the kind the request takes.
		"""
		input: AnswerInteractionInput!
	): InteractionPayload!
	"""
	Cancel a run, and its sub-agents with it.
	
	Read `run.status`: `CANCELLED` means the cancel landed. A run that had
	already finished is a `CONFLICT`, which tells a client the difference
	between "you stopped it" and "it was over before you asked".
	"""
	cancelRun(
		"""
		The run to cancel.
		"""
		runId: String!
	): RunPayload!
	"""
	Add an MCP server to the config.
	
	Remote code execution by construction: the command written here is what
	Leviath spawns, for this run and every future one. That is why the whole
	group is behind a flag rather than behind the API token alone.
	"""
	addMcpServer(
		"""
		Unique server name.
		"""
		name: String!,
		"""
		The command, for a stdio server.
		"""
		command: String,
		"""
		The URL, for an HTTP server.
		"""
		url: String,
		"""
		Arguments for a stdio server.
		"""
		args: [String!],
		"""
		Headers sent with every request to an HTTP server. An `Authorization` header here is a credential, so the server needs no separate sign-in.
		"""
		headers: [EnvEntryInput!]
	): Boolean!
	"""
	Remove an MCP server from the config.
	"""
	removeMcpServer(
		"""
		The server to remove.
		"""
		name: String!
	): Boolean!
	"""
	Add or update one row of the mime registry.
	
	Every field but the key is optional, because a row says only what it
	changes: what a field leaves out stays as whatever broader row already
	covers the type.
	"""
	putMimeRow(
		"""
		The row to write.
		"""
		row: MimeRowInput!
	): MimeRowWritten!
	"""
	Remove a row from the mime registry.
	
	False when there was no such row, which is a fact about the registry
	rather than a failed request.
	"""
	deleteMimeRow(
		"""
		The row to remove.
		"""
		mimeType: String!
	): Boolean!
	"""
	Change the machine's config.
	
	A partial edit: a field left out leaves the setting alone, `null` clears
	it, and a value sets it. An empty string is refused rather than read as a
	clear, because a form that posts its empty box should be told rather than
	obeyed. Every refusal happens before anything is written, so a request
	that is going to fail leaves the file as it was.
	"""
	updateConfig(
		"""
		What to change.
		"""
		input: ConfigInput!
	): Config!
	"""
	Write a Rhai script.
	
	Remote code execution by construction, like adding an MCP server: what is
	written here is what a run then executes. The answer says whether it
	compiles, so an editor does not have to save and wait for a run to fail.
	"""
	putScript(
		"""
		Which registry: tool, region_hook, stage_hook, output_validator, mime_check or provider.
		"""
		kind: String!,
		"""
		Its name, unique within that kind.
		"""
		name: String!,
		"""
		The script's source.
		"""
		content: String!,
		"""
		The blueprint whose directory it belongs to, for a blueprint-scoped script.
		"""
		blueprint: String
	): ScriptWritten!
	"""
	Remove a script.
	"""
	deleteScript(
		"""
		Which registry it belongs to.
		"""
		kind: String!,
		"""
		The script to remove.
		"""
		name: String!,
		"""
		The blueprint whose directory it is in.
		"""
		blueprint: String
	): Boolean!
	"""
	Run the diagnostics that reach the network.
	
	The plain `doctor` field answers from the config alone. This one asks a
	provider whether a key works and the daemon whether it is there, which
	costs a few seconds and is why it is a mutation rather than a field: it is
	an act with a cost, and one runs at a time.
	"""
	runDoctorLive: DoctorReport!
	"""
	Make one directory, so a picker can offer "New Folder" rather than one
	that refuses.
	
	The three refusals are told apart on purpose: a path outside
	`--workdir-root`, a parent that is not there, and a name already taken are
	three different things to show somebody.
	"""
	makeDirectory(
		"""
		The existing directory to make it in, absolute.
		"""
		path: String!,
		"""
		One directory name, not a path.
		"""
		name: String!
	): MadeDirectory!
	"""
	Start a self-update, and hand back the job.
	
	Answers before the work is done, because the work is a download and an
	install: a request held open for a package manager is a console showing a
	spinner it made up. Poll `updateJob(id:)`, or watch the live frames. One
	update at a time: two package-manager upgrades of the same binary racing
	each other is not a state worth debugging.
	"""
	startUpdate(
		"""
		Upgrade the binary.
		"""
		binary: Boolean! = true,
		"""
		Install the bundled blueprints.
		"""
		blueprints: Boolean! = true,
		"""
		Respell keys that changed name in your own blueprints.
		"""
		keys: Boolean! = true,
		"""
		Apply the config migrations.
		"""
		migrations: Boolean! = true
	): UpdateJob!
	"""
	Sign in to a subscription provider.
	
	Answers as soon as there is a URL to go to, because what happens after
	that is the person's business: they open it, approve, and the flow lands
	the grant. Read `providers` to see whether it did.
	
	The browser has to be on the serving host. The flow listens on a loopback
	port there, so a browser anywhere else cannot complete it, and one sign-in
	runs at a time because a second could not bind that port.
	"""
	providerSignIn(
		"""
		The provider, by name.
		"""
		provider: String!
	): SignInStarted!
	"""
	Forget a provider's stored sign-in.
	
	The config is untouched: signing out is not turning the provider off, and
	doing both would surprise anybody who meant to sign in again.
	"""
	providerSignOut(
		"""
		The provider, by name.
		"""
		provider: String!
	): Boolean!
	"""
	Ask a provider whether the stored sign-in works.
	
	It asks the account rather than reading a table, so a green answer means
	the subscription really did agree, and the models are what that account may
	use. That costs a request, which is why this is a mutation.
	"""
	checkProvider(
		"""
		The provider, by name.
		"""
		provider: String!
	): [String!]!
	"""
	Connect to an MCP server and list what it advertises.
	
	The only honest answer to "does this server work": a config that parses
	proves nothing about a program that will not start.
	"""
	testMcpServer(
		"""
		The server, by name.
		"""
		name: String!
	): [String!]!
	"""
	Sign in to an MCP server that wants OAuth.
	
	`NOT_REQUIRED` is a success, not a failure: the question was whether a
	sign-in was needed, and the answer is no. Opens a browser on the serving
	host, like the provider sign-in.
	"""
	loginMcpServer(
		"""
		The server, by name.
		"""
		name: String!
	): McpLoginStatus!
	"""
	Ask an OpenAI-compatible endpoint what models it serves.
	
	Makes this host open a connection to an address the caller names, which is
	the same act as testing an MCP server, and it exists to precede writing a
	gateway for it: a person picks a default from what the endpoint really
	serves rather than typing a model id and hoping.
	"""
	probeModels(
		"""
		Where the endpoint is.
		"""
		baseUrl: String!,
		"""
		Its API key, when it wants one. Used for this one call and dropped: never written to the config, and this server logs no request body, so it reaches nothing on disk.
		"""
		apiKey: String,
		"""
		Extra headers the request carries.
		"""
		headers: [EnvEntryInput!]
	): [String!]!
	"""
	Replace the yolo profiles file.
	
	The whole file, because the file is the unit: `--yolo=<name>` names a
	profile inside it and the profiles refer to each other, so writing one at a
	time would let a save leave the set inconsistent. Parsed before it is
	written, so a file that would not load is refused rather than saved and
	discovered at the next spawn.
	"""
	putYoloProfiles(
		"""
		The whole file, as TOML.
		"""
		text: String!
	): YoloProfiles!
}

"""
Anything this schema can hand back from its id alone.

The id is globally unique: no two nodes of any type share one, so a client
may cache by id alone and `node` needs no type from the caller.
"""
interface Node {
	"""
	This node's id, unique across every type that implements `Node`.
	"""
	id: ID!
}

"""
What happens when a model answers with text before calling any tool.

Each field cascades on its own, so a level that sets only `max` inherits the
policy and the text. Unset everywhere, the nudge fires, except for a stage
with checkpoints, whose text is its work product.
"""
type NudgeConfig {
	"""
	Whether the nudge fires.
	"""
	policy: NudgePolicy!
	"""
	How many text-only answers are nudged before the text is taken as final.
	"""
	max: Int
	"""
	The nudge itself. `{stage}` and `{regions}` are filled in.
	"""
	text: String
}

"""
Whether a stage is sent back round when it answers with text instead of
calling a tool.
"""
enum NudgePolicy {
	"""
	Take the level above.
	"""
	INHERIT
	"""
	Send it back round with the nudge.
	"""
	NUDGE
	"""
	Take the text as the answer.
	"""
	NEVER_NUDGE
}

"""
One open ask, with the run it is parked on.
"""
type OpenInteraction {
	"""
	The run waiting for this answer.
	"""
	runId: String!
	"""
	What is being asked.
	"""
	request: InteractionRequest!
}

"""
One file the output is expected to carry.

A slot rather than a file: this is what the blueprint asked for, and a run's
`artifacts` is what it produced.
"""
type OutputArtifact {
	"""
	The name the run hands it back under.
	"""
	name: String!
	"""
	The mime type or pattern it must be.
	"""
	mimeType: String!
	"""
	Whether the output is incomplete without it.
	"""
	required: Boolean!
	"""
	One line on what it should contain, shown to the model.
	"""
	description: String
}

"""
What a stage must produce before it may transition.
"""
type OutputRequirement {
	"""
	How many times the stage is asked again when it tries to leave without
	having submitted. After that the transition proceeds anyway and the
	run's `outputForced` counter records it: a missing answer never strands
	a run.
	"""
	reasks: Int!
}

"""
Where the parts a stage produces are written, by mime pattern.
"""
type OutputRoute {
	"""
	The mime pattern this rule matches: `image/png`, `image/*` or `*/*`. The
	most specific match wins.
	"""
	pattern: String!
	"""
	The region matching parts are written to.
	
	Null where no layout in this blueprint declares that name, which is a
	route whose parts would land nowhere: `lev validate` refuses it and the
	daemon will not spawn it. `regionName` carries the name either way.
	"""
	region: Region
	"""
	The region name the route was written with, verbatim.
	"""
	regionName: String!
}

"""
The shape an output must take.

Declaring a shape does not by itself demand an output: that is
`outputRequirement` on the stage. This says what the answer has to look like
when it comes.
"""
type OutputSpec {
	"""
	The format asked for, such as `json` or `markdown`.
	"""
	format: String
	"""
	What to tell the model about the answer wanted.
	"""
	instructions: String
	"""
	An example answer, shown to the model.
	"""
	example: String
	"""
	A JSON Schema the answer must satisfy.
	"""
	schema: JSON
	"""
	A script that checks the answer, beyond the schema.
	"""
	validator: String
	"""
	What happens when that script refuses an answer. Null leaves the default,
	which is to refuse the output and ask again.
	"""
	onValidatorError: ValidatorErrorPolicy
	"""
	Whether an artifact may replace a file of the same name in the working
	directory.
	"""
	overwriteArtifacts: Boolean
	"""
	The files the answer is expected to carry.
	"""
	artifacts: [OutputArtifact!]!
}

"""
Keyset page state.
"""
type PageInfo {
	"""
	Whether another page follows this one.
	"""
	hasNextPage: Boolean!
	"""
	Pass as `after` to get it.
	"""
	endCursor: Cursor
}

"""
Arguments for the `present_for_review` tool.
"""
type PresentForReviewArgs {
	"""
	The short title shown above the review prompt.
	"""
	title: String!
	"""
	The document presented, as markdown.
	"""
	markdown: String!
}

"""
One `present_for_review` call.
"""
type PresentForReviewCall implements ToolCall {
	"""
	Tool name, exactly as the model called it.
	"""
	toolName: String!
	"""
	What the tool does, as this build describes it.
	"""
	toolDescription: String
	"""
	The arguments as the model sent them, untouched. The typed
	form beside this is a reading of it, not a replacement.
	"""
	rawArguments: JSON!
	"""
	The call's arguments.
	"""
	args: PresentForReviewArgs!
}

"""
One provider this machine can reach.
"""
type Provider {
	"""
	The registry name a blueprint would use.
	"""
	id: String!
	"""
	The name to show.
	"""
	display: String!
	"""
	Whether the config has it turned on.
	
	Separate from `signedIn`: the two are set by different routes, and
	either can be true on its own.
	"""
	enabled: Boolean!
	"""
	Whether a credential is stored for it.
	"""
	signedIn: Boolean!
	"""
	The account, when the credential names one.
	"""
	account: String
	"""
	The subscription tier, when the credential names one.
	"""
	plan: String
	"""
	When the access token lapses.
	
	Not a deadline for anybody: it is refreshed well before this. It is
	here so a console can show the session is live rather than implying
	somebody must act.
	"""
	expiresAt: Timestamp
}

"""
The whole read side: runs and their history, the blueprints and tools
installed on this machine, and what the daemon itself is doing.

Start from `runs` to find work, and from `node(id:)` when you already hold
an id: anything this schema gives an id to comes back from there, whatever
type it is. Reading never changes a run, so a query is safe to repeat and
safe to poll.
"""
type Query {
	"""
	The blueprints installed on this machine, by name.
	
	This is the live definition, not what any run executed: for that, read
	`blueprint` on the run, which answers from the run's own snapshot. The
	digests tell you whether the two are the same bytes.
	
	`filter.names` fetches blueprints by name. A name that is not installed
	lands in `missing` rather than failing the request.
	
	Keyset-paged on the name, which is the order the catalogue is read in.
	A cursor names where you got to, so a blueprint installed or removed
	mid-walk cannot make a page skip or repeat one.
	"""
	blueprints(
		"""
		Which blueprints to list. Omitted means all of them.
		"""
		filter: BlueprintFilter,
		"""
		Page size; capped by the server's page-size cap.
		"""
		first: Int! = 50,
		"""
		Cursor from the previous page's pageInfo.
		"""
		after: Cursor
	): BlueprintConnection!
	"""
	How this server is configured, with every secret left out.
	
	Read `capabilities` before choosing a code path. A 404 also means "no
	such run", so discovering a feature by being refused costs a round trip
	and tells you less.
	"""
	config: Config!
	"""
	Environment and configuration diagnostics.
	
	A failing check is `ok: false` inside a healthy answer, never an error:
	the request to run the checks succeeded, and what they found is the
	answer.
	"""
	doctor: DoctorReport!
	"""
	The MCP servers this machine has configured.
	"""
	mcpServers: [McpServer!]!
	"""
	The yolo profiles, and the file they are read from.
	"""
	yoloProfiles: YoloProfiles!
	"""
	The operator's mime registry, before any blueprint's own rows.
	"""
	mime: [MimeRow!]!
	"""
	The scripts this machine has registered.
	"""
	scripts(
		"""
		Only this blueprint's own scripts, plus the global ones.
		"""
		blueprint: BlueprintInput
	): [Script!]!
	"""
	The directories under a path, for a file picker.
	
	Confined to `--workdir-root` when the operator set one, which is also
	why `parent` is null at that fence rather than leading above it.
	"""
	directories(
		"""
		The directory to list. Omitted means this server's own.
		"""
		path: String,
		"""
		Include hidden directories.
		"""
		hidden: Boolean! = false
	): Directory!
	"""
	Every model this machine can route to.
	
	Answered from the catalogue this server keeps, so it costs no provider
	call. Two providers can serve the same model id and bill to different
	places, so `provider` is part of each answer rather than something a
	client infers.
	"""
	models(
		"""
		Only this provider's models.
		"""
		provider: String,
		"""
		Refresh this server's catalogue from the providers before answering, instead of answering from what it already holds. Slower, and it changes nothing a later request would not see anyway.
		"""
		refresh: Boolean! = false
	): [Model!]!
	"""
	The providers this machine can reach, configured or not.
	
	`enabled` and `signedIn` are different questions with different
	answers: a provider can be turned on with no credential stored, and a
	credential can outlive the config entry that used it.
	"""
	providers: [Provider!]!
	"""
	The tools a run on this machine can call.
	
	Scoped to one blueprint's own directory when `blueprint` names one,
	which is what an editor offering an `available_tools` list wants.
	"""
	tools(
		"""
		Scope to this blueprint's own tools directory.
		"""
		blueprint: BlueprintInput
	): ToolInventory!
	"""
	Who is on the other end of the control socket.
	
	A read this server answers from what it already knows, so it works while
	the daemon is down: that is the point of asking. `connected` false does
	not mean requests fail, it means the live frames have stopped.
	"""
	daemon: DaemonStatus!
	"""
	Whether the daemon is still recording what its runs do.
	
	Null when the daemon cannot be reached, because this is the daemon's own
	reading and no other copy of it exists - `daemon.reachable` says whether
	that is why. Everything else about a run is read from disk and keeps
	working while the daemon is down; this does not.
	
	Worth asking on any page that shows runs as healthy. A daemon whose
	journal is refusing writes serves every field here exactly as it did
	before, and a run whose journal record cannot be written is failed rather
	than carried on.
	"""
	journal: JournalHealth
	"""
	What an update would do, and whether there is anything newer to get.
	
	Planning never reaches the network. The "is there anything newer" half is
	whatever the last check found, and asking starts another one for whoever
	asks next rather than waiting on one here, so this is cheap enough for a
	page to ask every time it opens.
	"""
	update: UpdateInfo!
	"""
	Anything with a globally unique id, from that id alone.
	
	For a client that holds an id and no type: a webhook payload, a cache
	key, a link somebody pasted. Ask for the fields on `Node` and narrow
	with `... on Run { }` for the rest.
	
	How an id routes, in order. An id tagged `mcpServer:`, `yoloProfile:` or
	`script:` names that kind of thing; a tag this server does not know
	answers null. An id carrying an `@` is a blueprint revision. Anything
	else is a minted id, and the two job registries are asked before the run
	store, which is the only one of the three that reads a file.
	
	Null rather than an error for an id that names nothing: a deleted run, an
	expired export and a typo are the same answer, and all three mean the
	thing is not here. A read that could not answer the question at all, such
	as a config file that will not parse, fails the way the listing it would
	have come from fails.
	
	`Model` is not a `Node`, because a model id is the provider's own and two
	providers can serve the same one; read `models` and key on provider and
	id together.
	"""
	node(
		"""
		The id, as whatever holds it spelled it.
		"""
		id: ID!
	): Node
	"""
	One update run, by id.
	
	Null when no job carries that id. The last few runs are kept, so an
	operator reading back after the fact finds the job rather than nothing.
	"""
	updateJob(
		"""
		The job's id.
		"""
		id: String!
	): UpdateJob
	"""
	Poll an export this server started.
	
	Null when no export carries that id: it was never started, or it has
	expired. An export's file is kept for an hour, and its record goes with
	the file, so neither outlives the other.
	"""
	bulkExport(
		"""
		The export job's id.
		"""
		id: String!
	): BulkExport
	"""
	Every open ask across every run: the approval inbox.
	
	The daemon holds these in memory, so this is one read rather than a walk
	of the run store. Each entry names the run it is parked on, which is
	what a client needs to show the row it belongs to.
	"""
	openInteractions: [OpenInteraction!]!
	"""
	Keyset-paged run listing.
	
	`filter.ids` fetches exact runs, which is also how a client reads one
	run: `runs(filter: { ids: ["..."] })`. An id that names nothing lands
	in `missing` rather than failing the request, so one dead id in a batch
	of fifty does not cost the other forty-nine.
	"""
	runs(
		"""
		Which runs to list. Omitted means all of them.
		"""
		filter: RunFilter,
		"""
		Page size; capped by the server's page-size limit.
		"""
		first: Int! = 50,
		"""
		Cursor from the previous page's pageInfo.
		"""
		after: Cursor
	): RunConnection!
	"""
	Check a manifest without installing it.
	
	A failing check is a report, not an error: the request to validate
	succeeded, and what it found is the answer.
	"""
	validateBlueprint(
		"""
		The manifest text to check.
		"""
		content: String!,
		"""
		Check the text as this installed blueprint, so its own scripts resolve.
		"""
		name: String
	): ValidationReport!
	"""
	Whether a provider key looks like one of that provider's.
	
	Format only: nothing is dialled and nothing is written, which is what
	makes it safe to run on every keystroke of a form. `checkProvider` is
	the one that asks the account.
	"""
	validateConfigKey(
		"""
		The provider the key is for.
		"""
		provider: String!,
		"""
		The key to look at. Never stored, never logged.
		"""
		key: String!,
		"""
		A gateway's address, checked first when given.
		"""
		baseUrl: String
	): KeyVerdict!
	"""
	Whether a script compiles, without writing it.
	
	The alternative was saving it and waiting for a run to fail, which is
	not much of an improvement on editing the file over SSH. Ungated:
	compiling text in memory writes nothing and runs nothing, because every
	compiler here stops at the syntax tree.
	"""
	validateScript(
		"""
		Which registry the script is for.
		"""
		kind: String!,
		"""
		The source to compile.
		"""
		content: String!,
		"""
		Hook functions it has to define, for a stage or region hook.
		"""
		hooks: [String!]
	): ScriptVerdict!
	"""
	What one yolo profile would do with one call.
	
	The same code path `lev yolo test` runs, so the command and the API cannot
	disagree about a call. Decides and reports; nothing is run.
	"""
	testYoloProfile(
		"""
		The call to decide about.
		"""
		call: YoloTestInput!
	): YoloDecision!
}

"""
Arguments for the `read_file` tool.
"""
type ReadFileArgs {
	"""
	Path to the file, relative to the working directory.
	"""
	path: String!
}

"""
One `read_file` call.
"""
type ReadFileCall implements ToolCall {
	"""
	Tool name, exactly as the model called it.
	"""
	toolName: String!
	"""
	What the tool does, as this build describes it.
	"""
	toolDescription: String
	"""
	The arguments as the model sent them, untouched. The typed
	form beside this is a reading of it, not a replacement.
	"""
	rawArguments: JSON!
	"""
	The call's arguments.
	"""
	args: ReadFileArgs!
}

"""
Arguments for the `read_files` tool.
"""
type ReadFilesArgs {
	"""
	The file paths, relative to the working directory.
	"""
	paths: [String!]!
}

"""
One `read_files` call.
"""
type ReadFilesCall implements ToolCall {
	"""
	Tool name, exactly as the model called it.
	"""
	toolName: String!
	"""
	What the tool does, as this build describes it.
	"""
	toolDescription: String
	"""
	The arguments as the model sent them, untouched. The typed
	form beside this is a reading of it, not a replacement.
	"""
	rawArguments: JSON!
	"""
	The call's arguments.
	"""
	args: ReadFilesArgs!
}

"""
One named slice of context a blueprint declares: what it is for, how large
it may grow, and what it gives up when it fills.

A blueprint's context window is cut into regions so that a stage can carry
one part of what it knows and compact or empty another. This is the
declaration only. What a live run's region holds is `ContextRegion`, and
the two are read separately on purpose.
"""
type Region {
	"""
	Region name, unique within the layout that declares it.
	"""
	name: String!
	"""
	The stage whose own `[context.regions]` declares this region. Null for a
	region the blueprint declares run-wide, which is every region in
	`Blueprint.regions`.
	
	A stage may declare a layout of its own, and a name resolved from
	anywhere in the manifest can land in one of those. This says where the
	declaration was read from, so a client can tell a run-wide region from
	one only a single stage sets up.
	"""
	declaredByStage: Stage
	"""
	What the region does when it fills.
	"""
	kind: RegionKind!
	"""
	Hard token ceiling for the region, as resolved for this layout.
	
	A region whose budget is a share of the window carries the share in
	`budgetPercent`, and this number is what that resolved to against the
	layout's own window.
	"""
	maxTokens: Int!
	"""
	The share of the model's context window this region claims, as a
	percentage. Null when the region names a fixed ceiling instead.
	"""
	budgetPercent: Float
	"""
	The floor a percentage budget resolves no lower than, so a small-context
	model does not starve the region.
	"""
	minTokens: Int
	"""
	The ceiling a percentage budget resolves no higher than, so a share of a
	very large window does not balloon.
	"""
	budgetMaxTokens: Int
	"""
	One line on what this region is for.
	"""
	description: String
	"""
	Whether the run may not proceed while this region is empty.
	"""
	required: Boolean!
	"""
	Shown when a required region is empty. `{region}` is filled in.
	"""
	requiredMessage: String
	"""
	Whether the description is also shown to the model, above the region's
	contents.
	"""
	describeInPrompt: Boolean!
	"""
	Whether an edge that compacts the context may hand this region to the
	summarizer.
	"""
	summarizable: Boolean!
	"""
	How much the contents move between requests, which is what decides where
	the region sits in the assembled prompt and so what the prompt cache can
	keep.
	"""
	volatility: RegionVolatility!
	"""
	What happens to a write that does not fit.
	"""
	admission: RegionAdmission!
	"""
	The fraction of the budget at which a compacting region compacts.
	"""
	compactAt: Float
	"""
	The mime patterns this region takes as parts. Empty means anything.
	"""
	accepts: [String!]!
	"""
	What fills this region before the first inference. Null means it starts
	empty, for the run to fill.
	"""
	seed: RegionSeed
	"""
	The most entries a sliding region keeps.
	"""
	maxItems: Int
	"""
	How a sliding region makes room. Null for every other kind.
	"""
	strategy: RegionStrategy
	"""
	How many entries over its ceiling a bulk eviction waits for.
	"""
	overflow: Int
	"""
	How many of the oldest entries one compaction pass takes.
	"""
	compactCount: Int
	"""
	The token count at which a compacting region compacts.
	"""
	thresholdTokens: Int
	"""
	The compacting region whose summaries land here.
	
	Null for every kind but `COMPACT_HISTORY`, and also where the name this
	region was given is one no layout in the blueprint declares, which is a
	history region nothing will ever write to. Read `sourceRegionName` to
	tell those two apart.
	"""
	sourceRegion: Region
	"""
	The name this region's `source_region` was given, verbatim.
	
	Null for every kind but `COMPACT_HISTORY`. Set beside a null
	`sourceRegion` when the name matches no layout in the blueprint.
	"""
	sourceRegionName: String
	"""
	The most keys a key-value region holds.
	"""
	maxEntries: Int
	"""
	The Rhai script that owns this region, for a custom one.
	"""
	script: String
	"""
	Whether a custom region is never evicted, like a pinned one, rather than
	first out, like a temporary one. Null for every other kind.
	"""
	pinned: Boolean
}

"""
What happens to a write that does not fit.
"""
enum RegionAdmission {
	"""
	The oldest entries roll off to make room.
	"""
	EVICT
	"""
	The write is refused, and what is there stays.
	"""
	REJECT
}

"""
A region and the fewest entries it must hold.
"""
type RegionEntryRequirement {
	"""
	The region counted.
	
	Null where no layout in this blueprint declares that name.
	`regionName` carries the name either way.
	"""
	region: Region
	"""
	The region name the gate wrote, verbatim.
	"""
	regionName: String!
	"""
	The fewest entries that satisfy the gate.
	"""
	atLeast: Int!
}

"""
One context region, by name.

An object rather than a string so a region reads the same on the way in as it
does on the way out, and so a later field can be added to it without changing
the argument's type.
"""
input RegionInput {
	"""
	The region's name, as the blueprint declares it.
	"""
	name: String!
}

"""
What a region does when it fills.

One value per kind the daemon recognises. The manifest accepts `hashmap`
and `hash_map` for the same kind, which is a spelling the TOML takes; the
API has one name for one thing.
"""
enum RegionKind {
	"""
	Stays in the prompt verbatim.
	"""
	PINNED
	"""
	The default. Cleared or dropped as the window fills.
	"""
	TEMPORARY
	"""
	Emptied by an edge transform or an explicit clear.
	"""
	CLEARABLE
	"""
	Keeps the newest entries.
	"""
	SLIDING_WINDOW
	"""
	Summarized by the compaction model as it fills.
	"""
	COMPACTING
	"""
	Keeps compacted summaries of its own past.
	"""
	COMPACT_HISTORY
	"""
	Key-value entries with admission control.
	"""
	HASHMAP
	"""
	Open and done items a gate can require empty.
	"""
	CHECKLIST
	"""
	Behaviour defined by a Rhai script under `context_hooks/`.
	"""
	CUSTOM
}

"""
One region's route into another blueprint's layout.

Both regions are names. Each belongs to a blueprint the mapping names rather
than to this one, and the receiving blueprint has to be installed for the
handoff to happen at all, so neither side has a declaration to read here.
"""
type RegionMapping {
	"""
	The region it comes from, by name in the handing-off blueprint.
	"""
	fromRegion: String!
	"""
	The region it goes to, by name in the receiving blueprint.
	"""
	toRegion: String!
	"""
	What happens to the content on the way. Null leaves it verbatim.
	"""
	transform: MappingTransform
	"""
	The fields kept, for an `EXTRACT` transform. Empty for the others.
	"""
	fields: [String!]!
}

"""
The most one region reached while a stage was active.
"""
type RegionPeak {
	"""
	The region's name.
	"""
	region: String!
	"""
	The most tokens it held while this stage was active.
	"""
	tokens: Int!
}

"""
What fills a region before the first inference.

A region with no seed starts empty and is filled by the run. A union rather
than one object with a field per source: a seed has exactly one source, and a
bag of nullable fields would admit combinations no manifest can express.
"""
union RegionSeed = SeedFromCaller | SeedFromGlob | SeedFromFiles | SeedFromLiteral | SeedFromScript | SeedFromCommand | SeedFromTools

"""
Seed text for one context region at spawn.
"""
input RegionSeedInput {
	"""
	The region to seed.
	"""
	region: RegionInput!
	"""
	The text it starts with.
	"""
	text: String!
}

"""
How a sliding region makes room.

It decides more than eviction: `PER_ITEM` shifts the prompt's prefix every
turn, which costs the prompt cache, while the other two keep it still
between eviction events.
"""
enum RegionStrategy {
	"""
	One entry at a time, as soon as the region is over.
	"""
	PER_ITEM
	"""
	Nothing until the region is `overflow` entries over, then back down to
	its ceiling in one go.
	"""
	BULK
	"""
	The oldest entries are summarized into one, `compactCount` at a time.
	"""
	COMPACT
}

"""
What one committed change did to one region.

No content: the window recorded on the same tick already holds the text, so
repeating it here would double the journal to say nothing new. The digests are
what tell you whether you need to go and read it - `digestBefore` equal to
`digestAfter` means this region ended the transaction holding exactly what it
started with.
"""
type RegionTransition {
	"""
	The region this part of the transaction touched, by the name it carries
	in the run's window.
	
	A name rather than a `Region`, because the window is not the manifest.
	The runtime carries `conversation`, `tool_results`, `final_output` and
	`stage_instructions` whether a blueprint declares them or not, and those
	are the regions that move most, so a manifest lookup would answer nothing
	for the common case. Join on `contextHistory`'s `ContextRegion.name` for
	what the region held, and on `blueprint { regions { name } }` for what
	the author declared.
	"""
	region: String!
	"""
	A content address of what it held before the change. Compare it with
	`digestAfter`, and with the same region in another transaction; nothing
	else is promised about the value.
	
	Null on a change a build that recorded one region at a time wrote, which
	digested nothing.
	"""
	digestBefore: String
	"""
	A content address of what it held afterwards. Null on the same changes.
	"""
	digestAfter: String
	"""
	What it held before, in tokens. Null on a change that recorded only how
	the count moved.
	"""
	tokensBefore: BigInt
	"""
	What it held afterwards. Null on the same changes.
	"""
	tokensAfter: BigInt
	"""
	How its token count moved. Negative when the region shrank.
	"""
	tokenDelta: BigInt!
	"""
	How many entries it held before. Null on a change that recorded only the
	counts it moved.
	"""
	entriesBefore: Int
	"""
	How many it held afterwards. Null on the same changes.
	"""
	entriesAfter: Int
	"""
	Entries the change itself pushed. Not derivable from the counts either
	side: a write into a full sliding region leaves the count where it was.
	"""
	entriesAdded: Int!
	"""
	Entries that left, including any eviction the change itself triggered.
	"""
	entriesRemoved: Int!
}

"""
How much a region's contents move between requests.

A prompt cache keys on an unchanged prefix, so this is what decides where a
region sits in the assembled prompt.
"""
enum RegionVolatility {
	"""
	Written once and left alone.
	"""
	STABLE
	"""
	Appended to, keeping what is already there.
	"""
	GROWS
	"""
	Replaced wholesale.
	"""
	REWRITTEN
}

"""
When a run is stopped for going round in circles.

For the degenerate read loop: the same call again and again, or a long run of
read-only calls with nothing produced between them.
"""
type RepetitionDetection {
	"""
	Whether detection runs. Null inherits, and unset everywhere it is on.
	"""
	enabled: Boolean
	"""
	How many times one call with one set of arguments may repeat before a
	nudge.
	"""
	maxRepeatCalls: Int
	"""
	How many read-only calls may run in a row with nothing produced between
	them.
	"""
	maxReadonlyStreak: Int
}

"""
What went out on one attempt, in the little of it worth keeping.

Two attempts carrying the same digest sent the same request, which is the
question a retry raises: the same provider refusing repeatedly reads
differently from a request that kept changing underneath the run. No bodies,
because a digest that grew with the prompt would put a copy of the whole
window in the journal once per retry.
"""
type RequestDigest {
	"""
	The assembled system prefix, as an opaque lowercase-hex digest. Compare
	it between attempts; nothing else is promised about the value.
	"""
	systemHash: String!
	"""
	How many conversation messages went out.
	"""
	messages: Int!
	"""
	How many tools the request advertised.
	"""
	tools: Int!
	"""
	The completion budget it asked for.
	"""
	maxTokens: Int!
	"""
	The sampling temperature it asked for.
	"""
	temperature: Float!
}

"""
What the retry loop did after an attempt failed.
"""
enum RetryDecision {
	"""
	Nothing. The failure went back to the run, either because it was
	permanent or because the attempts and the backoff budget were spent.
	"""
	REPORTED
	"""
	The same provider and model again, after a wait. The next attempt's
	`backoffMs` says how long that wait really was.
	"""
	SAME_MODEL
	"""
	The same provider and model again, at once, with every file the request
	named uploaded afresh because the provider said one of them was gone. It
	spends no wait and none of the retry budget, so it is the one case where
	two attempts can share a `backoffMs` of zero.
	"""
	RENEWED_FILES
}

"""
One execution of a blueprint: the work itself, from the task it was given
to whatever it finally produced.

The `id` is the handle everything else in this API names a run by, and it
outlives the run: a finished run is still readable, with its stages, its
spend, its tool calls and the context it was holding. A run that spawns
sub-agents is the `parent` of their runs, so a whole tree hangs off one id.

Every duration on a run is measured against the moment the request was
answered, so the numbers in one response agree with each other rather than
each being taken at its own instant.
"""
type Run implements Node {
	"""
	Globally unique run id, and the id every REST route names this run by.
	"""
	id: ID!
	"""
	The name of the blueprint this run was spawned from.
	"""
	blueprintName: String!
	"""
	Human title, set by the titling pass; null until it lands.
	"""
	title: String
	"""
	Why titling failed, when it did.
	"""
	titleError: String
	"""
	The lifecycle state: the filter and subscription vocabulary.
	"""
	status: RunStatus!
	"""
	Present only when the status is `ERROR`.
	"""
	error: String
	"""
	The initial ask this run was given.
	"""
	task: String!
	"""
	Inference turns in the current stage, reset on entering a new one.
	"""
	iteration: Int!
	"""
	How many tool calls the run has made.
	
	A count, not the calls themselves: `executions` is the list, with what
	each one was and how it ended.
	"""
	toolCallCount: Int!
	"""
	Unix epoch seconds, as the daemon stores it.
	"""
	startedAt: Timestamp!
	"""
	Last state change, unix epoch seconds.
	"""
	updatedAt: Timestamp!
	"""
	When the run last actually moved. Age a wedged run against this.
	"""
	lastProgressAt: Timestamp
	"""
	Seconds since `startedAt`, wall-clock.
	"""
	ageSecs: BigInt!
	"""
	Seconds actually working, parked time excluded.
	"""
	workingSecs: BigInt!
	"""
	The working span in progress; null while the clock is stopped.
	"""
	active: WorkingClock
	"""
	Token roll-up for the whole run.
	"""
	usage: TokenUsage!
	"""
	Spend roll-up for the whole run.
	"""
	cost: CostBreakdown!
	"""
	Whether the run was spawned unattended, so approvals resolve without
	a person.
	"""
	unattended: Boolean!
	"""
	The yolo profile this run was spawned with, when it named one.
	"""
	yoloProfileName: String
	"""
	The working directory the run executes in.
	"""
	workdir: String!
	"""
	The run that spawned this one; null for a top-level run.
	"""
	parentId: String
	"""
	The blueprint this run executed.
	
	The run's own snapshot of the manifest, taken at spawn, so it answers
	for the run even after the installed blueprint is edited or deleted.
	For a run recorded before snapshots existed there is no copy, and this
	falls back to the installed file: `blueprint.source` says which, and
	`blueprintDigest` is set only for a run that carries its own.
	
	Null, with an error naming the file, when neither can be read. Nullable
	on purpose: one unreadable blueprint in a page of fifty runs must not
	cost a client the other forty-nine.
	"""
	blueprint: Blueprint
	"""
	The digest of the manifest this run executed, lowercase hex SHA-256.
	
	Recorded at spawn. Compare it with the installed blueprint's digest to
	tell "this run executed what is installed now" from "this run executed
	something else". Null for a run recorded before snapshots existed,
	where the answer is unknown rather than "the same".
	"""
	blueprintDigest: String
	"""
	Why this run is parked, and what would unblock it.
	
	Present only while the status is `WAITING_INPUT`. A run waiting on a
	person also carries the prompt itself; a run parked on its own workers
	carries only this, and needs nobody.
	"""
	waitReason: WaitReason
	"""
	Post-hoc diagnostics: an empty or degraded run told from a healthy one
	without reading logs.
	"""
	flags: RunFlags!
	"""
	The run's stage ledger: what each stage cost, and how often it ran.
	
	Bounded by the blueprint's stage count, so it is a list rather than a
	connection. Read from the run's own `stages.json` only when selected.
	Null, with an error, when that file will not read: one run's broken
	ledger must not cost a client the page around it.
	"""
	stages: [StageRecord!]
	"""
	The run's context window as it stands right now.
	
	Null for a run that has not written one yet, and for a finished run
	whose window was never persisted. Region contents are their own field,
	so asking for the shape of the window does not read its text.
	"""
	context: ContextWindow
	"""
	The answer this run submitted. Null until something is submitted.
	"""
	finalOutput: FinalOutput
	"""
	This run's direct children, paged.
	
	A connection rather than an array: a two-hundred-worker fan-out would
	otherwise be one unbounded response. Nest the field to walk deeper, one
	level per nesting, and read `pageInfo.hasNextPage` to see a level that
	was cut. For a flat read of a whole subtree, `runs(filter: { parent: })`
	is the same walk one page at a time.
	"""
	children(
		"""
		Page size for this level.
		"""
		first: Int! = 50,
		"""
		How many of this run's children to skip.
		"""
		skip: Int! = 0
	): ChildConnection!
	"""
	How deep and how wide this run's sub-agent tree is, without walking it.
	
	The roll-up covers the whole subtree, which is the figure a fan-out is
	judged by: a parent that spent little and whose fifty workers spent a
	great deal is not a cheap run.
	"""
	treeStatus: RunTreeStatus!
	"""
	A stage's logs.
	
	`stageIndex` picks one stage, `allStages` reads every stage in order, and
	neither reads more than `tail` bytes from the end of each stream. The cap
	is the server's, because `allStages` multiplies whatever the client asks
	for by the stage count.
	
	Empty is not null: a stage that has written nothing, an index no stage
	answers to and a file this server cannot read all read as no text.
	"""
	logs(
		"""
		One stage by index; omitted means the stage the run is on now.
		"""
		stageIndex: Int,
		"""
		Every stage's logs in order, instead of one stage's.
		"""
		allStages: Boolean! = false,
		"""
		Read the operational log rather than the output stream.
		"""
		operational: Boolean! = false,
		"""
		Bytes to read from the end of each stream.
		"""
		tailBytes: Int
	): String!
	"""
	The binary parts this run holds.
	
	Metadata only: the bytes are behind each entry's `url`, a short-lived
	signed link the byte route verifies. Bytes never ride a query answer,
	and a page can put that link straight into an `<img src>`.
	"""
	blobs: [BlobEntry!]
	"""
	The files this run handed back beside its answer.
	
	Same as `blobs`: metadata here, bytes behind a signed link.
	"""
	artifacts: [Artifact!]!
	"""
	A short-lived signed link to one file in this run's working directory.
	
	The byte route verifies the signature, so this works in an `<img src>` or
	a download link, where a header cannot be set. It is good for a few
	minutes and for that one path.
	
	Minted without resolving the path, so a file this run never wrote is a
	404 from the byte route rather than nothing here.
	"""
	fileUrl(
		"""
		The file, relative to the run's working directory.
		"""
		path: String!,
		"""
		Offer it as a download rather than inline.
		"""
		download: Boolean! = false
	): String!
	"""
	The run that started this one. Null for a run nobody started.
	
	A lookup in the index's own map rather than a read: the parent is already
	in memory, so walking up a fan-out costs nothing per level.
	"""
	parent: Run
	"""
	The stage the run is in, by name and position. Null before the first
	stage is entered.
	"""
	currentStage: CurrentStage
	"""
	What the run is parked on, if anything. Null when nothing is waiting.
	
	The daemon holds these in memory, so this is one round trip to it rather
	than a read of the run store. A run in `WAITING_INPUT` whose ask has just
	been answered by somebody else answers null, which is the truth by then.
	"""
	interaction: InteractionRequest
	"""
	The run's files: what it recorded changing, or what is in its working
	directory now.
	
	Two different questions. `MODIFIED` is the run's own record, which is
	free but capped at record time and a claim about the run rather than about
	the disk. `WORKDIR` is the truth, one directory level per request: that
	bound is the answer to a repository with a `node_modules` in it.
	"""
	files(
		"""
		The directory to list. Null lists the working directory's root.
		"""
		path: String,
		"""
		Which question to answer.
		"""
		source: FileSource! = MODIFIED,
		"""
		Include dot-prefixed entries.
		"""
		hidden: Boolean! = false
	): FileListing!
	"""
	One window of one of the run's files, as text.
	
	At most a megabyte per read, because the answer travels inside this one.
	A larger file is read a window at a time: pass `nextOffset` back as
	`offset`, and the windows concatenate into the file. For bytes rather than
	text, and for anything that is not text at all, mint a `fileUrl` instead.
	"""
	fileContent(
		"""
		The file, relative to the run's working directory.
		"""
		path: String!,
		"""
		Byte offset to start at.
		"""
		offset: Int! = 0
	): FileWindow!
	"""
	What this run did: every attempt at every tool call, in order, paged.
	
	Read from the run's journal, so it holds the attempts a context window no
	longer shows: a call a gate refused, one that failed and was reissued, one
	a restart cut off. Results are not on the page; each execution fetches its
	own, because one result can be a whole file.
	"""
	executions(
		"""
		Page size.
		"""
		first: Int! = 50,
		"""
		Cursor from the previous page.
		"""
		after: Cursor
	): ToolExecutionConnection!
	"""
	Every question this run put to a person and got an outcome for, in the
	order it asked them, paged.
	
	The only record that this run stopped for somebody. `executions` says
	what the run tried; this says what it needed a person for, and what
	came back - including a scope that only ever lived here, since a
	granted approval reads no differently from a call no policy ever
	stopped once the tool has read it.
	
	A question is written down when it settles, so one the run is parked on
	right now is not here yet: `interaction` carries that one while it is
	open. A run reading as `WAITING_INPUT` with nothing on its last page has
	asked something nobody has answered, rather than asked nothing.
	
	Empty for an unattended run, which asks nobody: `--yolo` answers before
	the question reaches a person, so an empty list on a run that plainly
	did something dangerous means exactly that.
	"""
	interactions(
		"""
		Page size.
		"""
		first: Int! = 50,
		"""
		Cursor from the previous page.
		"""
		after: Cursor
	): InteractionConnection!
	"""
	Every trip this run made to a provider, in the order it made them,
	paged.
	
	What `usage` and `cost` cannot say. They are per call that worked, so a
	call refused three times and answered on the fourth is billed once and
	reads here as the four trips it was. Each entry names the provider and
	model asked, how the attempt ended, what the loop did next, and how long
	the run waited before it; `failover` carries the move where the stage gave
	up on a provider.
	
	Empty for a run whose journal holds no attempt records.
	"""
	inferences(
		"""
		Page size.
		"""
		first: Int! = 50,
		"""
		Cursor from the previous page.
		"""
		after: Cursor
	): InferenceAttemptConnection!
	"""
	Every committed change to this run's context window, in the order they
	landed, paged.
	
	`contextHistory` serves the window snapshots: what every region held at
	each point. This serves the changes: which path through the runtime moved
	the window, so a region that lost its plan to a compaction reads
	differently from one a stage-edge transform cleared and one the model
	deleted. No content, since the snapshot on the same tick already holds the
	text.
	
	Each entry is one transaction, which may touch several regions, and names
	the window's revision either side of it - so `contextSnapshot` takes you
	to exactly what it started from and what it produced.
	
	Empty for a run whose journal holds no change records, and for writes
	whose path cannot name a cause.
	"""
	contextChanges(
		"""
		Page size.
		"""
		first: Int! = 50,
		"""
		Cursor from the previous page.
		"""
		after: Cursor
	): ContextChangeConnection!
	"""
	Snapshots of this run's context window over the run, paged.
	
	What the window held at each point, not why it changed: `contextChanges`
	is the reasons. Each point here carries a whole window, so this is paged
	harder than the run listing is: ask for the regions you render rather
	than every point's every region. Chronological by default, which is also
	the cheaper direction to read.
	"""
	contextHistory(
		"""
		Page size.
		"""
		first: Int! = 50,
		"""
		Cursor from the previous page.
		"""
		after: Cursor,
		"""
		Newest first instead of chronological.
		"""
		descending: Boolean! = false
	): ContextHistoryConnection!
	"""
	One window this run held, by its revision.
	
	A historical read, and an immutable one: a revision is derived from a
	window's contents and the journal it is looked up in is append-only, so
	this resolves to exactly the content the revision was minted from. No
	later write can change what a revision means, and asking for one can never
	answer with what the run holds now - `context` is the field for that.
	
	Take a revision from `ContextChange.revisionBefore` or `revisionAfter` to
	see the window either side of a change, or from `ContextWindow.revision`.
	
	Null when this run never held that window, which is also what a revision
	from another run looks like. Where the run held the same content more than
	once, this is the first time it did; the content is identical either way.
	"""
	contextSnapshot(
		"""
		The window's revision.
		"""
		revision: String!
	): ContextSnapshotPoint
	"""
	A short-lived signed link to one stored part's bytes.
	
	The same kind of link `fileUrl` mints, and minted without asking the
	store whether the hash is held. `blobs` carries one per part already and
	nulls it for bytes that are gone; this is for a hash a client holds, and
	for the download form of a part it is showing inline.
	"""
	blobUrl(
		"""
		The part, by content hash.
		"""
		sha256: String!,
		"""
		Offer it as a download rather than inline.
		"""
		download: Boolean! = false
	): String!
	"""
	A short-lived signed link to one artifact's bytes.
	
	Minted without reading what the run produced, so an unknown name is a
	404 from the byte route rather than nothing here.
	"""
	artifactUrl(
		"""
		The artifact, by name.
		"""
		name: String!,
		"""
		Offer it as a download rather than inline.
		"""
		download: Boolean! = false
	): String!
	"""
	Whether `sendMessage` reaches this run where it stands.
	
	Read from the stage the run is in, so it is the answer for now rather than
	for the blueprint as a whole. Null when the run's blueprint cannot be read:
	unknown is not the same as no, and a console that greyed out its box on a
	failed read would be wrong half the time.
	"""
	acceptsMessages: Boolean
	"""
	Caller-supplied metadata from spawn. Values are always strings.
	
	Labels for whoever started the run, such as a ticket or a tenant. They
	are searched by `filter.query` and read back unchanged, and nothing in
	the run reads them: not a typed extension point.
	
	Sorted by key: the daemon keeps these in a hash map, and a listing
	whose order changes between two identical requests is a diff nobody
	can read.
	"""
	metadata: [MetadataEntry!]!
}

"""
A run reached a terminal status.
"""
type RunCompleted {
	"""
	The run.
	"""
	runId: String!
	"""
	The agent's live id.
	"""
	agentId: String!
	"""
	The terminal status.
	"""
	status: String!
	"""
	The run's error, when that is how it ended.
	"""
	error: String
	"""
	The answer it submitted, when there is one.
	"""
	finalOutput: CompletedOutput
}

"""
A keyset-paged run listing.
"""
type RunConnection {
	"""
	The runs on this page.
	"""
	edges: [RunEdge!]!
	"""
	Keyset page state.
	"""
	pageInfo: PageInfo!
	"""
	How many runs matched. Null when `scanTruncated` is true: a count from
	a partial scan is not a fact.
	"""
	total: Int
	"""
	True when the search gave up before covering the store.
	"""
	scanTruncated: Boolean!
	"""
	Ids from an `ids` fetch that name no run here. Never fails the request.
	"""
	missing: [String!]!
	"""
	Daemon time when the page was built. Pass it back as `since` to poll.
	"""
	serverTime: Timestamp!
}

"""
One run with its page cursor and its match highlights.
"""
type RunEdge {
	"""
	The run.
	"""
	node: Run!
	"""
	Cursor for this edge.
	"""
	cursor: Cursor!
	"""
	Why this run matched a search; empty when there was no search.
	"""
	highlights: [Highlight!]!
}

"""
One frame off the daemon broadcast.
"""
union RunEvent = RunSpawned | RunStatusChanged | RunRenamed | TokensUpdated | ContextUpdated | StageTransition | ToolCallStarted | ToolCallFinished | LogLine | RunSpend | InteractionNeeded | RunCompleted | DaemonLinkChanged | ConfigHealthChanged | UpdateProgress | UpdateFinished | EventsDropped

"""
One frame type off the daemon broadcast.

Subscribe with the types you render. Each value names the union member it
selects for, so a client reads one vocabulary for the filter and for the
frames it gets back.
"""
enum RunEventType {
	"""
	A run spawned.
	"""
	RUN_SPAWNED
	"""
	A run's status, stage or counters moved.
	"""
	RUN_STATUS_CHANGED
	"""
	A run got its title.
	"""
	RUN_RENAMED
	"""
	Token usage ticked up.
	"""
	TOKENS
	"""
	Context window totals moved.
	"""
	CONTEXT_UPDATE
	"""
	The run entered a new stage.
	"""
	STAGE_TRANSITION
	"""
	A tool call began.
	"""
	TOOL_CALL_STARTED
	"""
	A tool call finished.
	"""
	TOOL_CALL_FINISHED
	"""
	One log line.
	"""
	LOG
	"""
	Spend crossed a threshold.
	"""
	RUN_SPEND
	"""
	A run parked on a prompt somebody has to answer.
	"""
	INTERACTION_NEEDED
	"""
	A run reached a terminal status.
	"""
	RUN_COMPLETED
	"""
	The serving daemon's identity or link state changed.
	"""
	DAEMON_LINK
	"""
	The config file's health changed.
	"""
	CONFIG_HEALTH
	"""
	A self-update step moved.
	"""
	UPDATE_PROGRESS
	"""
	A self-update finished.
	"""
	UPDATE_FINISHED
	"""
	This subscription fell behind and frames were dropped.
	"""
	EVENTS_DROPPED
}

"""
Which runs a listing is about.

Every field set has to hold, so a filter object is an `and` of its own
fields. `and`, `or` and `not` take filters of this same type, so a client
composes whatever predicate it needs rather than waiting for a field that
spells it.

`query`, `queryIn`, `sort` and `ascending` describe the listing rather than
a run, so they are read from the filter a request passes and refused inside
a combinator, where there is no one listing for them to describe.
"""
input RunFilter {
	"""
	Every one of these has to match.
	"""
	and: [RunFilter!]
	"""
	At least one of these has to match. An empty list matches no run, which
	is what an alternation with no alternatives selects.
	"""
	or: [RunFilter!]
	"""
	This must not match.
	"""
	not: RunFilter
	"""
	Exactly these runs, by id.
	
	Passed on the filter a request makes rather than inside a combinator,
	this also says which runs to read: the listing fetches them by id and
	reports the ones it cannot find in `missing`, instead of walking the
	store. Everything else in the filter still applies to what comes back.
	"""
	ids: [ID!]
	"""
	Only runs in this status.
	"""
	status: RunStatus
	"""
	Runs in any of these statuses. Set beside `status`, the two name one
	set and a run in any of them matches.
	"""
	statusIn: [RunStatus!]
	"""
	The run's human title, absent until the titling pass lands one. A run
	with no title yet matches nothing here.
	"""
	title: StringFilter
	"""
	The initial ask the run was given.
	"""
	task: StringFilter
	"""
	The blueprint name the run recorded.
	"""
	blueprintName: StringFilter
	"""
	Only runs of this installed blueprint, matched on the name each run
	recorded.
	
	A `digest` on it pins the revision installed now, and the request fails
	where that is something else: runs are matched by name whatever is
	installed, so the pin is how a client asking "this agent's runs" finds
	out the agent has been edited under it.
	"""
	blueprint: BlueprintInput
	"""
	Runs where some stage ran an inference on a provider this accepts.
	
	The question is about the run's stages, so one stage matching keeps the
	run. That makes `ne` "a stage ran on something else" rather than "no
	stage ran on this"; wrap the filter in `not` for the second. A run that
	has billed no call, and a run recorded before Leviath kept this, match
	nothing here.
	"""
	stageProvider: StringFilter
	"""
	Runs where some stage ran an inference on a model this accepts, matched
	as the serving provider spells it.
	
	Quantified over the run's stages exactly as `stageProvider` is, with
	the same reading of `ne`. Set beside `stageProvider`, the two are
	separate conditions rather than one pair: a run whose first stage ran
	on one provider and whose second ran on another provider's model
	satisfies both.
	"""
	stageModel: StringFilter
	"""
	Whether the run was spawned unattended.
	"""
	unattended: BooleanFilter
	"""
	The yolo profile the run named at spawn. A run that named none matches
	nothing here.
	"""
	yoloProfileName: StringFilter
	"""
	Why a parked run is parked. A run that is not parked matches nothing
	here.
	"""
	waitReason: WaitReasonKind
	"""
	Runs parked for any of these reasons. Set beside `waitReason`, the two
	name one set.
	"""
	waitReasonIn: [WaitReasonKind!]
	"""
	When the run was spawned, in unix epoch seconds.
	"""
	startedAt: TimestampFilter
	"""
	When the run last changed state, in unix epoch seconds.
	"""
	updatedAt: TimestampFilter
	"""
	Wall-clock seconds since the run started. "Older than an hour" is
	`{ gt: 3600 }`.
	"""
	ageSecs: IntFilter
	"""
	Seconds the run spent actually working, parked time excluded.
	"""
	workingSecs: IntFilter
	"""
	What the run has spent, in US dollars. A run whose spend is unknown
	because some call in it went unpriced matches nothing here.
	"""
	costUsd: DecimalFilter
	"""
	Which part of the run tree to include.
	"""
	scope: RunScope
	"""
	Direct children of this run id. A run id naming nothing gives an empty
	page rather than an error: a run with no children yet is a normal
	answer.
	"""
	parent: ID
	"""
	Every run under this one, at any depth, and not the run itself. The
	flat read of a fan-out: nesting `children` walks one level per request,
	and this walks the whole subtree one page at a time.
	"""
	descendantOf: ID
	"""
	Case-insensitive substring. No regex, no boolean operators.
	"""
	query: String
	"""
	Where to look. Defaults to metadata and files, which are free.
	"""
	queryIn: [SearchScope!]
	"""
	Newest spawns or most recently active first.
	"""
	sort: RunSort
	"""
	Oldest first when true.
	"""
	ascending: Boolean
}

"""
Post-hoc diagnostics: an empty or degraded run told from a healthy one
without reading logs.
"""
type RunFlags {
	"""
	The run finished with nothing to show.
	"""
	emptyOutput: Boolean!
	"""
	Whether the run ever submitted an answer.
	"""
	producedOutput: Boolean!
	"""
	How many times a stage that must submit was let through without having
	submitted, after being asked again its bounded number of times.
	"""
	outputForced: Int!
	"""
	Whether the run was offered no tool it could answer with.
	"""
	noOutputTools: Boolean!
	"""
	How many transitions were taken with their gates forced.
	"""
	gatesForced: Int!
	"""
	How many times a stage exhausted its iteration budget.
	"""
	maxIterationsHit: Int!
	"""
	How many fan-outs ran degraded, with fewer workers than they split.
	"""
	splitsDegraded: Int!
	"""
	Files the run recorded as changed.
	"""
	modifiedFileCount: Int!
	"""
	The files themselves, capped when recorded.
	"""
	modifiedFiles: [String!]!
	"""
	Search operations the run performed.
	"""
	searchesRun: Int!
	"""
	Searches that matched nothing.
	"""
	searchesEmpty: Int!
	"""
	Required regions the run left empty when it ended.
	"""
	requiredRegionsAbandoned: [String!]!
	"""
	Whether the run's working directory went missing under it.
	"""
	workspaceLost: Boolean!
}

"""
What a lifecycle mutation answers with.
"""
type RunPayload {
	"""
	The run as the act left it.
	
	The daemon applies the act to its world before it answers, and writes
	the record a moment later, so this waits for the act to show there
	before answering: a pause reads `PAUSED`, a cancel reads `CANCELLED`,
	and a resume reads whatever the run went back to doing.
	
	A run slow to write its record is answered with the record as it stands
	rather than held any longer. That is not a refusal - a refusal is an
	error, never a quiet answer - so a status that does not yet show the act
	means the act is still on its way. Watch `RunStatusChanged` to see it
	land.
	"""
	run: Run!
	"""
	Retired checks the mutation noticed. Empty unless something was
	superseded.
	"""
	warnings: [String!]!
}

"""
A run got its title.
"""
type RunRenamed {
	"""
	The run.
	"""
	runId: String!
	"""
	The agent's live id.
	"""
	agentId: String!
	"""
	The new title.
	"""
	title: String!
}

"""
Which part of the run tree a listing is about.

One three-way choice, because a run either was started by another run or
was not. `ALL` is every run on the machine, sub-agents included.
"""
enum RunScope {
	"""
	Every run, sub-agents included.
	"""
	ALL
	"""
	Only runs nobody started.
	"""
	TOP_LEVEL
	"""
	Only runs somebody started, at any depth.
	"""
	SUB_AGENTS
}

"""
Sort order for the run listing.
"""
enum RunSort {
	"""
	Newest spawns first.
	"""
	STARTED_AT
	"""
	Most recently changed first.
	"""
	UPDATED_AT
	"""
	Runs that moved most recently first.
	"""
	LAST_PROGRESS_AT
}

"""
A run spawned.
"""
type RunSpawned {
	"""
	The run's durable id.
	"""
	runId: String!
	"""
	The agent's live id in the world, which a run outlives.
	"""
	agentId: String!
	"""
	The blueprint it was spawned from, by name.
	"""
	blueprint: String!
	"""
	The run that spawned it, for a sub-agent.
	"""
	parentId: String
}

"""
Spend crossed a threshold.
"""
type RunSpend {
	"""
	The run.
	"""
	runId: String!
	"""
	The agent's live id.
	"""
	agentId: String!
	"""
	The figure that was crossed, in dollars.
	"""
	thresholdUsd: Decimal!
	"""
	What the run has spent so far, in dollars.
	"""
	totalUsd: Decimal!
	"""
	Whether every call behind that total could be priced. When false the
	run has spent at least this and more by an unknown amount, so it must
	not be shown as a final figure.
	"""
	complete: Boolean!
	"""
	The stage that was running when it crossed.
	"""
	stage: String!
}

"""
The lifecycle states a run moves through.

One state per variant of the daemon's own `RunStatus`, so the two cannot
drift: the conversion below is exhaustive and a new daemon state will not
compile until it is named here.
"""
enum RunStatus {
	"""
	Spawned but not yet running.
	"""
	STARTING
	"""
	Moving: inferring, calling tools, transitioning.
	"""
	RUNNING
	"""
	Parked: on a prompt somebody has to answer, or holding for children.
	"""
	WAITING_INPUT
	"""
	Paused by `lev pause`; resumes with `lev resume`.
	"""
	PAUSED
	"""
	Finished with an answer or a terminal state.
	"""
	COMPLETE
	"""
	Every required stage finished but the run still accepts messages.
	"""
	COMPLETE_INTERACTIVE
	"""
	Unrecoverable failure; `Run.error` carries what went wrong.
	"""
	ERROR
	"""
	Stopped from outside. Nothing went wrong; somebody decided.
	"""
	CANCELLED
}

"""
A run's status, stage or counters moved.
"""
type RunStatusChanged {
	"""
	The run.
	"""
