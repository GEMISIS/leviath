"""
A run reached a terminal status.
"""
type AgentCompleted {
	"""
	The run.
	"""
	runId: String!
	"""
	The agent's live id.
	"""
	agentId: String!
	"""
	The terminal status.
	"""
	status: String!
	"""
	The run's error, when that is how it ended.
	"""
	error: String
	"""
	The answer it submitted, when there is one.
	"""
	finalOutput: CompletedOutput
}

"""
What a lifecycle mutation answers with.
"""
type AgentPayload {
	"""
	The run, read back after the act, so its status is what the act made
	it rather than what the caller hoped.
	"""
	run: Run!
	"""
	Retired checks the mutation noticed. Empty unless something was
	superseded.
	"""
	warnings: [String!]!
}

"""
A run spawned.
"""
type AgentSpawned {
	"""
	The run's durable id.
	"""
	runId: String!
	"""
	The agent's live id in the world, which a run outlives.
	"""
	agentId: String!
	"""
	The blueprint it was spawned from, by name.
	"""
	blueprint: String!
	"""
	The run that spawned it, for a sub-agent.
	"""
	parentId: String
}

"""
Spend crossed a threshold.
"""
type AgentSpend {
	"""
	The run.
	"""
	runId: String!
	"""
	The agent's live id.
	"""
	agentId: String!
	"""
	The figure that was crossed, in dollars.
	"""
	thresholdUsd: Decimal!
	"""
	What the run has spent so far, in dollars.
	"""
	totalUsd: Decimal!
	"""
	Whether every call behind that total could be priced. When false the
	run has spent at least this and more by an unknown amount, so it must
	not be shown as a final figure.
	"""
	complete: Boolean!
	"""
	The stage that was running when it crossed.
	"""
	stage: String!
}

"""
A run's status, stage or counters moved.
"""
type AgentStatusChanged {
	"""
	The run.
	"""
	runId: String!
	"""
	The agent's live id.
	"""
	agentId: String!
	"""
	The status, in the daemon's own spelling.
	"""
	status: String!
	"""
	The stage it is in, by name.
	"""
	stage: String!
	"""
	Inference turns in that stage.
	"""
	iteration: Int!
	"""
	Tool calls across the whole run.
	"""
	toolCalls: Int!
	"""
	Whether a message reaches this run right now.
	"""
	acceptsMessages: Boolean!
	"""
	Its title, once it has one.
	"""
	title: String
}

"""
Answer a confirm or a tool approval.
"""
input AnswerApprovalInput {
	"""
	The open request being answered.
	"""
	requestId: String!
	"""
	Whether the call is approved.
	"""
	approved: Boolean!
	"""
	How long the approval lasts. Meaningless on a denial.
	"""
	scope: ApprovalScope
	"""
	What to tell the model instead, on a denial. It reads this as part of
	the tool result, so a denial can redirect rather than only refuse.
	Refused beside an approval, where there is nothing to redirect.
	"""
	feedback: String
}

"""
Answer a multiple-choice ask.
"""
input AnswerChoiceInput {
	"""
	The open request being answered.
	"""
	requestId: String!
	"""
	Which option, zero-based into the request's own list.
	"""
	choiceIndex: Int!
}

"""
The answer to one pending ask.

Exactly one variant, and which one the request's own kind decides: a choice
for a multiple-choice ask, text for a free-text or edit-text one, an
approval for a confirm or a tool approval. One variant at a time is the
schema's own rule, so there is no combination to get wrong.
"""
input AnswerInteractionInput @oneOf {
	"""
	For a multiple-choice ask.
	"""
	choice: AnswerChoiceInput
	"""
	For a free-text or edit-text ask.
	"""
	text: AnswerTextInput
	"""
	For a confirm or a tool approval.
	"""
	approval: AnswerApprovalInput
}

"""
Answer a free-text or edit-text ask.
"""
input AnswerTextInput {
	"""
	The open request being answered.
	"""
	requestId: String!
	"""
	The words, or the edited document.
	"""
	value: String!
}

"""
How long a tool approval lasts once it is given.
"""
enum ApprovalScope {
	"""
	This call only.
	"""
	ONCE
	"""
	Every call of this tool for the rest of the stage.
	"""
	STAGE
	"""
	Every call of this tool for the rest of the run.
	"""
	SESSION
}

"""
One file a run handed back beside its answer.
"""
type Artifact {
	"""
	What the submission called it.
	"""
	name: String!
	"""
	Its declared mime type.
	"""
	mimeType: String!
	"""
	Size in bytes, when the record has it.
	"""
	size: BigInt
	"""
	Content hash, when it was computed.
	"""
	sha256: String
	"""
	A short-lived signed link to the bytes.
	"""
	url: String!
}

"""
A 64-bit integer, serialized as a JSON number. GraphQL's `Int` is 32-bit:
it cannot hold a 2 GiB file size or a large aggregate token count. Every
magnitude this API produces is well under 2^53, so it round-trips through
a browser without loss.
"""
scalar BigInt

"""
One stored part a run holds.

The bytes are not here. They are behind `url`, which is a short-lived signed
link the byte route verifies: bytes never ride a query answer, and a page can
put that link straight in an `<img src>`.
"""
type BlobEntry {
	"""
	The store's key: the bytes' SHA-256.
	"""
	sha256: String!
	"""
	The type the bytes were stored as.
	"""
	mimeType: String!
	"""
	The name the part carries, when its context gave it one.
	"""
	name: String
	"""
	Size in bytes.
	"""
	size: BigInt!
	"""
	Pixel width, for an image or a video.
	"""
	width: Int
	"""
	Pixel height, for an image or a video.
	"""
	height: Int
	"""
	Duration in milliseconds, for audio or video.
	"""
	durationMs: Int
	"""
	What the part is budgeted at in context.
	"""
	tokens: Int!
	"""
	Every region holding an entry that names this part.
	"""
	regions: [String!]!
	"""
	Whether the bytes are still on disk. A context can name a part whose
	file was too large to keep, or that a pruned run directory lost.
	"""
	stored: Boolean!
	"""
	A short-lived signed link to the bytes. Null when they are not on disk.
	"""
	url: String
}

type Blueprint {
	"""
	This revision's id: `<name>@<digest prefix>`.
	
	The digest is part of the identity on purpose. A run's frozen copy and
	the installed blueprint share a name and may differ in every other way,
	and a client that caches by type and id would otherwise merge the two.
	"""
	id: String!
	"""
	Unique within the installed set.
	"""
	name: String!
	"""
	Content digest of this manifest, lowercase hex SHA-256.
	"""
	digest: String!
	"""
	Which file this was read from.
	"""
	source: BlueprintSource!
	"""
	From `[agent] version`.
	"""
	version: String!
	"""
	From `[agent] description`.
	"""
	description: String!
	"""
	The stage a run starts in. Defaults to the first stage declared.
	"""
	entryStage: Stage
	"""
	How deep sub-agent spawning may nest.
	"""
	maxChildDepth: Int
	"""
	Whether a run sees tools that appear after it started.
	"""
	toolDiscovery: ToolDiscovery!
	"""
	The prompt guidance this blueprint declares, before the cascade.
	"""
	toolGuidance: ToolUseGuidance!
	"""
	One entry per stage, in declaration order.
	"""
	stages: [Stage!]!
	"""
	One entry per declared context region.
	"""
	regions: [Region!]!
	"""
	Paths this agent declares it needs beyond its workdir. Declaring is not
	granting: an entry takes effect only where the host grants it.
	"""
	readPaths: [String!]!
}

"""
A paged listing of the installed blueprints.
"""
type BlueprintConnection {
	"""
	The blueprints on this page.
	"""
	edges: [BlueprintEdge!]!
	"""
	Keyset page state.
	"""
	pageInfo: PageInfo!
	"""
	How many blueprints are installed.
	"""
	total: Int!
	"""
	Names from an `exact` fetch that are not installed. Never fails the
	request.
	"""
	missing: [String!]!
}

"""
One installed blueprint with its page cursor.
"""
type BlueprintEdge {
	"""
	The blueprint.
	"""
	node: Blueprint!
	"""
	Cursor for this edge.
	"""
	cursor: Cursor!
}

"""
Where a blueprint was read from.
"""
enum BlueprintSource {
	"""
	The run's own copy, written at spawn: what the run executed, whatever
	the installed file says now.
	"""
	SNAPSHOT
	"""
	The installed file. For a run, this means it kept no snapshot, so the
	file may have changed since it ran.
	"""
	INSTALLED
}

"""
One page of a run's direct children.
"""
type ChildConnection {
	"""
	The children on this page.
	"""
	edges: [ChildEdge!]!
	"""
	How many direct children this run has.
	"""
	total: Int!
	"""
	Whether another page follows.
	"""
	hasNextPage: Boolean!
}

"""
One child run with nothing else attached.

No cursor: a level is read from the index's parent map in listing order, and
`skip` walks it. A keyset cursor would promise stability across a tree that
is growing under the reader, which is not something this can offer.
"""
type ChildEdge {
	"""
	The child run.
	"""
	node: Run!
}

"""
The answer carried on a completion frame.
"""
type CompletedOutput {
	"""
	The answer itself.
	"""
	content: String!
	"""
	The output format label the submission carried.
	"""
	format: String
	"""
	The stage that submitted it.
	"""
	stage: String!
	"""
	When it was submitted.
	"""
	submittedAt: Timestamp!
	"""
	True when the stored answer was cut to fit.
	"""
	truncated: Boolean!
}

"""
The daemon's configuration, with every secret left out.

The `has*Key` flags are the shape this takes deliberately: a console needs
to know whether a provider is configured, and never needs the key.
"""
type Config {
	"""
	The default provider, by name.
	"""
	defaultProvider: String!
	"""
	Providers allowed to serve a bare model name, best first. Empty means
	the default provider alone decides.
	"""
	providerOrder: [String!]!
	"""
	The model every stage that permits it starts on, ahead of its own list.
	"""
	overrideModel: String
	"""
	The model tried after every model a stage names.
	"""
	fallbackModel: String
	"""
	Whether a key is stored for each provider. Names only; no values.
	"""
	configuredProviders: [String!]!
	"""
	Custom model gateways.
	"""
	gateways: [Gateway!]!
	"""
	Where this server looks for blueprints, beyond the installed agents
	directory.
	"""
	agentPaths: [String!]!
	"""
	How many MCP servers the config declares.
	"""
	mcpServerCount: Int!
	"""
	The API version this server speaks.
	"""
	apiVersion: String!
	"""
	What this server can do. Check these rather than calling a route and
	reading a 404, which also means "no such run".
	"""
	capabilities: [String!]!
	"""
	The numbers above.
	"""
	limits: ServeLimits!
	"""
	Why the config file does not load. Absent when it does.
	"""
	configError: ConfigError
	"""
	When the config was last saved. While unhealthy this is the last good
	save, not what is on disk.
	"""
	configMtime: Timestamp
}

"""
Why the config file does not load.
"""
type ConfigError {
	"""
	Which step refused it: reading, parsing, or validating.
	"""
	kind: String!
	"""
	The file, as the server resolved it.
	"""
	path: String!
	"""
	One line on what is wrong.
	"""
	message: String!
	"""
	The line a parse failure is at, 1-based.
	"""
	line: Int
	"""
	The column beside it.
	"""
	column: Int
	"""
	The dotted config key a validation failure is about.
	"""
	key: String
	"""
	Said in words, for a client that only renders strings.
	"""
	note: String!
}

"""
The config file's health changed.
"""
type ConfigHealthChanged {
	"""
	Whether the file on disk loads right now.
	"""
	healthy: Boolean!
	"""
	The file that was checked.
	"""
	path: String!
	"""
	One line on why it does not load. Absent when healthy.
	"""
	error: String
	"""
	While unhealthy this is the last good save, not what is on disk.
	"""
	configMtime: Timestamp
}

type ContextRegion {
	"""
	The region's name, matching the blueprint's declaration.
	"""
	name: String!
	"""
	What the region does when it fills, as the snapshot recorded it.
	"""
	kind: String!
	"""
	Tokens it holds right now.
	"""
	tokens: Int!
	"""
	Its ceiling, in tokens.
	"""
	maxTokens: Int!
	"""
	How many entries it holds.
	"""
	entryCount: Int!
	"""
	One line on what the region is for.
	"""
	description: String
	"""
	The region's text, entries joined in order.
	
	Heavy, and the reason the window is not one blob: select it only for the
	regions you display. An entry holding a stored part reads as whatever
	stand-in the registry gives it, which is what the model sees too.
	"""
	content: String!
}

"""
Context window totals moved.
"""
type ContextUpdated {
	"""
	The run.
	"""
	runId: String!
	"""
	The agent's live id.
	"""
	agentId: String!
	"""
	Tokens held across every region.
	"""
	totalTokens: Int!
	"""
	The window's budget.
	"""
	maxTokens: Int!
}

type ContextWindow {
	"""
	Tokens held across every region: what the next request costs before the
	model's reply.
	"""
	totalTokens: Int!
	"""
	The window's budget, from the blueprint or the model's own limit.
	"""
	maxTokens: Int!
	"""
	The stage the run was in when this window was written.
	"""
	stageName: String!
	"""
	Every region, in layout order.
	"""
	regions: [ContextRegion!]!
}

"""
Spend for a run, a stage, or a subtree roll-up.
"""
type CostBreakdown {
	"""
	Null is unknown, never free: some call in the run went unpriced.
	"""
	costUsd: Decimal
	"""
	The priced subtotal, kept even while `costUsd` is null.
	"""
	costPricedUsd: Decimal!
	"""
	True when every priced call carried the provider's own figure.
	"""
	costIsExact: Boolean!
	"""
	Calls no provider priced.
	"""
	unpricedCalls: Int!
}

"""
An opaque keyset cursor: the same token the REST routes hand out. It
encodes the sort, the order and a digest of the filters, so a cursor from
one listing cannot resume a different one.
"""
scalar Cursor

"""
The daemon on the other end of the link.
"""
type DaemonIdentity {
	"""
	The version it was built from.
	"""
	version: String!
	"""
	Its build id.
	"""
	build: String!
	"""
	Its process id.
	"""
	pid: Int!
}

"""
The link to the daemon changed.

About the machine rather than a run, and delivered to every subscription,
scoped or not, because it explains why a run's frames stopped.
"""
type DaemonLinkChanged {
	"""
	Whether this server is receiving the daemon's events right now.
	"""
	connected: Boolean!
	"""
	Who is on the other end, once it has said.
	"""
	daemon: DaemonIdentity
	"""
	Whether the daemon behind the link is a different process than before:
	a restart this server lived through and its clients need not.
	"""
	restarted: Boolean!
	"""
	Present when the daemon and this server run different code, with what
	to do about it. Requests keep working while the two still understand
	each other.
	"""
	restartAdvised: String
}

"""
An exact decimal, serialized as a JSON string. Money is never a `Float` on
the wire: a cost figure that a JSON parser silently re-rounds is a lie
about spend. The daemon keeps costs as `f64`, so this carries that number's
shortest round-tripping form rather than inventing precision.
"""
scalar Decimal

"""
One directory, for a file picker.
"""
type Directory {
	"""
	The absolute directory that was listed.
	"""
	path: String!
	"""
	Where "up one level" goes. Null at the filesystem root, and at the
	workdir root: a picker is never led above the fence.
	"""
	parent: String
	"""
	The user's home directory, for a "home" shortcut.
	"""
	home: String!
	"""
	This server's own working directory, for a "here" shortcut.
	"""
	cwd: String!
	"""
	The directories inside, by name.
	"""
	entries: [String!]!
}

"""
One environment or configuration check.
"""
type DoctorCheck {
	"""
	What was checked.
	"""
	name: String!
	"""
	Whether it passed.
	"""
	ok: Boolean!
	"""
	What was found, or why not.
	"""
	detail: String!
}

"""
The diagnostics report.
"""
type DoctorReport {
	"""
	Whether every check passed.
	"""
	ok: Boolean!
	"""
	The checks themselves, in the order they ran.
	"""
	checks: [DoctorCheck!]!
}

"""
This subscription fell behind, and frames were dropped.

The daemon's broadcast is bounded, and a subscriber that cannot keep up is
skipped past rather than allowed to hold the fan-out. Silently, before
this: a client could not tell a quiet run from a missed one. Re-query the
state you render when you see this.
"""
type EventsDropped {
	"""
	How many frames this subscription missed.
	"""
	count: BigInt!
}

"""
The answer a run submitted.
"""
type FinalOutput {
	"""
	The answer itself.
	"""
	content: String!
	"""
	The output format label the submission carried.
	"""
	format: String
	"""
	The stage that submitted it.
	"""
	stage: String!
	"""
	When it was submitted, unix epoch seconds.
	"""
	submittedAt: Timestamp!
	"""
	True when the stored answer was cut to fit.
	"""
	truncated: Boolean!
}

"""
A custom model gateway from `[model_providers]`.
"""
type Gateway {
	"""
	The name an agent references, and the table key.
	"""
	name: String!
	"""
	Where the gateway lives, when the entry names one.
	"""
	baseUrl: String
	"""
	Whether a key is configured. The value itself never crosses the wire.
	"""
	hasApiKey: Boolean!
	"""
	What backs it: a script, or an endpoint.
	"""
	kind: String!
}

"""
Where a search matched, and enough text to show a person why.

The part of search a browser cannot do: the client never holds a run's
transcript, so without this a deep match is an unexplained result.
"""
type Highlight {
	"""
	What matched: a run field name, `metadata.<key>`, `modified_files`,
	`context.<region>`, `logs.output`, `logs.operational`, or
	`journal.tool.<tool_name>`.
	"""
	field: String!
	"""
	The matching text, with a little either side.
	"""
	snippet: String!
	"""
	Which stage the match came from, for the sources that have one.
	"""
	stage: Int
}

"""
Whether a prompt hint is included at one manifest level.

Omitting guidance never discourages the behaviour. It leaves the paragraph
out of the system prompt, and nothing else.
"""
enum HintSetting {
	"""
	Defer to the level above: a stage defers to the blueprint, and the
	blueprint defers to the host's own setting.
	"""
	INHERIT
	"""
	Include the hint at this level.
	"""
	INCLUDE
	"""
	Leave the hint out at this level, even where a broader level includes
	it.
	"""
	OMIT
}

"""
What kind of answer a parked run is waiting for.
"""
enum InteractionKind {
	"""
	The person writes anything.
	"""
	FREE_TEXT
	"""
	The person picks from options.
	"""
	MULTIPLE_CHOICE
	"""
	The person confirms or denies.
	"""
	CONFIRM
	"""
	The person approves or denies a tool call.
	"""
	TOOL_APPROVAL
	"""
	The person edits a document directly.
	"""
	EDIT_TEXT
}

"""
A run parked on a prompt somebody has to answer.
"""
type InteractionNeeded {
	"""
	The run.
	"""
	runId: String!
	"""
	The agent's live id.
	"""
	agentId: String!
	"""
	The parked request. Null when this build cannot read the shape the
	daemon sent, which is what a newer daemon's new kind looks like.
	"""
	request: InteractionRequest
}

"""
How answering an ask landed.
"""
type InteractionPayload {
	"""
	The request that was answered.
	"""
	requestId: String!
	"""
	True when the daemon took the answer. False when no open request
	carries that id any more: it was answered already, or it expired.
	"""
	accepted: Boolean!
}

"""
One pending ask, parked on a run.
"""
type InteractionRequest {
	"""
	The request's id, which is what an answer names.
	"""
	id: String!
	"""
	What kind of answer it takes.
	"""
	kind: InteractionKind!
	"""
	What the person is asked.
	"""
	prompt: String!
	"""
	A longer document shown alongside the prompt, such as a plan to review.
	"""
	body: String
	"""
	The choices, for a multiple-choice ask.
	"""
	options: [String!]!
	"""
	The tool awaiting approval, for an approval ask.
	"""
	tool: String
	"""
	The stage the run is in.
	"""
	stageName: String!
	"""
	Whether the run holds until this is answered.
	"""
	required: Boolean!
}

"""
One log line.
"""
type LogLine {
	"""
	The run.
	"""
	runId: String!
	"""
	The agent's live id.
	"""
	agentId: String!
	"""
	The line, without its trailing newline. Long lines are cut for the
	broadcast; the stage log on disk keeps the whole thing.
	"""
	line: String!
}

"""
One MCP server in the config.
"""
type McpServer {
	"""
	Unique server name.
	"""
	name: String!
	"""
	How it is reached: `stdio`, `http`, or `invalid` when the configured
	transport did not resolve.
	"""
	transport: String!
	"""
	The command for a stdio server, the URL for an HTTP one. Empty when the
	transport is invalid.
	"""
	endpoint: String!
	"""
	Its one-word auth state.
	"""
	auth: String!
}

"""
One caller-supplied metadata entry on a run.
"""
type MetadataEntry {
	"""
	The key.
	"""
	key: String!
	"""
	The value. Always a string.
	"""
	value: String!
}

"""
One caller-supplied metadata entry.
"""
input MetadataEntryInput {
	"""
	The key.
	"""
	key: String!
	"""
	The value. Always a string.
	"""
	value: String!
}

"""
One row of the mime registry.
"""
type MimeRow {
	"""
	The row's key: a type, or a pattern such as `image/*`.
	"""
	mimeType: String!
	"""
	Where the row came from: `builtin`, `config`, or a blueprint's name.
	"""
	source: String!
	"""
	The family the type resolves to, which is what providers key their
	encoders on.
	"""
	family: String
	"""
	Whether the bytes are text, and so may travel inline.
	"""
	text: Boolean
	"""
	The extensions this type is known by.
	"""
	extensions: [String!]!
}

"""
One model this machine can route to.
"""
type Model {
	"""
	The model id, as the provider names it.
	"""
	id: String!
	"""
	The provider that serves it. Two providers can serve the same id and
	bill to different places, which is why this is part of the answer.
	"""
	provider: String!
	"""
	The name to show, when the provider gives one.
	"""
	displayName: String
	"""
	Context window in tokens.
	"""
	maxContextTokens: Int!
	"""
	The most one reply may be, in tokens.
	"""
	maxOutputTokens: Int!
	"""
	Where those two limits came from.
	"""
	limitsSource: ModelLimitsSource!
	"""
	Whether the model takes tool definitions.
	"""
	supportsTools: Boolean!
	"""
	Whether it takes a sampling temperature.
	"""
	supportsTemperature: Boolean!
	"""
	Whether the limits were learned from a live call rather than declared.
	"""
	learned: Boolean!
	"""
	When the model was released, when the provider says.
	"""
	released: Timestamp
	"""
	When it retires, as the provider writes it.
	"""
	retires: String
	"""
	What it costs, when the price file knows.
	"""
	pricing: ModelPricing
	"""
	Mime type patterns it takes.
	"""
	inputTypes: [String!]!
	"""
	Mime type patterns it produces.
	"""
	outputTypes: [String!]!
}

"""
Where a model's token limits came from.
"""
enum ModelLimitsSource {
	"""
	What the provider's own API reports.
	"""
	API
	"""
	This build's compiled table, matched on the model name.
	"""
	BUILTIN
	"""
	A config override.
	"""
	OVERRIDE
	"""
	The daemon reported something this build does not know. The limits are
	still whatever it sent; only their provenance is unrecognised.
	"""
	UNKNOWN
}

"""
What one model costs per million tokens.

Absent where the price file has no entry for the model, which is why a run
can report an unpriced call rather than a cost of zero.
"""
type ModelPricing {
	"""
	Input tokens, per million.
	"""
	inputPerMtok: Decimal!
	"""
	Input tokens served from the provider's cache, per million.
	"""
	cachedInputPerMtok: Decimal!
	"""
	Tokens written to that cache, per million.
	"""
	cacheWritePerMtok: Decimal!
	"""
	Output tokens, per million.
	"""
	outputPerMtok: Decimal!
}

type Mutation {
	"""
	Park a run.
	
	Read `run.status` on the way back: `PAUSED` means the pause landed.
	A finished run is a `CONFLICT`, never a silent no-op.
	"""
	pauseAgent(
		"""
		The run to pause.
		"""
		runId: String!
	): AgentPayload!
	"""
	Resume a paused run.
	
	Read `run.status`: `RUNNING` means it is moving again.
	"""
	resumeAgent(
		"""
		The run to resume.
		"""
		runId: String!
	): AgentPayload!
	"""
	Start a run.
	
	Answers with the run itself, so a client renders the new row without a
	second request. `warnings` names checks the blueprint declared that this
	request's own output shape retires.
	
	The refusals are the server's, not the daemon's: a workdir outside
	`--workdir-root`, an unattended run on a `--no-remote-yolo` server, or a
	callback URL the outbound policy will not allow, each answer `FORBIDDEN`.
	"""
	spawnAgent(
		"""
		Everything about the new run.
		"""
		input: SpawnAgentInput!
	): AgentPayload!
	"""
	Send a message to a run that is going.
	
	Whether it lands is the daemon's call: a stage that declared
	`accepts_messages = false`, or a finished run, does not take one, and the
	refusal says that rather than claiming the run does not exist.
	"""
	sendMessage(
		"""
		The run to message.
		"""
		runId: String!,
		"""
		What to say to it.
		"""
		message: String!,
		"""
		Deliver into this context region instead of the default one.
		"""
		targetRegion: String
	): AgentPayload!
	"""
	Answer a pending ask.
	
	The first answer wins. A second answer to the same request is not an
	error on the client's part: two people clicking one prompt is ordinary,
	and it reads as `accepted: false` rather than as a failure.
	"""
	answerInteraction(
		"""
		Exactly one answer, of the kind the request takes.
		"""
		input: AnswerInteractionInput!
	): InteractionPayload!
	"""
	Cancel a run, and its sub-agents with it.
	
	Read `run.status`: `CANCELLED` means the cancel landed. A run that had
	already finished is a `CONFLICT`, which tells a client the difference
	between "you stopped it" and "it was over before you asked".
	"""
	cancelAgent(
		"""
		The run to cancel.
		"""
		runId: String!
	): AgentPayload!
}

"""
One open ask, with the run it is parked on.
"""
type OpenInteraction {
	"""
	The run waiting for this answer.
	"""
	runId: String!
	"""
	What is being asked.
	"""
	request: InteractionRequest!
}

"""
What a stage must produce before it may transition.
"""
type OutputRequirement {
	"""
	How many times the stage is asked again when it tries to leave without
	having submitted. After that the transition proceeds anyway and the
	run's `outputForced` counter records it: a missing answer never strands
	a run.
	"""
	reasks: Int!
}

"""
Keyset page state.
"""
type PageInfo {
	"""
	Whether another page follows this one.
	"""
	hasNextPage: Boolean!
	"""
	Pass as `after` to get it.
	"""
	endCursor: Cursor
}

"""
One provider this machine can reach.
"""
type Provider {
	"""
	The registry name a blueprint would use.
	"""
	id: String!
	"""
	The name to show.
	"""
	display: String!
	"""
	Whether the config has it turned on.
	
	Separate from `signedIn`: the two are set by different routes, and
	either can be true on its own.
	"""
	enabled: Boolean!
	"""
	Whether a credential is stored for it.
	"""
	signedIn: Boolean!
	"""
	The account, when the credential names one.
	"""
	account: String
	"""
	The subscription tier, when the credential names one.
	"""
	plan: String
	"""
	When the access token lapses.
	
	Not a deadline for anybody: it is refreshed well before this. It is
	here so a console can show the session is live rather than implying
	somebody must act.
	"""
	expiresAt: Timestamp
}

type Query {
	"""
	The blueprints installed on this machine, by name.
	
	This is the live definition, not what any run executed: for that, read
	`blueprint` on the run, which answers from the run's own snapshot. The
	digests tell you whether the two are the same bytes.
	
	`exact` fetches blueprints by name. A name that is not installed lands
	in `missing` rather than failing the request.
	"""
	blueprints(
		"""
		Case-insensitive prefix match on the blueprint name.
		"""
		query: String,
		"""
		Exact names to fetch; unknown ones land in missing.
		"""
		exact: [String!],
		"""
		Page size; capped by the server's page-size cap.
		"""
		first: Int! = 50,
		"""
		How many to skip, for the page after the first.
		"""
		skip: Int! = 0
	): BlueprintConnection!
	"""
	How this server is configured, with every secret left out.
	
	Read `capabilities` before choosing a code path. A 404 also means "no
	such run", so discovering a feature by being refused costs a round trip
	and tells you less.
	"""
	config: Config!
	"""
	Environment and configuration diagnostics.
	
	A failing check is `ok: false` inside a healthy answer, never an error:
	the request to run the checks succeeded, and what they found is the
	answer.
	"""
	doctor: DoctorReport!
	"""
	The MCP servers this machine has configured.
	"""
	mcpServers: [McpServer!]!
	"""
	The yolo profiles, and the file they are read from.
	"""
	yoloProfiles: YoloProfiles!
	"""
	The operator's mime registry, before any blueprint's own rows.
	"""
	mime: [MimeRow!]!
	"""
	The scripts this machine has registered.
	"""
	scripts(
		"""
		Only this blueprint's own scripts, plus the global ones.
		"""
		agent: String
	): [Script!]!
	"""
	The directories under a path, for a file picker.
	
	Confined to `--workdir-root` when the operator set one, which is also
	why `parent` is null at that fence rather than leading above it.
	"""
	directories(
		"""
		The directory to list. Omitted means this server's own.
		"""
		path: String,
		"""
		Include hidden directories.
		"""
		hidden: Boolean! = false
	): Directory!
	"""
	Every model this machine can route to.
	
	Answered from the catalogue this server keeps, so it costs no provider
	call. Two providers can serve the same model id and bill to different
	places, so `provider` is part of each answer rather than something a
	client infers.
	"""
	models(
		"""
		Only this provider's models.
		"""
		provider: String,
		"""
		Reload the provider listings before answering.
		"""
		refresh: Boolean! = false
	): [Model!]!
	"""
	The providers this machine can reach, configured or not.
	
	`enabled` and `signedIn` are different questions with different
	answers: a provider can be turned on with no credential stored, and a
	credential can outlive the config entry that used it.
	"""
	providers: [Provider!]!
	"""
	The tools an agent on this machine can call.
	
	Scoped to one blueprint's own directory when `agent` names one, which
	is what an editor offering an `available_tools` list wants.
	"""
	tools(
		"""
		Scope to this blueprint's own tools directory.
		"""
		agent: String
	): ToolInventory!
	"""
	Every open ask across every run: the approval inbox.
	
	The daemon holds these in memory, so this is one read rather than a walk
	of the run store. Each entry names the run it is parked on, which is
	what a client needs to show the row it belongs to.
	"""
	openInteractions: [OpenInteraction!]!
	"""
	Keyset-paged run listing.
	
	`ids` fetches exact runs, which is also how a client reads one run:
	`runs(ids: ["..."])`. An id that names nothing lands in `missing`
	rather than failing the request, so one dead id in a batch of fifty
	does not cost the other forty-nine.
	"""
	runs(
		"""
		Status, search, parentage and time filters.
		"""
		filter: RunFilter,
		"""
		Page size; capped by the server's page-size limit.
		"""
		first: Int! = 50,
		"""
		Cursor from the previous page's pageInfo.
		"""
		after: Cursor,
		"""
		Exact ids to fetch; unknown ones land in missing.
		"""
		ids: [String!]
	): RunConnection!
}

type Region {
	"""
	Region name, unique within the blueprint.
	"""
	name: String!
	"""
	What the region does when it fills.
	"""
	kind: RegionKind!
	"""
	Hard token ceiling for the region.
	"""
	maxTokens: Int!
	"""
	One line on what this region is for.
	"""
	description: String
	"""
	Whether the run may not proceed while this region is empty.
	"""
	required: Boolean!
	"""
	Whether the description is also shown to the model, above the region's
	contents.
	"""
	describeInPrompt: Boolean!
}

"""
What a region does when it fills.

One value per kind the daemon recognises. The manifest accepts `hashmap`
and `hash_map` for the same kind, which is a spelling the TOML takes; the
API has one name for one thing.
"""
enum RegionKind {
	"""
	Stays in the prompt verbatim.
	"""
	PINNED
	"""
	The default. Cleared or dropped as the window fills.
	"""
	TEMPORARY
	"""
	Emptied by an edge transform or an explicit clear.
	"""
	CLEARABLE
	"""
	Keeps the newest entries.
	"""
	SLIDING_WINDOW
	"""
	Summarized by the compaction model as it fills.
	"""
	COMPACTING
	"""
	Keeps compacted summaries of its own past.
	"""
	COMPACT_HISTORY
	"""
	Key-value entries with admission control.
	"""
	HASHMAP
	"""
	Open and done items a gate can require empty.
	"""
	CHECKLIST
	"""
	Behaviour defined by a Rhai script under `context_hooks/`.
	"""
	CUSTOM
}

"""
The most one region reached while a stage was active.
"""
type RegionPeak {
	"""
	The region's name.
	"""
	region: String!
	"""
	The most tokens it held while this stage was active.
	"""
	tokens: Int!
}

"""
Seed text for one named context region at spawn.
"""
input RegionSeedInput {
	"""
	The region to seed, by name.
	"""
	region: String!
	"""
	The text it starts with.
	"""
	text: String!
}

type Run {
	"""
	Globally unique run id.
	"""
	id: String!
	"""
	The agent name from the blueprint this run was spawned from.
	"""
	agentName: String!
	"""
	Human title, set by the titling pass; null until it lands.
	"""
	title: String
	"""
	Why titling failed, when it did.
	"""
	titleError: String
	"""
	The lifecycle state: the filter and subscription vocabulary.
	"""
	status: RunStatus!
	"""
	Present only when the status is `ERROR`.
	"""
	error: String
	"""
	The initial ask this run was given.
	"""
	task: String!
	"""
	Inference turns in the current stage, reset on entering a new one.
	"""
	iteration: Int!
	"""
	Tool calls across the whole run.
	"""
	toolCalls: Int!
	"""
	Unix epoch seconds, as the daemon stores it.
	"""
	startedAt: Timestamp!
	"""
	Last state change, unix epoch seconds.
	"""
	updatedAt: Timestamp!
	"""
	When the run last actually moved. Age a wedged run against this.
	"""
	lastProgressAt: Timestamp
	"""
	Seconds since `startedAt`, wall-clock.
	"""
	ageSecs: BigInt!
	"""
	Seconds actually working, parked time excluded.
	"""
	workingSecs: BigInt!
	"""
	The working span in progress; null while the clock is stopped.
	"""
	active: WorkingClock
	"""
	Token roll-up for the whole run.
	"""
	usage: TokenUsage!
	"""
	Spend roll-up for the whole run.
	"""
	cost: CostBreakdown!
	"""
	Whether the run was spawned unattended, so approvals resolve without
	a person.
	"""
	unattended: Boolean!
	"""
	The yolo profile this run was spawned with, when it named one.
	"""
	yoloProfileName: String
	"""
	The working directory the run executes in.
	"""
	workdir: String!
	"""
	The run that spawned this one; null for a top-level run.
	"""
	parentId: String
	"""
	The blueprint this run executed.
	
	The run's own snapshot of the manifest, taken at spawn, so it answers
	for the run even after the installed blueprint is edited or deleted.
	For a run recorded before snapshots existed there is no copy, and this
	falls back to the installed file: `blueprint.source` says which, and
	`blueprintDigest` is set only for a run that carries its own.
	
	Null, with an error naming the file, when neither can be read. Nullable
	on purpose: one unreadable blueprint in a page of fifty runs must not
	cost a client the other forty-nine.
	"""
	blueprint: Blueprint
	"""
	The digest of the manifest this run executed, lowercase hex SHA-256.
	
	Recorded at spawn. Compare it with the installed blueprint's digest to
	tell "this run executed what is installed now" from "this run executed
	something else". Null for a run recorded before snapshots existed,
	where the answer is unknown rather than "the same".
	"""
	blueprintDigest: String
	"""
	Why this run is parked, and what would unblock it.
	
	Present only while the status is `WAITING_INPUT`. A run waiting on a
	person also carries the prompt itself; a run parked on its own workers
	carries only this, and needs nobody.
	"""
	waitReason: WaitReason
	"""
	Post-hoc diagnostics: an empty or degraded run told from a healthy one
	without reading logs.
	"""
	flags: RunFlags!
	"""
	The run's stage ledger: what each stage cost, and how often it ran.
	
	Bounded by the blueprint's stage count, so it is a list rather than a
	connection. Read from the run's own `stages.json` only when selected.
	Null, with an error, when that file will not read: one run's broken
	ledger must not cost a client the page around it.
	"""
	stages: [StageRecord!]
	"""
	The run's context window as it stands right now.
	
	Null for a run that has not written one yet, and for a finished run
	whose window was never persisted. Region contents are their own field,
	so asking for the shape of the window does not read its text.
	"""
	context: ContextWindow
	"""
	The answer this run submitted. Null until something is submitted.
	"""
	finalOutput: FinalOutput
	"""
	This run's direct children, paged.
	
	A connection rather than an array: a two-hundred-worker fan-out would
	otherwise be one unbounded response. Nest the field to walk deeper, one
	level per nesting, and read `pageInfo.hasNextPage` to see a level that
	was cut. For a flat read of a whole subtree, `runs(filter: { parent: })`
	is the same walk one page at a time.
	"""
	children(
		"""
		Page size for this level.
		"""
		first: Int! = 50,
		"""
		How many of this run's children to skip.
		"""
		skip: Int! = 0
	): ChildConnection!
	"""
	How deep and how wide this run's sub-agent tree is, without walking it.
	
	The roll-up covers the whole subtree, which is the figure a fan-out is
	judged by: a parent that spent little and whose fifty workers spent a
	great deal is not a cheap run.
	"""
	treeStatus: RunTreeStatus!
	"""
	A stage's logs.
	
	`stageIndex` picks one stage, `allStages` reads every stage in order, and
	neither reads more than `tail` bytes from the end of each stream. The cap
	is the server's, because `allStages` multiplies whatever the client asks
	for by the stage count.
	"""
	logs(
		"""
		One stage by index; omitted means the stage the run is on now.
		"""
		stageIndex: Int,
		"""
		Every stage's logs in order, instead of one stage's.
		"""
		allStages: Boolean! = false,
		"""
		Read the operational log rather than the output stream.
		"""
		operational: Boolean! = false,
		"""
		Bytes to read from the end of each stream.
		"""
		tail: Int
	): String!
	"""
	The binary parts this run holds.
	
	Metadata only: the bytes are behind each entry's `url`, a short-lived
	signed link the byte route verifies. Bytes never ride a query answer,
	and a page can put that link straight into an `<img src>`.
	"""
	blobs: [BlobEntry!]
	"""
	The files this run handed back beside its answer.
	
	Same as `blobs`: metadata here, bytes behind a signed link.
	"""
	artifacts: [Artifact!]!
	"""
	A short-lived signed link to one file in this run's working directory.
	
	The byte route verifies the signature, so this works in an `<img src>` or
	a download link, where a header cannot be set. It is good for a few
	minutes and for that one path.
	"""
	fileUrl(
		"""
		The file, relative to the run's working directory.
		"""
		path: String!,
		"""
		Offer it as a download rather than inline.
		"""
		download: Boolean! = false
	): String!
	"""
	Caller-supplied metadata from spawn. Values are always strings.
	
	Sorted by key: the daemon keeps these in a hash map, and a listing
	whose order changes between two identical requests is a diff nobody
	can read.
	"""
	metadata: [MetadataEntry!]!
}

"""
A keyset-paged run listing.
"""
type RunConnection {
	"""
	The runs on this page.
	"""
	edges: [RunEdge!]!
	"""
	Keyset page state.
	"""
	pageInfo: PageInfo!
	"""
	How many runs matched. Null when `scanTruncated` is true: a count from
	a partial scan is not a fact.
	"""
	total: Int
	"""
	True when the search gave up before covering the store.
	"""
	scanTruncated: Boolean!
	"""
	Ids from an `ids` fetch that name no run here. Never fails the request.
	"""
	missing: [String!]!
	"""
	Daemon time when the page was built. Pass it back as `since` to poll.
	"""
	serverTime: Timestamp!
}

"""
One run with its page cursor and its match highlights.
"""
type RunEdge {
	"""
	The run.
	"""
	node: Run!
	"""
	Cursor for this edge.
	"""
	cursor: Cursor!
	"""
	Why this run matched a search; empty when there was no search.
	"""
	highlights: [Highlight!]!
}

"""
One frame off the daemon broadcast.
"""
union RunEvent = AgentSpawned | AgentStatusChanged | RunRenamed | TokensUpdated | ContextUpdated | StageTransition | ToolCallStarted | ToolCallFinished | LogLine | AgentSpend | InteractionNeeded | AgentCompleted | DaemonLinkChanged | ConfigHealthChanged | UpdateProgress | UpdateFinished | EventsDropped

"""
One frame type off the daemon broadcast.

Subscribe with the types you render. The names match the frame names `/ws`
uses, so a client moving over reads the same vocabulary.
"""
enum RunEventType {
	"""
	A run spawned.
	"""
	AGENT_SPAWNED
	"""
	A run's status, stage or counters moved.
	"""
	AGENT_STATUS
	"""
	A run got its title.
	"""
	RUN_RENAMED
	"""
	Token usage ticked up.
	"""
	TOKENS
	"""
	Context window totals moved.
	"""
	CONTEXT_UPDATE
	"""
	The run entered a new stage.
	"""
	STAGE_TRANSITION
	"""
	A tool call began.
	"""
	TOOL_CALL_STARTED
	"""
	A tool call finished.
	"""
	TOOL_CALL_FINISHED
	"""
	One log line.
	"""
	LOG
	"""
	Spend crossed a threshold.
	"""
	AGENT_SPEND
	"""
	A run parked on a prompt somebody has to answer.
	"""
	INTERACTION_NEEDED
	"""
	A run reached a terminal status.
	"""
	AGENT_COMPLETED
	"""
	The serving daemon's identity or link state changed.
	"""
	DAEMON_LINK
	"""
	The config file's health changed.
	"""
	CONFIG_HEALTH
	"""
	A self-update step moved.
	"""
	UPDATE_PROGRESS
	"""
	A self-update finished.
	"""
	UPDATE_FINISHED
	"""
	This subscription fell behind and frames were dropped.
	"""
	EVENTS_DROPPED
}

"""
Which runs a listing is about: status, search, parentage and time, in one
place.
"""
input RunFilter {
	"""
	Only runs in this status.
	"""
	status: RunStatus
	"""
	Runs in any of these statuses. Prefer this over one request per status
	when a client wants "everything active" as a single predicate.
	"""
	statusIn: [RunStatus!]
	"""
	Case-insensitive substring. No regex, no boolean operators.
	"""
	query: String
	"""
	Where to look. Defaults to metadata and files, which are free.
	"""
	queryIn: [SearchScope!]
	"""
	Direct children of this run id. A run id naming nothing gives an empty
	page rather than an error: a run with no children yet is a normal
	answer.
	"""
	parent: String
	"""
	Only runs nobody started, when true.
	"""
	topLevelOnly: Boolean
	"""
	Inclusive lower bound on the sort value. Pass the previous page's
	`serverTime` to poll for what changed.
	"""
	since: Timestamp
	"""
	Newest spawns or most recently active first.
	"""
	sort: RunSort
	"""
	Oldest first when true.
	"""
	ascending: Boolean
}

"""
Post-hoc diagnostics: an empty or degraded run told from a healthy one
without reading logs.
"""
type RunFlags {
	"""
	The run finished with nothing to show.
	"""
	emptyOutput: Boolean!
	"""
	Whether the run ever submitted an answer.
	"""
	producedOutput: Boolean!
	"""
	How many times a stage that must submit was let through without having
	submitted, after being asked again its bounded number of times.
	"""
	outputForced: Int!
	"""
	Whether the run was offered no tool it could answer with.
	"""
	noOutputTools: Boolean!
	"""
	How many transitions were taken with their gates forced.
	"""
	gatesForced: Int!
	"""
	How many times a stage exhausted its iteration budget.
	"""
	maxIterationsHit: Int!
	"""
	How many fan-outs ran degraded, with fewer workers than they split.
	"""
	splitsDegraded: Int!
	"""
	Files the run recorded as changed.
	"""
	modifiedFileCount: Int!
	"""
	The files themselves, capped when recorded.
	"""
	modifiedFiles: [String!]!
	"""
	Search operations the run performed.
	"""
	searchesRun: Int!
	"""
	Searches that matched nothing.
	"""
	searchesEmpty: Int!
	"""
	Required regions the run left empty when it ended.
	"""
	requiredRegionsAbandoned: [String!]!
	"""
	Whether the run's working directory went missing under it.
	"""
	workspaceLost: Boolean!
}

"""
A run got its title.
"""
type RunRenamed {
	"""
	The run.
	"""
	runId: String!
	"""
	The agent's live id.
	"""
	agentId: String!
	"""
	The new title.
	"""
	title: String!
}

"""
Sort order for the run listing.
"""
enum RunSort {
	"""
	Newest spawns first.
	"""
	STARTED_AT
	"""
	Most recently changed first.
	"""
	UPDATED_AT
	"""
	Runs that moved most recently first.
	"""
	LAST_PROGRESS_AT
}

"""
The lifecycle states a run moves through.

One state per variant of the daemon's own `RunStatus`, so the two cannot
drift: the conversion below is exhaustive and a new daemon state will not
compile until it is named here.
"""
enum RunStatus {
	"""
	Spawned but not yet running.
	"""
	STARTING
	"""
	Moving: inferring, calling tools, transitioning.
	"""
	RUNNING
	"""
	Parked: on a prompt somebody has to answer, or holding for children.
	"""
	WAITING_INPUT
	"""
	Paused by `lev pause`; resumes with `lev resume`.
	"""
	PAUSED
	"""
	Finished with an answer or a terminal state.
	"""
	COMPLETE
	"""
	Every required stage finished but the agent still accepts messages.
	"""
	COMPLETE_INTERACTIVE
	"""
	Unrecoverable failure; `Run.error` carries what went wrong.
	"""
	ERROR
	"""
	Stopped from outside. Nothing went wrong; somebody decided.
	"""
	CANCELLED
}

"""
How deep and how wide a run's sub-agent tree is.
"""
type RunTreeStatus {
	"""
	Token roll-up over the whole subtree, this run included.
	"""
	rollup: TokenUsage!
	"""
	The deepest nesting below this run.
	"""
	depth: Int!
	"""
	How many runs are below it, at any depth.
	"""
	descendantCount: Int!
}

"""
One registered script.
"""
type Script {
	"""
	Which registry it belongs to: a tool, a hook, a validator, a mime check
	or a provider.
	"""
	kind: String!
	"""
	Its name, unique within that kind.
	"""
	name: String!
	"""
	Where it was found.
	"""
	source: String!
	"""
	The agent whose directory it came from, for an agent-scoped script.
	"""
	agent: String
}

"""
Where a run search looks.

`META` and `FILES` answer from what is already parsed in memory. The other
three read files per run, so they are what a client offers as a "search
inside runs" toggle rather than paying for on every keystroke.
"""
enum SearchScope {
	"""
	Run metadata: title, agent name, status, task, caller metadata.
	"""
	META
	"""
	The run's own record of the files it changed.
	"""
	FILES
	"""
	Region contents on disk.
	"""
	CONTEXT
	"""
	Log lines on disk.
	"""
	LOGS
	"""
	The crash-resume journal.
	"""
	JOURNAL
}

"""
What the server will and will not do, in numbers.

Published so a client never hardcodes a cap. Reading the limit is how a
paging loop knows what to ask for, rather than discovering it by being
refused.
"""
type ServeLimits {
	"""
	The largest page any listing will serve.
	"""
	maxPageSize: Int!
	"""
	The most ids one batch fetch may name.
	"""
	maxIds: Int!
	"""
	The most bytes one file read returns.
	"""
	maxFileBytes: BigInt!
	"""
	The most entries one directory listing returns.
	"""
	maxListingEntries: Int!
	"""
	How many runs a file-reading search examines before giving up.
	"""
	maxSearchScan: Int!
	"""
	The largest page of context history.
	"""
	maxHistoryLimit: Int!
	"""
	The most requests served at once.
	"""
	maxConcurrentRequests: BigInt!
	"""
	The largest accepted upload, in bytes.
	"""
	maxUploadBytes: BigInt!
	"""
	The per-request deadline, in seconds.
	"""
	requestTimeoutSecs: Int!
}

"""
What has to change before a parked run can go on.

One value per remedy, not per error: topping up an account, adding a
provider and replacing a rejected key are three different screens, and a
client with only the sentence would have to match on its wording.
"""
enum SetupBlocker {
	"""
	The stage names a provider this install has not configured.
	"""
	PROVIDER_MISSING
	"""
	The account behind the provider is out of credits.
	"""
	CREDITS_EXHAUSTED
	"""
	The key was rejected.
	"""
	AUTH_FAILED
	"""
	The key is valid but not allowed to use the model.
	"""
	FORBIDDEN
	"""
	No provider is available at all.
	"""
	PROVIDERS_UNAVAILABLE
	"""
	The provider could not be reached.
	"""
	PROVIDER_UNREACHABLE
	"""
	The provider took too long.
	"""
	PROVIDER_TIMED_OUT
	"""
	The provider failed.
	"""
	PROVIDER_FAILED
}

"""
A `.rhai` file that was found and could not be offered as a tool.
"""
type SkippedTool {
	"""
	The file that was skipped.
	"""
	path: String!
	"""
	Why it could not be offered.
	"""
	reason: String!
}

"""
Everything about a new run.
"""
input SpawnAgentInput {
	"""
	The blueprint to start, by name.
	"""
	blueprint: String!
	"""
	The initial ask.
	"""
	task: String!
	"""
	Override the blueprint's model for this run, as `provider/model` or a
	bare model name. Wins over every other model setting.
	"""
	model: String
	"""
	How deep sub-agent spawning may nest for this run.
	"""
	maxDepth: Int
	"""
	Where the run's tools execute. Defaults to this server's own directory,
	and is refused outside `--workdir-root` when the operator set one.
	"""
	workdir: String
	"""
	Run unattended: approvals resolve without a person. Refused outright on
	a server started with `--no-remote-yolo`.
	"""
	yolo: Boolean
	"""
	A named yolo profile, which is a kind of yolo and refused with it.
	"""
	yoloProfile: String
	"""
	Tools to allow without asking, for this run.
	"""
	allow: [String!]
	"""
	Refuse this blueprint's command seeds, which run before any approval
	prompt exists.
	"""
	noSeedCommands: Boolean
	"""
	Seed text for named context regions.
	"""
	regions: [RegionSeedInput!]
	"""
	Caller-supplied metadata. Values are always strings.
	"""
	metadata: [MetadataEntryInput!]
	"""
	The output format label to ask the run for.
	"""
	outputFormat: String
	"""
	Extra instructions for the run's output stage.
	"""
	outputInstructions: String
	"""
	URL the daemon POSTs this run's events to. Checked against the same
	outbound policy a model-supplied URL is.
	"""
	callbackUrl: String
	"""
	Shared secret for signing that webhook. Write-only: never read back on
	the run.
	"""
	callbackSecret: String
}

type Stage {
	"""
	Stage name, unique within the blueprint.
	"""
	name: String!
	"""
	How the stage runs.
	"""
	mode: StageMode!
	"""
	One line on what the stage is for.
	"""
	description: String
	"""
	The only tools the model is offered here. Group tokens (`@all`,
	`@builtin`, `@subagent`, `@scripts`, `@mcp`) stand for whole sources and
	resolve at spawn.
	"""
	availableTools: [String!]!
	"""
	Tools this stage cannot work without. These survive an unattended run,
	where the blocking interaction tools are otherwise withheld.
	"""
	requiredTools: [String!]!
	"""
	MCP servers whose whole tool set this stage may use.
	"""
	availableConnectors: [String!]!
	"""
	Inference-turn bound for one visit to this stage.
	"""
	maxIterations: Int
	"""
	How many times the run may re-enter this stage.
	"""
	maxRevisits: Int
	"""
	What this stage must submit before it transitions. Null when it may
	leave without producing anything.
	"""
	outputRequirement: OutputRequirement
	"""
	Whether `sendMessage` reaches a run parked in this stage.
	"""
	acceptsMessages: Boolean!
	"""
	Whether this stage may end the run outright.
	"""
	allowComplete: Boolean!
	"""
	Whether this stage may run as a fan-out worker or sub-agent.
	"""
	allowAsWorker: Boolean!
	"""
	Whether this stage may not finish until its child runs complete.
	"""
	requiresChildren: Boolean!
	"""
	Records that the author deliberately offers the human-in-the-loop tools
	while this stage runs autonomously.
	
	Grants nothing and changes no behaviour. Its one consumer is
	`lev validate`, where it silences the
	`blocking-tool-in-autonomous-stage` lint. An autonomous stage that
	calls one of those tools with nobody attached parks in `WAITING_INPUT`
	until a person answers or the run is cancelled.
	"""
	declaresBlockingTools: Boolean!
	"""
	The prompt guidance this stage declares, before the cascade.
	"""
	toolGuidance: ToolUseGuidance!
	"""
	Outgoing edges. An empty list marks a terminal stage.
	"""
	transitions: [TransitionEdge!]!
}

"""
How a stage runs.
"""
enum StageMode {
	"""
	The tight loop: infer, act on tool calls, repeat until a transition
	fires.
	"""
	AUTONOMOUS
	"""
	Pauses for a person at every step.
	"""
	INTERACTIVE
	"""
	Holds at each declared interaction point instead of at every step.
	"""
	INTERACTIVE_POINTS
	"""
	Splits work across worker agents, then continues.
	"""
	FAN_OUT
	"""
	Produces the run's final answer and nothing else.
	"""
	OUTPUT
}

"""
One stage's record within a run: what it cost, and how often it ran.
"""
type StageRecord {
	"""
	The stage's name.
	"""
	name: String!
	"""
	Visit order within the blueprint.
	"""
	index: Int!
	"""
	The stage's own lifecycle state.
	"""
	status: StageStatus!
	"""
	False when the run never reached this stage.
	"""
	entered: Boolean!
	"""
	Token roll-up for this stage, across every visit.
	"""
	usage: TokenUsage!
	"""
	Spend roll-up for this stage, across every visit.
	"""
	cost: CostBreakdown!
	"""
	How many times the run entered this stage.
	"""
	visitCount: Int!
	"""
	One entry per stay, capped when recorded. When `visitCount` is larger
	than this list, the roll-ups above are still the complete figures.
	"""
	visits: [StageVisit!]!
	"""
	The most each region held while this stage was active.
	"""
	regionPeaks: [RegionPeak!]!
	"""
	Whether the runaway detector fired here.
	"""
	runawayWarned: Boolean!
	"""
	First entry, unix epoch seconds.
	"""
	startedAt: Timestamp
	"""
	Last exit; null while the stage is active.
	"""
	endedAt: Timestamp
	"""
	The working span in progress; null while the clock is stopped.
	"""
	active: WorkingClock
}

"""
A stage's own lifecycle state within a run.
"""
enum StageStatus {
	"""
	Declared but not yet entered.
	"""
	PENDING
	"""
	The stage the run is in right now.
	"""
	ACTIVE
	"""
	Entered, and blocked on a person answering.
	"""
	WAITING_INPUT
	"""
	Finished and left.
	"""
	COMPLETE
	"""
	Ended in a failure. The run's own error carries the message.
	"""
	ERROR
	"""
	The run finished without ever entering this stage.
	"""
	SKIPPED
}

"""
The run entered a new stage.
"""
type StageTransition {
	"""
	The run.
	"""
	runId: String!
	"""
	The agent's live id.
	"""
	agentId: String!
	"""
	The stage it left.
	"""
	from: String!
	"""
	The stage it entered.
	"""
	to: String!
	"""
	How many times the destination has been entered, this entry included.
	"""
	iteration: Int!
}

"""
One visit to a stage.
"""
type StageVisit {
	"""
	When the run entered, unix epoch seconds.
	"""
	enteredAt: Timestamp!
	"""
	When it left; null for the visit in progress.
	"""
	leftAt: Timestamp
	"""
	Tokens burned on this visit.
	"""
	usage: TokenUsage!
	"""
	Spend on this visit.
	"""
	cost: CostBreakdown!
}

type Subscription {
	"""
	The daemon broadcast, filtered server-side.
	
	Pass `types` to name only the frames you render. Pass `runId` or
	`runIds` to narrow to particular runs, and `includeDescendants` to have
	their sub-agents included as they spawn, which is what a fan-out needs:
	without it a client has to re-query the tree and re-subscribe as it
	grows. Pass no scope and it is every run, like `/ws`.
	
	Delivery is at-most-once. A dropped connection delivers nothing until
	the client reconnects, and a subscription that falls behind gets an
	`EventsDropped` frame saying how many it missed, which is the cue to
	re-read whatever it renders.
	"""
	events(
		"""
		Only these frame types; omitted or empty means all of them.
		"""
		types: [RunEventType!],
		"""
		Narrow to one run.
		"""
		runId: String,
		"""
		Narrow to a set of runs.
		"""
		runIds: [String!],
		"""
		Include the sub-agents of the runs in scope, as they spawn.
		"""
		includeDescendants: Boolean! = false
	): RunEvent!
}

"""
Unix epoch seconds, as the daemon stores them. No string dates, so no
timezone maths over a number that never had a timezone.
"""
scalar Timestamp

"""
Token counts for a run, a stage, or a subtree roll-up.
"""
type TokenUsage {
	"""
	Input tokens, cached ones included.
	"""
	promptTokens: BigInt!
	"""
	Output tokens.
	"""
	completionTokens: BigInt!
	"""
	Counted within `promptTokens`, not on top of it. Do not add them twice.
	"""
	cachedTokens: BigInt!
	"""
	Tokens written to the provider's cache.
	"""
	cacheWriteTokens: BigInt!
}

"""
Token usage ticked up.
"""
type TokensUpdated {
	"""
	The run.
	"""
	runId: String!
	"""
	The agent's live id.
	"""
	agentId: String!
	"""
	Input tokens so far, cached ones included.
	"""
	promptTokens: BigInt!
	"""
	Output tokens so far.
	"""
	completionTokens: BigInt!
	"""
	Counted within `promptTokens`, not on top of it.
	"""
	cachedTokens: BigInt!
	"""
	Tokens written to the provider's cache.
	"""
	cacheWriteTokens: BigInt!
}

"""
Where a tool comes from.
"""
type Tool {
	"""
	The name the model calls it by.
	"""
	name: String!
	"""
	Which source offers it: a built-in, a sub-agent tool, a script, or an
	MCP server.
	"""
	source: String!
	"""
	The file behind it, for a script tool.
	"""
	path: String
	"""
	The agent whose directory it came from, for an agent-scoped script.
	"""
	agent: String
}

"""
A tool call finished.
"""
type ToolCallFinished {
	"""
	The run.
	"""
	runId: String!
	"""
	The agent's live id.
	"""
	agentId: String!
	"""
	Pairs with the start.
	"""
	callId: String!
	"""
	The tool called.
	"""
	tool: String!
	"""
	Whether the call took effect. False for a refused or failed call: a
	finish is not a success on its own.
	"""
	ok: Boolean!
	"""
	The result, flattened to one line and cut to fit.
	"""
	summary: String!
}

"""
A tool call began.
"""
type ToolCallStarted {
	"""
	The run.
	"""
	runId: String!
	"""
	The agent's live id.
	"""
	agentId: String!
	"""
	The provider's call id, which pairs this with its finish.
	"""
	callId: String!
	"""
	The tool called.
	"""
	tool: String!
}

"""
Whether a run sees tools that appear after it started.
"""
enum ToolDiscovery {
	"""
	Tools are discovered once, at spawn. A tool installed mid-run reaches
	the next run, not this one.
	"""
	AT_SPAWN_ONLY
	"""
	The run also scans its workdir's `tools/`, and re-advertises its tool
	set after a script is written. This decides when a run *sees* a new
	tool, not whether it may install one: that is what the tool permissions
	decide.
	"""
	RESCAN_AFTER_WRITES
}

"""
One group token an `available_tools` list may name in place of tool names.
"""
type ToolGroup {
	"""
	The token itself, such as `@builtin`.
	"""
	name: String!
	"""
	What the token stands for.
	"""
	description: String!
}

"""
The tool inventory: what an agent on this machine can call.
"""
type ToolInventory {
	"""
	The tools themselves.
	"""
	tools: [Tool!]!
	"""
	The group tokens a blueprint may name instead of individual tools.
	"""
	groups: [ToolGroup!]!
	"""
	Scripts that were found and could not be offered, with the reason.
	
	Reported rather than dropped: a tool an author believes exists and that
	silently is not there is the failure this prevents.
	"""
	skipped: [SkippedTool!]!
}

"""
The prompt guidance a blueprint or a stage declares.
"""
type ToolUseGuidance {
	"""
	Whether the batch-independent-tool-calls paragraph is included.
	"""
	batchIndependentCalls: HintSetting!
	"""
	Whether the platform shell paragraph is included. Even when included,
	it is only emitted where the host has shell guidance worth giving and
	the stage offers the `shell` tool.
	"""
	shellForMultiStepWork: HintSetting!
}

"""
One outgoing edge of a stage.
"""
type TransitionEdge {
	"""
	The stage this edge leads to.
	"""
	target: String!
	"""
	Told to the model when it is choosing where to go next.
	"""
	hint: String
}

"""
A self-update finished.
"""
type UpdateFinished {
	"""
	The update job.
	"""
	jobId: String!
	"""
	Its terminal status.
	"""
	status: String!
	"""
	Whether both this server and the daemon keep running the old build
	until they are restarted.
	"""
	restartRequired: Boolean!
}

"""
A self-update step moved.
"""
type UpdateProgress {
	"""
	The update job.
	"""
	jobId: String!
	"""
	Which part of the install the step touches.
	"""
	step: String!
	"""
	The step's status.
	"""
	status: String!
	"""
	One line about what just happened, ready to print.
	"""
	detail: String!
}

"""
Why a run is parked, and what would unblock it.

Present only while the run is in `WAITING_INPUT`. A run waiting on a person
carries the prompt in `interaction`; a run parked on its own sub-agents
carries the reason here and needs nobody.
"""
type WaitReason {
	"""
	The machine-readable cause.
	"""
	reason: WaitReasonKind!
	"""
	What is blocked. Present when `reason` is `NEEDS_SETUP`.
	"""
	blocker: SetupBlocker
	"""
	What to do about it, in a sentence. Present with `blocker`.
	"""
	remedy: String
	"""
	How many are still outstanding. Present for `FAN_OUT_WORKERS` and
	`CHILDREN`.
	"""
	outstanding: Int
	"""
	Whether this needs a person, as against resolving on its own.
	
	The difference a client cares about: a run waiting on workers is
	healthy, and a run waiting on an answer is a row somebody has to act
	on.
	"""
	needsAPerson: Boolean!
}

"""
Why a run is parked.
"""
enum WaitReasonKind {
	"""
	Waiting on a tool-permission decision.
	"""
	TOOL_APPROVAL
	"""
	Waiting on an answer to a question the agent asked.
	"""
	USER_PROMPT
	"""
	Waiting at a taint gate.
	"""
	TAINT_GATE
	"""
	Waiting at a blueprint interaction point.
	"""
	INTERACTION_POINT
	"""
	Fan-out workers are still running. Healthy; it resolves on its own.
	"""
	FAN_OUT_WORKERS
	"""
	Child runs are still running. Healthy; it resolves on its own.
	"""
	CHILDREN
	"""
	Something on the machine has to change before this run can go on.
	"""
	NEEDS_SETUP
}

"""
Elapsed working time: banked spans plus the one in progress.
"""
type WorkingClock {
	"""
	Seconds banked by spans that have ended.
	"""
	bankedSecs: Int!
	"""
	When the span in progress began; null while the clock is stopped.
	"""
	since: Timestamp
}

"""
One named yolo profile, summarised.

The counts rather than the rules: a settings list shows how much a profile
waives, and `lev yolo show` prints the rules themselves.
"""
type YoloProfile {
	"""
	The profile's name, as `--yolo=<name>` spells it.
	"""
	name: String!
	"""
	What tools with no explicit rule do.
	"""
	default: String!
	"""
	What happens to the agent's own questions.
	"""
	questions: String!
	"""
	What happens at blueprint checkpoints.
	"""
	checkpoints: String!
	"""
	What happens at the taint gate.
	"""
	gate: String!
	"""
	How many tool rules it carries: allow, ask, deny.
	"""
	toolRules: [Int!]!
	"""
	How many shell rules it carries: allow, ask, deny.
	"""
	shellRules: [Int!]!
}

"""
The yolo profiles, and where they are read from.
"""
type YoloProfiles {
	"""
	The file the profiles are read from.
	"""
	path: String!
	"""
	Whether that file exists. False with no error means `--yolo=<name>` has
	nothing to name yet.
	"""
	exists: Boolean!
	"""
	Why the file does not load, when it does not. The profiles are then
	empty, and a spawn naming one is refused with this same message.
	"""
	error: String
	"""
	The profiles themselves.
	"""
	profiles: [YoloProfile!]!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Indicates that an Input Object is a OneOf Input Object (and thus requires exactly one of its field be provided)
"""
directive @oneOf on INPUT_OBJECT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Query
	mutation: Mutation
	subscription: Subscription
}

