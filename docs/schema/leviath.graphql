"""
Filled at run time by whoever starts the run.
"""
type SeedFromCaller {
	"""
	The caller-input key this region is filled from. The key `task` is the
	run's own prompt.
	"""
	key: String!
}

"""
Filled with the output of a shell command run at spawn.

The one seed that executes something through a shell, and it runs before the
first inference, so before any approval prompt could exist. It runs inside
the entry stage's sandbox when one is configured, and the `allow_seed_commands`
switch turns the whole feature off.
"""
type SeedFromCommand {
	"""
	The command line, run with the platform shell in the working directory.
	"""
	command: String!
}

"""
Filled from a list of files.
"""
type SeedFromFiles {
	"""
	The paths, resolved against the run's working directory.
	"""
	paths: [String!]!
}

"""
Filled from the working-directory files matching a pattern.
"""
type SeedFromGlob {
	"""
	The pattern, resolved against the run's working directory.
	"""
	pattern: String!
}

"""
Filled with text written into the blueprint.
"""
type SeedFromLiteral {
	"""
	The text, verbatim.
	"""
	text: String!
}

"""
Filled with what a Rhai script returns.
"""
type SeedFromScript {
	"""
	The script, relative to the blueprint.
	"""
	script: String!
}

"""
Filled with the output of tool calls run at spawn.

Through the run's own tool layer rather than a shell, so each call answers to
the same permissions and taint rules it would answer to mid-run. That is what
makes an unrestricted list safe: a seed reaches nothing the run was not
already granted.
"""
type SeedFromTools {
	"""
	The calls, in order. Each writes its own headed block into the region.
	"""
	calls: [SeedToolCall!]!
	"""
	Whether the calls run once or on every stage entry.
	"""
	refresh: SeedRefresh!
}

"""
When a seed that runs tools runs again.
"""
enum SeedRefresh {
	"""
	Once, at spawn. What every other kind of seed does.
	"""
	ONCE
	"""
	Again whenever a stage is entered, replacing the region. For a seed whose
	answer moves, such as the time.
	"""
	EACH_STAGE
}

"""
One tool call a seed makes.
"""
type SeedToolCall {
	"""
	The tool to call, by the name the manifest used, so an MCP tool keeps
	its `<server>__<tool>` qualification.
	"""
	tool: String!
	"""
	Its arguments, as the manifest wrote them.
	
	Raw JSON, and not because nothing has typed it yet: a seed may name any
	tool this machine can offer, including an MCP tool and a script tool, so
	the shape is whatever that one tool's schema is. `tools` carries the
	schema a name resolves to. Empty for the many tools that take none.
	"""
	args: JSON!
}

"""
Arguments for the `send_to_agent` tool.
"""
type SendToAgentArgs {
	"""
	The agent written to, by its live id.
	"""
	agentId: String!
	"""
	What was sent.
	"""
	message: String!
	"""
	The region it was delivered to. Left out means the conversation.
	"""
	targetRegion: String
}

"""
One `send_to_agent` call.
"""
type SendToAgentCall implements ToolCall {
	"""
	Tool name, exactly as the model called it.
	"""
	toolName: String!
	"""
	What the tool does, as this build describes it.
	"""
	toolDescription: String
	"""
	The arguments as the model sent them, untouched. The typed
	form beside this is a reading of it, not a replacement.
	"""
	rawArguments: JSON!
	"""
	The call's arguments.
	"""
	args: SendToAgentArgs!
}

"""
What the server will and will not do, in numbers.

Published so a client never hardcodes a cap. Reading the limit is how a
paging loop knows what to ask for, rather than discovering it by being
refused.
"""
type ServeLimits {
	"""
	The largest page any listing will serve.
	"""
	maxPageSize: Int!
	"""
	The most ids one batch fetch may name.
	"""
	maxIds: Int!
	"""
	The most bytes one file read returns.
	"""
	maxFileBytes: BigInt!
	"""
	The most entries one directory listing returns.
	"""
	maxListingEntries: Int!
	"""
	How many runs a file-reading search examines before giving up.
	"""
	maxSearchScan: Int!
	"""
	The largest page of context history.
	"""
	maxHistoryLimit: Int!
	"""
	The most requests served at once.
	"""
	maxConcurrentRequests: BigInt!
	"""
	The largest accepted upload, in bytes.
	"""
	maxUploadBytes: BigInt!
	"""
	The per-request deadline, in seconds.
	"""
	requestTimeoutSecs: Int!
}

"""
How far an approval that settled an ask reached.

The REST journal and the answer routes write this scope's widest value as
`session`; this field always spells it `RUN`, so a client reading GraphQL
never has to know the REST name for the same thing.
"""
enum SettledApprovalScope {
	"""
	Just the one call it was asked about.
	"""
	ONCE
	"""
	Every later call it covered, until the run left the stage it was asked
	in.
	"""
	STAGE
	"""
	Every later call it covered, for the rest of the run.
	"""
	RUN
}

"""
How a question this run asked ended up, and what the answer was.

`approved`, `scope`, `choice`, `text` and `feedback` are null unless
`outcome` is `ANSWERED`. Nobody answered a `TIMED_OUT`, `CANCELLED` or
`REFUSED` ask, so there is nothing for any of them to carry.
"""
type Settlement {
	"""
	How it ended.
	"""
	outcome: SettlementOutcome!
	"""
	Whether a tool approval was granted. Null for every kind of ask but a
	tool approval that was answered.
	"""
	approved: Boolean
	"""
	The scope an approval was given at: this call, this stage, or the rest
	of the run. Null where none was offered, or where nobody answered.
	"""
	scope: SettledApprovalScope
	"""
	Which option was picked, for a question that offered a list.
	"""
	choice: Int
	"""
	What was typed, for a question that took text. An edited document
	comes back here too, exactly as it was left.
	"""
	text: String
	"""
	What the person told the model to do instead, on a denial.
	"""
	feedback: String
}

"""
How a question a run asked ended up.
"""
enum SettlementOutcome {
	"""
	A person answered it.
	"""
	ANSWERED
	"""
	Nobody answered before the run's interaction timeout ran out, so the
	hub answered for them.
	"""
	TIMED_OUT
	"""
	The request was withdrawn: the run was cancelled, or the agent that
	asked it went away.
	"""
	CANCELLED
	"""
	It never opened, because a request was already open under the same id,
	and the daemon keeps the one somebody may already be reading.
	
	Not a denial: the run was handed the neutral answer, which a tool
	approval and a taint gate both read as not-approved. Its own outcome
	because it means two runs minted one id, which is a fault in this
	server rather than a decision about the call.
	"""
	REFUSED
}

"""
What has to change before a parked run can go on.

One value per remedy, not per error: topping up an account, adding a
provider and replacing a rejected key are three different screens, and a
client with only the sentence would have to match on its wording.
"""
enum SetupBlocker {
	"""
	The stage names a provider this install has not configured.
	"""
	PROVIDER_MISSING
	"""
	The account behind the provider is out of credits.
	"""
	CREDITS_EXHAUSTED
	"""
	The key was rejected.
	"""
	AUTH_FAILED
	"""
	The key is valid but not allowed to use the model.
	"""
	FORBIDDEN
	"""
	No provider is available at all.
	"""
	PROVIDERS_UNAVAILABLE
	"""
	The provider could not be reached.
	"""
	PROVIDER_UNREACHABLE
	"""
	The provider took too long.
	"""
	PROVIDER_TIMED_OUT
	"""
	The provider failed.
	"""
	PROVIDER_FAILED
}

"""
Arguments for the `shell` tool.
"""
type ShellArgs {
	"""
	The command, as the model wrote it.
	"""
	command: String!
}

"""
One `shell` call.
"""
type ShellCall implements ToolCall {
	"""
	Tool name, exactly as the model called it.
	"""
	toolName: String!
	"""
	What the tool does, as this build describes it.
	"""
	toolDescription: String
	"""
	The arguments as the model sent them, untouched. The typed
	form beside this is a reading of it, not a replacement.
	"""
	rawArguments: JSON!
	"""
	The call's arguments.
	"""
	args: ShellArgs!
}

"""
A provider sign-in that is waiting for the person to finish it.
"""
type SignInStarted {
	"""
	The provider, by its canonical name.
	"""
	provider: String!
	"""
	Where the person has to go, on the serving host.
	"""
	authorizeUrl: String!
	"""
	Whether this is the sign-in somebody already started rather than a new
	one. The URL is the same either way, which is what a client needs.
	"""
	alreadyWaiting: Boolean!
}

"""
One run a delete passed over, and why.
"""
type SkippedDelete {
	"""
	The run that stayed.
	"""
	id: String!
	"""
	Why it did: it is still going, or its record cannot be read.
	"""
	reason: String!
}

"""
A `.rhai` file that was found and could not be offered as a tool.
"""
type SkippedTool {
	"""
	The file that was skipped.
	"""
	path: String!
	"""
	Why it could not be offered.
	"""
	reason: String!
}

"""
Arguments for the `spawn_agent` tool.
"""
type SpawnAgentArgs {
	"""
	The blueprint to run, by name.
	"""
	blueprint: String!
	"""
	The task handed to it.
	"""
	task: String!
	"""
	Whether the caller blocked until it finished. Left out means no, which is
	also what the tool's own default says.
	"""
	wait: Boolean
	"""
	Context put in the child's first pinned region.
	"""
	seedContext: String
	"""
	Stored parts of this run handed to the child, each by name or by the
	start of its sha256.
	"""
	parts: [String!]
	"""
	A depth limit for the child's own children.
	"""
	maxChildDepth: Int
	"""
	The shape the child was asked to answer in, overriding its blueprint's.
	"""
	outputFormat: String
	"""
	Extra guidance about that shape.
	"""
	outputInstructions: String
}

"""
One `spawn_agent` call.
"""
type SpawnAgentCall implements ToolCall {
	"""
	Tool name, exactly as the model called it.
	"""
	toolName: String!
	"""
	What the tool does, as this build describes it.
	"""
	toolDescription: String
	"""
	The arguments as the model sent them, untouched. The typed
	form beside this is a reading of it, not a replacement.
	"""
	rawArguments: JSON!
	"""
	The call's arguments.
	"""
	args: SpawnAgentArgs!
}

"""
Everything about a new run.
"""
input SpawnRunInput {
	"""
	The blueprint to start. A `digest` on it refuses the spawn where what is
	installed under that name is a different revision, which is how a client
	starts the blueprint it read rather than whatever is there now.
	"""
	blueprint: BlueprintInput!
	"""
	The initial ask.
	"""
	task: String!
	"""
	Override the blueprint's model for this run, as `provider/model` or a
	bare model name. Wins over every other model setting.
	"""
	model: String
	"""
	How deep sub-agent spawning may nest for this run.
	"""
	maxDepth: Int
	"""
	Where the run's tools execute. Defaults to this server's own directory,
	and is refused outside `--workdir-root` when the operator set one.
	"""
	workdir: String
	"""
	Run unattended: approvals resolve without a person. Refused outright on
	a server started with `--no-remote-yolo`.
	
	Null is `false`, not a third state: the run asks a person. Only
	`yoloProfile` says which prompts are waived rather than all of them.
	"""
	yolo: Boolean
	"""
	A named yolo profile, which is a kind of yolo and refused with it.
	"""
	yoloProfile: String
	"""
	Tools to allow without asking, for this run.
	"""
	allow: [String!]
	"""
	Refuse this blueprint's command seeds, which run before any approval
	prompt exists.
	
	Null is `false`, not a third state: the seeds the blueprint declares run.
	"""
	noSeedCommands: Boolean
	"""
	Write this run's exact requests into its journal, once per provider
	attempt, whatever this machine is configured to do for other runs.
	
	A captured request is the whole prompt, holding whatever the run's
	context held: file contents, command output, the words somebody typed.
	There is no size cap, and every call re-sends the window, so a captured
	run's journal grows by roughly the context size per attempt. Read it back
	on `InferenceAttempt.modelInput`.
	"""
	captureModelInput: Boolean
	"""
	Seed text for named context regions.
	"""
	regions: [RegionSeedInput!]
	"""
	Caller-supplied metadata: labels for whoever started the run, such as a
	ticket or a tenant. Values are always strings, the run reads none of
	them, and `filter.query` searches them. Not a typed extension point. A
	key given twice keeps the last value.
	"""
	metadata: [MetadataEntryInput!]
	"""
	The output format label to ask the run for.
	"""
	outputFormat: String
	"""
	Extra instructions for the run's output stage.
	"""
	outputInstructions: String
	"""
	URL the daemon POSTs this run's events to. Checked against the same
	outbound policy a model-supplied URL is.
	"""
	callbackUrl: String
	"""
	Shared secret for signing that webhook. Write-only: never read back on
	the run.
	
	Refused without a `callbackUrl`, since there is no webhook to sign:
	sending one on its own means a caller believes it has set up a signed
	callback that will never fire. Send both, or neither.
	"""
	callbackSecret: String
}

"""
One step of a blueprint: a prompt, the tools it may reach for, the slice of
context it sees, and the edges leading out of it.

Everything here is what the blueprint declares, so a stage reads the same
however many runs have passed through it. A run occupies one stage at a
time and leaves along an edge once that edge's gate is satisfied.
"""
type Stage {
	"""
	Stage name, unique within the blueprint.
	"""
	name: String!
	"""
	How the stage runs.
	"""
	mode: StageMode!
	"""
	One line on what the stage is for.
	"""
	description: String
	"""
	Extra prompt text for when the stage is choosing where to go next.
	"""
	transitionPrompt: String
	"""
	Which model this stage runs on, and what it asks of it.
	"""
	model: StageModelConfig!
	"""
	The only tools the model is offered here. Group tokens (`@all`,
	`@builtin`, `@subagent`, `@scripts`, `@mcp`) stand for whole sources and
	resolve at spawn.
	
	Names rather than tools: a blueprint may name a tool this machine does
	not have, and resolving would drop it. Read `tools` for what is here.
	"""
	availableTools: [String!]!
	"""
	Tools this stage cannot work without. These survive an unattended run,
	where the blocking interaction tools are otherwise withheld.
	"""
	requiredTools: [String!]!
	"""
	MCP servers whose whole tool set this stage may use.
	"""
	availableConnectors: [String!]!
	"""
	Inference-turn bound for one visit to this stage.
	"""
	maxIterations: Int
	"""
	How many times the run may re-enter this stage.
	"""
	maxRevisits: Int
	"""
	What this stage must submit before it transitions. Null when it may
	leave without producing anything.
	"""
	outputRequirement: OutputRequirement
	"""
	The shape this stage's answer must take, narrowing the blueprint's own.
	Declaring a shape is not demanding one: that is `outputRequirement`.
	"""
	output: OutputSpec
	"""
	What this stage takes as typed parts, when its regions do not already
	say.
	"""
	input: StageInput!
	"""
	Whether `sendMessage` reaches a run parked in this stage.
	"""
	acceptsMessages: Boolean!
	"""
	Whether this stage may end the run outright.
	"""
	allowComplete: Boolean!
	"""
	Whether this stage may run as a fan-out worker or sub-agent.
	"""
	allowAsWorker: Boolean!
	"""
	Whether this stage may not finish until its child runs complete.
	"""
	requiresChildren: Boolean!
	"""
	Records that the author deliberately offers the human-in-the-loop tools
	while this stage runs autonomously.
	
	Grants nothing and changes no behaviour. Its one consumer is
	`lev validate`, where it silences the
	`blocking-tool-in-autonomous-stage` lint. An autonomous stage that
	calls one of those tools with nobody attached parks in `WAITING_INPUT`
	until a person answers or the run is cancelled.
	"""
	declaresBlockingTools: Boolean!
	"""
	The prompt guidance this stage declares, before the cascade.
	"""
	toolGuidance: ToolUseGuidance!
	"""
	What this stage does with each tool it names, where that differs from the
	blueprint's own rules. A stage may only tighten them.
	"""
	toolPermissions: [ToolPermissionRule!]!
	"""
	What each tool may be handed here, as mime patterns.
	"""
	toolAccepts: [ToolAcceptRule!]!
	"""
	Where this stage's tool results land in its context. Null leaves the
	daemon's own routing.
	"""
	toolRouting: ToolRouting
	"""
	Where the parts this stage produces are written, by mime pattern.
	"""
	outputRouting: [OutputRoute!]!
	"""
	Which regions this stage adds, hides or empties.
	"""
	context: StageContext!
	"""
	What happens when the model answers with text before calling any tool.
	Null inherits the blueprint's setting.
	"""
	nudge: NudgeConfig
	"""
	Where this stage's tools run. Null inherits the blueprint's setting.
	"""
	sandbox: SandboxConfig
	"""
	What this stage asks of the taint layer. Null inherits the blueprint's
	setting, which inherits the machine's.
	"""
	security: BlueprintSecurity
	"""
	The scripts this stage runs at points in its own lifecycle. Null when it
	declares none, which costs nothing at run time.
	"""
	hooks: StageHooks
	"""
	The checkpoints this stage raises, where the run waits for a person.
	Empty for every mode but `INTERACTIVE_POINTS`.
	"""
	interactionPoints: [InteractionPoint!]!
	"""
	What this stage splits into, for a `FAN_OUT` stage. Null for every other
	mode.
	"""
	fanOut: FanOut
	"""
	What this stage's settings resolve to against this machine's config, as
	they would for a run spawned now.
	
	The fields above are what the author declared, which is a different
	question: a stage that declares nothing still runs with something.
	"""
	effective: EffectiveStageSettings!
	"""
	Outgoing edges. An empty list marks a terminal stage.
	"""
	transitions: [TransitionEdge!]!
}

"""
Which regions a stage adds, hides or empties on its way in.
"""
type StageContext {
	"""
	Regions this stage declares of its own, beyond the blueprint's layout.
	
	Every one is declared right here, so this list is always the whole of
	what the stage wrote.
	"""
	regions: [Region!]!
	"""
	Regions kept out of this stage's prompt. The contents survive; the stage
	simply does not see them.
	
	Declared names only. `hideNames` carries every name the stage wrote,
	which is where a name with no declaration stays readable.
	"""
	hide: [Region!]!
	"""
	Every name the stage wrote in `hide`, verbatim and in order, declared or
	not.
	"""
	hideNames: [String!]!
	"""
	Regions emptied as this stage is entered.
	
	Declared names only, and a stage resetting `conversation` is the ordinary
	case of a name with no declaration: the runtime carries that region
	whatever a manifest says. `resetNames` carries every name the stage
	wrote.
	"""
	reset: [Region!]!
	"""
	Every name the stage wrote in `reset`, verbatim and in order, declared or
	not.
	"""
	resetNames: [String!]!
}

"""
The scripts a stage runs at points in its own lifecycle.

Each names a Rhai file relative to the blueprint. The function a script has to
define is named for the field it is given as, so one file may back several
hooks. A stage that declares none costs nothing: no file is read and no
engine is built.
"""
type StageHooks {
	"""
	As the stage is entered, before its first inference.
	"""
	onStageEnter: String
	"""
	When the stage finishes, before its transitions are considered.
	"""
	onStageExit: String
	"""
	With the context assembled, before the request goes out.
	"""
	beforeInference: String
	"""
	With the model's answer in hand, before it reaches the context.
	"""
	afterInference: String
	"""
	With the model's tool calls, before the permission and taint layers see
	them, so a hook can narrow what runs and never widen it.
	"""
	onToolCall: String
	"""
	Once, when the run finishes successfully.
	"""
	onCompletion: String
	"""
	Once, when the run finishes in error.
	"""
	onError: String
}

"""
What a stage takes as typed parts.

Both lists empty means the stage takes whatever the regions it sees accept,
which is the usual case: a stage says this only when it wants something
narrower or wider than its regions imply.
"""
type StageInput {
	"""
	Mime patterns this stage takes as parts.
	"""
	accepts: [String!]!
	"""
	Mime patterns whose parts reach the model as text whatever that model
	takes. For a type the registry already calls text this changes nothing.
	"""
	asText: [String!]!
}

"""
How a stage runs.
"""
enum StageMode {
	"""
	The tight loop: infer, act on tool calls, repeat until a transition
	fires.
	"""
	AUTONOMOUS
	"""
	Pauses for a person at every step.
	"""
	INTERACTIVE
	"""
	Holds at each declared interaction point instead of at every step.
	"""
	INTERACTIVE_POINTS
	"""
	Splits work across worker runs, then continues.
	"""
	FAN_OUT
	"""
	Produces the run's final answer and nothing else.
	"""
	OUTPUT
}

"""
A stage's model block.
"""
type StageModelConfig {
	"""
	The models to try, best first. The first whose provider is configured on
	this machine is the one that runs.
	"""
	models: [StageModelRoute!]!
	"""
	Whether the machine's own default model may stand in when none of the
	listed models is configured. False makes the list a requirement.
	"""
	allowUserDefault: Boolean!
	"""
	What the stage asks of the model it lands on.
	"""
	parameters: ModelParameters!
	"""
	A per-stage deadline for one inference, in seconds, including retries.
	Null leaves the daemon's own deadline in place.
	"""
	requestTimeoutSecs: Int
}

"""
One provider and model, in a stage's ordered list.
"""
type StageModelRoute {
	"""
	The provider that serves it, as the config names providers.
	"""
	provider: String!
	"""
	The model id, as that provider spells it.
	"""
	model: String!
}

"""
One provider and model a stage ran an inference on.

Both halves, because neither identifies what ran on its own: one provider
serves many models, and one model is spelled differently by each provider
that routes to it.
"""
type StageModelUse {
	"""
	The registered provider that served the call.
	"""
	provider: String!
	"""
	The model the call named, spelled as that provider spells it.
	"""
	model: String!
}

"""
One stage's record within a run: what it cost, and how often it ran.
"""
type StageRecord {
	"""
	The stage's name.
	"""
	name: String!
	"""
	Visit order within the blueprint.
	"""
	index: Int!
	"""
	The stage's own lifecycle state.
	"""
	status: StageStatus!
	"""
	False when the run never reached this stage.
	"""
	entered: Boolean!
	"""
	Token roll-up for this stage, across every visit.
	"""
	usage: TokenUsage!
	"""
	Spend roll-up for this stage, across every visit.
	"""
	cost: CostBreakdown!
	"""
	What this stage actually ran on, in the order it first reached each
	entry.
	
	A list because a stage that fails over runs on more than one: the first
	entry is where it started, the last is where it ended up, and one entry
	means it never moved. Each pair appears once however many calls it
	served, so this is what ran and not how often.
	
	Null when the stage has run no inference at all - one the run never
	entered, one whose first call has not come back, one whose provider
	could not be reached, and every stage of a run that finished before
	Leviath recorded this. Choosing a model is not running on one, so there
	is nothing here to read as the stage's intended model.
	"""
	models: [StageModelUse!]
	"""
	How many times the run entered this stage.
	"""
	visitCount: Int!
	"""
	One entry per stay, capped when recorded. When `visitCount` is larger
	than this list, the roll-ups above are still the complete figures.
	"""
	visits: [StageVisit!]!
	"""
	The most each region held while this stage was active.
	"""
	regionPeaks: [RegionPeak!]!
	"""
	Whether the runaway detector fired here.
	"""
	runawayWarned: Boolean!
	"""
	First entry, unix epoch seconds.
	"""
	startedAt: Timestamp
	"""
	Last exit; null while the stage is active.
	"""
	endedAt: Timestamp
	"""
	The working span in progress; null while the clock is stopped.
	"""
	active: WorkingClock
}

"""
A stage's own lifecycle state within a run.
"""
enum StageStatus {
	"""
	Declared but not yet entered.
	"""
	PENDING
	"""
	The stage the run is in right now.
	"""
	ACTIVE
	"""
	Entered, and blocked on a person answering.
	"""
	WAITING_INPUT
	"""
	Finished and left.
	"""
	COMPLETE
	"""
	Ended in a failure. The run's own error carries the message.
	"""
	ERROR
	"""
	The run finished without ever entering this stage.
	"""
	SKIPPED
}

"""
The run entered a new stage.
"""
type StageTransition {
	"""
	The run.
	"""
	runId: String!
	"""
	The agent's live id.
	"""
	agentId: String!
	"""
	The stage it left.
