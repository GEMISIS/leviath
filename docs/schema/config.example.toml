# A config.toml exercising every section, as the fixture behind two checks:
# it must satisfy config.schema.json, and it must deserialize into `Config`.
# One of those alone would let the schema and the struct drift apart.
#
# Not a recommended configuration. Nothing here is required, and a real install
# with one provider key needs almost none of it.

default_provider = "anthropic"
default_model = "claude-sonnet-5"
agent_paths = ["~/work/agents"]
openrouter_api_key = "sk-or-example"
ollama_base_url = "http://localhost:11434"
request_timeout_secs = 600
taint_tracking = false
update_check = true
batch_tool_hint = true
shell_hint = true

[providers]
anthropic_api_key = "sk-ant-example"
openai_api_key = "sk-example"
google_api_key = "AIza-example"
# Reach a provider through an enterprise gateway instead of the vendor's host.
# Unset means the vendor's own endpoint. One per provider, because a gateway
# usually fronts one family.
anthropic_base_url = "https://gateway.example.internal/v1"
openai_base_url = "https://gateway.example.internal/v1"
google_base_url = "https://gateway.example.internal/v1"
openrouter_base_url = "https://gateway.example.internal/v1"
claude_code_enabled = false
# How long a cached prompt prefix survives: "5m" (free, default) or "1h".
anthropic_cache_ttl = "5m"
claude_code_binary = "/usr/local/bin/claude"
claude_code_effort = "medium"
# Offer Ollama. Opt-in like everything else: setting `ollama_base_url` above
# also counts as choosing it.
ollama_enabled = false
# Bill inference to a ChatGPT subscription instead of an API balance.
# Sign in from `lev setup` (or `lev auth login codex` on a headless machine);
# the grant is stored outside this file and its token renews itself.
codex_enabled = false
codex_originator = "leviath"
# Accepted values differ per model: gpt-5.5 rejects "minimal", and a model
# that must reason rejects "none". "low" and above work everywhere so far.
codex_reasoning_effort = "medium"
codex_verbosity = "medium"
codex_replay_reasoning = true
fallback_order = ["anthropic/claude-sonnet-5", "openai/gpt-5.4-mini"]

[limits]
max_concurrent_inferences = 8
max_concurrent_tools = 8
default_max_iterations = 50
stream_inference = true
script_shell_timeout_secs = 60
script_http_timeout_secs = 30
script_http_max_per_host = 4
mcp_idle_disconnect_secs = 60
stall_timeout_secs = 60
dead_cycles_before_relief = 10
finished_retention_secs = 300
wedge_timeout_secs = 0
provider_failures_before_open = 3
provider_circuit_cooldown_secs = 300
# Unset, a prompt waits for a person until answered. Set this to bound the
# wait for a run nobody will be watching; an expiry denies, never approves.
# interaction_timeout_secs = 3600
inference_retry_attempts = 4
inference_retry_base_ms = 1000
max_agents_per_run = 0
notify_spend_usd = [1.0, 5.0]
# How much an agent may write to disk. Unset in code and written by `lev setup`:
# delete either line to remove that limit. Running out of disk is refused
# separately and is not configurable.
max_tool_call_write_bytes = 2147483648
max_run_write_bytes = 10737418240

# Override the global cap for one model. Every model not listed uses
# max_concurrent_inferences above.
[limits.max_concurrent_inferences_by_model]
"gpt-oss-120b" = 2

# Bound one provider across every model it serves - a second cap on top of the
# per-model pool, for a metered API where the point is bounding spend. Shapes
# concurrency; [rate_limits.<provider>] shapes rate.
[limits.max_concurrent_inferences_by_provider]
cerebras = 1

[security]
allowed_workdirs = ["~/work"]
allow_seed_commands = true
allow_local_network = false
allow_env_vars = ["MY_BUILD_TOKEN"]
allow_blueprint_read_paths = false
allow_blueprint_safe_commands = false
allow_blueprint_permissions = false
shell_env = "filtered"
shell_env_withhold = []
read_paths = ["~/reference"]
credential_store = "file"

[serve]
max_concurrent_requests = 64
request_timeout_secs = 30

[webhook]
max_retries = 3
base_delay_ms = 500
max_delay_ms = 30000
timeout_secs = 10

[observability]
enabled = false
exporter = "otlp"
endpoint = "http://localhost:4318"
service_name = "leviath"

[nudge]
enabled = true
max = 3
text = "You are in {stage} and have not written to {regions}."

[title]
enabled = true
provider = "anthropic"
model = "claude-sonnet-5"

[sandbox]
kind = "none"
image = "debian:stable-slim"
engine = "docker"
network = false
mounts = ["/opt/toolchain:ro"]
persist = false
on_unavailable = "error"

[tool_permissions]
read_file = "allow"
write_file = "ask"
shell = "ask"

[agent_tool_permissions.coder]
shell = "allow"

[tool_script_permissions]
http_get = "inherit"
http_post = "deny"
shell = "inherit"
read_file = "inherit"
write_file = "inherit"
env_var = "deny"

[agent_read_paths.reviewer]
allow = ["~/reference", "glob:~/schemas/**/*.json"]

# What runs without an approval prompt. A shell entry is a program, optionally
# with the subcommand that narrows it, so `git status` never covers `git push`.
[safe_commands]
defaults = true
tools = ["read_files"]
shell = ["cargo test", "rg"]

[agent_safe_commands.reviewer]
shell = ["cargo clippy"]
allow_blueprint = true

[rate_limits.anthropic]
requests_per_minute = 50
tokens_per_minute = 100000

# Every field is optional: name only what you are correcting, and the rest keeps
# whatever the provider reports for that model.
[model_capabilities."my-local-llama"]
supports_temperature = true
supports_streaming = true
supports_tools = false
supports_system_prompt = true
max_context_tokens = 32768
max_output_tokens = 4096

# The common shape - one wrong number, one line.
[model_capabilities."moonshotai/kimi-k3"]
max_context_tokens = 1048576

[model_providers.groq]
script = "groq.rhai"
api_key = "gsk-example"
base_url = "https://api.groq.com/openai/v1"

[model_providers.groq.rate_limit]
requests_per_minute = 30
tokens_per_minute = 60000

# A server that speaks OpenAI's chat API needs no script: llama.cpp, LM Studio,
# vLLM, BionicGPT or a gateway. base_url is required; api_key, headers and
# models are optional. models is read only when GET /models fails.
# [model_providers.llama-cpp]
# kind = "openai-compatible"
# base_url = "http://localhost:8080/v1"
# api_key = "..."
# models = ["qwen3-8b"]
#
# [model_providers.llama-cpp.headers]
# X-Org = "research"

[[mcp_servers]]
name = "filesystem"
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

[mcp_servers.env]
NODE_ENV = "production"

[[mcp_servers]]
name = "remote"
transport = "http"
url = "https://mcp.example.com/v1"

[mcp_servers.headers]
Authorization = "Bearer ${MY_MCP_TOKEN}"
