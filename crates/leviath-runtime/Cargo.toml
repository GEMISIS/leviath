[package]
name = "leviath-runtime"
description = "ECS-based agent execution engine for Leviath"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# Not published to crates.io: Leviath ships as the `lev` binary (via Homebrew,
# the install script, or `cargo install --git`), and these are its internal
# crates. Saying so explicitly prevents an accidental `cargo publish` and lets
# cargo-deny treat the intra-workspace `path` dependencies as what they are
# rather than as unbounded version requirements. Remove this line if a crate is
# ever meant to be published - at which point its path deps need versions too.
publish = false

[dependencies]
leviath-core = { workspace = true }
# Custom-region Rhai hooks (render/on_write/on_overflow). The boundary is
# JSON-in/JSON-out, so this crate needs no direct rhai dependency.
leviath-scripting = { workspace = true }
# Control-channel token generation.
rand = { workspace = true }
leviath-providers = { workspace = true }
# For the control socket's file permissions and peer-uid check. `leviath-sys`
# has no leviath dependencies of its own, so this adds no cycle.
leviath-sys = { workspace = true }
leviath-tools = { workspace = true }
bevy_ecs = { workspace = true }
bevy_tasks = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
leviath-testkit = { workspace = true }
async-trait = "0.1"
temp-env = { workspace = true, features = ["async_closure"] }
tempfile = "3"

[lints]
workspace = true
