[package]
name = "leviath-core"
description = "Core types and traits for Leviath: context regions, memory layouts, blueprints, and lifecycle policies"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# Not published to crates.io: Leviath ships as the `lev` binary (via Homebrew,
# the install script, or `cargo install --git`), and these are its internal
# crates. Saying so explicitly prevents an accidental `cargo publish` and lets
# cargo-deny treat the intra-workspace `path` dependencies as what they are
# rather than as unbounded version requirements. Remove this line if a crate is
# ever meant to be published — at which point its path deps need versions too.
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
dirs = { workspace = true }
# For the shared HTTP client factory (`leviath_core::net::client_builder`), so
# every outbound client in the workspace starts from one timeout + redirect
# policy instead of a bare `Client::new()` with neither.
reqwest = { workspace = true }

[dev-dependencies]
# Real directories and real symlinks: the path-containment tests are about what
# the filesystem actually does, so a mock would test the mock.
tempfile = "3"
temp-env = { workspace = true }

[lints]
workspace = true
