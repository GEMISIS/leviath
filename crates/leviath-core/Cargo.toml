[package]
name = "leviath-core"
description = "Core types and traits for Leviath: context regions, memory layouts, blueprints, and lifecycle policies"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
dirs = { workspace = true }
# For the shared HTTP client factory (`leviath_core::net::client_builder`), so
# every outbound client in the workspace starts from one timeout + redirect
# policy instead of a bare `Client::new()` with neither.
reqwest = { workspace = true }
# The `[read_paths]` allowlist matcher (`leviath_core::read_paths`): glob and
# regex entries compile at spawn and match against symlink-resolved paths.
glob = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
# A redirecting server, so the redirect policy is verified by following one
# rather than by testing the decision it delegates to.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
# Real directories and real symlinks: the path-containment tests are about what
# the filesystem actually does, so a mock would test the mock.
tempfile = "3"
temp-env = { workspace = true }

[lints]
workspace = true
