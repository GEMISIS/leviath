[package]
name = "leviath-sys"
description = "Platform/OS-specific system calls for Leviath, isolated behind a cross-platform API: file permissions, detached process spawning, signals, controlling TTY, and executable resolution"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# Not published to crates.io: Leviath ships as the `lev` binary (via Homebrew,
# the install script, or `cargo install --git`), and these are its internal
# crates. Saying so explicitly prevents an accidental `cargo publish` and lets
# cargo-deny treat the intra-workspace `path` dependencies as what they are
# rather than as unbounded version requirements. Remove this line if a crate is
# ever meant to be published — at which point its path deps need versions too.
publish = false

[dependencies]
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
