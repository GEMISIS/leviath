[package]
name = "leviath-net"
description = "Outbound-request policy for Leviath: which URLs an agent-driven fetch may reach, the HTTP clients that enforce it, and the SSE framing they share"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# The reason this is a crate of its own: `reqwest` pulls a little over a
# hundred crates, and `leviath-core` holds plain serializable data with no
# async dependencies, so depending on Leviath's data types must not cost a full
# HTTP client and everything under it.
reqwest = { workspace = true }
# The decoder `reqwest::Response::text` uses, so a capped read of a body
# declaring `charset=` decodes it the same way the uncapped one did.
encoding_rs = "0.8"
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# The always-on tracing subscriber, so the `debug!` on a refused URL runs
# under test rather than sitting behind a level check nothing enables.
leviath-testkit = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
