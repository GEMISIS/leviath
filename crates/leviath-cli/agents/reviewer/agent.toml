[blueprint]
name = "reviewer"
version = "0.4.0"
description = "Code review agent - discover, scan, review the areas in parallel, then deep review and report, with error recovery and multi-provider fallback"

# discover -> scan -> split_review (review_worker x N) -> deep_review -> report -> summary
#
# `error_handler` is reached only through an `error` edge, so it never shows up
# in a run that goes well.

[graph]
entry = "discover"

# Read-only agent: it inspects a diff/codebase and reports. No write access.
tool_permissions = { read_file = "allow", list_dir = "allow", bash = "ask" }

compaction = { model = { provider = "anthropic", model = "claude-sonnet-5-5" }, max_summary_tokens = 2000, temperature = 0.2 }

# What the caller asked for, if anything (`--task`), and - when this blueprint
# is running as one of its own fan-out workers - the area `split_review` gave
# it. A worker's item also fills `diff` with its hunks, `criteria` with its
# focus and `conventions` with what this project calls correct.
[[graph.inputs]]
name = "task"
type = { kind = "text", multiline = true }
binds = [{ region = "task" }]

# The code/diff to review - required. Supply via `--diff <text|@file>` (CLI),
# or as the `diff` input of a spawn request (`"inputs": {"diff": ...}` over the
# API, or `_leviath/spawn` over the Agent Client Protocol).
[[graph.inputs]]
name = "diff"
type = { kind = "text", multiline = true }
required = true
binds = [{ region = "diff" }]

# Optional caller focus, e.g. --criteria "focus on security / backwards-compat".
[[graph.inputs]]
name = "criteria"
type = { kind = "text", multiline = true }
binds = [{ region = "review_criteria" }]

# What this project calls correct, verbatim from `discovery`: what
# `split_review` hands each worker, which does not share the discover stage's
# context. A run started by a person leaves it out.
[[graph.inputs]]
name = "conventions"
type = { kind = "text", multiline = true }
description = "For an area reviewer: what this project calls correct, from the discover stage."
binds = [{ region = "conventions" }]

# Optional screenshots of the change (a mockup, a before and an after):
# `--attach before.png:screenshots --attach after.png:screenshots`, or a
# `@path` in `--criteria`.
[[graph.inputs]]
name = "screenshots"
type = { kind = "text", multiline = true }
binds = [{ region = "screenshots" }]

# ─── Context layout ──────────────────────────────────────────────────────────
# Budgets are a percentage of the model's context window, and the percentage is
# the whole answer: every region scales with whatever model the stage runs on.
# There are no absolute token caps on top, because a cap below the percentage
# silently wins on every window worth having, which is how a 1M-context run
# ends up with a 40k findings region. Percentages are ceilings, not
# reservations: a region costs only what is stored in it, so a ceiling it never
# reaches is free, and they may sum past 100% because regions rarely fill
# together.
[graph.layout]
total_budget_tokens = 0
regions = [
    # The `task` input: the caller's request, or, for a fan-out worker, the area
    # it reviews.
    { name = "task", kind = "pinned", budget = "2%", volatility = "stable" },
    { name = "diff", kind = "pinned", budget = "20%", required = true, required_message = "Provide the code or diff to review via --diff <text|@file>.", volatility = "stable" },
    { name = "review_criteria", kind = "pinned", budget = "2%", volatility = "stable" },
    # An area reviewer's copy of this project's conventions, from its work item.
    { name = "conventions", kind = "pinned", budget = "3%", volatility = "stable" },
    # Typed `image/*`, so a model that can see them does, and one that cannot
    # gets a stand-in naming each. Six at most; older ones go.
    { name = "screenshots", kind = "pinned", budget = "6%", volatility = "stable", accepts = ["image/*"] },
    # Pre-loaded on startup: architecture / conventions (missing files skipped).
    { name = "project_context", kind = "pinned", budget = "4%", volatility = "stable", seed = { files = ["ARCHITECTURE.md", "DESIGN.md", "docs/ARCHITECTURE.md", "CONVENTIONS.md", "CONTRIBUTING.md", "README.md"] } },
    # Deterministic repo scan, run once at spawn, so the discover stage starts
    # from facts instead of burning iterations on `ls`. `git ls-files` behaves
    # the same in POSIX and Windows shells; outside a git repo it fails and the
    # region is left empty, and output past the budget is trimmed. Refuse it
    # with `--no-seed-commands` or `[security] allow_seed_commands = false`.
    { name = "repo_files", kind = "pinned", budget = "3%", volatility = "stable", seed = { command = "git ls-files" } },

    # ── Discovery: written by the discover stage, read by every later stage.
    # Pinned, so no edge can clear or compact them. `required` puts the
    # runtime's own gate behind them: the discover stage is run again with a
    # nudge until it actually fills them.
    { name = "discovery", kind = "pinned", budget = "4%", required = true, required_message = "Populate `discovery` (context_write) with this project's build system, test runner, layout and conventions before leaving the discover stage.", volatility = "grows" },
    { name = "workflow", kind = "pinned", budget = "2%", required = true, required_message = "Populate `workflow` (context_write) with the literal VERIFY / DONE WHEN lines before leaving the discover stage.", volatility = "grows" },

    # The area workers' submitted findings, on the way into the deep review. Its
    # budget is what each worker's share is divided from, so it gets a slice the
    # size of the findings region it feeds. Clearable: once the deep review has
    # folded the findings in, the raw worker report is safe to drop.
    { name = "worker_findings", kind = "clearable", budget = "20%" },

    # Accumulated review findings and the running severity tally.
    # Declared `grows` because it is appended to and never rewritten: tool
    # results land here and earlier ones stay put. Undeclared it would default
    # to `rewritten`, which assumes the whole region changes every turn and so
    # caches none of it - measured at 4% cache hits on a run where this region
    # held 280K tokens, every one of them re-sent and re-paid on every single
    # inference.
    # Sized by the percentage alone, with no budget max: a max binds on every
    # model above the window it was chosen for, so the percentage - which is
    # the whole mechanism for scaling with the model in front of you - would
    # decide nothing across the range anyone runs on. The size is not the fault
    # anyway. 280K tokens re-sent at 4% cached is expensive; the same 280K
    # mostly cached is not, and the `volatility` is what makes the difference.
    { name = "findings", kind = "temporary", budget = "20%", volatility = "grows" },
    { name = "severity_index", kind = "pinned", budget = "2%" },
    { name = "report", kind = "clearable", budget = "7%" },

    # The message stream. Every blueprint needs an explicit sliding_window
    # `conversation` region: the layout that replaces it on each stage
    # transition is rebuilt from this list, so an auto-added one would be
    # dropped after stage 1.
    { name = "conversation", kind = { kind = "sliding_window", max_items = 30, eviction = { bulk = 10 } }, budget = "15%" },

    # Written by the RUNTIME on an abnormal stage ending: a failed inference
    # call's error text, or a note that a stage hit its iteration cap. Pinned so
    # it survives the edge into the stage that acts on it.
    { name = "error_report", kind = "pinned", budget = "1%" },
]

# ─── Stage 1: Discover ────────────────────────────────────────────────────────
# A reviewer that doesn't know how to run this project's tests can only assert;
# one that does can verify. Map the project first, then review. Cheap model,
# hard iteration cap, one non-error edge (auto-followed, no routing call).
[[graph.stages]]
name = "discover"
description = "Map the project and work out how to verify a hypothesis in it"
model = { models = [{ model = "claude-sonnet-5-5" }, { model = "gpt-5.4-mini" }, { model = "gemini-3.5-flash" }, { provider = "ollama", model = "qwen3.5:9b" }] }
tools = ["read_file", "list_dir", "bash", "context_write"]
max_iterations = 6
max_revisits = 2
system_prompt = """
Before reviewing anything, work out what this project is and how a claim about it
can be CHECKED rather than asserted. Do not review the diff here.

Start from what you already have - do not rediscover it:
- `repo_files` holds the tracked file list (empty if this isn't a git repo).
- `project_context` is pre-loaded with architecture/conventions docs.
- If `CLAUDE.md`, `AGENTS.md`, `CONTRIBUTING.md` or
  `.github/copilot-instructions.md` exist, read them - they usually state the
  test command and the review bar directly.

Fill gaps with list_dir/read_file. Use bash ONLY read-only, to interrogate the
tooling (e.g. `pytest --collect-only -q`, `cargo test --list`, `npm run`). This
agent has no write access; never attempt to modify anything.

Write `discovery` (context_write): language, build system, test runner, the
command to run a SINGLE test or file, directory layout, and the conventions this
project actually holds itself to (which is what "correct" means in the review).

Write `workflow` (context_write) ending with these two literal lines, which the
deep review uses to confirm hypotheses instead of guessing:
  VERIFY: <command to run one test or check, or "none - no runnable suite">
  DONE WHEN: <what makes this review complete and trustworthy>"""

[[graph.edges]]
name = "error_handler"
from = "discover"
to = "error_handler"
when = "error"

[[graph.edges]]
name = "scan"
from = "discover"
to = "scan"
hint = "Project mapped - begin the review"

# ─── Stage 2: Scan ────────────────────────────────────────────────────────────
[[graph.stages]]
name = "scan"
description = "Fast first pass for obvious issues"
model = { models = [{ model = "claude-sonnet-5-5" }, { model = "gpt-5.4-mini" }, { model = "gemini-3.5-flash" }, { provider = "ollama", model = "qwen3.5:9b" }] }
tools = ["read_file", "list_dir", "context_append", "context_read"]
max_iterations = 12
# Passive reads go to `findings`; everything else stays in conversation.
tool_routing = { default_region = "conversation", tool_regions = { read_file = "findings", list_dir = "findings" }, keep_results = true }
system_prompt = """
Do a fast first pass over the code in the `diff` region (and read_file for
surrounding context). Honor any focus in `review_criteria`, and use `discovery`
(this project's layout and conventions, mapped by the discover stage) plus
`project_context` to judge what "correct" means here. If `screenshots` holds
images, they show what the change is meant to look like or what it broke:
check the diff against them, and say when the code cannot produce what they show.

Flag the obvious red flags - don't go deep yet:
- Security: injection, unsafe deserialization, secrets in code, missing authz.
- Correctness smells: unhandled errors, nil/None derefs, off-by-one, dead code.
- Missing input validation, TODO/FIXME markers, and anything that looks risky.

Append the flagged areas (file + one line each) to the `findings` region via
context_append - this is the worklist the deep review scrutinizes."""

[[graph.edges]]
name = "error_handler"
from = "scan"
to = "error_handler"
when = "error"

# Un-exhaustible escape (lint: dead-end-possible): when every looping
# target has spent its max_revisits budget, the run can still move forward
# to the deliverable instead of dead-ending.
[[graph.edges]]
name = "report"
from = "scan"
to = "report"
when = "dead_end"
hint = "The review stages are out of revisits - report the scan findings"
carry = { compact = {} }

[[graph.edges]]
name = "split_review"
from = "scan"
to = "split_review"
hint = "First pass complete - hand the flagged areas out for review"

# ─── Stage 3: Split review ────────────────────────────────────────────────────
# One worker per area of the change, so forty files get read at once instead of
# one after another - and each area is read by a reviewer whose context holds
# nothing but that area. The workers hand back findings; the deep review merges
# them and does the work that needs the whole picture.
[[graph.stages]]
name = "split_review"
description = "Split the change into areas, one reviewer each"
model = { models = [{ model = "claude-sonnet-5-5" }, { model = "gpt-5.4-mini" }, { model = "gemini-3.5-flash" }, { provider = "ollama", model = "qwen3.5:9b" }] }
tools = ["fan_out"]
max_iterations = 4
# split_review <-> error_handler is a cycle, so it needs a ceiling. One retry is
# enough to route around a transient failure; a second means the change cannot
# be split usefully and the run should review what it has rather than keep
# splitting.
max_revisits = 1

# An area nobody could review is a gap in the report, not a reason to throw the
# others away, so a failed worker does not end the stage: it is named in the
# results, and the deep review is told to cover its area itself.
[graph.stages.mode.fan_out]
worker = { stage = "review_worker" }
merge_stage = "deep_review"
# Every area at once rather than in waves; the daemon's inference pool paces the
# requests. Set to 0 for no cap at all.
max_workers = 30
# Where the workers' findings land, and the budget their shares divide. A region
# of its own rather than the conversation, which is carrying the message history
# alongside them.
results_region = "worker_findings"
# A ceiling on areas, not just on concurrency. Thirty areas covers a change of
# any size while leaving each worker a usable share of the region for its
# finding list; the merge is told when that share had to be trimmed. Set to 0
# for no ceiling.
max_items = 30
split_prompt = """
Split this review into areas that can be scrutinized independently, one work
item each. An area is a file, a module, a subsystem, or one coherent group of
hunks - whatever divides the change without two workers reviewing the same
lines. Start from the areas `findings` already flags.

Call `fan_out` with one entry in `items` per work item:

  items: [{"id": "<short-slug>", "inputs": {"task": "<the files or hunks to review>", "diff": "<the diff hunks for this area, verbatim>", "criteria": "<what to look hardest at here>", "conventions": "<what this project calls correct, verbatim from discovery>"}}]

Those four are the only inputs a worker takes. Every item MUST carry its diff
and the conventions: workers do not share this
agent's context, so the work item is all they get. A worker that does not know
what this project holds itself to can only offer generic advice.

A small change is ONE item, not one per hunk. Split when there is genuinely more
ground than a single reviewer can hold at once.
"""

[[graph.edges]]
name = "error_handler"
from = "split_review"
to = "error_handler"
when = "error"

# ─── Worker: review one area ─────────────────────────────────────────────────
# Entered as a sub-agent, one per area. It hands back findings, which the deep
# review merges. `require_output` is what makes that a guarantee rather than a
# hope. Same models as the deep review: this IS the deep review, on one area.
# No bash here - a worker's hypothesis checks would raise four approval prompts
# at once, so verification stays in the merge, where `workflow`'s VERIFY line is.
[[graph.stages]]
name = "review_worker"
description = "Review one area of the change in depth"
model = { models = [{ model = "claude-opus-5-5" }, { model = "gpt-5.5" }, { model = "gemini-3.1-pro-preview" }, { provider = "ollama", model = "devstral:24b" }, { provider = "ollama", model = "qwen3.5:9b" }] }
tools = ["read_file", "list_dir", "submit_output"]
max_iterations = 20
allow_as_worker = true
require_output = true
system_prompt = """
Review ONE area. `task` names it, `diff` holds its hunks, `review_criteria`
says what to look hardest at, and `conventions` holds what this project calls
correct - it is all the context you get, so work from it.

Run the same framework the deep review does, on your area only:
  1. Correctness - does it do what it intends? Trace the logic.
  2. Security - injection, authz, secret handling, unsafe input.
  3. Performance - hot-path allocations, N+1 queries, needless work.
  4. Maintainability - clarity, naming, duplication, conventions.
  5. Test coverage - are the risky paths actually tested?

Read the surrounding code with read_file before judging a hunk. A diff read on
its own is how a reviewer reports a bug the caller already prevents.

Submit your findings with submit_output. Recommend fixes; never apply one - no
stage in this agent has a tool that writes, and calling one is refused.

A clean area is a result, not a failure: say so in one line rather than padding
the list. Only your submitted findings reach the merge - anything else you write
is lost."""

[graph.stages.output]
format = "markdown"
instructions = "One finding per line, most severe first, as `severity | file:line | what is wrong | the failure scenario | the fix`, with severity in {critical, warning, info}. A clean area is the single line `none | <area> | no findings`."

# ─── Stage 4: Deep review ─────────────────────────────────────────────────────
[[graph.stages]]
name = "deep_review"
description = "In-depth analysis of correctness, security, and architecture"
model = { models = [{ model = "claude-opus-5-5" }, { model = "gpt-5.5" }, { model = "gemini-3.1-pro-preview" }, { provider = "ollama", model = "devstral:24b" }, { provider = "ollama", model = "qwen3.5:9b" }] }
tools = ["read_file", "list_dir", "bash", "context_write", "context_append", "context_read"]
max_iterations = 25
max_revisits = 2
# Passive reads go to `findings`; bash (hypothesis checks) stays in conversation.
tool_routing = { default_region = "conversation", tool_regions = { read_file = "findings", list_dir = "findings" }, keep_results = true }
system_prompt = """
The area reviewers' findings are in the `worker_findings` region, one block per
area. Start there: fold each finding into `findings` (context_append), drop the
duplicates and anything that reads as generic advice, and check the ones that
would block a merge yourself. A worker reported as FAILED covered nothing - its
area is still unreviewed, so review it here.

Then scrutinize what no single area could show: the interactions between them,
and anything the workers left. If `screenshots` holds images, they are the
caller's evidence of intent or breakage; a finding that contradicts one should
say so. Work the review through a fixed framework so
nothing is skipped:
  1. Correctness - does it do what the task/diff intends? Trace the logic.
  2. Security - injection, authz, secret handling, unsafe input.
  3. Performance - hot-path allocations, N+1 queries, needless work.
  4. Maintainability - clarity, naming, duplication, conventions.
  5. Test coverage - are the risky paths actually tested?

For each finding give: location, the concrete failure scenario (inputs/state →
wrong result or crash), a severity (critical / warning / info), and a recommended
fix. Recommend it - do not apply it. This agent reads and judges; no stage here
has a tool that writes or edits a file, and calling one is refused. Append each finding to `findings` (context_append).

Keep a running tally in the `severity_index` region: rewrite it with
context_write each time the counts change, e.g. "critical: 2, warning: 5, info: 3".
This survives even if the finding detail is compacted, so the report stage always
has the totals.

Use bash only to CONFIRM a hypothesis, never to modify anything - `workflow`'s
VERIFY line holds the command this project actually uses to run one test. A
finding you were able to check beats one you reasoned your way to; say which it
is. Hold the review to `workflow`'s DONE WHEN line."""

[[graph.edges]]
name = "error_handler"
from = "deep_review"
to = "error_handler"
when = "error"

[[graph.edges]]
name = "report"
from = "deep_review"
to = "report"
hint = "Analysis complete - write the report"
carry = { compact = {} }

# ─── Stage 5: Report ──────────────────────────────────────────────────────────
[[graph.stages]]
name = "report"
description = "Produce an actionable, ranked review report"
model = { models = [{ model = "claude-sonnet-5-5" }, { model = "gpt-5.4-mini" }, { model = "gemini-3.5-flash" }, { provider = "ollama", model = "qwen3.5:9b" }] }
tools = ["read_file"]
max_iterations = 10
system_prompt = """
Produce the review report from the `findings` region, structured by the
`severity_index` tally so the counts and the report agree.

Order findings most-severe first and group by severity level:
  ## Critical - <must fix before merge>
  ## Warning  - <should fix>
  ## Info     - <nice to have>
For each: file and line, one-sentence defect summary, the failure scenario, and the
fix. End with a short overall assessment (ship / ship-with-fixes / needs-work) that
matches the severity_index totals.

If `error_report` says an earlier stage hit its iteration cap, the review was cut
off before covering everything - say so in the overall assessment and list what
went unreviewed."""

[[graph.edges]]
name = "summary"
from = "report"
to = "summary"
hint = "The review is written"

# ─── Stage 6: Error handler ───────────────────────────────────────────────────
[[graph.stages]]
name = "error_handler"
description = "Handle errors encountered during scanning or review"
model = { models = [{ model = "claude-sonnet-5-5" }, { model = "gpt-5.4-mini" }, { model = "gemini-3.5-flash" }, { provider = "ollama", model = "qwen3.5:9b" }] }
tools = ["read_file", "bash"]
max_iterations = 10
max_revisits = 1
system_prompt = """
An error occurred during review. The `error_report` region holds the error text
the runtime captured - read it first, note a workaround (e.g. skip an unreadable
file and record why), then return to deep_review to continue with the rest."""

[[graph.edges]]
name = "deep_review"
from = "error_handler"
to = "deep_review"
hint = "Recovered - resume the deep review"
carry = { compact = {} }

# Un-exhaustible escape (lint: dead-end-possible): when every looping
# target has spent its max_revisits budget, the run can still move forward
# to the deliverable instead of dead-ending.
[[graph.edges]]
name = "report"
from = "error_handler"
to = "report"
hint = "Recovery is not converging - report what was reviewed"
carry = { compact = {} }

# ─── Final output ────────────────────────────────────────────────────────────
# The last stage. An output stage hands back the run's answer with
# `submit_output`, must call it, and may end the run. No file tools on
# purpose: this stage reports, it does not work.
[[graph.stages]]
name = "summary"
description = "Say what the review found"
model = { models = [{ model = "claude-sonnet-5-5" }, { model = "gpt-5.4-mini" }, { model = "gemini-3.5-flash" }, { provider = "ollama", model = "qwen3.5:9b" }] }
mode = "output"
tools = ["submit_output"]
max_iterations = 8
allow_complete = true
require_output = true
system_prompt = """
Say what this review found, for whoever asked for it.

Lead with whether the change is safe to merge and why. Then the findings that
would block it, and the ones worth fixing later. Name the report file you wrote.

If nothing blocking turned up, say so plainly - a clean review is a result."""
