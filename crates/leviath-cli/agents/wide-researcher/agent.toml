[blueprint]
name = "wide-researcher"
version = "0.5.0"
description = "Broad multi-topic survey - cast a wide net, research the threads in parallel, compare approaches, and produce a landscape overview"

# survey -> investigate (fan out) -> compare -> deep_dive -> challenge -> summarize -> polish -> summary
#
# `compare` and `deep_dive` loop between themselves and back to `survey` until
# the threads worth reading have been read. `error_recovery` is reached only
# through an `error` edge, so it never shows up in a run that goes well.

[graph]
entry = "survey"
max_child_depth = 2

tool_permissions = { read_file = "allow", list_dir = "allow", web_search = "allow", web_fetch = "allow", current_time = "allow", write_file = "ask", bash = "ask" }

compaction = { model = { provider = "anthropic", model = "claude-sonnet-5" }, max_summary_tokens = 2000, temperature = 0.2 }

[[graph.inputs]]
name = "task"
type = { kind = "text", multiline = true }
required = true
binds = [{ region = "query" }]

[[graph.inputs]]
name = "scope"
type = { kind = "text", multiline = true }
binds = [{ region = "scope" }]

# How many threads are researched at once, over the 12 this blueprint runs
# by default: `lev run wide-researcher --input max_workers=4`.
[[graph.inputs]]
name = "max_workers"
type = { kind = "int", min = 1, max = 30 }
description = "How many threads are researched at once (12 when left out)."
binds = [{ fan_out_max_workers = "investigate" }]

# ─── Context layout ───────────────────────────────────────────────────────────
[graph.layout]
total_budget_tokens = 0
regions = [
    { name = "report_path", kind = "pinned", budget = "1%", description = "The exact filename of the report, written by the stage that created it so the polish stage rewrites that file rather than guessing among the workers' own reports in the same directory." },
    { name = "progress_report", kind = "clearable", budget = "1%", description = "What your last visit to this stage actually added, measured. Weigh another pass against it." },
    { name = "challenges", kind = "pinned", budget = "4%", description = "Adversarial challenges to the analysis: leads to check, not verdicts", volatility = "grows" },
    { name = "query", kind = "pinned", budget = "1%", required = true, required_message = "State the survey topic/area via --task.", volatility = "stable" },
    { name = "scope", kind = "pinned", budget = "1%", volatility = "stable" },
    { name = "environment", kind = "pinned", budget = "1%", volatility = "stable", seed = { tools = { calls = [{ tool = "current_time", args = {} }, { tool = "locale_info", args = {} }] } } },
    # `required`: the overview is built from this, and a stage that gathered
    # nothing would hand an empty bibliography to `summarize`, which writes the
    # references from memory rather than reporting that it had none. The gate
    # binds the stages that can write context and no-ops for the ones that
    # cannot, so it can never deadlock the deliverable.
    { name = "sources_index", kind = "pinned", budget = "3%", required = true, required_message = 'You have not recorded a single source in `sources_index`. Append one bibliography line per source you actually read (context_append, region="sources_index"): `[n] <title> - <url or path> - credibility: <high/med/low + why>`. If the searches came back empty or unavailable, record THAT as the finding - do not proceed as though sources were gathered.', volatility = "grows" },
    { name = "format", kind = "pinned", budget = "1%", volatility = "stable", seed = { literal = "Cite non-obvious claims as [n], matching a numbered entry in the Sources bibliography (title + URL/path). Write every marker as a link to the source it cites - `[[n]](<url>)`, which renders as [n] and clicks through - so a reader can check a claim without scrolling to the bibliography and pasting a URL by hand. Use the URL from that source's `sources_index` line; a source that has a local path instead of a URL stays a bare [n]. The bibliography entry keeps its full URL either way. Prefer comparison tables where they clarify tradeoffs. Credibility is about what a source IS, not how authoritative it sounds: only the primary artifact - the paper, the spec, the model card, the official docs, the registry or leaderboard - can be high for a factual claim about that artifact. A roundup, listicle or vendor blog is medium at best however confident its title, and a number that appears in exactly one such page with nothing corroborating it is low and says so. A claim about something the task names only as a comparison rests on what THIS run read about it, not on the credibility of your own topic's sources: grade it on that, and when a figure reaches you through a source that mentions a study rather than one that reports it, say so and grade it down." } },

    # Declared `grows` because it is appended to and never rewritten: tool results
    # land here and earlier ones stay put. Undeclared it would default to
    # `rewritten`, which assumes the whole region changes every turn and so caches
    # none of it - measured at 4% cache hits on a run where this region held 280K
    # tokens, every one of them re-sent and re-paid on every single inference.
    # Sized by the percentage alone, with no absolute ceiling on top: a ceiling
    # binds on every model above 200K, so the percentage - which is the whole
    # mechanism for scaling with the model in front of you - would decide nothing
    # across the range anyone runs on. The size is not the cost anyway. 280K
    # tokens re-sent at 4% cached is expensive; the same 280K mostly cached is
    # not, and `volatility` is what makes the difference.
    { name = "landscape", kind = "temporary", budget = "30%", volatility = "grows" },
    { name = "deep_dives", kind = { kind = "sliding_window", max_items = 15 }, budget = "8%" },
    # What the parallel researcher workers hand back, one entry each. Pinned: it is
    # the whole point of the fan-out, and compare reads it directly.
    { name = "thread_findings", kind = "pinned", budget = "20%", volatility = "grows" },
    { name = "comparisons", kind = "compacting", budget = "25%", compact_at = 0.8, volatility = "grows" },
    { name = "comparison_history", kind = { kind = "compact_history", source = "comparisons" }, budget = "3%", volatility = "grows" },

    { name = "conversation", kind = { kind = "sliding_window", max_items = 12, eviction = { bulk = 10 } }, budget = "12%" },

    # Written by the RUNTIME on an abnormal stage ending: a failed inference
    # call's error text, or a note that a stage hit its iteration cap. Pinned so
    # it survives the edge into the stage that acts on it.
    { name = "error_report", kind = "pinned", budget = "1%" },
]

# ─── Stage 1: Survey ──────────────────────────────────────────────────────────
[[graph.stages]]
name = "survey"
description = "Survey the landscape across multiple sub-topics"
model = { models = [{ model = "grok-4.6" }, { model = "claude-sonnet-5" }, { model = "gpt-5.4" }, { model = "gemini-3.5-flash" }, { provider = "ollama", model = "qwen3.5:9b" }] }
tools = ["web_search", "web_fetch", "read_file", "list_dir", "context_append", "current_time", "context_read", "ask_user_text", "ask_user_choice"]
max_iterations = 25
max_revisits = 2
# The ask tools block on a person, which is the point: this stage decides what
# the whole fan-out investigates. An unattended run is never offered them.
allow_blocking_tools = true
tool_routing = { default_region = "conversation", tool_regions = { web_search = "landscape", web_fetch = "landscape", read_file = "landscape", list_dir = "landscape" }, keep_results = true }
system_prompt = """
Map the landscape of the area in `query` (within any bounds in `scope`). Breadth
over depth:
- Major approaches / schools of thought, key players / projects / companies
- Current state of the art; what's active vs mature vs abandoned

Run web_search across the distinct facets, web_fetch a few representative sources
per facet, read_file for local material. Landscape material lands in `landscape`.
Issue a round's searches, and then that round's fetches, as ONE response each: a batch runs in parallel, so eight fetches cost about what one costs, while the inference call between two responses costs tens of seconds.
For each source you use, append a bibliography line to `sources_index`
(context_append): `[n] <title> - <url/path> - credibility: <high/med/low>`.
Append it in the SAME turn you read the source, not at the end of the stage. It
has to be a `context_append` call: a bibliography written out in your reply is
not stored anywhere, and the stage after this one reads the region, not your
message. Batching the whole list for later is how a stage ends with twenty
sources fetched and an empty `sources_index`.
Note interesting threads worth pulling on later. If sent back, focus on the named
coverage gap.

Establish what exists NOW before naming players. Search the field as of the date
in `environment` and fetch the authoritative index for the domain (registry,
leaderboard, release feed) before you settle the list of threads. A landscape
recalled rather than gathered is by construction the landscape from before your
cutoff, and this stage decides what the whole fan-out investigates.

A "which one should I use" question has an index too, even when it names none:
the model cards, the leaderboard, the vendor's own docs, the package registry.
Searching the question as asked returns roundups and listicles; go to the
artifact itself for anything you are going to state as a number.

One index is one filter. Every index - a registry, a leaderboard, a category
listing, a "best of" roundup - has an inclusion rule, and whatever sits outside
that rule is not ranked low in it, it is absent from it entirely, so reading
further down will never surface it. The rule is invisible from inside: a
category listing looks like a list of everything, because the things it leaves
out are the things it does not mention.

So cross at least two indexes of DIFFERENT KINDS before settling the list, and
record which kinds in `sources_index`. Different kinds means structurally
different: a category listing and a second category listing are one index twice.
Reach for what a category filter cannot reach: awards and guides, a
professional body's own roster, the "related" and "see also" edges out of a
page you already trust, whatever an entry sits inside rather than the type it
is filed under, and what the primary source says it is in its own words.

Ask an index what is ON it. Do not name the entries you already have in the
query: adding the three you know turns "what is on this list" into "confirm these
are on this list", and the answer comes back about them. This is the failure mode
that survives crossing indexes properly, because the query still looks like the
right query. Measured: a run searched an awards guide - exactly the kind a
category listing cannot reach - and appended three names it already had. The
top-rated entry it was missing sits third in the results for the same search with
those three names removed, on that guide's own page for it.

Then ask the question that catches the filter: what would something in this
field have to be for it NOT to appear in the indexes I used? Name one such thing
and go looking for it specifically. A run that finds nothing there has spent one
search confirming its coverage; a run that skips the question cannot tell a
complete landscape from a well-filtered one, and neither can its reader.

Today's date is in the `environment` region. Treat it as authoritative over
anything you remember: your training has a cutoff and this run does not. Judge
"recent", "current", "active" and "state of the art" against it, and note how
old a source is when its age bears on the claim. Call current_time for the clock.
Pass `freshness` to web_search whenever currency is part of the question.

If web_search hands back a diagnostic instead of results - no engine configured,
an engine error, or an encyclopedia fallback - then this run cannot see the web.
Record that in `sources_index` and do NOT close the gap from memory. A landscape
reported as unmapped is a usable result; one assembled from recall is not, and a
reader cannot tell the two apart after the fact.

If the task is ambiguous in a way that would change what you survey - a term with
two common meanings, a constraint you cannot infer, a scope that could be read
narrow or wide - ask before you spend the run on a guess. `ask_user_text` takes a
free-text answer and `ask_user_choice` offers options; one good question here is
worth more than a thorough survey of the wrong field, and this stage decides what
the whole fan-out investigates.

Ask once, early, and only when the answer changes what you would do. If nobody is
attached to this run the tools are not offered at all - carry on, state the
reading you chose, and say what you would have asked.

A front page is not the source. A docs site, a repository, a product site: the
page you land on says what a project wants to be known for, and the thing you
need is one hop further in, behind the nav. When you fetch a landing page, read
its navigation and follow the entries that bear on your question before you
conclude anything about the subject. A project's own docs and its own source
outrank every write-up about it.

Absence is a claim and it needs its own evidence. You may not write that
something lacks a capability because a page you read did not mention it - pitch
pages, READMEs and comparison posts are selective by design, and the feature you
are looking for is very often on a page you did not open. Before stating that
something is missing, search the subject's own documentation for it by name. If
you cannot, write "not found in <what you actually read>" and grade it low.
"Does not have it" and "I did not find it" are different claims and only one of
them is yours to make.

Before you hand off, read back what you gathered and ask one question of it: for
every figure the report will state, is there a source that MEASURED it, or only
pages that repeat it? If a number exists only in roundups, go and fetch the
artifact - the paper, the model card, the spec, the vendor's own docs - before
leaving this stage. Coming back for it later costs a whole extra pass, and going
without means the report states a number on the authority of a page that was
guessing."""

# Un-exhaustible escape (lint: dead-end-possible): when every looping
# target has spent its max_revisits budget, the run can still move forward
# to the deliverable instead of dead-ending.
[[graph.edges]]
name = "challenge"
from = "survey"
to = "challenge"
when = "dead_end"
hint = "Out of revisits here - hand what exists to the adversarial pass, which is the only way to the report"
carry = { compact = {} }

[[graph.edges]]
name = "error_recovery"
from = "survey"
to = "error_recovery"
when = "error"

# The only way forward. Covering the threads in parallel is what this blueprint
# is for, so it is not a choice: offered an edge straight to `compare` for areas
# that "turn out to be narrow", a model that takes it compares a landscape
# nothing has investigated. One thread is a fan-out of one.
[[graph.edges]]
name = "investigate"
from = "survey"
to = "investigate"
hint = "Landscape mapped - the threads worth covering are identified"

# ─── Stage 2: Investigate (fan out) ──────────────────────────────────────────
# The survey found the threads; this covers them at the same time instead of one
# after another. Each worker is a full `researcher` run rather than a stage of
# this blueprint, so a thread gets that agent's own gather/analyze loop and its
# own clean context window.
#
# `researcher` is a separate installed blueprint. `lev setup` installs the
# bundled set together, so it is there in the normal case; installing this agent
# on its own leaves the workers with nothing to run, and a failed worker is
# reported rather than ending the run.
[[graph.stages]]
name = "investigate"
description = "Research each thread of the landscape in parallel"
model = { models = [{ model = "claude-sonnet-5" }, { model = "grok-4.6" }, { model = "gpt-5.4" }, { model = "gemini-3.5-flash" }, { provider = "ollama", model = "qwen3.5:9b" }] }
tools = ["fan_out"]
max_iterations = 4
# investigate to error_recovery and back is a cycle, so it needs a ceiling.
max_revisits = 1

[graph.stages.mode.fan_out]
worker = { blueprint = { name = "researcher" } }
merge_stage = "compare"
# Every thread at once rather than in waves; the daemon's inference pool paces the
# requests. Set to 0 for no cap at all.
max_workers = 12
# Where the workers' findings land, and the budget their shares divide.
results_region = "thread_findings"
# A ceiling on threads, not just on concurrency. Thirty leaves each worker a
# usable share of the region for its answer; the compare stage is told when
# that share had to be trimmed. Set to 0 for no ceiling.
max_items = 30
split_prompt = """
Split the landscape in `landscape` into threads that can be researched
independently, one work item each. A thread is an approach, a project, a school
of thought, a question the survey raised - whatever divides the area without two
workers covering the same ground.

Call `fan_out` with one entry in `items` per work item:

  items: [{"id": "<short-slug>", "inputs": {"task": "<the thread to research>", "scope": "<what the survey wants to know about it>"}}]

Each item's inputs are the worker's own: "task" is the question it
researches, and "scope" what its answer is for. Nothing else reaches it.

Every item MUST carry enough to work from alone: a worker is a separate agent
and does not share this run's context, so the work item is all it gets.

The unit of a work item is a SUBJECT, not a source. Judge a split by what a
worker would have to read, not by how many links you have:

- A dozen companies, models or standards to compare is a dozen items. They do
  not overlap and no one worker could do them justice.
- Six links on the same site about the same subject is ONE item. Hand the
  worker the subject and let it read all six.
- "Read this page" is never an item. A worker is a research agent with its own
  gather/analyze loop, and pointing it at a single URL wastes all of that -
  fetch it yourself instead.
- If two items would send workers to overlapping material, they are one item.
  Two workers reading the same sources return the same finding twice, and a
  finding that appears twice reads like corroboration when it is an echo.

There is no prize for few items and no penalty for many. Split as wide as the
subject genuinely is - and no wider, because a split finer than the material
returns thin answers that cost a full agent each.

GROUND EVERY NAME IN `landscape`. A proper noun in a thread - a product, model,
version, company, standard - must already appear there. If you cannot name the
players from what the survey gathered, then finding them IS the thread ("which X
exist as of the date in `environment`, and which are current"), not comparing a
list you remember.

This is not style. A worker starts from a clean context and cannot question your
premise: it will faithfully research whatever you named. A list you recalled
instead of surveyed therefore comes back as several workers' worth of
independent-looking confirmation for candidates that may be years stale or may
not exist at all, and the compare stage has no way to tell that apart from
evidence. The fan-out multiplies whatever you put in, including the mistake.

Prefer a handful of substantial threads over many thin ones. One thread is fine
for a narrow area.
"""

# Un-exhaustible escape (lint: dead-end-possible). Conditioned, like every
# other escape here: unconditioned, it would sit on the model's menu and let a
# fan-out stage answer "summarize" and walk past its own workers.
[[graph.edges]]
name = "challenge"
from = "investigate"
to = "challenge"
when = "dead_end"
hint = "Out of revisits here - hand what exists to the adversarial pass, which is the only way to the report"
carry = { compact = {} }

[[graph.edges]]
name = "error_recovery"
from = "investigate"
to = "error_recovery"
when = "error"

# ─── Stage 3: Compare ─────────────────────────────────────────────────────────
# Three edges: more breadth (survey), dive on a thread (deep_dive), or have the
# comparison attacked before it is written up (challenge).
[[graph.stages]]
name = "compare"
description = "Compare and contrast approaches across the landscape"
model = { models = [{ model = "deepseek-v4-pro" }, { model = "claude-opus-5" }, { model = "gpt-5.5" }, { model = "gemini-3.5-flash" }, { provider = "ollama", model = "qwen3.5:9b" }] }
tools = ["read_file", "web_fetch", "context_write", "context_append", "current_time"]
max_iterations = 15
max_revisits = 4  # backstop only; the convergence note is what should end this loop
transition_prompt = """
Decide the next move:
- Coverage gaps that need broader surveying → respond with: survey
- A figure or ranking the overview will state rests only on roundups, or on a
  single page nothing corroborates, and the primary artifact was never fetched
  → respond with: survey, naming the artifact to go and get
- A comparison cell is about to read as "does not have it", and `sources_index`
  shows only that subject's front page or write-ups about it, never its own docs
  or its own source → respond with: survey, naming the page to go and open
- One especially interesting/consequential thread worth a focused deep read
  before you can judge it fairly → respond with: deep_dive
- You've covered enough ground to write a useful overview → respond with: challenge
  Before you choose this or deep_dive: the comparative judgments you made this
  pass must be in `comparisons`. That region is what the overview is written
  from, so a judgment left in your reply and not in the region is one the
  writing stage cannot use.
- The `[Progress in stage ...]` note says this pass added little next to the one
  before it, and you cannot name a specific gap you would go and fill → the work
  here has converged → respond with: challenge"""
system_prompt = """
Compare across the `landscape` and `thread_findings`, organizing by THEME not by
source:
- Patterns; where approaches converge or diverge
- The tradeoffs each approach makes
- What's overhyped vs underappreciated
Record the key comparative judgments in `comparisons` (context_write) and any
source disagreements you notice. Flag threads that deserve a deep_dive before you
can rank them fairly. Help the reader see the shape of the field.

The workers' findings are already here: the fan-out wrote them into
`thread_findings`, which is rendered into this prompt under its own `## thread_findings`
heading. They are not files. A work item's name is not a filename, and
`read_file` on one finds nothing - the whole point of the fan-out is that the
answers came back to you.

If `error_report` says a previous stage hit its iteration cap, that stage was cut
off before finishing - treat its coverage as incomplete when judging the field."""

# Gated on the region this agent exists to produce. Measured on a finished run,
# `comparisons` held 2,560 tokens of its 125,000 while `landscape` sat at 83%: the
# comparing was happening and only the recording was not.
#
# This edge and not `deep_dive` as well. Everything written passes through here,
# so this is where the region has to exist; asking a pass that went to read one
# thread in depth to also add something new would block it for being honest.
# It is also the way out once `deep_dive` has spent its revisits, so the
# overview still gets written.
[[graph.edges]]
name = "challenge"
from = "compare"
to = "challenge"
hint = "Evidence is sufficient - have it attacked before writing"
carry = { compact = {} }
gate = { require_region_updated = "comparisons", message = "Write the comparative judgments you reached this pass into `comparisons` with context_write before moving on. The adversarial pass reads that region, and the overview is written from it." }

# A thread worth comparing is worth reading properly before the overview is
# written. The "do we need more" decision lives in `deep_dive`, which is the
# first stage to have actually read a thread in depth and can judge whether the
# landscape is thin.
[[graph.edges]]
name = "deep_dive"
from = "compare"
to = "deep_dive"
hint = "Threads compared - read the most significant one in depth"
carry = { compact = {} }

[[graph.edges]]
name = "error_recovery"
from = "compare"
to = "error_recovery"
when = "error"

# ─── Stage 4: Deep dive ───────────────────────────────────────────────────────
# This is where the run decides whether it has enough, because it is the first
# stage that has read a thread properly rather than surveyed it. Three ways out:
# another thread, more breadth, or the deliverable.
[[graph.stages]]
name = "deep_dive"
description = "Focused deep read on one interesting thread flagged during comparison"
model = { models = [{ model = "deepseek-v4-pro" }, { model = "claude-sonnet-5" }, { model = "gpt-5.4" }, { model = "gemini-3.5-flash" }, { provider = "ollama", model = "qwen3.5:9b" }] }
tools = ["web_search", "web_fetch", "read_file", "context_append", "current_time", "context_read"]
max_iterations = 12
max_revisits = 2
tool_routing = { default_region = "conversation", tool_regions = { web_search = "landscape", web_fetch = "landscape", read_file = "landscape" }, keep_results = true }
transition_prompt = """
Decide the next move:
- This read exposed something the survey never covered - a name, a category, a
  kind of source that is absent from `sources_index` - → respond with: survey,
  naming what to go and get. This is one of only two ways left to widen what the
  report can draw on, so take it whenever the gap is nameable rather than noting
  it and moving on.
- Another flagged thread is still worth a focused read → respond with: compare
- The threads worth reading have been read → respond with: challenge"""
system_prompt = """
Compare flagged a specific thread for a focused read. web_search / web_fetch the
best sources on JUST that thread, read them, and append the findings to
`landscape` plus a note to `deep_dives` capturing what makes it notable (with
source refs) and a bibliography line to `sources_index`. Then hand back to compare.
Stay on the flagged thread - this is depth on one item, not a new broad survey."""

# Everything leaving this stage for good passes through here, so this is where
# the region has to exist. Without it the stage produced nothing at all: on one
# measured run it spent 77 seconds, made no tool call, and left `deep_dives`
# empty, while `compare` next door - which has a gate - filled its region every
# pass. A focused read that records nothing is indistinguishable from one that
# never happened.
[[graph.edges]]
name = "challenge"
from = "deep_dive"
to = "challenge"
hint = "Done here - hand to the adversarial pass, which is the only way to the report"
carry = { compact = {} }
gate = { require_region_updated = "deep_dives", message = "This stage is a focused read and it has to leave a trace. Append what you found to `deep_dives` with context_append: what makes this thread notable, with source refs, and a bibliography line to `sources_index` for anything you opened. If the read changed nothing about your judgment, write THAT and why - a thread that turned out to be ordinary is a finding the report can use." }

[[graph.edges]]
name = "compare"
from = "deep_dive"
to = "compare"
hint = "Thread explored - compare again to pick the next one worth reading"
carry = { compact = {} }

[[graph.edges]]
name = "error_recovery"
from = "deep_dive"
to = "error_recovery"
when = "error"

[[graph.edges]]
name = "survey"
from = "deep_dive"
to = "survey"
hint = "This depth exposed gaps in the landscape - survey additional areas"
carry = { compact = {} }

# ─── Stage 5: Summarize ───────────────────────────────────────────────────────
[[graph.stages]]
name = "summarize"
description = "Produce a landscape overview with recommendations"
model = { models = [{ model = "claude-opus-5" }, { model = "gpt-5.5" }, { model = "claude-sonnet-5" }, { model = "gemini-3.5-flash" }, { provider = "ollama", model = "qwen3.5:9b" }] }
tools = ["write_file", "read_file", "context_write"]
max_iterations = 10
system_prompt = """
Write a landscape overview (write_file) built from `comparisons` and `deep_dives`,
citing `sources_index` per the rules in `format`. Include:
- Overview of the space
- Major categories/approaches with brief descriptions
- A comparison matrix (approaches vs key criteria)
- Notable projects/implementations worth watching (draw on deep_dives)
- Trends and trajectory
- Recommendations (what to look at first, by goal)
- Sources - the numbered bibliography from `sources_index`, every line carrying
  its URL

Every `[n]` in the prose is a link to its source - `[[n]](<url>)` - so the
reader can click through from the claim.

Write densely, not briefly. The reader wants the lay of the land quickly, and
that is a reason to cut throat-clearing, restated questions and summaries of
summaries - it is not a reason to cover fewer candidates. Coverage is the
deliverable here: a survey that names four of the twelve things the run
investigated has thrown away most of what it was asked for, and the reader has
no way to tell that the other eight were ever looked at.

The long tail is where this stage earns its keep. The obvious entries are the
ones the reader could have found alone in ten minutes; the one they could not is
usually the one a shorter draft drops first, because it is unfamiliar and takes
a sentence more to explain. If the run gathered something that does not fit the
main recommendation, it goes in with what makes it different rather than being
cut for tidiness.

Cite sources for non-obvious claims.

A qualifier travels with the claim it qualifies. If the evidence says "yes, with
offload" or "tight", or the figure came from one uncorroborated page, the
recommendation says so too - a reader acting on your summary never sees the table
it came from. A run recommending a local model carried "yes, with offload" and
"~22 tok/s" in its comparison table and dropped both from the recommendation,
which is the one place the tradeoff mattered.

The bibliography is the deliverable as much as the prose is: a survey is a
reading list, and `[n]` markers over a source list with no URLs send the reader
back to a search engine to find what this run already found. Carry the URL on
every line, even when the title looks searchable.

Citations are load-bearing, so two rules bind absolutely:

1. Every `[n]` must resolve to a line already in `sources_index`. A reference
   points at something this run actually read - never a reconstructed URL, a
   remembered paper or discussion thread, or a plausible-looking title. Never
   invent the details that make a citation look checked: no vote counts, no
   comment counts, no dates you did not read off the source.
2. If `sources_index` is empty, you have no bibliography and therefore no
   evidence. Do not write one. Say up front that the survey could not reach its
   sources, drop the `[n]` markers, mark every finding low confidence, and
   present what you have as background knowledge rather than findings.

Confidence describes the evidence, not how sure the prose sounds.


When you have written the report, record its filename with `context_write` to
the `report_path` region, exactly as you passed it to `write_file` and nothing
else. The stage after this one rewrites that file, and the working directory
also holds a report from every worker, so a name it has to guess at is a name it
gets wrong."""

# The transcript of the research is not wanted here: this stage rewrites the
# report named in `report_path`, and the turns that produced it are only
# prompt weight on the run's most expensive model. Carrying them also hands
# this stage function calls made by a different model family, which Gemini
# refuses because it never signed them.
[[graph.edges]]
name = "polish"
from = "summarize"
to = "polish"
hint = "The comparison is written"
carry = { custom = { clear = ["conversation"] } }

# ─── Stage 6: Error recovery ──────────────────────────────────────────────────
[[graph.stages]]
name = "error_recovery"
description = "Recover from a failed source fetch during the survey"
model = { models = [{ model = "claude-sonnet-5" }, { model = "gpt-5.4" }, { model = "gemini-3.5-flash" }, { provider = "ollama", model = "qwen3.5:9b" }] }
tools = ["read_file", "bash"]
max_iterations = 8
max_revisits = 1
system_prompt = """
A call failed during the survey. The `error_report` region holds the error text
the runtime captured - read it first, note the gap it leaves, and return to
compare to continue with the coverage you have."""

[[graph.edges]]
name = "compare"
from = "error_recovery"
to = "compare"
hint = "Recovered - continue comparing"
carry = { compact = {} }

# Un-exhaustible escape (lint: dead-end-possible): when every looping
# target has spent its max_revisits budget, the run can still move forward
# to the deliverable instead of dead-ending.
[[graph.edges]]
name = "summarize"
from = "error_recovery"
to = "summarize"
hint = "Recovery is not converging - write the overview from what exists"
carry = { compact = {} }

# ─── Final output ────────────────────────────────────────────────────────────
# The last stage. An output stage hands back the run's answer with
# `submit_output`, must call it, and may end the run. No file tools on
# purpose: this stage reports, it does not work.
[[graph.stages]]
name = "summary"
description = "Say what the survey found"
model = { models = [{ model = "claude-sonnet-5" }, { model = "gpt-5.4" }, { model = "gemini-3.5-flash" }, { provider = "ollama", model = "qwen3.5:9b" }] }
mode = "output"
tools = ["submit_output"]
max_iterations = 8
allow_complete = true
require_output = true
system_prompt = """
Say what this survey found, for whoever asked for it.

Lead with the recommendation or the shape of the answer. Then the axes that
actually separated the options, and where the comparison is weakest. Name the
file you wrote."""

# ─── Challenge: an adversary that flags, and cannot rewrite ───────────────────
# A different vendor's model reading the analysis with no attachment to it. The
# point is independence, not authority: it writes only to `challenges`, so it
# can annotate a finding and never alter one, and `summarize` decides what
# survives. Grok is here because it is the least likely to agree with a Claude
# analysis out of politeness - and because it may simply be wrong, which is why
# its output is a lead to check rather than a verdict to apply.
[[graph.stages]]
name = "challenge"
description = "Attack the analysis: what is thin, unsupported, or too confident"
model = { models = [{ model = "grok-4.6" }, { model = "deepseek-v4-pro" }, { model = "claude-sonnet-5" }, { model = "gpt-5.4" }, { model = "gemini-3.5-flash" }, { provider = "ollama", model = "qwen3.5:9b" }] }
tools = ["context_read", "context_append", "web_search", "web_fetch", "current_time"]
max_iterations = 10
max_revisits = 1
transition_prompt = """
Decide the next move:
- A challenge you just wrote needs evidence nobody has gathered, or you named a
  kind of source missing from `sources_index` → respond with: survey, naming
  what to go and get. Going back is the point of this stage existing before the
  report rather than after it, and it is the ONLY remaining way to add anything
  the survey missed. Prefer it whenever you named an absence: a gap you record
  and do not fill is one the report ships with.
- Every challenge is recorded and each one is either settled or is a caveat the
  report can state honestly → respond with: summarize"""
system_prompt = """
You are reading someone else's analysis in order to attack it. You did not
write it and you owe it nothing.

Go through `thread_findings`, `comparisons` and `deep_dives` - what the workers
handed back, the judgments compare reached, and any focused read. For each thing
the report is going to assert, ask the uncomfortable question:

- What single source is this resting on, and would I believe it alone?
- Is the confidence claimed higher than the evidence supports?
- Is a number quoted from something that repeated it rather than measured it?
- Is a comparison to another system based on that system's own docs, or on
  what someone said about it?
- What would have to be true for this conclusion to be wrong, and did anyone
  check that?
- Is anything MISSING? Read `sources_index` and ask what kind of source is not
  in it. A survey that found its candidates through category listings has only
  what that category is indexed under, and the best answer is often filed
  somewhere else: a different category, an award or a guide, whatever it sits
  inside rather than the type it is. Name what is absent and where it would be
  found. Absence is a finding, and this is the last stage that can still go and
  get it.

Write each challenge to `challenges` (context_append) as one line:
`[!] <the claim> - <what is wrong with the support> - <what would settle it>`

You may fetch a source to test a specific doubt. You may not rewrite the
analysis, and nothing you write goes into the report directly.

Two rules that make you useful rather than noise:

Be specific. "This needs more sources" helps nobody; "the 2.8 GB figure comes
only from the vendor's own page and no third party has reproduced it" is a
lead someone can act on.

Say when something holds. If a claim is well supported, write
`[ok] <the claim> - <why the support is sufficient>`. An adversary that only
ever objects is indistinguishable from noise, and the reader cannot tell which
of your objections to take seriously.

You are not required to invent fault. You are required to look: read the regions
named above and say what you found, per claim. "It all looks fine" without that
reading is the one answer this stage cannot give, because it is also what an
adversary that never ran would produce, and the two are indistinguishable from
outside."""

[[graph.edges]]
name = "error_recovery"
from = "challenge"
to = "error_recovery"
when = "error"

# On the edge to the report, not on the one back to `survey`: a pass that found
# a real gap should be able to go and fill it without first writing up why it is
# leaving. This is the last edge before the deliverable, so it is where "the
# adversarial pass actually ran" has to be provable.
[[graph.edges]]
name = "summarize"
from = "challenge"
to = "summarize"
hint = "Challenges are recorded - write the overview"
carry = { compact = {} }
gate = { require_region_updated = "challenges", message = "Write this pass's challenges to `challenges` with context_append, one line each: `[!] <claim> - <what is wrong with the support> - <what would settle it>`, or `[ok] <claim> - <why the support is sufficient>` for the ones that hold. Include at least one line about what is MISSING from `sources_index` rather than wrong in it. The stage is not done until that region has them: a pass that leaves it empty is indistinguishable from one that never read anything." }

[[graph.edges]]
name = "survey"
from = "challenge"
to = "survey"
hint = "A challenge needs evidence nobody has gathered yet - name what to fetch"
carry = { compact = {} }

# ─── Polish: the same report, readable ───────────────────────────────────────
# Measured on a real report: this model took it from grade 12.8 to 9.6 and
# reading ease 42 to 58, kept all fourteen linked citations, and lost no
# entities - while defining jargon inline as it went ("MCP (Model Context
# Protocol) is a standard for connecting agents to outside tools"). Claude
# rewriting its own prose barely moved it, and llama-4-maverick made it worse.
#
# No web tools and no send-back edge: this is a filter, not a decision point.
# A validator enforces what the prompt asks for, because "keep every citation"
# is not something to leave to good intentions.
[[graph.stages]]
name = "polish"
description = "Rewrite the report in plain language without changing what it says"
model = { models = [{ model = "gemini-3.1-pro-preview" }, { model = "claude-opus-5" }, { model = "gpt-5.5" }, { model = "claude-sonnet-5" }, { provider = "ollama", model = "qwen3.5:9b" }], params = { max_output_tokens = 24000 } }
tools = ["context_read", "context_write", "read_file", "write_file", "list_dir"]
max_iterations = 10
system_prompt = """
Rewrite the report so a smart reader outside this field can follow it.

You are changing how it reads, never what it says. Every fact, number, name,
date, confidence marker and citation survives exactly as written. If you cannot
make a sentence clearer without risking its meaning, leave it alone.

What to change:
- Long sentences into shorter ones.
- Jargon into plain words where a plain word exists.
- A term with no plain equivalent stays, with a short definition the first time
  it appears: "an append-only journal (a log you can only add to, never erase)".
- Nested clauses into sequence.

Write the way a careful person writes, not the way a model writes. These are the
tells, and they matter as much as sentence length:

- No em dashes. Use a full stop, a comma, or brackets.
- No stock openers: "It's worth noting", "It's important to note", "That said",
  "Overall", "In conclusion", "At its core", "When it comes to".
- No throat-clearing connectives where the sentence works without them:
  "Furthermore", "Moreover", "Additionally", "Consequently".
- No inflated vocabulary where a plain word exists: "leverage" is use, "utilize"
  is use, "robust" is usually strong or reliable, "crucial" is usually important,
  "delve into" is examine. "comprehensive", "seamless", "pivotal", "landscape",
  "ecosystem" and "myriad" are almost always padding.
- No "not only X but also Y", and no "isn't just X, it's Y".
- Not every list needs three items. If two will do, write two.
- Do not open a bullet with a bolded phrase and a colon unless the bold is a
  real term being defined.

A sentence that states the finding plainly beats one that performs expertise.
If a phrase could be deleted without losing information, delete it.

What must not change:
- `[[n]](url)` citation links. Same markers, same URLs, same places.
- Numbers, units, versions, dates, proper nouns.
- Confidence markers and every caveat. A hedge is content, not padding - if the
  original said "medium-to-low for the numbers", the rewrite says it too.
- The heading structure.

Do not add an introduction, a note about the rewrite, or anything the original
did not say.

The file to rewrite is named in the `report_path` region. Read that file, and
write your rewrite back to that same path, replacing it. Do not go looking for
it: this directory also holds a separate report from every worker, and rewriting
one of those instead would leave the real report untouched while the stage
reports success."""

[[graph.edges]]
name = "error_recovery"
from = "polish"
to = "error_recovery"
when = "error"

[[graph.edges]]
name = "summary"
from = "polish"
to = "summary"
hint = "The report reads clearly - produce the final answer"
carry = { compact = {} }
gate = { require_modifications = true, message = "You have not written the report yet. Read the file named in `report_path`, rewrite it in plain language, and write it back to that same path with write_file. The stage is not done until that file has been replaced." }
