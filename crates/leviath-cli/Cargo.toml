[package]
name = "leviath-cli"
description = "Command-line interface for Leviath agent framework"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# Not published to crates.io: Leviath ships as the `lev` binary (via Homebrew,
# the install script, or `cargo install --git`), and these are its internal
# crates. Saying so explicitly prevents an accidental `cargo publish` and lets
# cargo-deny treat the intra-workspace `path` dependencies as what they are
# rather than as unbounded version requirements. Remove this line if a crate is
# ever meant to be published - at which point its path deps need versions too.
publish = false

[lib]
name = "leviath_cli"
path = "src/lib.rs"

[[bin]]
name = "lev"
path = "src/main.rs"

[features]
debug-http = ["leviath-providers/debug-http"]

[dependencies]
leviath-core = { workspace = true }
leviath-agent-client = { workspace = true }
leviath-runtime = { workspace = true }
leviath-providers = { workspace = true }
leviath-mcp = { workspace = true }
leviath-package = { workspace = true }
leviath-scripting = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rhai = { workspace = true }
glob = { workspace = true }
dirs = "6.0.0"
chrono = { workspace = true }
bevy_ecs = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
unicode-width = { workspace = true }
futures = { workspace = true }
dotenvy = { workspace = true }
leviath-tools = { workspace = true }
leviath-sys = { workspace = true }
async-trait = { workspace = true }
libc = { workspace = true }
pulldown-cmark = { workspace = true }
ratatui-textarea = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
tower = { version = "0.5", features = ["util"] }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }

# Randomly named, owner-only temp files for the interactive task editor: a
# predictable `/tmp` name is a symlink-attack target on a shared host.
tempfile = "3"

[dev-dependencies]
leviath-testkit = { workspace = true }
# An in-memory credential store installed as the process default, so the
# `KeychainStore` adapter is tested against the real `leviath_sys::keychain`
# path rather than a stand-in. No CI runner has an unlocked login keychain, and
# reaching a developer's real one would raise an OS prompt and hang.
keyring-core = "1"

tempfile = "3"
temp-env = { workspace = true, features = ["async_closure"] }

[lints]
workspace = true
