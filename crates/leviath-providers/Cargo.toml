[package]
name = "leviath-providers"
description = "LLM provider integrations for Leviath (Anthropic, OpenAI)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
debug-http = []

[dependencies]
leviath-core = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tiktoken-rs = { workspace = true }
async-trait = "0.1"
futures-core = { workspace = true }
tokio-stream = { workspace = true }
bytes = "1"
rhai = { workspace = true }
base64 = { workspace = true }
# The Claude Code transport hands its system prompt to the CLI as a file: an
# assembled context routinely exceeds Linux's 128 KB cap on a single argv entry.
tempfile = "3"

[dev-dependencies]
# test-util enables tokio::time::pause so retry/backoff tests run instantly
tokio = { workspace = true, features = ["test-util"] }
# temp-env isolates process-env mutations in tests (edition 2024 set_var is unsafe)
temp-env = { workspace = true }

[lints]
workspace = true
