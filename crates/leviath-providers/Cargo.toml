[package]
name = "leviath-providers"
description = "LLM provider integrations for Leviath (Anthropic, OpenAI)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# One feature per provider, all on by default. `--no-default-features
# --features anthropic,openai` builds those two and no others; with none at
# all, the only providers left are OpenAI-compatible endpoints named in the
# config. `leviath-cli` and `leviath` forward the same names.
#
# A feature gates a provider's client. Its model tables stay compiled either
# way, because a gateway describes another vendor's models with them.
[features]
default = ["providers"]
providers = [
    "anthropic",
    "openai",
    "openai-subscription",
    "xai",
    "xai-subscription",
    "google",
    "openrouter",
    "bedrock",
    "meta",
    "ollama",
    "meshy",
    "rhai",
]
anthropic = []
openai = []
# ChatGPT sign-in: the `codex` provider.
openai-subscription = []
xai = []
# Grok sign-in: the `grok` provider. It runs on xAI's client, so it brings
# the `xai` provider along.
xai-subscription = ["xai"]
google = []
openrouter = []
bedrock = ["dep:crc32fast"]
meta = []
ollama = []
meshy = []
# Providers written as Rhai scripts.
rhai = ["dep:rhai", "dep:leviath-scripting"]
debug-http = []

[dependencies]
leviath-core = { workspace = true }
leviath-net = { workspace = true }
# Owner-only writes for the opt-in request dump, which contains whole transcripts.
leviath-sys = { workspace = true }
# For the shared Rhai sandbox limits (`leviath_scripting::harden`), so provider
# scripts and tool scripts are hardened by one definition rather than two copies.
# No cycle: `leviath-scripting` depends only on `leviath-core`.
leviath-scripting = { workspace = true, optional = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The shipped price table is a TOML file compiled in with `include_str!`.
toml = { workspace = true }
thiserror = { workspace = true }
# The grant store's IO and parse failures, which are reported to a person
# rather than matched on. `ProviderError` is the inference vocabulary and
# has no arm that fits "the file on disk is corrupt".
anyhow = { workspace = true }
tracing = { workspace = true }
tiktoken-rs = { workspace = true }
async-trait = { workspace = true }
futures-core = { workspace = true }
tokio-stream = { workspace = true }
bytes = "1"
# A vendor's upload answer names the file's expiry as an RFC 3339 time.
chrono = { workspace = true }
# Bedrock streams a reply as binary event-stream frames, each checked with
# the CRC32 gzip uses. Already in the graph through flate2.
crc32fast = { version = "1", optional = true }
# Decoding the `exp` and plan-tier claims out of the ChatGPT id and access
# tokens. Payload only: the signature is the issuer's to verify, not ours.
base64 = { workspace = true }
# Ollama sends no tool-call ids, so Leviath mints them and they have to be
# unique for the life of a conversation - which outlives the process, since
# a pause and resume restores a window full of ids from the last one.
rand = { workspace = true }
rhai = { workspace = true, optional = true }

[dev-dependencies]
leviath-testkit = { workspace = true }
tempfile = { workspace = true }
# test-util enables tokio::time::pause so retry/backoff tests run instantly
tokio = { workspace = true, features = ["test-util"] }
# temp-env isolates process-env mutations in tests (edition 2024 set_var is unsafe)
temp-env = { workspace = true }
# An in-memory credential store installed as the process default, so the
# keychain adapter is tested against the real `leviath_sys::keychain` path
# rather than a stand-in. No CI runner has an unlocked login keychain, and
# reaching a developer's real one would raise an OS prompt and hang.
keyring-core = "1"

[lints]
workspace = true
