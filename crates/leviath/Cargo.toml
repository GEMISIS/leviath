[package]
name = "leviath"
description = "Structured agent runtime for LLMs - the batteries-included library facade over the leviath-* crates"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# This crate is re-exports only, and CI's `guard-facade` job keeps it that
# way: it is exempt from the 100% coverage gate (there is nothing for llvm-cov
# to count), so any executable code added here would ship untested. The guard
# fails the build on anything other than doc comments and `pub use` lines.

[features]
default = ["providers"]
# The daemon's control transport, forwarded from leviath-runtime. Off by
# default: embedders talk to the world in-process via leviath::runtime's
# AgentWorld; only a client for a running lev daemon needs the socket.
control-socket = ["leviath-runtime/control-socket"]

# The providers this build carries, all of them by default.
# `default-features = false, features = ["anthropic"]` builds that one and no
# others. Each forwards to the feature of the same name on `leviath-providers`.
providers = [
    "anthropic",
    "openai",
    "openai-subscription",
    "xai",
    "xai-subscription",
    "google",
    "openrouter",
    "bedrock",
    "meta",
    "ollama",
    "meshy",
    "rhai",
]
anthropic = ["leviath-providers/anthropic"]
openai = ["leviath-providers/openai"]
# ChatGPT sign-in: the `codex` provider.
openai-subscription = ["leviath-providers/openai-subscription"]
xai = ["leviath-providers/xai"]
# Grok sign-in: the `grok` provider, which brings `xai` along.
xai-subscription = ["xai", "leviath-providers/xai-subscription"]
google = ["leviath-providers/google"]
openrouter = ["leviath-providers/openrouter"]
bedrock = ["leviath-providers/bedrock"]
meta = ["leviath-providers/meta"]
ollama = ["leviath-providers/ollama"]
meshy = ["leviath-providers/meshy"]
# Providers written as Rhai scripts.
rhai = ["leviath-providers/rhai"]

[dependencies]
leviath-core = { workspace = true }
leviath-runtime = { workspace = true }
leviath-providers = { workspace = true }
leviath-tools = { workspace = true }
leviath-mcp = { workspace = true }
leviath-scripting = { workspace = true }
leviath-telemetry = { workspace = true }
leviath-blueprint = { workspace = true }
leviath-package = { workspace = true }
leviath-agent-client = { workspace = true }

# For examples/ only (the library itself is re-exports and needs nothing).
[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
