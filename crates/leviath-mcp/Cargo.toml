[package]
name = "leviath-mcp"
description = "Model Context Protocol (MCP) tool integration for Leviath"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# Not published to crates.io: Leviath ships as the `lev` binary (via Homebrew,
# the install script, or `cargo install --git`), and these are its internal
# crates. Saying so explicitly prevents an accidental `cargo publish` and lets
# cargo-deny treat the intra-workspace `path` dependencies as what they are
# rather than as unbounded version requirements. Remove this line if a crate is
# ever meant to be published — at which point its path deps need versions too.
publish = false

[dependencies]
leviath-core = { workspace = true }
leviath-sys = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "sync", "macros", "rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
form_urlencoded = "1"

[lints]
workspace = true

[dev-dependencies]
leviath-testkit = { workspace = true }
toml = { workspace = true }
async-stream = "0.3"
axum = { workspace = true }
temp-env = { workspace = true }
tempfile = "3"
