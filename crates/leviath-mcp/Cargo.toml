[package]
name = "leviath-mcp"
description = "Model Context Protocol (MCP) tool integration for Leviath"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
leviath-core = { workspace = true }
leviath-sys = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "sync", "macros", "rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
form_urlencoded = "1"

[lints]
workspace = true

[dev-dependencies]
leviath-testkit = { workspace = true }
toml = { workspace = true }
async-stream = "0.3"
axum = { workspace = true }
# `async_closure` for the auth probe tests, which have to hold a variable set
# across an await. `leviath-cli` already takes the same feature.
temp-env = { workspace = true, features = ["async_closure"] }
tempfile = "3"
