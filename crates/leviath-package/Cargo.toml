[package]
name = "leviath-package"
description = "Agent packaging, sharing, and installation for Leviath"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# Not published to crates.io: Leviath ships as the `lev` binary (via Homebrew,
# the install script, or `cargo install --git`), and these are its internal
# crates. Saying so explicitly prevents an accidental `cargo publish` and lets
# cargo-deny treat the intra-workspace `path` dependencies as what they are
# rather than as unbounded version requirements. Remove this line if a crate is
# ever meant to be published — at which point its path deps need versions too.
publish = false

[dependencies]
leviath-core = { workspace = true }
# Real URL parsing for the registry scheme/host check: hand-splitting on `://`
# and `:` mistakes userinfo for a host.
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
reqwest = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
leviath-testkit = { workspace = true }
tempfile = "3"
tokio = { workspace = true }

[lints]
workspace = true
