[package]
name = "leviath-tools"
description = "Native built-in tools for Leviath agents"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
leviath-core = { workspace = true }
leviath-providers = { workspace = true }
# The one Rhai compiler: `install_tool` asks it whether a script would become
# a tool before writing into the directory every agent executes from.
leviath-scripting = { workspace = true }
leviath-sys = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
toml = { workspace = true }
quick-xml = { workspace = true }
yaml-rust2 = { workspace = true }
csv = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
# The clock behind `current_time`, plus the IANA zone name chrono's `Local`
# already resolved internally but does not expose.
chrono = { workspace = true }
iana-time-zone = { workspace = true }
# The per-user config/data directories `environment_info` reports. Already the
# workspace's answer for "where does this platform put these", so the tool says
# the same thing the rest of Leviath acts on.
dirs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
temp-env = { workspace = true }

[lints]
workspace = true
