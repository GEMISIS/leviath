id: no-lint-suppression
language: rust
severity: error
message: >-
  Lint suppressions are banned outright: `#[allow]` and `#[expect]`, inner or
  outer, with or without a `reason`. The tree carries zero of them.
  A `reason` is not a licence. Every suppression this repo ever had carried one,
  and every reason was true when written - they were still worth deleting,
  because a reason documents an invariant while leaving the code free to drift
  away from it. Each fix beat the attribute: parameter structs (and `SystemParam`
  for the bevy system), restoring a file's original permissions, socket2, an
  explicit `impl Future`, one named constant per match arm, and
  `leviath_core::text`'s total `substring` / `split_at_boundary` for `&s[a..b]`.
  `#[expect]` is banned alongside `#[allow]` on purpose. It is the better of the
  two, but that only matters once you have decided to suppress - and an
  `#[expect]` for an unlisted lint used to pass clippy and ast-grep in silence.
  If a new one looks unavoidable, it is worth an hour before it is worth an
  attribute. If it genuinely is, change this rule in the same PR and say why.
rule:
  any:
    - kind: attribute_item
    - kind: inner_attribute_item
  regex: '^#!?\[\s*(allow|expect)\s*\('
